				if (fade === false) {
					removeSprite();
					return;
				}

				enableGpuAccel(sprite);
				sprite.classList.remove('active');
				sprite.hideTimer = setTimeout(removeSprite, TIMINGS.spriteFade);
			}

			#position(sprite, command, isNew) {
				SpriteManager.#applyAxes(sprite, command.pos, isNew, PLACEMENT_KEYWORDS.pos, '--sprite-x', '--sprite-y', '%');
				SpriteManager.#applyAxes(sprite, command.anchor, isNew, PLACEMENT_KEYWORDS.anchor, '--sprite-anchor-x', '--sprite-anchor-y', '');

				if (command.height != null) sprite.style.setProperty('--sprite-height', `${SpriteManager.#normalizeHeight(command.height)}vh`);
				else if (isNew) sprite.style.setProperty('--sprite-height', `${SpriteManager.#normalizeHeight()}vh`);

				if (command.layer != null) {
					const layer = Number(command.layer);
					sprite.style.zIndex = Number.isFinite(layer) ? String(layer) : '';
				} else if (isNew) {
					sprite.style.zIndex = '';
				}
			}

			static #applyAxes(sprite, value, isNew, keywords, xProp, yProp, suffix) {
				const placement = value != null ? resolvePlacement(value, keywords) : null;
				const x = placement ? placement.x : null;
				const y = placement ? placement.y : null;
				if (x != null) sprite.style.setProperty(xProp, `${x}${suffix}`);
				else if (isNew) sprite.style.setProperty(xProp, `50${suffix}`);
				if (y != null) sprite.style.setProperty(yProp, `${y}${suffix}`);
				else if (isNew) sprite.style.setProperty(yProp, `100${suffix}`);
			}

			static #normalizeHeight(value, fallback = 90) {
				if (typeof value === 'string') {
					value = value.trim().endsWith('%') ? parseFloat(value) : Number(value);
				}

				const parsed = Number(value);
				return Number.isFinite(parsed) ? clamp(parsed, 1, 100) : fallback;
			}
		}

		class StageManager {
			#vn;
			#bg1;
			#bg2;
			#currentLayer;
			#currentFadeId = null;
			#activeFades = {};
			#fs1;
			#fs2;
			#fsCurrent;
			#fsVideo = null;
			#fsFadeTimer = null;

			constructor(vn) {
				this.#vn = vn;
				this.#bg1 = document.getElementById('bgLayer1');
				this.#bg2 = document.getElementById('bgLayer2');
				this.#currentLayer = this.#bg1;
				this.#fs1 = document.getElementById('fsLayer1');
				this.#fs2 = document.getElementById('fsLayer2');
				this.#fsCurrent = this.#fs1;
			}

			#createVideo(scene) {
				const video = document.createElement('video');
				video.src = scene.asset;
				video.autoplay = true;
				video.muted = false;
				video.loop = scene.loop !== false;
				video.playsInline = true;
				video.preload = 'auto';
				video.disableRemotePlayback = true;
				video.style.objectPosition = scene.position || '';
				const target = clamp(scene.volume !== undefined ? Number(scene.volume) : 1, 0, 1);
				if (this.#routeVideo(video)) this.#vn.audio.fadeGain(video._gain, target, 0);
				else video.volume = target;
				return video;
			}

			setBackgroundInstant(scene) {
				const layer = this.#bg1;
				this.#cleanupFade(this.#currentFadeId);
				this.#destroyVideo(this.#bg2.querySelector('video'));
				this.#bg2.innerHTML = '';
				this.#bg2.classList.remove('visible', 'video-bg');
				this.#bg2.classList.add('hidden');
				this.#bg2.style.backgroundImage = '';
				this.#bg2.style.zIndex = '';
				this.#destroyVideo(layer.querySelector('video'));
				layer.innerHTML = '';
				layer.style.transition = 'none';
				layer.style.opacity = '1';
				layer.style.zIndex = '';
				layer.classList.remove('hidden', 'video-bg');
				layer.classList.add('visible');

				if (scene.mediaType === 'video') {
					layer.classList.add('video-bg');
					const video = this.#createVideo(scene);
					layer.appendChild(video);
					video.play().catch(() => {});
				} else {
					const cached = this.#vn.assets.imageCache.get(scene.asset);
					layer.style.backgroundImage = `url('${cached ? cached.src : scene.asset}')`;
					layer.style.backgroundPosition = scene.position || '';
				}

				this.#currentLayer = layer;
			}

			fadeBackground(scene) {
				const nextLayer = this.#currentLayer === this.#bg1 ? this.#bg2 : this.#bg1;
				const currentLayer = this.#currentLayer;

				this.#destroyVideo(nextLayer.querySelector('video'));
				nextLayer.innerHTML = '';
				nextLayer.style.backgroundImage = '';
				nextLayer.classList.remove('video-bg','visible');
				nextLayer.classList.add('hidden');

				const fadeId = `fade_${Date.now()}_${Math.random().toString(36).substr(2,9)}`;
				this.#currentFadeId = fadeId;

				this.#activeFades[fadeId] = { timers: [], handlers: [] };
				const registerTimer = t => this.#activeFades[fadeId].timers.push(t);
				const registerHandler = removerFn => this.#activeFades[fadeId].handlers.push(removerFn);

				const handleFadeStart = () => {
					if (this.#currentFadeId !== fadeId) return;
					this.#performCrossfade(nextLayer, currentLayer, scene, fadeId);
				};

				if (scene.mediaType === 'video') {
					nextLayer.classList.add('video-bg');

					const video = document.createElement('video');
					video.src = scene.asset;
					video.autoplay = true;
					video.muted = true;
					video.loop = scene.loop !== false;
					const targetVol = (scene.volume !== undefined) ? Number(scene.volume) : 1.0;
					video.targetVolume = clamp(targetVol, 0, 1);
					video.volume = 0;
					video.playsInline = true;
					video.preload = 'auto';
					video.disableRemotePlayback = true;
					video.style.objectPosition = scene.position || '';
					video.dataset.fadeId = fadeId;

					let isReady = false;

					const markReady = () => {
						if (isReady) return;
						isReady = true;

						video.removeEventListener('canplaythrough', markReady);
						video.removeEventListener('loadeddata', markReady);

						const meta = this.#activeFades[fadeId];
						if (meta && meta.timers) {
							meta.timers.forEach(t => clearTimeout(t));
							meta.timers = [];
						}

						if (video.dataset.fadeId !== fadeId) {
							video.pause();
							return;
						}
						nextLayer.appendChild(video);
						const p = video.play();
						if (p && p.catch) p.catch(e => console.log('Video play failed:', e));

						setTimeout(() => {
							if (this.#currentFadeId === fadeId) handleFadeStart();
						}, TIMINGS.videoReadySettle);
					};

					video.addEventListener('canplaythrough', markReady);
					video.addEventListener('loadeddata', markReady);

					registerHandler(() => {
						try {
							video.removeEventListener('canplaythrough', markReady);
							video.removeEventListener('loadeddata', markReady);
						} catch (e) {}
					});

					const safety1 = setTimeout(() => {
						if (!isReady && this.#currentFadeId === fadeId) markReady();
					}, TIMINGS.videoSafety1);
					registerTimer(safety1);

					const safety2 = setTimeout(() => {
						if (!isReady && this.#currentFadeId === fadeId) markReady();
					}, TIMINGS.videoSafety2);
					registerTimer(safety2);

					try { video.load(); } catch (e) {  }

				} else {
					const cached = this.#vn.assets.imageCache.get(scene.asset);
					const bgSrc = cached ? cached.src : scene.asset;
					nextLayer.style.backgroundImage = `url('${bgSrc}')`;
					nextLayer.style.backgroundPosition = scene.position || '';

					const img = new Image();
					const onImgLoad = () => { if (this.#currentFadeId === fadeId) handleFadeStart(); };
					img.onload = onImgLoad;
					img.onerror = onImgLoad;
					img.src = scene.asset;

					registerHandler(() => { img.onload = null; img.onerror = null; });
				}

				const finalSafety = setTimeout(() => {
					if (this.#currentFadeId === fadeId) handleFadeStart();
				}, TIMINGS.videoFinalSafety);
				registerTimer(finalSafety);
			}

			#performCrossfade(nextLayer, currentLayer, scene, fadeId) {
				if (this.#currentFadeId !== fadeId) return;

				this.#cleanupFade(fadeId);

				const currentVideo = currentLayer.querySelector('video');
				if (currentVideo && !currentVideo.paused) {
					this.#fadeVolume(currentVideo, currentVideo.volume, 0, TIMINGS.videoFadeOut);
					setTimeout(() => {
						if (currentVideo !== this.#currentLayer.querySelector('video')) {
							try { currentVideo.pause(); } catch (e) {}
						}
					}, TIMINGS.videoFadeOutClear);
				}

				currentLayer.style.zIndex = '-2';
				nextLayer.style.zIndex = '-1';
				nextLayer.style.transition = 'none';
				nextLayer.style.opacity = '0';
				nextLayer.classList.remove('hidden');
				nextLayer.classList.add('visible');
				void nextLayer.offsetWidth;

				if (scene.mediaType === 'video') {
					const video = nextLayer.querySelector('video');
					if (video) {
						const p = video.play();
						if (p && p.catch) p.catch(e => {  });

						video.muted = false;
						if (!this.#routeVideo(video)) video.volume = 0;
						const target = (scene.volume !== undefined) ? Number(scene.volume) : (video.targetVolume || 1.0);
						this.#fadeVolume(video, 0, target, TIMINGS.videoFadeIn);
					}
				}

				const oldLayer = this.#currentLayer;
				this.#currentLayer = nextLayer;

				requestAnimationFrame(() => {
					enableGpuAccel(nextLayer);
					nextLayer.style.transition = 'opacity 1s ease-in-out';
					nextLayer.style.opacity = '1';

					setTimeout(() => {
						if (oldLayer !== this.#currentLayer) {
							oldLayer.style.transition = 'none';
							oldLayer.style.opacity = '0';
							oldLayer.style.zIndex = '';
							oldLayer.classList.remove('visible', 'video-bg');
							oldLayer.classList.add('hidden');

							this.#destroyVideo(oldLayer.querySelector('video'));

							oldLayer.innerHTML = '';
							oldLayer.style.backgroundImage = '';
						}

						nextLayer.style.transition = 'none';
					}, TIMINGS.bgCrossfade);
				});
			}

			#routeVideo(video) {
				if (!isSameOrigin(video.src)) return false;
				const gain = this.#vn.audio.attachElement(video);
				if (!gain) return false;
				video._gain = gain;
				video.volume = 1;
				return true;
			}

			#fadeVolume(videoElement, startVolume, endVolume, duration = 1000) {
				if (!videoElement) return;

				if (videoElement._gain) {
					this.#vn.audio.fadeGain(videoElement._gain, clamp(Number(endVolume), 0, 1), duration);
					return;
				}

				if (videoElement.fadeRAF) {
					cancelAnimationFrame(videoElement.fadeRAF);
					videoElement.fadeRAF = null;
				}

				const from = clamp(Number(startVolume), 0, 1);
				const to = clamp(Number(endVolume), 0, 1);
				videoElement.volume = from;

				const startTime = performance.now();
				const step = (now) => {
					const progress = Math.min((now - startTime) / duration, 1);
					videoElement.volume = clamp(from + (to - from) * progress, 0, 1);
					if (progress < 1) {
						videoElement.fadeRAF = requestAnimationFrame(step);
					} else {
						videoElement.fadeRAF = null;
					}
				};
				videoElement.fadeRAF = requestAnimationFrame(step);
			}

			#destroyVideo(video) {
				if (!video) return;
				try {
					if (video.fadeRAF) {
						cancelAnimationFrame(video.fadeRAF);
						video.fadeRAF = null;
					}
					if (video._gain) {
						this.#vn.audio.detachElement(video, video._gain);
						video._gain = null;
					}
					video.pause();
					video.removeAttribute('src');

					while (video.firstChild) video.removeChild(video.firstChild);
					video.load();
				} catch (e) {  }
				video.remove();
			}

			showVideoScene(scene) {
				const layer = this.#vn.elements.videoScreen;
				if (!layer) return;
				this.#destroyVideo(layer.querySelector('video'));
				layer.innerHTML = '';
				const video = this.#createVideo(scene);
				layer.appendChild(video);
				video.play().catch(() => {});
				this.#vn.scene.activateLayer(layer);
			}

			clearVideoScene() {
				const layer = this.#vn.elements.videoScreen;
				if (!layer) return;
				const video = layer.querySelector('video');
				if (video) {
					this.#destroyVideo(video);
					layer.innerHTML = '';
				}
			}

			showFullscreenMedia(scene) {
				const current = this.#fsCurrent;
				const next = current === this.#fs1 ? this.#fs2 : this.#fs1;

				this.#destroyVideo(next.querySelector('video'));
				next.innerHTML = '';
				next.classList.remove('video-bg');
				next.style.backgroundImage = '';
				this.#fsVideo = null;

				if (scene.type === 'video') {
					next.classList.add('video-bg');
					const video = this.#createVideo(scene);
					next.appendChild(video);
					video.play().catch(() => {});
					this.#fsVideo = video;
				} else {
					const cached = this.#vn.assets.imageCache.get(scene.asset);
					next.style.backgroundImage = `url('${cached ? cached.src : scene.asset}')`;
					next.style.backgroundPosition = scene.position || '';
				}

				this.#fsCurrent = next;
				this.#crossfadeFsLayers(current, next, this.#vn.scene.instant);
			}

			#crossfadeFsLayers(current, next, instant) {
				clearTimeout(this.#fsFadeTimer);
				current.classList.remove('fs-front');
				next.classList.add('fs-front');
				next.classList.remove('hidden');
				next.classList.add('visible');

				if (instant) {
					next.style.transition = 'none';
					next.style.opacity = '1';
					this.#hideFsLayer(current, true);
					return;
				}

				next.style.transition = 'none';
				next.style.opacity = '0';
				const outgoingVideo = current.querySelector('video');
				if (outgoingVideo) this.#fadeVolume(outgoingVideo, outgoingVideo.volume, 0, TIMINGS.videoFadeOut);
				void next.offsetWidth;

				requestAnimationFrame(() => {
					enableGpuAccel(next);
					next.style.transition = 'opacity 1s ease-in-out';
					next.style.opacity = '1';
					this.#fsFadeTimer = setTimeout(() => {
						if (this.#fsCurrent === next) {
							this.#hideFsLayer(current, false);
							next.style.transition = 'none';
						}
					}, TIMINGS.bgCrossfade);
				});
			}

			#hideFsLayer(layer, instant) {
				this.#destroyVideo(layer.querySelector('video'));
				layer.innerHTML = '';
				layer.classList.remove('visible', 'video-bg', 'fs-front');
				layer.classList.add('hidden');
				layer.style.backgroundImage = '';
				if (instant) layer.style.transition = 'none';
				layer.style.opacity = '0';
			}

			clearOverlay(instant = false) {
				if (!this.isOverlayShowing()) return;
				this.#fsVideo = null;
				clearTimeout(this.#fsFadeTimer);

				if (instant) {
					this.#hideFsLayer(this.#fs1, true);
					this.#hideFsLayer(this.#fs2, true);
					this.#fsCurrent = this.#fs1;
					return;
				}

				const layer = this.#fsCurrent;
				const outgoingVideo = layer.querySelector('video');
				if (outgoingVideo) this.#fadeVolume(outgoingVideo, outgoingVideo.volume, 0, TIMINGS.videoFadeOut);

				requestAnimationFrame(() => {
					enableGpuAccel(layer);
					layer.style.transition = 'opacity 1s ease-in-out';
					layer.style.opacity = '0';
					this.#fsFadeTimer = setTimeout(() => this.#hideFsLayer(layer, false), TIMINGS.bgCrossfade);
				});
			}

			isOverlayShowing() {
				return this.#fs1.classList.contains('visible') || this.#fs2.classList.contains('visible');
			}

			get activeSceneVideo() {
				return this.#fsVideo || this.#vn.elements.videoScreen?.querySelector('video') || null;
			}

			#cleanupFade(fadeId) {
				if (!fadeId) return;
				const meta = this.#activeFades[fadeId];
				if (!meta) return;

				if (meta.timers) {
					meta.timers.forEach(t => clearTimeout(t));
				}
				if (meta.handlers) {
					meta.handlers.forEach(h => {
						try { h(); } catch (e) {  }
					});
				}
				delete this.#activeFades[fadeId];
			}
		}

		class ProgressManager {
			#vn;
			#chapterProgress = null;
			#chapterCheckpoints = [];

			pendingResumeIndex = null;

			constructor(vn) { this.#vn = vn; }

			get chapterProgress() { return this.#chapterProgress; }
			get chapterCheckpoints() { return this.#chapterCheckpoints; }

			reset() {
				this.#chapterProgress = null;
				this.#chapterCheckpoints = [];
				this.pendingResumeIndex = null;
			}

			static getChapterProgressPercent(store, chapterFile) {
				const chapter = store?.[chapterFile];
				if (!chapter) return 0;
				if (chapter.finished) return 100;
				return clamp(Math.round(Number(chapter.progressPercent) || 0), 0, 100);
			}

			getChapterProgress() {
				const vn = this.#vn;
				if (!vn.controls.enableCheckpoints || !vn.chapterFile) return null;
				const store = vn.save.loadCheckpointStore();
				return store[vn.chapterFile] || {
					unlocked: [],
					lastCheckpointId: null,
					progressPercent: 0,
					finished: false
				};
			}

			saveChapterProgress(progress) {
				const vn = this.#vn;
				if (!vn.controls.enableCheckpoints || !vn.chapterFile) return;
				const store = vn.save.loadCheckpointStore();
				store[vn.chapterFile] = {
					unlocked: Array.from(new Set(progress.unlocked || [])),
					lastCheckpointId: progress.lastCheckpointId || null,
					progressPercent: clamp(Math.round(Number(progress.progressPercent) || 0), 0, 100),
					finished: Boolean(progress.finished)
				};
				vn.save.saveCheckpointStore(store);
				this.#chapterProgress = store[vn.chapterFile];
			}

			prepareCheckpoints() {
				const vn = this.#vn;
				this.#chapterCheckpoints = [];
				if (!vn.controls.enableCheckpoints) return;

				let activeBefore = 0;
				let totalActive = 0;
				const pending = [];
				vn.script.forEach((scene, index) => {
					if (scene.type === 'checkpoint') {
						const checkpointNumber = pending.length + 1;
						const id = scene.name || `checkpoint-${checkpointNumber}`;
						scene.checkpointId = id;
						pending.push({ id, name: scene.name || `Checkpoint ${checkpointNumber}`, index, activeBefore });
					}
					if (!scene?.isPassive) { activeBefore++; totalActive++; }
				});

				this.#chapterCheckpoints = pending.map(cp => ({
					id: cp.id,
					name: cp.name,
					index: cp.index,
					percent: totalActive ? clamp(Math.round(cp.activeBefore / totalActive * 100), 0, 100) : 0
				}));

				this.#chapterProgress = this.getChapterProgress();
			}

			getResumeIndex() {
				if (!this.#vn.controls.enableCheckpoints) return null;
				const progress = this.getChapterProgress();
				if (!progress || progress.finished || !progress.lastCheckpointId) return null;
				const checkpoint = this.#chapterCheckpoints.find(item => item.id === progress.lastCheckpointId);
				return checkpoint ? checkpoint.index + 1 : null;
			}

			getCheckpointByResumeIndex(index) {
				return this.#chapterCheckpoints.find(checkpoint => checkpoint.index + 1 === index) || null;
			}

			reachCheckpoint(scene, index, isPassive = false) {
				const vn = this.#vn;
				if (!vn.controls.enableCheckpoints) return;
				const id = scene.checkpointId || scene.name;
				if (!id) return;
				const progress = this.#chapterProgress || this.getChapterProgress();

				const isNew = !(progress.unlocked || []).includes(id);
				const checkpointRef = this.#chapterCheckpoints.find(c => c.id === id);

				this.saveChapterProgress({
					...progress,
					unlocked: [...(progress.unlocked || []), id],
					lastCheckpointId: id,
					progressPercent: checkpointRef ? checkpointRef.percent : progress.progressPercent,
					finished: false
				});

				if (isNew && !isPassive) {
					const displayName = checkpointRef ? checkpointRef.name : (scene.name || id);
					emit('checkpoint_reached', { checkpoint_id: id, checkpoint_name: displayName });
					vn.ui.showToast(vn.i18n.t('toast.checkpointUnlocked', { name: displayName }), 'success');
				}
			}

			markChapterFinished() {
				const vn = this.#vn;
				if (!vn.controls.enableCheckpoints) return;
				const progress = this.#chapterProgress || this.getChapterProgress();
				this.saveChapterProgress({
					...progress,
					progressPercent: 100,
					finished: true
				});
			}
		}

		class InputManager {
			#vn;
			#actions;

			constructor(vn) {
				this.#vn = vn;
				this.#actions = {
					'fullscreen': () => vn.ui.toggleFullscreen(),
					'typewriter': () => this.toggleTypewriter(),
					'volume-toggle': () => { vn.elements.autoplayControl?.classList.remove('open'); vn.elements.volumeControl.classList.toggle('open'); },
					'mute': () => this.toggleMute(),
					'autoplay-toggle': () => vn.autoplay.togglePanel(),
					'autoplay-enable': () => vn.autoplay.toggleEnabled(),
					'autoplay-progress': () => vn.autoplay.toggleProgress(),
					'log-open': () => vn.ui.openModal('log'),
					'log-toggle': () => vn.activeModal === 'log' ? vn.ui.closeModal() : vn.ui.openModal('log'),
					'log-close': () => vn.ui.closeModal(),
					'credits-open': () => vn.ui.openModal('credits'),
					'credits-close': () => vn.ui.closeModal(),
					'pause-open': () => vn.ui.openModal('pause'),
					'pause-close': () => vn.ui.closeModal(),
					'restart-chapter': () => vn.scene.restartChapterMidGame(),
					'share': (el) => vn.ui.shareStory(el),
					'next-chapter': (el) => vn.enterChapter(el.dataset.chapter),
					'menu': () => { window.location.href = window.location.pathname; },
					'retry': () => vn.scene.retry(),
					'reset-progress-open': () => vn.menu.openResetProgressModal(),
					'reset-progress-cancel': () => vn.menu.closeResetProgressModal(),
					'reset-progress-confirm': () => vn.menu.confirmResetProgress(),
					'cookies-open': () => document.dispatchEvent(new CustomEvent('sastra:cookies_open')),
					'language-open': () => vn.menu.openLanguageModal(),
					'language-close': () => vn.menu.closeLanguageModal(),
					'language-select': (el) => vn.menu.selectLanguage(el?.dataset.lang)
				};
			}

			bind() {
				const vn = this.#vn;
				document.addEventListener('click', (e) => this.#handleClick(e));
				document.addEventListener('keydown', (e) => this.#handleKeydown(e));
				document.addEventListener('fullscreenchange', () => vn.ui.updateFullscreenButton());

				let previousVolumeLevel = Math.round(vn.audio.masterVolume * 100);
				vn.elements.volumeSlider.addEventListener('input', (e) => {
					vn.audio.setMasterVolume(Number(e.target.value) / 100);
					vn.ui.updateVolumeUi();
					vn.save.setVolume(vn.audio.masterVolume);
				});
				vn.elements.volumeSlider.addEventListener('change', (e) => {
					const level = Math.round(Number(e.target.value));
					emit('volume_adjusted', { old_level: previousVolumeLevel, new_level: level });
					previousVolumeLevel = level;
				});

				vn.elements.autoplaySpeedSlider?.addEventListener('input', (e) => {
					vn.autoplay.setSpeed(Number(e.target.value));
				});
			}

			#handleKeydown(e) {
				const vn = this.#vn;
				if (e.code === 'Tab') {
					e.preventDefault();
					if (!e.repeat && vn.isLoaded && !vn.isWaitingForStart) {
						document.body.classList.toggle('controls-hidden');
					}
					return;
				}
				if (e.repeat && !vn.controls.allowHoldToSkip) return;
				if (e.code === 'Escape') {
					e.preventDefault();

					const openOverlay = document.querySelector('.reset-progress-overlay.active');
					if (openOverlay) {
						openOverlay.classList.remove('active');
						return;
					}
					if (vn.activeModal === 'log' || vn.activeModal === 'pause') {
						vn.ui.closeModal();
					} else if (vn.activeModal === 'credits') {
						vn.ui.closeModal();
					} else if (vn.isLoaded && !vn.isWaitingForStart) {

						vn.ui.openModal('pause');
					}
					return;
				}

				const shortcut = SHORTCUTS[e.code];
				if (shortcut && !e.ctrlKey && !e.metaKey && !e.altKey) {
					if (!e.repeat && this.#shortcutAllowed(shortcut)) {
						e.preventDefault();
						this.runAction(shortcut);
					}
					return;
				}

				if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') {
					e.preventDefault();

					if (vn.isWaitingForStart) {
						if (!vn.progress.pendingResumeIndex) vn.ui.beginStart('start');
						return;
					}
					this.advance();
				}
			}

			#shortcutAllowed(action) {
				const vn = this.#vn;
				if (!vn.controls.enableKeyboardShortcuts || !vn.isLoaded || vn.isWaitingForStart) return false;
				if (vn.activeModal && !(action === 'log-toggle' && vn.activeModal === 'log')) return false;
				if (action === 'log-toggle') return vn.controls.showLogButton;
				if (action === 'typewriter') return vn.controls.showTypewriterToggle;
				if (action === 'autoplay-enable') return vn.controls.showAutoplayButton;
				return true;
			}

			#handleClick(e) {
				const vn = this.#vn;

				const chapterBtn = e.target.closest('.chapter-button[data-chapter]');
				if (chapterBtn) {
					vn.enterChapter(chapterBtn.dataset.chapter);
					return;
				}

				if (e.target.classList && e.target.classList.contains('reset-progress-overlay')) {
					e.target.classList.remove('active');
					return;
				}

				const actionEl = e.target.closest('[data-action]');
				if (actionEl) {
					const action = actionEl.dataset.action;

					if (!(action === 'pause-open' && !vn.controls.enableCheckpoints)) {
						this.runAction(action, actionEl);
						return;
					}
				}

				const cpItem = e.target.closest('.checkpoint-item');
				if (cpItem) {
					if (!cpItem.disabled) vn.scene.jumpToCheckpoint(cpItem.dataset.checkpoint);
					return;
				}

				if (e.target.closest('.start-gate')) {
					const startBtn = e.target.closest('[data-start-action]');
					if (startBtn) vn.ui.beginStart(startBtn.dataset.startAction);
					else if (!vn.progress.pendingResumeIndex) vn.ui.beginStart('start');
					return;
				}

				if (e.target.closest('.volume-control')) return;

				if (vn.elements.volumeControl.classList.contains('open')) {
					vn.elements.volumeControl.classList.remove('open');
					return;
				}

				if (e.target.closest('.autoplay-control')) return;

				if (vn.elements.autoplayControl.classList.contains('open')) {
					vn.elements.autoplayControl.classList.remove('open');
					return;
				}

				if (e.target === vn.elements.logModal ||
					e.target === vn.elements.creditsModal ||
					e.target === vn.elements.pauseMenu) {
					vn.ui.closeModal();
					return;
				}

				if (vn.activeModal === 'log' || vn.activeModal === 'pause' || vn.isWaitingForStart) return;
				if (e.target.closest('.top-controls, .log-modal, .credits-modal, .pause-menu, .start-gate')) return;

				const boxes = ['.dialogue-content', '.conv-dialogue-box', '.narration-screen'];
				if (!boxes.some(sel => e.target.closest(sel))) this.advance();
			}

			runAction(action, actionEl = null) {
				this.#actions[action]?.(actionEl);
			}

			toggleMute() {
				const vn = this.#vn;
				const volume = vn.audio.toggleMute();
				emit('feature_audio', { state: volume > 0 ? 'unmuted' : 'muted', volume: Math.round(volume * 100) });
				vn.ui.updateVolumeUi();
				vn.save.setVolume(volume);
			}

			toggleTypewriter() {
				const vn = this.#vn;
				vn.dialogue.enabled = !vn.dialogue.enabled;
				vn.save.setTypewriter(vn.dialogue.enabled);
				emit('feature_typewriter', { state: vn.dialogue.enabled ? 'enabled' : 'disabled' });

				if (!vn.dialogue.enabled && vn.dialogue.isTyping) {
					vn.dialogue.completeAll();
					vn.autoplay.onContentSettled(vn.script[vn.currentIndex]);
				}

				this.updateTypewriterToggleButton();

				const message = vn.i18n.t(vn.dialogue.enabled ? 'controls.typewriterEnabled' : 'controls.typewriterDisabled');
				const type = vn.dialogue.enabled ? "success" : "error";
				vn.ui.showToast(message, type);
			}

			updateTypewriterToggleButton() {
				const vn = this.#vn;
				document.body.dataset.typewriterEnabled = String(vn.dialogue.enabled);
				vn.ui.setTitle(vn.elements.typewriterToggle, vn.dialogue.enabled ? 'controls.typewriterDisable' : 'controls.typewriterEnable');
			}

			advance() {
				const vn = this.#vn;
				if (!vn.isLoaded || vn.isWaitingForStart || vn.activeModal || vn.scene.isLoadingScene) return;

				vn.autoplay.onAdvanceStart();

				if (vn.scene.flushPendingScene()) return;

				if (vn.dialogue.isTyping) {
					vn.dialogue.completeAll();
					vn.autoplay.onContentSettled(vn.script[vn.currentIndex]);
				} else if (vn.dialogue.isConversationActive) {
					vn.dialogue.advanceConversation();
				} else if (vn.currentIndex < vn.script.length - 1) {
					vn.scene.nextScene();
				}
			}
		}

		class SceneManager {
			#vn;
			#sceneTimer = null;
			#pendingSceneExecute = null;
			#isStartingChapter = false;
			#instantScene = false;
			#isLoadingScene = false;
			#retryHandler = null;
			#titleFadeTimeout = null;

			#sceneRenderers = {
				single: (scene) => this.#vn.dialogue.render(scene),
				multi: (scene) => this.#vn.dialogue.render(scene),
				narration: (scene) => this.#vn.dialogue.render(scene),
				conversation: (scene) => this.#vn.dialogue.render(scene),
				image: (scene) => scene.fullscreen ? this.#vn.stage.showFullscreenMedia(scene) : this.#vn.ui.showImage(scene),
				video: (scene) => scene.fullscreen ? this.#vn.stage.showFullscreenMedia(scene) : this.#vn.stage.showVideoScene(scene),
				blank: () => this.activateLayer(this.#vn.elements.blankScreen),
				title: (scene, isStarting) => this.#vn.ui.showTitleScreen(scene, isStarting),
				end: (scene) => this.#vn.ui.showEndScreen(scene),
			};

			#passiveInstant = {
				chapter: (scene) => this.setChapter(scene.name),
				background: (scene) => this.#vn.stage.setBackgroundInstant(scene),
				audio: (scene) => this.#vn.audio.handleScene({ ...scene, fade: 0 }),
				sprite: (scene) => this.#vn.sprites.applyCommand({ ...scene, fade: false }),
				sprites: (scene) => (scene.sprites || []).forEach(sprite => this.#vn.sprites.applyCommand({ ...sprite, fade: false })),
				checkpoint: (scene, index) => this.#vn.progress.reachCheckpoint(scene, index, true),
				position: (scene) => { this.#vn.dialoguePosition = scene.value; },
			};

			#passiveLive = {
				chapter: (scene) => this.setChapter(scene.name),
				background: (scene) => this.#vn.stage.fadeBackground(scene),
				audio: (scene) => this.#vn.audio.handleScene(scene),
				sprite: (scene) => this.#vn.sprites.applyScene(scene),
				sprites: (scene) => this.#vn.sprites.applyScene(scene),
				checkpoint: (scene, index) => this.#vn.progress.reachCheckpoint(scene, index, false),
				position: (scene) => { this.#vn.dialoguePosition = scene.value; },
			};

			dispatchPassiveEvent(scene, index, live = false) {
				(live ? this.#passiveLive : this.#passiveInstant)[scene.type]?.(scene, index);
			}

			constructor(vn) { this.#vn = vn; }

			get isLoadingScene() { return this.#isLoadingScene; }
			get instant() { return this.#instantScene; }

			reset() {
				this.#isLoadingScene = false;
				this.#retryHandler = null;
				if (this.#sceneTimer) { clearTimeout(this.#sceneTimer); this.#sceneTimer = null; }
				this.#pendingSceneExecute = null;
				this.cancelTitleReveal();
			}

			retry() { if (this.#retryHandler) this.#retryHandler(); }

			flushPendingScene() {
				if (this.#sceneTimer && this.#pendingSceneExecute) {
					clearTimeout(this.#sceneTimer);
					this.#pendingSceneExecute();
					return true;
				}
				return false;
			}

			scheduleTitleReveal(callback) {
				this.#titleFadeTimeout = setTimeout(callback, TIMINGS.titleCrossfade);
			}

			cancelTitleReveal() {
				if (this.#titleFadeTimeout) { clearTimeout(this.#titleFadeTimeout); this.#titleFadeTimeout = null; }
			}

			begin() {
				this.consumePassiveScenesInstant();
				this.#isStartingChapter = true;
				this.showCurrentScene();
			}

			#resetPlaybackForJump() {
				this.#vn.autoplay.reset();
				this.#vn.dialogue.completeAll();
				if (this.#sceneTimer) { clearTimeout(this.#sceneTimer); this.#sceneTimer = null; }
				this.#pendingSceneExecute = null;
				this.#vn.dialogue.resetConversation();
			}

			#playFrom(restoreIndex, currentIndex) {
				this.#resetPlaybackForJump();
				const targetSceneType = this.#getNextActiveSceneType(currentIndex);
				this.restoreSceneState(restoreIndex, targetSceneType);
				this.#vn.currentIndex = currentIndex;
				this.consumePassiveScenesInstant();
				this.#isStartingChapter = true;
				this.showCurrentScene();
			}

			jumpToCheckpoint(id) {
				const vn = this.#vn;
				const checkpoint = vn.progress.chapterCheckpoints.find(item => item.id === id);
				if (!checkpoint) return;
				vn.ui.closeModal();
				emit('checkpoint_jump', { checkpoint_id: id });

				this.#instantScene = true;
				const targetIndex = Math.min(checkpoint.index + 1, vn.script.length - 1);
				this.#playFrom(checkpoint.index, targetIndex);
			}

			restartChapterMidGame() {
				this.#vn.ui.closeModal();
				emit('chapter_restarted', { trigger: 'pause_menu' });

				this.fadeToBlack(() => {
					this.#instantScene = true;
					this.#playFrom(-1, 0);
					this.fadeFromBlack();
				});
			}

			fadeToBlack(onComplete) {
				const fade = this.#vn.elements.screenFade;
				if (!fade) { onComplete(); return; }

				let done = false;
				const finish = () => {
					if (done) return;
					done = true;
					fade.removeEventListener('transitionend', finish);
					onComplete();
				};
				fade.addEventListener('transitionend', finish);
				forceNextFrame(() => fade.classList.add('active'));
				setTimeout(finish, TIMINGS.screenFade + 100);
			}

			fadeFromBlack() {
				this.#vn.elements.screenFade?.classList.remove('active');
			}

			setChapter(name) {
				const vn = this.#vn;
				document.title = stripHtml(name);
				vn.currentChapter = name;
				const info = vn.elements.chapterInfo;
				if (!info) return;
				info.innerHTML = name;
				info.classList.toggle('checkpoints-enabled', vn.controls.enableCheckpoints);
				info.title = vn.controls.enableCheckpoints ? vn.i18n.t('pause.openMenu') : '';
			}

			consumePassiveScenesInstant() {
				const vn = this.#vn;
				while (vn.currentIndex < vn.script.length) {
					const scene = vn.script[vn.currentIndex];
					if (!scene || !scene.isPassive) return;

					this.dispatchPassiveEvent(scene, vn.currentIndex);
					vn.currentIndex++;
				}
			}

			restoreSceneState(targetIndex, targetSceneType = null) {
				const vn = this.#vn;
				this.hideAllScreens(targetSceneType);
				vn.stage.clearOverlay(true);
				vn.sprites.clear(false);
				vn.audio.stopAll(0);
				vn.dialogue.resetConversation();
				vn.dialoguePosition = DEFAULT_DIALOGUE_POSITION;

				vn.log.rebuild(targetIndex);

				let clusterStart = Math.min(targetIndex, vn.script.length - 1);
				while (clusterStart > 0 && vn.script[clusterStart - 1]?.isPassive) clusterStart--;

				for (let i = 0; i <= targetIndex && i < vn.script.length; i++) {
					const scene = vn.script[i];
					if (!scene || scene.type === 'checkpoint' || (scene.type === 'audio' && i < clusterStart)) continue;

					this.dispatchPassiveEvent(scene, i);
				}
			}

			async gateSceneAssets(scene) {
				const vn = this.#vn;
				const pending = vn.assets.pendingFor(scene);
				if (pending.length === 0) return;

				this.#isLoadingScene = true;
				vn.elements.loading.classList.remove('hidden');

				let retried = false;
				try {
					while (true) {
						try {
							await Promise.all(pending.map(src => vn.assets.ensureAsset(src)));
							if (retried) emit('asset_retry_success', { assets: pending.join(', ') });
							break;
						} catch (e) {
							const { network, missing } = await vn.assets.diagnoseFailure(pending);
							if (!network) {
								const bad = (missing.length ? missing : pending).join('\n');
								vn.ui.showScriptError(`The chapter referenced ${missing.length ? 'an asset that could not be found' : 'an asset that could not be loaded'}:\n\n${bad}\n\nCheck that the file path is correct and that the file exists.`);
								await new Promise(() => {});
							}
							retried = true;
							emit('error_network', { assets: pending.join(', ') });
							await new Promise(resolve => {
								this.#retryHandler = () => { this.#retryHandler = null; resolve(); };
								vn.elements.loading.classList.add('hidden');
								vn.ui.showLoadingError();
							});
							vn.ui.hideLoadingError();
							vn.elements.loading.classList.remove('hidden');
							vn.assets.invalidate(pending);
						}
					}
				} finally {
					vn.elements.loading.classList.add('hidden');
					this.#isLoadingScene = false;
				}
			}

			static #isFullscreenMedia(scene) {
				return scene && (scene.type === 'image' || scene.type === 'video') && scene.fullscreen === true;
			}

			nextScene() {
				this.#vn.currentIndex++;
				this.showCurrentScene();
			}

			executeScene(scene, isStarting) {
				this.#sceneRenderers[scene.type]?.(scene, isStarting);

				if (isStarting) {
					requestAnimationFrame(() => {
						this.#vn.elements.startGate.classList.remove('active');
					});
				}

				this.#instantScene = false;

				if (scene.type === 'image' || scene.type === 'video' || scene.type === 'title' || scene.type === 'blank') {
					this.#vn.autoplay.onContentSettled(scene);
				}
			}

			async showCurrentScene() {
				const vn = this.#vn;
				if (this.#sceneTimer) {
					clearTimeout(this.#sceneTimer);
					this.#sceneTimer = null;
				}
				const scene = vn.script[vn.currentIndex];
				if (!scene) return;

				vn.assets.updateWindow(vn.currentIndex, () => vn.ui.updatePauseAssets());

				const pendingAssets = vn.assets.pendingFor(scene);
				if (pendingAssets.length) {
					await this.gateSceneAssets(scene);

					if (vn.script[vn.currentIndex] !== scene) return;
				}

				const activeIndices = vn.assets.activeIndices;
				if (activeIndices.length && vn.currentIndex === activeIndices[activeIndices.length - 1]) {
					vn.progress.markChapterFinished();
					emit('game_completed', { chapter_id: vn.chapterFile });
				}

				if (scene.isPassive) {
					this.dispatchPassiveEvent(scene, vn.currentIndex, true);
					this.nextScene();
					return;
				}

				if (!SceneManager.#isFullscreenMedia(scene) && this.#vn.stage.isOverlayShowing()) {
					this.#vn.stage.clearOverlay(this.#instantScene);
				}

				if (scene.type === 'conversation') {
					vn.dialogue.startConversation(scene);
				} else {
					this.hideAllScreens(scene.type);
					vn.dialogue.resetConversation();
				}

				const isStarting = this.#isStartingChapter;
				this.#isStartingChapter = false;

				const gapMs = (isStarting || (scene.type === 'conversation' && vn.dialogue.isConversationActive) || scene.type === 'title') ? 0 : TIMINGS.sceneGap;

				this.#pendingSceneExecute = () => {
					this.#sceneTimer = null;
					this.#pendingSceneExecute = null;
					this.executeScene(scene, isStarting);
				};

				this.#sceneTimer = setTimeout(this.#pendingSceneExecute, gapMs);
			}

			#getNextActiveSceneType(startIndex) {
				const vn = this.#vn;
				let tempIndex = Math.max(0, startIndex);
				while (tempIndex < vn.script.length) {
					let s = vn.script[tempIndex];
					if (!s) break;

					if (s.isPassive) {
						tempIndex++;
					} else {
						return s.type;
					}
				}
				return null;
			}

			activateLayer(layer) {
				if (!layer) return;
				if (this.#instantScene) {
					this.#toggleLayerInstant(layer, true);
					return;
				}
				enableGpuAccel(layer);
				layer.classList.add('active');
			}

			#toggleLayerInstant(layer, active) {
				const previousTransition = layer.style.transition;
				layer.style.transition = 'none';
				layer.classList.toggle('active', active);
				void layer.offsetWidth;
				layer.style.transition = previousTransition;
			}

			hideAllScreens(excludeType = null) {

				this.#vn.stage.clearVideoScene();

				const keepTitle = excludeType === 'title';

				document.querySelectorAll('.scene-layer').forEach(element => {
					if (keepTitle && element === this.#vn.elements.titleScreen) return;
					if (this.#instantScene) {
						this.#toggleLayerInstant(element, false);
						return;
					}
					if (element.classList.contains('active')) enableGpuAccel(element);
					element.classList.remove('active');
				});

				if (!keepTitle) this.cancelTitleReveal();
			}
		}

			getLanguageOptions() {

				const codes = vn.languageManager?.languages || [];
				const systemBase = (navigator.language || '').toLowerCase().split('-')[0];
				const baseOf = (code) => code.toLowerCase().split('-')[0];

				return codes
					.map(code => ({ code, label: this.getLanguageLabel(code) }))
					.sort((a, b) => {
						const aSystem = baseOf(a.code) === systemBase;
						const bSystem = baseOf(b.code) === systemBase;
						if (aSystem !== bSystem) return aSystem ? -1 : 1;
						return a.label.localeCompare(b.label);
					});
			}

				try {
					const label = new Intl.DisplayNames([code], { type: 'language' }).of(code);
					if (label && label.toLowerCase() !== code.toLowerCase()) {

						return label.charAt(0).toUpperCase() + label.slice(1);
					}
				} catch (e) {  }
				return code;
			}

		class ScriptCompiler {

			static compile(raw, fileLabel = '', source = '') {
				const where = (msg) => fileLabel ? `In ${fileLabel}, ${msg}` : msg;

				if (!isPlainObject(raw)) {
					throw new Error(where('the file must be a YAML mapping with "chapter", "characters" and "script".'));
				}
				if (!Array.isArray(raw.script)) {
					throw new Error(where('a "script:" list of events is required.'));
				}

				const characters = ScriptCompiler.#parseCharacters(raw.characters, where);
				const scenes = [];

				if (hasAsset(raw.chapter)) scenes.push({ type: 'chapter', name: String(raw.chapter), isPassive: true });

				const ends = [];
				raw.script.forEach((event, i) => {
					const at = (msg) => {
						const line = ScriptCompiler.#scriptEventLines(source)[i];
						const location = line ? `script event #${i + 1} (line ${line})` : `script event #${i + 1}`;
						return where(`${location}: ${msg}`);
					};
					const scene = ScriptCompiler.#compileEvent(event, characters, at);
					if (scene.type === 'end') ends.push({ index: scenes.length, at });
					scenes.push(scene);
				});

				for (const { index, at } of ends) {
					for (let j = index + 1; j < scenes.length; j++) {
						if (!scenes[j].isPassive) throw new Error(at('an "end" event must be the last active event in the chapter.'));
					}
				}

				let startIndex = -1;
				for (let i = 0; i < scenes.length; i++) if (scenes[i].type === 'start') startIndex = i;
				if (startIndex === -1) return scenes;
				const head = scenes[0] && scenes[0].type === 'chapter' ? [scenes[0]] : [];
				const carried = new Map();
				for (let i = startIndex - 1; i >= 0; i--) {
					const type = scenes[i].type;
					if (ScriptCompiler.#START_CARRIED.includes(type) && !carried.has(type)) carried.set(type, scenes[i]);
				}
				return head.concat([...carried.values()].reverse(), scenes.slice(startIndex + 1));
			}

			static #START_CARRIED = ['background', 'position'];

			static #LINE_COMMENT = /^\s*#/;
			static #LINE_LEADING_WS = /^\s*/;
			static #LINE_SCRIPT_KEY = /^\s*script\s*:/;
			static #LINE_SEQ_ITEM = /^\s*-/;

			static #scriptEventLines(source) {
				const lines = String(source ?? '').split('\n');
				const eventLines = [];
				let scriptIndent = -1;
				let seqIndent = -1;
				let inScript = false;

				for (let i = 0; i < lines.length; i++) {
					const line = lines[i];
					if (line.trim() === '' || ScriptCompiler.#LINE_COMMENT.test(line)) continue;
					const indent = line.length - line.replace(ScriptCompiler.#LINE_LEADING_WS, '').length;

					if (!inScript) {
						if (ScriptCompiler.#LINE_SCRIPT_KEY.test(line)) { inScript = true; scriptIndent = indent; }
						continue;
					}

					const isSeqItem = ScriptCompiler.#LINE_SEQ_ITEM.test(line);
					if (!isSeqItem && indent <= scriptIndent) break;
					if (!isSeqItem) continue;
					if (seqIndent === -1) seqIndent = indent;
					if (indent === seqIndent) eventLines.push(i + 1);
				}

				return eventLines;
			}

			static #parseCharacters(raw, where) {
				const characters = {};
				if (raw == null) return characters;
				if (!isPlainObject(raw)) {
					throw new Error(where('"characters:" must be a mapping of id to definition.'));
				}
				for (const [id, def] of Object.entries(raw)) {
					if (RESERVED_WORDS.has(id)) {
						throw new Error(where(`character id "${id}" is a reserved word and cannot be used.`));
					}
					const definition = def || {};
					characters[id] = {
						name: definition.name != null ? String(definition.name) : id,
						color: definition.color,
						avatar: definition.avatar
					};
				}
				return characters;
			}

			static #compileEvent(event, characters, at) {
				if (!isPlainObject(event)) {
					throw new Error(at('each event must be a mapping, e.g. - narration: "..."'));
				}

				const keys = Object.keys(event);
				const candidates = keys.filter(key => RESERVED_ACTIONS.has(key) || key in characters);

				if (candidates.length === 0) {
					throw new Error(at(`unknown action or character id "${keys[0]}". Define it under "characters:" or use a valid action word.`));
				}

				let primary;
				const primaryCandidates = candidates.filter(key => !SECONDARY_ACTIONS.has(key));
				if (primaryCandidates.length === 1) {
					primary = primaryCandidates[0];
				} else if (primaryCandidates.length === 0 && candidates.length === 1) {
					primary = candidates[0];
				} else {
					throw new Error(at(`ambiguous event — found multiple actions/characters (${candidates.join(', ')}). Each event needs exactly one.`));
				}

				if (primary in characters) return ScriptCompiler.#single(primary, event, characters, at);
				return ScriptCompiler.#compilers[primary](event[primary], event, characters, at);
			}

			static #compilers = {
				narration: (value, event) => ({ type: 'narration', text: ScriptCompiler.#text(value), position: event.position, log: event.log }),
				multi: (value, event, characters, at) => ScriptCompiler.#multi(value, event, characters, at),
				conversation: (value, event, characters, at) => ScriptCompiler.#conversation(event, characters, at),
				bg: (value, event, characters, at) => {
					const asset = ScriptCompiler.#asset(value, 'bg', at);
					return { type: 'background', asset, mediaType: isVideoAsset(asset) ? 'video' : 'image', loop: event.loop, volume: event.volume, position: ScriptCompiler.#bgAnchor(event.anchor, at), isPassive: true };
				},
				play: (value, event, characters, at) => ScriptCompiler.#compileAudio('play', value, event, at),
				stop: (value, event) => ScriptCompiler.#compileAudio('stop', value, event),
				pause: (value, event) => ScriptCompiler.#compileAudio('pause', value, event),
				volume: (value, event) => ScriptCompiler.#compileAudio('volume', value, event),
				show: (value, event, characters, at) => ScriptCompiler.#compileSprite('show', value, event, at),
				replace: (value, event, characters, at) => ScriptCompiler.#compileSprite('replace', value, event, at),
				hide: (value, event, characters, at) => ScriptCompiler.#compileSprite('hide', value, event, at),
				clear: (value, event, characters, at) => ScriptCompiler.#compileSprite('clear', value, event, at),
				image: (value, event, characters, at) => ({ type: 'image', asset: ScriptCompiler.#asset(value, 'image', at), fullscreen: event.fullscreen === true, position: ScriptCompiler.#bgAnchor(event.anchor, at), caption: event.caption, log: event.log }),
				video: (value, event, characters, at) => ({ type: 'video', asset: ScriptCompiler.#asset(value, 'video', at), fullscreen: event.fullscreen === true, loop: event.loop, volume: event.volume, position: ScriptCompiler.#bgAnchor(event.anchor, at), caption: event.caption, log: event.log }),
				title: (value, event) => ({ type: 'title', title: ScriptCompiler.#text(value), image: event.image, subtitle: event.subtitle, log: event.log }),
				end: (value, event) => ({ type: 'end', title: ScriptCompiler.#text(value), subtitle: event.subtitle, image: event.image, credits: event.credits }),
				checkpoint: (value) => ({ type: 'checkpoint', name: ScriptCompiler.#text(value), isPassive: true }),
				blank: () => ({ type: 'blank' }),
				start: () => ({ type: 'start' }),
				position: (value, event, characters, at) => ({ type: 'position', value: ScriptCompiler.#dialoguePosition(value, at), isPassive: true })
			};

			static #dialoguePosition(value, at) {
				const position = value != null ? String(value).trim().toLowerCase() : '';
				if (position === '' || position === 'default') return DEFAULT_DIALOGUE_POSITION;
				if (!DIALOGUE_POSITIONS.includes(position)) {
					throw new Error(at('"position:" must be top, center, bottom, or left empty to reset.'));
				}
				return position;
			}

			static #text(value) {
				return value != null ? String(value) : '';
			}

			static #asset(value, action, at) {
				if (!hasAsset(value)) throw new Error(at(`"${action}:" needs a file path.`));
				return String(value);
			}

			static #bgAnchor(value, at) {
				if (value == null) return undefined;
				const placement = resolvePlacement(value, PLACEMENT_KEYWORDS.anchor);
				if (!placement) {
					throw new Error(at('"anchor" must be top, bottom, left, right, center, a percentage, or a pair like "top left".'));
				}
				return `${placement.x != null ? placement.x : 50}% ${placement.y != null ? placement.y : 50}%`;
			}

			static #audioTarget(value) {
				const target = ScriptCompiler.#text(value).trim();
				return target === '' || target === 'all' ? undefined : target;
			}

			static #compileAudio(action, value, event, at) {
				if (action === 'play') {
					return { type: 'audio', action: 'play', asset: ScriptCompiler.#asset(value, 'play', at), id: event.id != null ? String(event.id) : value, loop: event.loop, volume: event.volume, fade: event.fade, from: event.from, isPassive: true };
				}
				const command = { type: 'audio', action, id: ScriptCompiler.#audioTarget(value), fade: event.fade, isPassive: true };
				if (action === 'volume') command.volume = event.level;
				return command;
			}

			static #compileSprite(action, value, event, at) {
				if (action === 'clear') return { type: 'sprite', action: 'clear', fade: event.fade, isPassive: true };
				if (action === 'hide') return ScriptCompiler.#hide(value, event, at);
				return ScriptCompiler.#sprite(value, event, action, at);
			}

			static #line(id, container, characters, at) {
				const character = characters[id];
				if (!character) throw new Error(at(`unknown character id "${id}".`));
				return {
					name: character.name,
					color: container.color != null ? container.color : character.color,
					avatar: container.avatar != null ? container.avatar : character.avatar,
					text: ScriptCompiler.#text(container[id]),
					hideAvatarInGame: container.hideAvatarInGame === true,
					hideAvatarInLog: container.hideAvatarInLog === true
				};
			}

			static #single(id, event, characters, at) {
				const line = ScriptCompiler.#line(id, event, characters, at);
				return {
					type: 'single',
					character: line.name,
					color: line.color,
					avatar: line.avatar,
					text: line.text,
					position: event.position,
					hideAvatarInGame: line.hideAvatarInGame,
					hideAvatarInLog: line.hideAvatarInLog,
					log: event.log
				};
			}

			static #characterKey(item, characters, at, label) {
				if (!isPlainObject(item)) {
					throw new Error(at(`${label} must be a mapping like - m: "..."`));
				}
				const ids = Object.keys(item).filter(key => key in characters);
				if (ids.length !== 1) throw new Error(at(`${label} needs exactly one character id.`));
				return ids[0];
			}

			static #multi(value, event, characters, at) {
				if (!Array.isArray(value)) throw new Error(at('"multi:" must be a list of character lines.'));
				const cast = value.map((item, j) => {
					const id = ScriptCompiler.#characterKey(item, characters, at, `multi line #${j + 1}`);
					return ScriptCompiler.#line(id, item, characters, at);
				});
				return { type: 'multi', characters: cast, position: event.position, log: event.log };
			}

			static #conversation(event, characters, at) {
				const value = event.conversation;
				const src = isPlainObject(value) ? value : event;
				const left = characters[src.left];
				const right = characters[src.right];
				if (!left) throw new Error(at(`conversation "left:" references unknown character id "${src.left}".`));
				if (!right) throw new Error(at(`conversation "right:" references unknown character id "${src.right}".`));
				if (!Array.isArray(src.dialogue)) throw new Error(at('conversation needs a "dialogue:" list.'));

				const cast = [
					{ name: left.name, color: left.color, avatar: left.avatar, position: 'left' },
					{ name: right.name, color: right.color, avatar: right.avatar, position: 'right' }
				];

				const dialogue = src.dialogue.map((item, j) => {
					const id = ScriptCompiler.#characterKey(item, characters, at, `conversation line #${j + 1}`);
					if (id !== src.left && id !== src.right) {
						throw new Error(at(`conversation line #${j + 1} speaker "${id}" is not the left or right character.`));
					}
					const line = { speaker: characters[id].name, text: ScriptCompiler.#text(item[id]) };
					if (item.avatar != null) line.avatar = item.avatar;
					if (item.color != null) line.color = item.color;
					return line;
				});

				return { type: 'conversation', characters: cast, dialogue, position: src.position != null ? src.position : event.position, log: src.log != null ? src.log : event.log };
			}

			static #spriteParams(id, params, action, at) {
				if (!isPlainObject(params)) {
					throw new Error(at(`sprite "${id}" must be a mapping of parameters.`));
				}
				return {
					id, action,
					asset: params.asset,
					pos: params.pos,
					anchor: params.anchor,
					layer: params.layer,
					height: params.height,
					fade: params.fade
				};
			}

			static #sprite(value, event, action, at) {
				if (typeof value === 'string') {
					return { type: 'sprite', id: value, action, asset: event.asset, pos: event.pos, anchor: event.anchor, layer: event.layer, height: event.height, fade: event.fade, isPassive: true };
				}
				if (isPlainObject(value)) {
					const sprites = Object.entries(value).map(([id, params]) => ScriptCompiler.#spriteParams(id, params, action, at));
					return { type: 'sprites', sprites, isPassive: true };
				}
				throw new Error(at(`"${action}:" must be a character id or a mapping of character ids.`));
			}

			static #hide(value, event, at) {
				if (typeof value === 'string') {
					return { type: 'sprite', id: value, action: 'hide', fade: event.fade, isPassive: true };
				}
				if (Array.isArray(value)) {
					return { type: 'sprites', sprites: value.map(id => ({ id: String(id), action: 'hide', fade: event.fade })), isPassive: true };
				}
				throw new Error(at('"hide:" must be a character id or a list of character ids.'));
			}
		}

		class AutoplayManager {
			#vn;
			#enabled = false;
			#speedIndex = AUTOPLAY_DEFAULT_SPEED;
			#showProgress = true;
			#timer = null;
			#settled = false;
			#armStart = 0;
			#armDwell = 0;
			#armScene = null;
			#armFixed = false;
			#metaVideo = null;
			#metaHandler = null;
			#isFrozen = false;
			#frozenFrac = 0;

			constructor(vn) { this.#vn = vn; }

			get enabled() { return this.#enabled; }

			static speedLabelKey(index) {
				const id = AUTOPLAY_SPEEDS[index].id;
				return `controls.autoplaySpeed${id.charAt(0).toUpperCase()}${id.slice(1)}`;
			}

			init() {
				const save = this.#vn.save;
				const savedSpeed = save.getAutoplaySpeed();
				this.#speedIndex = (savedSpeed !== null && savedSpeed >= 0 && savedSpeed < AUTOPLAY_SPEEDS.length) ? savedSpeed : AUTOPLAY_DEFAULT_SPEED;
				const savedProgress = save.getAutoplayProgress();
				this.#showProgress = savedProgress === null ? true : savedProgress === 'true';
				this.#syncUi();
			}

			togglePanel() {
				const control = this.#vn.elements.autoplayControl;
				if (!control) return;
				this.#vn.elements.volumeControl?.classList.remove('open');
				control.classList.toggle('open');
			}

			toggleEnabled() { this.setEnabled(!this.#enabled); }

			setEnabled(on) {
				this.#enabled = Boolean(on);
				this.#syncUi();
				emit('feature_autoplay', { state: this.#enabled ? 'enabled' : 'disabled' });
				if (this.#enabled) this.#maybeArm();
				else this.#cancel();
			}

			setSpeed(index) {
				if (!(index >= 0 && index < AUTOPLAY_SPEEDS.length) || index === this.#speedIndex) return;
				this.#speedIndex = index;
				this.#vn.save.setAutoplaySpeed(index);
				this.#syncUi();
				if (this.#timer) this.#adjustDwell();
			}

			toggleProgress() {
				this.#showProgress = !this.#showProgress;
				this.#vn.save.setAutoplayProgress(this.#showProgress);
				this.#syncUi();
				if (this.#timer && this.#showProgress) {
					const frac = this.#elapsedFraction();
					this.#renderBar(frac, this.#armDwell * (1 - frac));
				} else {
					this.#hideBar();
				}
			}

			onContentSettled(scene) {
				this.#cancel();
				this.#settled = Boolean(scene) && scene.type !== 'end';
				this.#armScene = this.#settled ? scene : null;
				this.#maybeArm();
			}

			onAdvanceStart() {
				this.#cancel();
				this.#settled = false;
				this.#armScene = null;
			}

			pause() { this.#cancel(); }

			resume() { this.#maybeArm(); }

			reset() {
				this.#cancel();
				this.#settled = false;
				this.#armScene = null;
			}

			#maybeArm() {
				if (this.#settled && this.#armScene && this.#enabled && this.#canRun()) this.#armForScene(this.#armScene);
			}

			#canRun() {
				const vn = this.#vn;
				return vn.isLoaded && !vn.isWaitingForStart && !vn.activeModal && !vn.scene.isLoadingScene;
			}

			#armForScene(scene) {
				this.#cancel();
				if (scene.type === 'video') {
					const video = this.#vn.stage.activeSceneVideo;
					const begin = () => {
						const remaining = (video && isFinite(video.duration) && video.duration > 0)
							? Math.max(0, (video.duration - (video.currentTime || 0)) * 1000)
							: AUTOPLAY_VIDEO_FALLBACK;
						this.#arm(remaining, true);
					};
					if (video && isFinite(video.duration) && video.duration > 0) {
						begin();
					} else if (video) {
						this.#metaVideo = video;
						this.#metaHandler = () => {
							this.#cancelMeta();
							if (this.#settled && this.#enabled && this.#canRun()) begin();
						};
						video.addEventListener('loadedmetadata', this.#metaHandler, { once: true });
					} else {
						this.#arm(AUTOPLAY_VIDEO_FALLBACK, true);
					}
				} else {
					this.#arm(this.#dwellForScene(scene), false);
				}
			}

			#dwellForScene(scene) {
				const preset = AUTOPLAY_SPEEDS[this.#speedIndex];
				const isStatic = scene.type === 'image' || scene.type === 'blank';
				const chars = isStatic ? AUTOPLAY_MEDIA_CHARS : this.#measureChars();
				return clamp(preset.base + chars * preset.perChar, AUTOPLAY_MIN_DWELL, AUTOPLAY_MAX_DWELL);
			}

			#measureChars() {
				let count = 0;
				document.querySelectorAll('.scene-layer.active .dialogue-text, .scene-layer.active .narration-text, .scene-layer.active .screen-title, .scene-layer.active .screen-subtitle')
					.forEach(el => { count += (el.textContent || '').length; });
				return count;
			}

			#arm(dwell, fixed = false) {
				this.#cancel();
				this.#armStart = Date.now();
				this.#armDwell = dwell;
				this.#armFixed = fixed;
				this.#renderBar(0, dwell);
				this.#timer = setTimeout(() => { this.#timer = null; this.#fire(); }, dwell);
			}

			#adjustDwell() {
				if (this.#armFixed || !this.#armScene) return;

				const frac = this.#isFrozen ? this.#frozenFrac : this.#elapsedFraction();
				
				clearTimeout(this.#timer);
				
				this.#isFrozen = true;
				this.#frozenFrac = frac;

				const bar = this.#vn.elements.autoplayProgressBar;
				if (bar) {
					bar.style.transition = 'none';
					bar.style.transform = `scaleX(${frac})`;
				}

				this.#timer = setTimeout(() => {
					this.#isFrozen = false;
					
					const remaining = Math.max(this.#dwellForScene(this.#armScene) * (1 - frac), 100);
					
					this.#armDwell = frac < 1 ? remaining / (1 - frac) : remaining;
					this.#armStart = Date.now() - (frac * this.#armDwell);
					
					this.#timer = setTimeout(() => { this.#timer = null; this.#fire(); }, remaining);
					this.#renderBar(frac, remaining);
				}, AUTOPLAY_SPEED_BUFFER); 
			}

			#elapsedFraction() {
				if (!this.#armDwell) return 0;
				return clamp((Date.now() - this.#armStart) / this.#armDwell, 0, 1);
			}

			#fire() {
				this.#hideBar();
				if (this.#enabled && this.#canRun()) this.#vn.input.advance();
			}

			#cancel() {
				if (this.#timer) { clearTimeout(this.#timer); this.#timer = null; }
				this.#isFrozen = false;
				this.#cancelMeta();
				this.#hideBar();
			}

			#cancelMeta() {
				if (this.#metaVideo && this.#metaHandler) this.#metaVideo.removeEventListener('loadedmetadata', this.#metaHandler);
				this.#metaVideo = null;
				this.#metaHandler = null;
			}

			#renderBar(fromFraction, durationMs) {
				const wrap = this.#vn.elements.autoplayProgress;
				const bar = this.#vn.elements.autoplayProgressBar;
				if (!wrap || !bar) return;
				if (!this.#showProgress) { wrap.classList.remove('visible'); return; }
				bar.style.transition = 'none';
				bar.style.transform = `scaleX(${fromFraction})`;
				wrap.classList.add('visible');
				void bar.offsetWidth;
				bar.style.transition = `transform ${durationMs}ms linear`;
				bar.style.transform = 'scaleX(1)';
			}

			#hideBar() {
				const wrap = this.#vn.elements.autoplayProgress;
				const bar = this.#vn.elements.autoplayProgressBar;
				if (!wrap || !bar) return;
				wrap.classList.remove('visible');
				bar.style.transition = 'none';
				bar.style.transform = 'scaleX(0)';
			}

			#syncUi() {
				const vn = this.#vn;
				const button = vn.elements.autoplayToggle;
				if (button) {
					button.classList.toggle('active', this.#enabled);
					vn.ui.setTitle(button, 'controls.autoplay');
				}
				vn.elements.autoplayControl?.classList.toggle('autoplay-on', this.#enabled);
				const enableToggle = vn.elements.autoplayEnableToggle;
				if (enableToggle) {
					enableToggle.setAttribute('aria-checked', String(this.#enabled));
					vn.ui.setTitle(enableToggle, this.#enabled ? 'controls.autoplayDisable' : 'controls.autoplayEnable');
				}
				const progressToggle = vn.elements.autoplayProgressToggle;
				if (progressToggle) {
					progressToggle.setAttribute('aria-checked', String(this.#showProgress));
					progressToggle.title = vn.i18n.t(this.#showProgress ? 'controls.autoplayProgressHide' : 'controls.autoplayProgressShow');
				}
				const slider = vn.elements.autoplaySpeedSlider;
				if (slider) {
					slider.value = String(this.#speedIndex);
					slider.style.setProperty('--fill', `${(this.#speedIndex / (AUTOPLAY_SPEEDS.length - 1)) * 100}%`);
				}
				if (vn.elements.autoplaySpeedValue) vn.elements.autoplaySpeedValue.textContent = vn.i18n.t(AutoplayManager.speedLabelKey(this.#speedIndex));
			}
		}

			applyGameSettings(meta = {}) {
				this.controls.showLogButton = booleanSetting(meta, 'showLogButton', true);
				this.controls.showTypewriterToggle = booleanSetting(meta, 'showTypewriterButton', true);
				this.controls.showAutoplayButton = booleanSetting(meta, 'showAutoplayButton', true);
				this.controls.enableCheckpoints = booleanSetting(meta, 'enableCheckpoints', true);
				this.controls.allowHoldToSkip = booleanSetting(meta, 'allowHoldToSkip', false);
				this.controls.enableKeyboardShortcuts = booleanSetting(meta, 'enableKeyboardShortcuts', true);
				TIMINGS.typewriterStep = clamp(numberSetting(meta, 'typewriterSpeed', 30), 0, 500);

				const savedTypewriter = this.save.getTypewriter();
				if (savedTypewriter === 'true' || savedTypewriter === 'false') {
					this.dialogue.enabled = savedTypewriter === 'true';
				} else {
					this.dialogue.enabled = booleanSetting(meta, 'enableTypewriter', true);
				}

				this.elements.logButton.classList.toggle('control-hidden', !this.controls.showLogButton);
				this.elements.typewriterToggle.classList.toggle('control-hidden', !this.controls.showTypewriterToggle);
				this.elements.autoplayControl.classList.toggle('control-hidden', !this.controls.showAutoplayButton);
				this.input.updateTypewriterToggleButton();
				this.autoplay.init();
				this.ui.updateVolumeUi();
				this.ui.updateFullscreenButton();
				this.ui.setTitle(this.elements.logButton, 'controls.log');
			}

			hasAsset(value) { return hasAsset(value); }
			getImageSrc(src) { return this.assets.getImageSrc(src); }

			applyDialoguePosition(element, position) {
				if (!element || position === null) return;

				const requested = position === undefined ? this.dialoguePosition : position;
				const safePosition = DIALOGUE_POSITIONS.includes(requested) ? requested : DEFAULT_DIALOGUE_POSITION;
				element.classList.remove('dialogue-position-top', 'dialogue-position-center', 'dialogue-position-bottom');
				element.classList.add(`dialogue-position-${safePosition}`);
			}

			async loadDialogueAndAssets() {
				try {
					await this.config.load();

					const urlParams = new URLSearchParams(window.location.search);
					const chapter = urlParams.get('chapter');

					if (!chapter) {
						await this.menu.show();
						return;
					}

					await this.loadChapter(chapter);

				} catch (error) {
					console.error('Error loading dialogue:', error);
					this.elements.loading.classList.add('hidden');
					this.isLoaded = true;
				}
			}

			async loadChapter(chapter) {
				this.resetChapterState();
				this.elements.loading.classList.remove('hidden');
				this.chapterFile = chapter;

				let dialoguePath = null;
				let response = null;
				for (const path of [`chapters/${chapter}.yaml`, `chapters/${chapter}.yml`]) {
					const attempt = await fetch(path);
					if (attempt.ok) { response = attempt; dialoguePath = path; break; }
				}
				if (!response) {
					this.ui.showScriptError(`Could not load chapters/${chapter}.yaml (or .yml). Check that the file exists and the "file:" value in config.yaml is correct.`);
					return;
				}

				const source = await response.text();
				let raw;
				try {
					raw = jsyaml.load(source);
				} catch (error) {
					this.ui.showScriptError(`Could not parse YAML in ${dialoguePath}.\n\n${error.message}`);
					return;
				}

				try {
					this.script = ScriptCompiler.compile(raw, dialoguePath, source);
				} catch (error) {
					this.ui.showScriptError(error.message);
					return;
				}

				this.progress.prepareCheckpoints();
				this.progress.pendingResumeIndex = this.progress.getResumeIndex();
				this.currentIndex = 0;

				emit('chapter_started', { chapter_id: chapter, chapter_name: stripHtml((this.gameMeta.chapters || []).find(c => c.file === chapter)?.name || chapter) });

				this.assets.collectAssets(this.script);

				await this.assets.preloadInitialAssets();
				this.assets.backgroundPreloadRest(() => this.ui.updatePauseAssets());

				this.assets.findMissingAssets().then(missing => {
					if (this.chapterFile !== chapter || !missing.length) return;
					this.ui.showScriptError(`The chapter referenced one or more assets that could not be found:\n\n${missing.join('\n')}\n\nCheck that each file path is correct and that the file exists.`);
				});

				document.querySelector('.chapter-select')?.remove();
				updateOrientationBlocker();

				setTimeout(() => {
					this.elements.loading.classList.add('hidden');
					this.isLoaded = true;
					this.ui.showStartGate();
				}, TIMINGS.loadingHandoff);
			}

			resetChapterState() {
				this.isLoaded = false;
				this.isWaitingForStart = false;
				this.currentIndex = 0;
				this.dialoguePosition = DEFAULT_DIALOGUE_POSITION;
				this.dialogue.halt();
				this.dialogue.resetConversation();
				this.activeModal = null;
				this.scene.reset();
				this.autoplay.reset();
				this.ui.hideLoadingError();
				this.script = [];
				this.assets.reset();
				this.ui.resetStartTransition();
				this.progress.reset();
				this.scene.hideAllScreens();
				this.stage.clearOverlay(true);
				this.audio.stopAll(0);
				this.log.reset();
				this.elements.endScreen.classList.remove('active');
				this.elements.logModal.classList.remove('active');
				this.elements.creditsModal.classList.remove('active');
				this.elements.pauseMenu.classList.remove('active');
				this.elements.startGate.classList.remove('active', 'hidden');
				const startPanel = this.elements.startGate.querySelector('.start-panel');
				if (startPanel) { startPanel.classList.remove('starting'); startPanel.style.opacity = ''; }
			}

			async enterChapter(chapterFile) {
				try {
					if (screen.orientation?.lock) {
						await screen.orientation.lock('landscape');
					}
				} catch (e) {

				}

				window.location.href = `${window.location.pathname}?chapter=${encodeURIComponent(chapterFile)}`;
			}

			setOrientationPaused(paused) {
				if (paused) {
					this.audio.suspendAll();
					document.querySelectorAll('video').forEach(video => {
						if (!video.paused) {
							video.dataset.orientationPaused = '1';
							video.pause();
						}
					});
				} else {
					this.audio.resumeAll();
					document.querySelectorAll('video').forEach(video => {
						if (video.dataset.orientationPaused) {
							delete video.dataset.orientationPaused;
							video.play().catch(() => {});
						}
					});
				}
			}

        }

		function insertFallbackTitle(imgEl) {
			const title = imgEl.dataset.fallbackTitle || DEFAULT_GAME_META.title;
			const fallback = document.createElement('h1');
			fallback.className = 'screen-title';
			fallback.dir = 'auto';
			fallback.innerHTML = title;
			imgEl.parentNode.appendChild(fallback);
		}

		let game = null;
		let isOrientationBlocked = false;

		function updateOrientationBlocker() {
			const isChapter = document.body.classList.contains('game-active') || new URLSearchParams(window.location.search).has('chapter');
			const isPortrait = window.matchMedia('(orientation: portrait)').matches;
			const isSmall = Math.min(window.innerWidth, window.innerHeight) < 768;
			const blocked = isChapter && isPortrait && isSmall;
			document.body.classList.toggle('portrait-blocked', blocked);

			if (blocked !== isOrientationBlocked) {
				isOrientationBlocked = blocked;
				game?.setOrientationPaused(blocked);
				if (blocked) emit('orientation_blocked', { device: Math.min(window.innerWidth, window.innerHeight) >= 600 ? 'tablet' : 'mobile' });
			}
		}

        document.addEventListener('DOMContentLoaded', () => {

			if (isFileProtocol()) {
				showFileProtocolError();
				return;
			}

			game = new VisualNovel();
			window.SASTRA.game = game;

			updateOrientationBlocker();
			let orientationRaf = null;
			new ResizeObserver(() => {
				if (orientationRaf) return;
				orientationRaf = requestAnimationFrame(() => {
					orientationRaf = null;
					updateOrientationBlocker();
				});
			}).observe(document.body);

			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('sw.js')
						.then(reg => console.log('Sastra: PWA Core Ready'))
						.catch(err => {});
				});
			}
		});
