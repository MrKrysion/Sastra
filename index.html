					const progress = Math.min((now - startTime) / duration, 1);
					videoElement.volume = clamp(from + (to - from) * progress, 0, 1);
					if (progress < 1) {
						videoElement.fadeRAF = requestAnimationFrame(step);
					} else {
						videoElement.fadeRAF = null;
					}
				};
				videoElement.fadeRAF = requestAnimationFrame(step);
			}

			/**
			 * Fully releases a video, like an audio track: cancel its fade, disconnect its
			 * audio, drop its sources and unload it.
			 */
			#destroyVideo(video) {
				if (!video) return;
				try {
					if (video.fadeRAF) {
						cancelAnimationFrame(video.fadeRAF);
						video.fadeRAF = null;
					}
					if (video._gain) {
						this.#vn.audio.detachElement(video, video._gain);
						video._gain = null;
					}
					while (video.firstChild) video.removeChild(video.firstChild);
					unloadMedia(video);
				} catch (e) {  }
				video.remove();
			}

			showVideoScene(scene) {
				const layer = this.#vn.elements.videoScreen;
				if (!layer) return;
				this.#destroyVideo(layer.querySelector('video'));
				layer.innerHTML = '';
				const video = this.#createVideo(scene);
				layer.appendChild(video);
				video.play().catch(() => {});
				this.#vn.scene.activateLayer(layer);
			}

			clearVideoScene() {
				const layer = this.#vn.elements.videoScreen;
				if (!layer) return;
				const video = layer.querySelector('video');
				if (video) {
					this.#destroyVideo(video);
					layer.innerHTML = '';
				}
			}

			/**
			 * Crossfades full-screen media between the two overlay layers, with the incoming
			 * one in front. Instant mode just swaps.
			 */
			showFullscreenMedia(scene) {
				const current = this.#fsCurrent;
				const next = current === this.#fs1 ? this.#fs2 : this.#fs1;
				clearTimeout(this.#fsFadeTimer);
				this.#hideLayer(next);
				this.#fsVideo = this.#fillLayer(next, scene);
				this.#fsCurrent = next;
				current.classList.remove('fs-front');
				next.classList.add('fs-front');
				next.classList.replace('hidden', 'visible');

				if (this.#vn.scene.instant) {
					next.style.opacity = '1';
					this.#hideLayer(current);
					return;
				}

				const outgoingVideo = current.querySelector('video');
				if (outgoingVideo) this.#fadeVolume(outgoingVideo, outgoingVideo.volume, 0, TIMINGS.videoFadeOut);
				void next.offsetWidth;

				requestAnimationFrame(() => {
					enableGpuAccel(next);
					next.style.transition = 'opacity 1s ease-in-out';
					next.style.opacity = '1';
					this.#fsFadeTimer = setTimeout(() => {
						if (this.#fsCurrent === next) {
							this.#hideLayer(current);
							next.style.transition = 'none';
						}
					}, TIMINGS.bgCrossfade);
				});
			}

			/**
			 * Fades the full-screen media out and clears it, or clears at once when `instant`.
			 */
			clearOverlay(instant = false) {
				if (!this.isOverlayShowing()) return;
				this.#fsVideo = null;
				clearTimeout(this.#fsFadeTimer);

				if (instant) {
					this.#hideLayer(this.#fs1);
					this.#hideLayer(this.#fs2);
					this.#fsCurrent = this.#fs1;
					return;
				}

				const layer = this.#fsCurrent;
				const outgoingVideo = layer.querySelector('video');
				if (outgoingVideo) this.#fadeVolume(outgoingVideo, outgoingVideo.volume, 0, TIMINGS.videoFadeOut);

				requestAnimationFrame(() => {
					enableGpuAccel(layer);
					layer.style.transition = 'opacity 1s ease-in-out';
					layer.style.opacity = '0';
					this.#fsFadeTimer = setTimeout(() => this.#hideLayer(layer), TIMINGS.bgCrossfade);
				});
			}

			isOverlayShowing() {
				return this.#fs1.classList.contains('visible') || this.#fs2.classList.contains('visible');
			}

			get activeSceneVideo() {
				return this.#fsVideo || this.#vn.elements.videoScreen?.querySelector('video') || null;
			}
		}

		/**
		 * Checkpoint progress, stored per chapter file in one localStorage object:
		 * { unlocked: [ids], lastCheckpointId, progressPercent, finished }. Every method
		 * returns early when checkpoints are disabled (`enableCheckpoints: false`).
		 * prepareCheckpoints() scans the compiled script for `checkpoint` scenes. A
		 * checkpoint's id is its name or `checkpoint-N`, and its percentage is the share of
		 * active scenes before it, so progress follows the story rather than counting
		 * scenes that run by themselves.
		 */
		class ProgressManager {
			#vn;
			#chapterProgress = null;
			#chapterCheckpoints = [];

			/**
			 * where Continue would resume; null when there is nothing to resume
			 */
			pendingResumeIndex = null;

			constructor(vn) { this.#vn = vn; }

			get chapterProgress() { return this.#chapterProgress; }
			get chapterCheckpoints() { return this.#chapterCheckpoints; }

			reset() {
				this.#chapterProgress = null;
				this.#chapterCheckpoints = [];
				this.pendingResumeIndex = null;
			}

			/**
			 * 100 for a finished chapter, otherwise the stored percentage clamped to 0-100. The
			 * chapter menu uses it on the whole store, without loading the chapter.
			 */
			static getChapterProgressPercent(store, chapterFile) {
				const chapter = store?.[chapterFile];
				if (!chapter) return 0;
				if (chapter.finished) return 100;
				return clamp(Math.round(Number(chapter.progressPercent) || 0), 0, 100);
			}

			/**
			 * The saved record for the current chapter, or an empty one. Null when checkpoints
			 * are off or no chapter is loaded.
			 */
			getChapterProgress() {
				const vn = this.#vn;
				if (!vn.controls.enableCheckpoints || !vn.chapterFile) return null;
				const store = vn.save.loadCheckpointStore();
				return store[vn.chapterFile] || {
					unlocked: [],
					lastCheckpointId: null,
					progressPercent: 0,
					finished: false
				};
			}

			/**
			 * Normalises and stores the record (no duplicate ids, percentage clamped), then
			 * emits `progress` to plugins with the whole store.
			 */
			saveChapterProgress(progress) {
				const vn = this.#vn;
				if (!vn.controls.enableCheckpoints || !vn.chapterFile) return;
				const store = vn.save.loadCheckpointStore();
				store[vn.chapterFile] = {
					unlocked: Array.from(new Set(progress.unlocked || [])),
					lastCheckpointId: progress.lastCheckpointId || null,
					progressPercent: clamp(Math.round(Number(progress.progressPercent) || 0), 0, 100),
					finished: Boolean(progress.finished)
				};
				vn.save.saveCheckpointStore(store);
				this.#chapterProgress = store[vn.chapterFile];
				vn.plugins.emit('progress', { store });
			}

			/**
			 * Replaces the whole store, or clears it when called with nothing. For Reset progress
			 * and for plugins that sync progress from elsewhere.
			 */
			replaceStore(store) {
				const vn = this.#vn;
				if (store) vn.save.saveCheckpointStore(store);
				else vn.save.clearCheckpointStore();
				this.#chapterProgress = this.getChapterProgress();
			}

			/**
			 * Whether the player has been past this scene: the chapter is finished, or an
			 * unlocked checkpoint lies after it. Also exposed to plugins.
			 */
			passed(index) {
				const progress = this.getChapterProgress();
				if (!progress) return false;
				if (progress.finished) return true;
				const unlocked = new Set(progress.unlocked || []);
				return this.#chapterCheckpoints.some(checkpoint => checkpoint.index > index && unlocked.has(checkpoint.id));
			}

			prepareCheckpoints() {
				const vn = this.#vn;
				this.#chapterCheckpoints = [];
				if (!vn.controls.enableCheckpoints) return;

				let activeBefore = 0;
				let totalActive = 0;
				const pending = [];
				vn.script.forEach((scene, index) => {
					if (scene.type === 'checkpoint') {
						const checkpointNumber = pending.length + 1;
						const id = scene.name || `checkpoint-${checkpointNumber}`;
						scene.checkpointId = id;
						pending.push({ id, name: scene.name || `Checkpoint ${checkpointNumber}`, index, activeBefore });
					}
					if (!scene?.isPassive) { activeBefore++; totalActive++; }
				});

				this.#chapterCheckpoints = pending.map(cp => ({
					id: cp.id,
					name: cp.name,
					index: cp.index,
					percent: totalActive ? clamp(Math.round(cp.activeBefore / totalActive * 100), 0, 100) : 0
				}));

				this.#chapterProgress = this.getChapterProgress();
			}

			/**
			 * The scene right after the last checkpoint reached, or null when there is no
			 * record, the chapter is finished, or that checkpoint no longer exists.
			 */
			getResumeIndex() {
				if (!this.#vn.controls.enableCheckpoints) return null;
				const progress = this.getChapterProgress();
				if (!progress || progress.finished || !progress.lastCheckpointId) return null;
				const checkpoint = this.#chapterCheckpoints.find(item => item.id === progress.lastCheckpointId);
				return checkpoint ? checkpoint.index + 1 : null;
			}

			getCheckpointByResumeIndex(index) {
				return this.#chapterCheckpoints.find(checkpoint => checkpoint.index + 1 === index) || null;
			}

			/**
			 * Records reaching a checkpoint: it is unlocked, becomes the resume point and sets
			 * the percentage. Plugins hear `checkpoint` every time. The analytics event and the
			 * toast fire only the first time, and not when `isPassive` is set (the checkpoint was
			 * passed while passive scenes were being replayed).
			 */
			reachCheckpoint(scene, index, isPassive = false) {
				const vn = this.#vn;
				if (!vn.controls.enableCheckpoints) return;
				const id = scene.checkpointId || scene.name;
				if (!id) return;
				const progress = this.#chapterProgress || this.getChapterProgress();

				const isNew = !(progress.unlocked || []).includes(id);
				const checkpointRef = this.#chapterCheckpoints.find(c => c.id === id);

				this.saveChapterProgress({
					...progress,
					unlocked: [...(progress.unlocked || []), id],
					lastCheckpointId: id,
					progressPercent: checkpointRef ? checkpointRef.percent : progress.progressPercent,
					finished: false
				});

				const displayName = checkpointRef ? checkpointRef.name : (scene.name || id);
				vn.plugins.emit('checkpoint', { id, name: displayName, first: isNew });
				if (isNew && !isPassive) {
					emit('checkpoint_reached', { checkpoint_id: id, checkpoint_name: displayName });
					vn.ui.showToast(vn.i18n.t('toast.checkpointUnlocked', { name: displayName }), 'success');
				}
			}

			markChapterFinished() {
				const vn = this.#vn;
				if (!vn.controls.enableCheckpoints) return;
				const progress = this.#chapterProgress || this.getChapterProgress();
				this.saveChapterProgress({
					...progress,
					progressPercent: 100,
					finished: true
				});
			}
		}

		/**
		 * All user input. Two global listeners, click and keydown, route to named actions.
		 * Elements carry data-action="name" and the #actions map holds the handler for each
		 * name. Buttons, keyboard shortcuts (SHORTCUTS) and plugins (runAction) all go
		 * through the same map.
		 */
		class InputManager {
			#vn;
			#actions;

			constructor(vn) {
				this.#vn = vn;
				this.#actions = {
					'fullscreen': () => vn.ui.toggleFullscreen(),
					'typewriter': () => this.toggleTypewriter(),
					'volume-toggle': () => this.togglePopover(vn.elements.volumeControl),
					'mute': () => this.toggleMute(),
					'autoplay-toggle': () => this.togglePopover(vn.elements.autoplayControl),
					'more-toggle': (el) => this.togglePopover(el.parentElement),
					'autoplay-enable': () => vn.autoplay.toggleEnabled(),
					'autoplay-progress': () => vn.autoplay.toggleProgress(),
					'log-open': () => vn.ui.openModal('log'),
					'log-toggle': () => vn.activeModal === 'log' ? vn.ui.closeModal() : vn.ui.openModal('log'),
					'log-close': () => vn.ui.closeModal(),
					'credits-open': () => vn.ui.openModal('credits'),
					'credits-close': () => vn.ui.closeModal(),
					'pause-open': () => vn.ui.openModal('pause'),
					'debug-toggle': () => vn.elements.pauseMenu.classList.toggle('show-debug'),
					'pause-close': () => vn.ui.closeModal(),
					'restart-chapter': () => vn.scene.restartChapterMidGame(),
					'share': (el) => vn.ui.shareStory(el),
					'next-chapter': (el) => vn.enterChapter(el.dataset.chapter),
					'menu': () => { window.location.href = window.location.pathname; },
					'retry': () => vn.scene.retry(),
					'reload': () => window.location.reload(),
					'reset-progress-open': () => vn.menu.openResetProgressModal(),
					'reset-progress-cancel': () => vn.menu.closeResetProgressModal(),
					'reset-progress-confirm': () => vn.menu.confirmResetProgress(),
					'cookies-open': () => { document.dispatchEvent(new CustomEvent('sastra:cookies_open')); vn.plugins.emit('cookies'); },
					'language-open': () => vn.menu.openLanguageModal(),
					'language-close': () => vn.menu.closeLanguageModal(),
					'language-select': (el) => vn.menu.selectLanguage(el?.dataset.lang)
				};
			}

			bind() {
				const vn = this.#vn;
				document.addEventListener('click', (e) => this.#handleClick(e));
				document.addEventListener('keydown', (e) => this.#handleKeydown(e));
				document.addEventListener('fullscreenchange', () => vn.ui.updateFullscreenButton());
				addEventListener('resize', () => vn.ui.updateFullscreenButton());
				this.#bindSheetDrag();

				let previousVolumeLevel = Math.round(vn.audio.masterVolume * 100);
				vn.elements.volumeSlider.addEventListener('input', (e) => {
					vn.audio.setMasterVolume(Number(e.target.value) / 100);
					vn.ui.updateVolumeUi();
					vn.save.setVolume(vn.audio.masterVolume);
				});
				vn.elements.volumeSlider.addEventListener('change', (e) => {
					const level = Math.round(Number(e.target.value));
					emit('volume_adjusted', { old_level: previousVolumeLevel, new_level: level });
					previousVolumeLevel = level;
				});

				vn.elements.autoplaySpeedSlider?.addEventListener('input', (e) => {
					vn.autoplay.setSpeed(Number(e.target.value));
				});
			}

			/**
			 * On portrait phones modals are bottom sheets. Dragging down from the header, or
			 * from the body when it is scrolled to the top, pulls the sheet along; letting go
			 * past 90px, or past 30px at speed, closes it. A click right after a drag is
			 * swallowed for 400ms so releasing the finger isn't taken as a tap.
			 */
			#bindSheetDrag() {
				const sheets = matchMedia('(max-width: 600px) and (orientation: portrait)');
				let sheet = null;
				let start = null;
				let distance = 0;
				let dragging = false;
				let swallowUntil = 0;
				document.addEventListener('touchstart', (e) => {
					sheet = sheets.matches && e.touches.length === 1 ? e.target.closest?.('.modal-overlay.active .modal-content') : null;
					if (!sheet) return;
					const head = e.target.closest('.modal-head');
					if (!head && sheet.querySelector('.modal-body')?.scrollTop > 0) { sheet = null; return; }
					start = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
					distance = 0;
					dragging = false;
				}, { passive: true });
				document.addEventListener('touchmove', (e) => {
					if (!sheet) return;
					const down = e.touches[0].clientY - start.y;
					const across = Math.abs(e.touches[0].clientX - start.x);
					if (!dragging) {
						if (Math.abs(down) + across < 8) return;
						if (down <= across) { sheet = null; return; }
						dragging = true;
						sheet.style.transition = 'none';
					}
					distance = Math.max(0, down);
					sheet.style.translate = `0 ${distance}px`;
					if (e.cancelable) e.preventDefault();
				}, { passive: false });
				const end = () => {
					if (!sheet || !dragging) { sheet = null; return; }
					const dragged = sheet;
					sheet = null;
					const quick = distance / Math.max(1, Date.now() - start.time) > .5;
					const gone = distance > 90 || (distance > 30 && quick);
					dragged.style.transition = 'translate .2s ease';
					dragged.style.translate = gone ? `0 ${dragged.offsetHeight}px` : '';
					if (gone) dragged.querySelector('.modal-head .close-button')?.click();
					swallowUntil = Date.now() + 400;
					setTimeout(() => {
						dragged.style.transition = '';
						dragged.style.translate = '';
					}, 320);
				};
				document.addEventListener('touchend', end);
				document.addEventListener('touchcancel', end);
				document.addEventListener('click', (e) => {
					if (Date.now() < swallowUntil) {
						e.preventDefault();
						e.stopPropagation();
					}
				}, true);
			}

			/**
			 * Ignored while the error screen is up, and while typing in a field or in plugin UI.
			 * Tab hides or shows the controls. Escape closes the topmost thing: a menu modal,
			 * then the log, credits or pause modal, otherwise it opens the pause menu. Keys in
			 * SHORTCUTS run their action (no modifiers, no auto-repeat). Space, Enter and the
			 * right arrow advance the story, or start it from the start gate unless a Continue
			 * choice is pending.
			 */
			#handleKeydown(e) {
				const vn = this.#vn;
				if ('error' in document.body.dataset || e.target.closest?.(`${EDITABLE}, .plugin-overlay, .plugin-screen`)) return;
				if (e.code === 'Tab') {
					e.preventDefault();
					if (!e.repeat && vn.isLoaded && !vn.isWaitingForStart) {
						document.body.classList.toggle('controls-hidden');
					}
					return;
				}
				if (e.repeat && !vn.controls.allowHoldToSkip) return;
				if (e.code === 'Escape') {
					e.preventDefault();

					const openOverlay = document.querySelector('.menu-modal.active');
					if (openOverlay) {
						openOverlay.classList.remove('active');
						return;
					}
					if (vn.activeModal === 'log' || vn.activeModal === 'pause') {
						vn.ui.closeModal();
					} else if (vn.activeModal === 'credits') {
						vn.ui.closeModal();
					} else if (vn.isLoaded && !vn.isWaitingForStart) {

						vn.ui.openModal('pause');
					}
					return;
				}

				const shortcut = SHORTCUTS[e.code];
				if (shortcut && !e.ctrlKey && !e.metaKey && !e.altKey) {
					if (!e.repeat && this.#shortcutAllowed(shortcut)) {
						e.preventDefault();
						this.runAction(shortcut);
					}
					return;
				}

				if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') {
					e.preventDefault();

					if (vn.isWaitingForStart) {
						if (!vn.progress.pendingResumeIndex) vn.ui.beginStart('start');
						return;
					}
					this.advance();
				}
			}

			/**
			 * A shortcut needs shortcuts enabled, a started game, no plugin capturing input and
			 * no modal open (the log's own key can still close it). The button it stands for
			 * must also be enabled in settings.
			 */
			#shortcutAllowed(action) {
				const vn = this.#vn;
				if (!vn.controls.enableKeyboardShortcuts || !vn.isLoaded || vn.isWaitingForStart || vn.plugins.capturing) return false;
				if (vn.activeModal && !(action === 'log-toggle' && vn.activeModal === 'log')) return false;
				if (action === 'log-toggle') return vn.controls.showLogButton;
				if (action === 'typewriter') return vn.controls.showTypewriterButton;
				if (action === 'autoplay-enable') return vn.controls.showAutoplayButton;
				return true;
			}

			/**
			 * Decides what a click means, in this order: only error-screen actions while the
			 * error screen shows; chapter buttons; a modal backdrop closes it; data-action
			 * elements; checkpoint rows; the start gate; an open top-bar popover closes;
			 * the backdrop of log, credits and pause closes. Anything else on the stage
			 * advances the story, except clicks on the text boxes themselves, so text can be
			 * selected.
			 */
			#handleClick(e) {
				const vn = this.#vn;
				if (e.target.closest('.plugin-overlay, .plugin-screen')) return;
				const actionEl = e.target.closest('[data-action]');
				if ('error' in document.body.dataset) return actionEl && this.runAction(actionEl.dataset.action, actionEl);

				const chapterBtn = e.target.closest('.chapter-button[data-chapter], .menu-play[data-chapter]');
				if (chapterBtn) {
					vn.enterChapter(chapterBtn.dataset.chapter);
					return;
				}

				if (e.target.classList && e.target.classList.contains('menu-modal')) {
					e.target.classList.remove('active');
					return;
				}

				if (actionEl) {
					const action = actionEl.dataset.action;

					if (!(action === 'pause-open' && !vn.controls.enableCheckpoints)) {
						this.runAction(action, actionEl);
						return;
					}
				}

				const cpItem = e.target.closest('.checkpoint-item');
				if (cpItem) {
					if (!cpItem.disabled) vn.scene.jumpToCheckpoint(cpItem.dataset.checkpoint);
					return;
				}

				if (e.target.closest('.start-gate')) {
					const startBtn = e.target.closest('[data-start-action]');
					if (startBtn) vn.ui.beginStart(startBtn.dataset.startAction);
					else if (!vn.progress.pendingResumeIndex) vn.ui.beginStart('start');
					return;
				}

				if (e.target.closest('.volume-control, .autoplay-control, .more-control')) return;

				const popover = document.querySelector('.top-controls .open');
				if (popover) {
					popover.classList.remove('open');
					return;
				}

				if (e.target === vn.elements.logModal ||
					e.target === vn.elements.creditsModal ||
					e.target === vn.elements.pauseMenu) {
					vn.ui.closeModal();
					return;
				}

				if (vn.activeModal === 'log' || vn.activeModal === 'pause' || vn.isWaitingForStart) return;
				if (e.target.closest('.top-controls, .log-modal, .credits-modal, .pause-menu, .start-gate')) return;

				const boxes = ['.dialogue-content', '.conv-dialogue-box', '.narration-screen'];
				if (!boxes.some(sel => e.target.closest(sel))) this.advance();
			}

			runAction(action, actionEl = null) {
				this.#actions[action]?.(actionEl);
			}

			/**
			 * Only one top-bar popover (volume, autoplay, more) is open at a time.
			 */
			togglePopover(control) {
				document.querySelectorAll('.top-controls .open').forEach(open => { if (open !== control) open.classList.remove('open'); });
				control?.classList.toggle('open');
			}

			toggleMute() {
				const vn = this.#vn;
				const volume = vn.audio.toggleMute();
				emit('feature_audio', { state: volume > 0 ? 'unmuted' : 'muted', volume: Math.round(volume * 100) });
				vn.ui.updateVolumeUi();
				vn.save.setVolume(volume);
			}

			/**
			 * Saved with the player's settings. Turning it off in the middle of a line finishes
			 * the line at once.
			 */
			toggleTypewriter() {
				const vn = this.#vn;
				vn.dialogue.enabled = !vn.dialogue.enabled;
				vn.save.setTypewriter(vn.dialogue.enabled);
				emit('feature_typewriter', { state: vn.dialogue.enabled ? 'enabled' : 'disabled' });

				if (!vn.dialogue.enabled && vn.dialogue.isTyping) {
					vn.dialogue.completeAll();
					vn.autoplay.onContentSettled(vn.script[vn.currentIndex]);
				}

				this.updateTypewriterToggleButton();

				vn.ui.showToast(vn.i18n.t(vn.dialogue.enabled ? 'controls.typewriterEnabled' : 'controls.typewriterDisabled'), vn.dialogue.enabled ? 'success' : 'error', { duration: TIMINGS.toastDuration, side: 'right' });
			}

			updateTypewriterToggleButton() {
				const vn = this.#vn;
				document.body.dataset.typewriterEnabled = String(vn.dialogue.enabled);
				vn.ui.setTitle(vn.elements.typewriterToggle, vn.dialogue.enabled ? 'controls.typewriterDisable' : 'controls.typewriterEnable');
			}

			/**
			 * One click or key press. Ignored while loading, at the start gate, in a modal, or
			 * while a plugin captures input. What it does, in order: show a scene that is
			 * waiting on a transition (flushPendingScene), else finish the typing, else nothing
			 * if a plugin holds the story, else step a conversation, else go to the next scene.
			 */
			advance() {
				const vn = this.#vn;
				if (!vn.isLoaded || vn.isWaitingForStart || vn.activeModal || vn.scene.isLoadingScene || vn.plugins.capturing) return;

				vn.autoplay.onAdvanceStart();

				if (vn.scene.flushPendingScene()) return;

				if (vn.dialogue.isTyping) {
					vn.dialogue.completeAll();
					vn.autoplay.onContentSettled(vn.script[vn.currentIndex]);
				} else if (vn.plugins.held) {
					return;
				} else if (vn.dialogue.isConversationActive) {
					vn.dialogue.advanceConversation();
				} else if (vn.currentIndex < vn.script.length - 1) {
					vn.scene.nextScene();
				}
			}
		}

		/**
		 * The game loop. Every scene in the compiled script is either *active*, waiting for
		 * the player (dialogue, image, title...), or *passive*, running by itself
		 * (background, audio, sprites, checkpoint, position, chapter). showCurrentScene()
		 * waits for the files of the scene's whole cluster, then runs a passive scene and
		 * moves straight on, or renders an active one and waits for input
		 * (InputManager.advance -> nextScene).
		 *
		 * Handler maps stand in for switches: #sceneRenderers shows active scenes, and
		 * #passiveInstant and #passiveLive run passive ones. *Instant* means no fades, for
		 * restoring state after a resume, jump or restart; *live* is the same event with
		 * its fades, as it plays.
		 */
		class SceneManager {
			#vn;
			/**
			 * timer for the gap before a scene is rendered, and what it would run
			 */
			#sceneTimer = null;
			#pendingSceneExecute = null;
			/**
			 * the next scene opens a run: it gets no gap and the start gate fades with it
			 */
			#isStartingChapter = false;
			/**
			 * render without transitions; set while restoring state
			 */
			#instantScene = false;
			#isLoadingScene = false;
			/**
			 * resolves the loading error's Retry wait in #gate
			 */
			#retryHandler = null;
			#titleFadeTimeout = null;
			/**
			 * bumped by every #playFrom, so a run superseded by a newer jump gives up
			 */
			#playToken = 0;

			#sceneRenderers = {
				single: (scene) => this.#vn.dialogue.render(scene),
				multi: (scene) => this.#vn.dialogue.render(scene),
				narration: (scene) => this.#vn.dialogue.render(scene),
				conversation: (scene) => this.#vn.dialogue.render(scene),
				image: (scene) => scene.fullscreen ? this.#vn.stage.showFullscreenMedia(scene) : this.#vn.ui.showImage(scene),
				video: (scene) => scene.fullscreen ? this.#vn.stage.showFullscreenMedia(scene) : this.#vn.stage.showVideoScene(scene),
				blank: () => this.activateLayer(this.#vn.elements.blankScreen),
				title: (scene, isStarting) => this.#vn.ui.showTitleScreen(scene, isStarting),
				end: (scene) => this.#vn.ui.showEndScreen(scene),
				plugin: (scene) => this.#vn.plugins.run(scene),
			};

			#passiveInstant = {
				chapter: (scene) => this.setChapter(scene.name),
				background: (scene) => this.#vn.stage.setBackgroundInstant(scene),
				audio: (scene) => this.#vn.audio.handleScene({ ...scene, fade: 0 }),
				sprite: (scene) => this.#vn.sprites.applyCommand({ ...scene, fade: false }),
				sprites: (scene) => (scene.sprites || []).forEach(sprite => this.#vn.sprites.applyCommand({ ...sprite, fade: false })),
				checkpoint: (scene, index) => this.#vn.progress.reachCheckpoint(scene, index, true),
				position: (scene) => { this.#vn.dialoguePosition = scene.value; },
				plugin: (scene) => this.#vn.plugins.run(scene, true),
			};

			#passiveLive = {
				chapter: (scene) => this.setChapter(scene.name),
				background: (scene) => this.#vn.stage.fadeBackground(scene),
				audio: (scene) => this.#vn.audio.handleScene(scene),
				sprite: (scene) => this.#vn.sprites.applyScene(scene),
				sprites: (scene) => this.#vn.sprites.applyScene(scene),
				checkpoint: (scene, index) => this.#vn.progress.reachCheckpoint(scene, index, false),
				position: (scene) => { this.#vn.dialoguePosition = scene.value; },
				plugin: (scene) => this.#vn.plugins.run(scene),
			};

			/**
			 * Runs a passive scene, live or instant, then applies the plugin modifiers (extra
			 * keys other plugins registered on the event) in the matching mode.
			 */
			dispatchPassiveEvent(scene, index, live = false) {
				(live ? this.#passiveLive : this.#passiveInstant)[scene.type]?.(scene, index);
				if (scene.mods && scene.isPassive) this.#vn.plugins.modify(scene, !live);
			}

			constructor(vn) { this.#vn = vn; }

			get isLoadingScene() { return this.#isLoadingScene; }
			get instant() { return this.#instantScene; }

			/**
			 * On a chapter change: cancel timers and invalidate any run in flight.
			 */
			reset() {
				this.#isLoadingScene = false;
				this.#retryHandler = null;
				this.#playToken++;
				if (this.#sceneTimer) { clearTimeout(this.#sceneTimer); this.#sceneTimer = null; }
				this.#pendingSceneExecute = null;
				this.cancelTitleReveal();
			}

			/**
			 * Resumes a #gate that is waiting on the Retry button.
			 */
			retry() { if (this.#retryHandler) this.#retryHandler(); }

			/**
			 * If a scene is waiting out its gap, show it now, so a click skips the pause.
			 * Returns whether it did.
			 */
			flushPendingScene() {
				if (this.#sceneTimer && this.#pendingSceneExecute) {
					clearTimeout(this.#sceneTimer);
					this.#pendingSceneExecute();
					return true;
				}
				return false;
			}

			scheduleTitleReveal(callback) {
				this.#titleFadeTimeout = setTimeout(callback, TIMINGS.titleCrossfade);
			}

			cancelTitleReveal() {
				if (this.#titleFadeTimeout) { clearTimeout(this.#titleFadeTimeout); this.#titleFadeTimeout = null; }
			}

			/**
			 * Starts the chapter, or resumes it from `index`, with the state of everything
			 * before it restored.
			 */
			begin(index = 0) {
				return this.#playFrom(index - 1, index);
			}

			/**
			 * Clears playback state before a start or jump: autoplay, typing, the pending scene
			 * and any conversation.
			 */
			#resetPlaybackForJump() {
				this.#vn.autoplay.reset();
				this.#vn.dialogue.completeAll();
				if (this.#sceneTimer) { clearTimeout(this.#sceneTimer); this.#sceneTimer = null; }
				this.#pendingSceneExecute = null;
				this.#vn.dialogue.resetConversation();
			}

			/**
			 * The one routine for starting anywhere: a new start, a resume, a checkpoint jump or
			 * a restart. Scenes up to `restoreIndex` are replayed silently to rebuild the state
			 * (background, sprites, audio); `currentIndex` is the scene to show next.
			 * Steps: reset playback, move the preload window, wait for every file of the
			 * restore set, restore state, consume the passive scenes at the target, show the
			 * scene. If the player outran the preloader the loading screen shows, and old
			 * audio and video are stopped first so nothing from the old position plays under
			 * it. A newer jump (#playToken) abandons this one at the await.
			 */
			async #playFrom(restoreIndex, currentIndex) {
				const vn = this.#vn;
				const token = ++this.#playToken;
				this.#resetPlaybackForJump();
				this.#updateWindow(currentIndex);
				const pending = vn.assets.pending(vn.assets.restoreSrcs(restoreIndex, currentIndex));
				if (pending.length) {
					vn.audio.stopAll(0);
					document.querySelectorAll('video').forEach(video => video.pause());
					await this.#gate(pending);
					if (token !== this.#playToken) return;
				}
				const targetSceneType = this.#getNextActiveSceneType(currentIndex);
				this.restoreSceneState(restoreIndex, targetSceneType);
				vn.currentIndex = currentIndex;
				this.consumePassiveScenesInstant();
				this.#isStartingChapter = true;
				this.showCurrentScene();
			}

			/**
			 * Closes the menu and replays from the checkpoint in instant mode: state restored up
			 * to it, then the story continues at the scene after it.
			 */
			jumpToCheckpoint(id) {
				const vn = this.#vn;
				const checkpoint = vn.progress.chapterCheckpoints.find(item => item.id === id);
				if (!checkpoint) return;
				vn.ui.closeModal();
				emit('checkpoint_jump', { checkpoint_id: id });
				vn.plugins.emit('jump', { id });

				this.#instantScene = true;
				const targetIndex = Math.min(checkpoint.index + 1, vn.script.length - 1);
				this.#playFrom(checkpoint.index, targetIndex);
			}

			/**
			 * Fades to black, replays from the start, and fades back.
			 */
			restartChapterMidGame() {
				this.#vn.ui.closeModal();
				emit('chapter_restarted', { trigger: 'pause_menu' });
				this.#vn.plugins.emit('restart');

				this.fadeToBlack(async () => {
					this.#instantScene = true;
					await this.#playFrom(-1, 0);
					this.fadeFromBlack();
				});
			}

			/**
			 * Calls onComplete once the cover is fully black: on transitionend, or after
			 * screenFade + 100ms in case that event never comes.
			 */
			fadeToBlack(onComplete) {
				const fade = this.#vn.elements.screenFade;
				if (!fade) { onComplete(); return; }

				let done = false;
				const finish = () => {
					if (done) return;
					done = true;
					fade.removeEventListener('transitionend', finish);
					onComplete();
				};
				fade.addEventListener('transitionend', finish);
				forceNextFrame(() => { if (!done) fade.classList.add('active'); });
				setTimeout(finish, TIMINGS.screenFade + 100);
			}

			fadeFromBlack() {
				this.#vn.elements.screenFade?.classList.remove('active');
			}

			/**
			 * Sets the chapter name for the page title and the chapter pill, which opens the
			 * pause menu when checkpoints are enabled.
			 */
			setChapter(name) {
				const vn = this.#vn;
				document.title = stripHtml(name);
				vn.currentChapter = name;
				const info = vn.elements.chapterInfo;
				if (!info) return;
				info.innerHTML = name;
				info.classList.toggle('checkpoints-enabled', vn.controls.enableCheckpoints);
				info.dataset.tip = vn.controls.enableCheckpoints ? vn.i18n.t('pause.openMenu') : '';
			}

			/**
			 * Runs the passive scenes from the current index, in instant mode, up to the first
			 * active one.
			 */
			consumePassiveScenesInstant() {
				const vn = this.#vn;
				while (vn.currentIndex < vn.script.length) {
					const scene = vn.script[vn.currentIndex];
					if (!scene || !scene.isPassive) return;

					this.dispatchPassiveEvent(scene, vn.currentIndex);
					vn.currentIndex++;
				}
			}

			/**
			 * Rebuilds the world as it was at targetIndex without playing it: clear the screens,
			 * full-screen media, sprites, audio, conversation and dialogue position; rebuild
			 * the log; then replay the state-setting scenes up to the target in instant mode.
			 * Left out: checkpoints (progress is not earned again), audio from before the
			 * target's cluster, and every background except the last.
			 */
			restoreSceneState(targetIndex, targetSceneType = null) {
				const vn = this.#vn;
				this.hideAllScreens(targetSceneType);
				vn.stage.clearOverlay(true);
				vn.sprites.clear(false);
				vn.audio.stopAll(0);
				vn.dialogue.resetConversation();
				vn.dialoguePosition = DEFAULT_DIALOGUE_POSITION;

				vn.log.rebuild(targetIndex);

				const clusterStart = vn.assets.clusterStart(targetIndex);
				let lastBackground = Math.min(targetIndex, vn.script.length - 1);
				while (lastBackground >= 0 && vn.script[lastBackground]?.type !== 'background') lastBackground--;

				for (let i = 0; i <= targetIndex && i < vn.script.length; i++) {
					const scene = vn.script[i];
					if (!scene || scene.type === 'checkpoint' || (scene.type === 'audio' && i < clusterStart) || (scene.type === 'background' && i !== lastBackground)) continue;

					this.dispatchPassiveEvent(scene, i);
				}
			}

			/**
			 * Waits until `pending` files are ready, with the loading screen up. Missing or
			 * damaged files show the asset error screen and never resolve, since the story
			 * can't go on without them; damaged audio alone is skipped with a console warning.
			 * A network failure shows the Retry screen and loops until a retry succeeds.
			 */
			async #gate(pending) {
				const vn = this.#vn;
				this.#isLoadingScene = true;
				vn.elements.loading.classList.remove('hidden');

				let retried = false;
				try {
					while (true) {
						const results = await Promise.allSettled(pending.map(src => vn.assets.ensureAsset(src)));
						const errors = results.filter(result => result.status === 'rejected').map(result => result.reason).filter(error => {
							if (!error.corrupt || !isAudioAsset(error.src)) return true;
							console.warn(`Sastra: skipped "${error.src}", which could not be played.`);
						});
						if (!errors.length) break;

						const missing = errors.filter(e => e.missing).map(e => e.src);
						const failed = missing.length ? missing : errors.filter(e => e.corrupt).map(e => e.src);
						if (failed.length) {
							vn.ui.showAssetError(failed, missing.length > 0);
							await new Promise(() => {});
						}
						retried = true;
						emit('error_network', { assets: pending.join(', ') });
						await new Promise(resolve => {
							this.#retryHandler = () => { this.#retryHandler = null; resolve(); };
							vn.elements.loading.classList.add('hidden');
							vn.ui.showLoadingError(errors.map(e => e.src));
						});
						vn.ui.hideLoadingError();
						vn.elements.loading.classList.remove('hidden');
					}
					if (retried) emit('asset_retry_success', { assets: pending.join(', ') });
				} finally {
					vn.elements.loading.classList.add('hidden');
					this.#isLoadingScene = false;
				}
			}

			#updateWindow(index) {
				this.#vn.assets.updateWindow(index, () => this.#vn.ui.updatePauseAssets());
			}

			static #isFullscreenMedia(scene) {
				return scene && (scene.type === 'image' || scene.type === 'video') && scene.fullscreen === true;
			}

			nextScene() {
				this.#vn.currentIndex++;
				this.showCurrentScene();
			}

			/**
			 * Renders an active scene: sets body[data-scene] (for skins), emits the plugin
			 * `scene` happening, calls the renderer, applies modifiers, takes the start gate
			 * away if this scene opens a run, and tells autoplay straight away for the scene
			 * types that don't type. Then leaves instant mode.
			 */
			executeScene(scene, isStarting) {
				document.body.dataset.scene = scene.event || scene.type;
				this.#vn.plugins.emit('scene', { index: this.#vn.currentIndex, scene });
				this.#sceneRenderers[scene.type]?.(scene, isStarting);
				if (scene.mods) this.#vn.plugins.modify(scene, this.#instantScene);

				if (isStarting) {
					requestAnimationFrame(() => {
						this.#vn.elements.startGate.classList.remove('active');
					});
				}

				this.#instantScene = false;

				if (scene.type === 'image' || scene.type === 'video' || scene.type === 'title' || scene.type === 'blank') {
					this.#vn.autoplay.onContentSettled(scene);
				}
			}

			/**
			 * Waits for the files of the scene's cluster. Reaching the last active scene marks
			 * the chapter finished. A passive scene runs and the loop moves on. An active one
			 * clears leftover full-screen media (unless it is full-screen media itself), starts
			 * its conversation or hides the other screens, and renders after `sceneGap`, with no
			 * gap when starting, mid-conversation or for a title. If the position moved while
			 * waiting, this call gives up.
			 */
			async showCurrentScene() {
				const vn = this.#vn;
				if (this.#sceneTimer) {
					clearTimeout(this.#sceneTimer);
					this.#sceneTimer = null;
				}
				const scene = vn.script[vn.currentIndex];
				if (!scene) return;

				this.#updateWindow(vn.currentIndex);

				const pending = vn.assets.pending(vn.assets.clusterSrcs(vn.currentIndex));
				if (pending.length) {
					await this.#gate(pending);
					if (vn.script[vn.currentIndex] !== scene) return;
				}

				const activeIndices = vn.assets.activeIndices;
				if (activeIndices.length && vn.currentIndex === activeIndices[activeIndices.length - 1]) {
					vn.progress.markChapterFinished();
					emit('game_completed', { chapter_id: vn.chapterFile });
				}

				if (scene.isPassive) {
					this.dispatchPassiveEvent(scene, vn.currentIndex, true);
					this.nextScene();
					return;
				}

				if (!SceneManager.#isFullscreenMedia(scene) && this.#vn.stage.isOverlayShowing()) {
					this.#vn.stage.clearOverlay(this.#instantScene);
				}

				if (scene.type === 'conversation') {
					vn.dialogue.startConversation(scene);
				} else {
					this.hideAllScreens(scene.type);
					vn.dialogue.resetConversation();
				}

				const isStarting = this.#isStartingChapter;
				this.#isStartingChapter = false;

				const gapMs = (isStarting || (scene.type === 'conversation' && vn.dialogue.isConversationActive) || scene.type === 'title') ? 0 : TIMINGS.sceneGap;

				this.#pendingSceneExecute = () => {
					this.#sceneTimer = null;
					this.#pendingSceneExecute = null;
					this.executeScene(scene, isStarting);
				};

				this.#sceneTimer = setTimeout(this.#pendingSceneExecute, gapMs);
			}

			#getNextActiveSceneType(startIndex) {
				const vn = this.#vn;
				let tempIndex = Math.max(0, startIndex);
				while (tempIndex < vn.script.length) {
					let s = vn.script[tempIndex];
					if (!s) break;

					if (s.isPassive) {
						tempIndex++;
					} else {
						return s.type;
					}
				}
				return null;
			}

			/**
			 * Fades a layer in, or snaps it in instant mode.
			 */
			activateLayer(layer) {
				if (!layer) return;
				if (this.#instantScene) {
					this.#toggleLayerInstant(layer, true);
					return;
				}
				enableGpuAccel(layer);
				layer.classList.add('active');
			}

			/**
			 * Changes the layer's class with transitions off and forces a reflow, so the change
			 * isn't animated.
			 */
			#toggleLayerInstant(layer, active) {
				const previousTransition = layer.style.transition;
				layer.style.transition = 'none';
				layer.classList.toggle('active', active);
				void layer.offsetWidth;
				layer.style.transition = previousTransition;
			}

			/**
			 * Deactivates every scene layer and stops plugin screens. Passing 'title' keeps the
			 * title screen, so one title can crossfade into the next.
			 */
			hideAllScreens(excludeType = null) {
				this.#vn.plugins.stop();
				this.#vn.stage.clearVideoScene();

				const keepTitle = excludeType === 'title';

				document.querySelectorAll('.scene-layer').forEach(element => {
					if (keepTitle && element === this.#vn.elements.titleScreen) return;
					if (this.#instantScene) {
						this.#toggleLayerInstant(element, false);
						return;
					}
					if (element.classList.contains('active')) enableGpuAccel(element);
					element.classList.remove('active');
				});

				if (!keepTitle) this.cancelTitleReveal();
			}
		}

		/**
		 * The chapter-select screen, the front door of a multi-chapter game, with its language
		 * and reset-progress modals. It is rebuilt from scratch whenever something changes
		 * (refresh()), which is simpler than patching it. A plugin may replace the menu
		 * (plugins.replaced('menu')): only the corner buttons are drawn then, unless the
		 * plugin turns those off, and the plugin supplies the rest.
		 */
		class MenuManager {
			#vn;
			#chapterSelectData = null;

			constructor(vn) { this.#vn = vn; }

			/**
			 * Waits for the logo, the background image and the fonts, so the menu appears
			 * complete instead of popping in.
			 */
			#preloadAssets(meta = {}) {
				const urls = [meta.logo, meta.background].filter(src => hasAsset(src));
				const images = urls.map(src => new Promise(resolve => {
					const img = new Image();
					img.decoding = 'async';
					img.onload = img.onerror = () => resolve();
					img.src = src;
				}));
				const fonts = document.fonts?.ready || Promise.resolve();
				return Promise.all([...images, fonts]);
			}

			async show() {
				const vn = this.#vn;
				const gameMeta = vn.gameMeta;
				const chapters = gameMeta.chapters || [];

				if (chapters.length === 0) {
					console.warn('No chapters found in config.yaml');
				}

				await this.#preloadAssets(gameMeta);
				this.render(chapters, gameMeta);
				vn.elements.loading.classList.add('hidden');
			}

			/**
			 * Builds the menu. The main button reads Continue when some chapter is started but
			 * not finished (the first such chapter), otherwise Start on the first unfinished
			 * chapter, or the first chapter. Percentages come from the saved progress. The
			 * reset button appears only once there is progress to reset (and
			 * `allowProgressReset` is on), the language button only with more than one
			 * language, the cookie button only when analytics is configured. The background
			 * image is applied once it has loaded, so a broken image never flashes. Plugins fill
			 * the action row and mount into the whole screen.

				const showReset = progressEnabled && vn.controls.allowProgressReset && Object.values(progressStore).some(chap => chap.finished || (chap.unlocked && chap.unlocked.length > 0));
				const showLanguage = Boolean(vn.languageManager?.hasMultiple());
				const showCookies = hasAsset(meta.analytics_id);

				if (meta.background) {
					const bgTest = new Image();
					bgTest.onload = () => { chapterSelect.style.backgroundImage = `var(--menu-fade), url('${meta.background}')`; };
					bgTest.src = meta.background;
				}

				const percentOf = (chapter) => progressEnabled ? ProgressManager.getChapterProgressPercent(progressStore, chapter.file) : 0;
				const progressOf = (chapter) => percentOf(chapter) >= 100 ? 'finished' : percentOf(chapter) > 0 ? 'started' : 'new';
				const resume = chapters.find(chapter => percentOf(chapter) > 0 && percentOf(chapter) < 100);
				const target = resume || chapters.find(chapter => percentOf(chapter) < 100) || chapters[0];
				const iconButton = (action, icon, title) => `<button class="control-button circle" data-action="${action}" title="${title}">${iconTag(icon)}</button>`;
				const rowMeta = (percent) => percent >= 100
					? '<span class="row-meta"><i class="icon" data-icon="success"></i></span>'
					: percent > 0 ? `<span class="row-meta">${percent}%</span><span class="chapter-progress" style="--progress: ${percent}%"></span>` : '';

				const custom = vn.plugins.replaced('menu');
				const corner = custom?.corner === false ? '' : `
					<div class="menu-corner">
						<div class="menu-actions">
							${hasAsset(meta.credits) ? iconButton('credits-open', 'credits', vn.i18n.t('endScreen.credits')) : ''}
							${showLanguage ? iconButton('language-open', 'globe', vn.i18n.t('language.tooltip')) : ''}
							${showCookies ? iconButton('cookies-open', 'cookie', vn.i18n.t('cookies.tooltip')) : ''}
							${showReset ? iconButton('reset-progress-open', 'reset', vn.i18n.t('reset.tooltip')) : ''}
						</div>
						${vn.controls.showMadeWith ? `<a href="https://www.sastra.dev" target="_blank" rel="noopener noreferrer" class="powered-link" data-tip-always title="${APP_VERSION_LABEL}">

				const menu = document.querySelector('.chapter-select');

				menu.remove();
				this.render(this.#chapterSelectData.chapters, this.#chapterSelectData.meta);
			}

			/**

			 * system language first and the rest alphabetical.
			 */
			getLanguageOptions() {
				const vn = this.#vn;
				const codes = vn.languageManager?.languages || [];
				const systemBase = (navigator.language || '').toLowerCase().split('-')[0];
				const baseOf = (code) => code.toLowerCase().split('-')[0];

				return codes
					.map(code => ({ code, label: this.getLanguageLabel(code) }))
					.sort((a, b) => {
						const aSystem = baseOf(a.code) === systemBase;
						const bSystem = baseOf(b.code) === systemBase;
						if (aSystem !== bSystem) return aSystem ? -1 : 1;
						return a.label.localeCompare(b.label);
					});
			}

			/**
			 * The language's name from Intl.DisplayNames, written in that language. Falls back to
			 * the plain code.
			 */
			getLanguageLabel(code) {
				try {
					const label = new Intl.DisplayNames([code], { type: 'language' }).of(code);
					if (label && label.toLowerCase() !== code.toLowerCase()) {

						return label.charAt(0).toUpperCase() + label.slice(1);
					}
				} catch (e) {  }
				return code;
			}

			openLanguageModal() {
				this.#openOverlay('languageModal');
			}

			closeLanguageModal() {
				document.getElementById('languageModal')?.classList.remove('active');
			}

			/**
			 * Saves the choice and reloads: strings, config and chapters are all loaded per
			 * language at startup, so a reload is the simplest correct switch.
			 */
			selectLanguage(code) {
				if (!code || code === this.#vn.activeLanguage) { this.closeLanguageModal(); return; }
				emit('feature_language', { language: code });
				this.#vn.save.setLanguage(code);
				window.location.reload();
			}

		/**
		 * Turns a chapter's parsed YAML into the flat scene list SceneManager plays, and
		 * catches every authoring mistake on the way. Errors name the file, the event number
		 * and the line; the line is found by re-scanning the source text, since parsed YAML
		 * has lost its line numbers. An unknown key only warns, or throws when `strict` is on.
		 */
		class ScriptCompiler {

			/**
			 * Validates the mapping, parses the characters, compiles each event, and checks
			 * that `end:` is the last active event. If the chapter has `start:` markers, the
			 * last one wins: everything before it is dropped except the chapter header and the
			 * latest background and dialogue position set before it, so the scene under test
			 * still shows with the right backdrop.
			 */
			static compile(raw, fileLabel = '', source = '', strict = false) {
				const where = (msg, place = '') => `${fileLabel ? `\`${fileLabel}\`${place}\n\n` : ''}${msg[0].toUpperCase()}${msg.slice(1)}`;
				ScriptCompiler.#strict = strict;

				if (!isPlainObject(raw)) {
					throw new Error(where('the file must be a YAML mapping with `chapter:`, `characters:` and `script:`.'));
				}
				if (!Array.isArray(raw.script)) {
					throw new Error(where('a `script:` list of events is required.'));
				}

				const characters = ScriptCompiler.#parseCharacters(raw.characters, where);
				const scenes = [];

				if (hasAsset(raw.chapter)) scenes.push({ type: 'chapter', name: String(raw.chapter), isPassive: true });

				const ends = [];
				raw.script.forEach((event, i) => {
					const at = (msg) => {
						const line = ScriptCompiler.#scriptEventLines(source)[i];
						return where(msg, ` · script event #${i + 1}${line ? ` · line ${line}` : ''}`);
					};
					const scene = ScriptCompiler.#compileEvent(event, characters, at);
					if (scene.type === 'end') ends.push({ index: scenes.length, at });
					scenes.push(scene);
				});

				for (const { index, at } of ends) {
					for (let j = index + 1; j < scenes.length; j++) {
						if (!scenes[j].isPassive) throw new Error(at('an `end:` event must be the last active event in the chapter.'));
					}
				}

				let startIndex = -1;
				for (let i = 0; i < scenes.length; i++) if (scenes[i].type === 'start') startIndex = i;
				if (startIndex === -1) return scenes;
				const head = scenes[0] && scenes[0].type === 'chapter' ? [scenes[0]] : [];
				const carried = new Map();
				for (let i = startIndex - 1; i >= 0; i--) {
					const type = scenes[i].type;
					if (ScriptCompiler.#START_CARRIED.includes(type) && !carried.has(type)) carried.set(type, scenes[i]);
				}
				return head.concat([...carried.values()].reverse(), scenes.slice(startIndex + 1));
			}

			/**
			 * scene types whose last value before a `start:` marker is kept
			 */
			static #START_CARRIED = ['background', 'position'];
			static #strict = false;

			static #LINE_COMMENT = /^\s*#/;
			static #LINE_LEADING_WS = /^\s*/;
			static #LINE_SCRIPT_KEY = /^\s*script\s*:/;
			static #LINE_SEQ_ITEM = /^\s*-/;

			/**
			 * The 1-based line of each event in the `script:` list, found by scanning the raw
			 * text: the dashes at the first indent under `script:`, skipping comments and blank
			 * lines. Only used for error messages.
			 */
			static #scriptEventLines(source) {
				const lines = String(source ?? '').split('\n');
				const eventLines = [];
				let scriptIndent = -1;
				let seqIndent = -1;
				let inScript = false;

				for (let i = 0; i < lines.length; i++) {
					const line = lines[i];
					if (line.trim() === '' || ScriptCompiler.#LINE_COMMENT.test(line)) continue;
					const indent = line.length - line.replace(ScriptCompiler.#LINE_LEADING_WS, '').length;

					if (!inScript) {
						if (ScriptCompiler.#LINE_SCRIPT_KEY.test(line)) { inScript = true; scriptIndent = indent; }
						continue;
					}

					const isSeqItem = ScriptCompiler.#LINE_SEQ_ITEM.test(line);
					if (!isSeqItem && indent <= scriptIndent) break;
					if (!isSeqItem) continue;
					if (seqIndent === -1) seqIndent = indent;
					if (indent === seqIndent) eventLines.push(i + 1);
				}

				return eventLines;
			}

			/**
			 * id -> { name, color, avatar }. The name defaults to the id. Reserved words are
			 * refused as ids.
			 */
			static #parseCharacters(raw, where) {
				const characters = {};
				if (raw == null) return characters;
				if (!isPlainObject(raw)) {
					throw new Error(where('`characters:` must be a mapping of id to definition.'));
				}
				for (const [id, def] of Object.entries(raw)) {
					if (RESERVED_WORDS.has(id)) {
						throw new Error(where(`character id \`${id}\` is a reserved word and cannot be used.`));
					}
					const definition = def || {};
					characters[id] = {
						name: definition.name != null ? String(definition.name) : id,
						color: definition.color,
						avatar: definition.avatar
					};
				}
				return characters;
			}

			/**
			 * Works out which key is the event. Reserved actions and character ids are
			 * candidates; the secondary actions only count when nothing else does. No
			 * candidate means a plugin event, several is an error. The event is then compiled
			 * by its type and every key is checked against what that event allows (EVENT_KEYS,
			 * plus a plugin's fields and modifiers). Plugin modifier keys are compiled into
			 * scene.mods.
			 */
			static #compileEvent(event, characters, at) {
				if (!isPlainObject(event)) {
					throw new Error(at('each event must be a mapping, e.g. `- narration: "..."`'));
				}

				const keys = Object.keys(event);
				const candidates = keys.filter(key => RESERVED_ACTIONS.has(key) || key in characters);
				const primaryCandidates = candidates.filter(key => !SECONDARY_ACTIONS.has(key));
				const primary = primaryCandidates.length === 1 ? primaryCandidates[0]
					: candidates.length === 1 ? candidates[0]
					: candidates.length ? null
					: keys.find(key => PLUGIN_EVENTS.has(key));
				if (primary === null) throw new Error(at(`ambiguous event — found multiple actions/characters (\`${candidates.join('`, `')}\`). Each event needs exactly one.`));
				if (!primary) throw new Error(at(`unknown action or character id \`${keys.find(key => !PLUGIN_MODIFIERS.has(key)) ?? keys[0]}\`. Define it under \`characters:\` or use a valid action word.`));

				const plugin = PLUGIN_EVENTS.get(primary);
				const scene = primary in characters ? ScriptCompiler.#single(primary, event, characters, at)
					: plugin ? ScriptCompiler.#plugin(primary, event, characters, at)
					: ScriptCompiler.#compilers[primary](event[primary], event, characters, at);
				const mods = keys.filter(key => PLUGIN_MODIFIERS.has(key));
				const allowed = primary in characters ? EVENT_KEYS.character
					: plugin ? plugin.fields && Object.keys(plugin.fields)
					: (primary === 'show' || primary === 'replace') && isPlainObject(event[primary]) ? [] : EVENT_KEYS[primary] ?? [];
				if (allowed) ScriptCompiler.#checkKeys(event, [primary, ...allowed, ...mods.flatMap(key => [key, ...Object.keys(PLUGIN_MODIFIERS.get(key).fields ?? {})])], at);
				if (mods.length) scene.mods = Object.fromEntries(mods.map(key => [key, ScriptCompiler.#modifier(key, event, scene, characters, at)]));

			}

			/**
			 * Unknown keys warn in the console, or throw in strict mode.
			 */
			static #checkKeys(object, allowed, at, label = '') {
				for (const key of Object.keys(object).filter(key => !allowed.includes(key))) {
					const message = at(`unknown key \`${key}:\`${label}. Check its spelling, or remove it.`);
					if (ScriptCompiler.#strict) throw new Error(message);
					console.warn(message);
				}
			}

			/**
			 * Calls a plugin's compile hook. The hook's fail() throws, and any error gets the
			 * file, event and line prefix.
			 */
			static #pluginCall(compile, value, event, extras, at) {
				try { return compile(value, event, (message) => { throw new Error(message); }, extras); }
				catch (error) { throw new Error(at(error?.message || String(error))); }
			}

			/**

			 */
			static #modifier(key, event, scene, characters, at) {

				const on = [].concat(modifier.on ?? []);
				if (on.length && !on.includes(scene.event || scene.type)) throw new Error(at(`\`${key}:\` only works on ${on.join(', ')} events.`));

			}

			/**
			 * One compiler per built-in event. A compiled scene holds its type, its data, and
			 * isPassive for scenes that run by themselves.
			 */
			static #compilers = {
				narration: (value, event, characters, at) => ({ type: 'narration', text: ScriptCompiler.#text(value), position: event.position, log: event.log, typewriter: ScriptCompiler.#typewriter(event.typewriter, at) }),

				conversation: (value, event, characters, at) => ScriptCompiler.#conversation(event, characters, at),
				bg: (value, event, characters, at) => {
					const asset = ScriptCompiler.#asset(value, 'bg', at);
					return { type: 'background', asset, mediaType: isVideoAsset(asset) ? 'video' : 'image', loop: event.loop, volume: event.volume, fade: event.fade === false || event.fade === 0 ? false : undefined, position: ScriptCompiler.#bgAnchor(event.anchor, at), isPassive: true };

				hide: (value, event, characters, at) => ScriptCompiler.#compileSprite('hide', value, event, at),
				clear: (value, event, characters, at) => ScriptCompiler.#compileSprite('clear', value, event, at),
