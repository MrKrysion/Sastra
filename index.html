					this.masterVolume = 0;
				} else {
					this.masterVolume = this.previousVolume || 1;
				}
				this.applyMasterVolume();
				return this.masterVolume;
			}

			/**
			 * Ramps a gain node linearly to `to` over `duration` seconds from its current value
			 * (or `from`). A ramp already running is cancelled, so a new fade takes over
			 * cleanly. Duration 0 sets the value at once.
			 */
			#fadeNode(gainNode, to, duration = 0, from = null) {
				if (!gainNode || !this.audioContext) return;
				const now = this.audioContext.currentTime;
				gainNode.gain.cancelScheduledValues(now);
				gainNode.gain.setValueAtTime(from !== null ? from : gainNode.gain.value, now);
				if (duration > 0) {
					gainNode.gain.linearRampToValueAtTime(to, now + duration);
				} else {
					gainNode.gain.setValueAtTime(to, now);
				}
			}

			/**
			 * Routes an Audio element into the graph and returns the track's gain node, which
			 * starts silent, or null when Web Audio isn't available. An element can only ever
			 * have one source node (a second createMediaElementSource throws), so it is cached
			 * in a WeakMap.
			 */
			attachElement(el) {
				const context = this.getContext();
				if (!context) return null;
				let source = this.audioSourceNodes.get(el);
				if (!source) {
					try { source = context.createMediaElementSource(el); }
					catch (e) { return null; }
					this.audioSourceNodes.set(el, source);
				}
				const gain = context.createGain();
				gain.gain.value = 0;
				source.connect(gain);
				gain.connect(this.masterGain);
				return gain;
			}

			/**
			 * Public fade for a gain node: arguments are clamped, and the duration is in
			 * milliseconds.
			 */
			fadeGain(gainNode, to, durationMs = 0, from = null) {
				this.#fadeNode(gainNode, clamp(Number(to), 0, 1), Math.max(0, Number(durationMs) || 0) / 1000, from);
			}

			/**
			 * Disconnects the track's nodes and forgets the source. The element can't be
			 * attached again afterwards; tracks are never reused.
			 */
			detachElement(el, gainNode) {
				if (gainNode) { try { gainNode.disconnect(); } catch (e) {  } }
				const source = this.audioSourceNodes.get(el);
				if (source) {
					try { source.disconnect(); } catch (e) {  }
					this.audioSourceNodes.delete(el);
				}
			}

			/**
			 * Master changes ramp over 30ms to avoid clicks. Tracks without a gain node get
			 * their element volume updated instead.
			 */
			applyMasterVolume() {
				const context = this.getContext();
				if (this.masterGain && context) {
					this.#fadeNode(this.masterGain, this.masterVolume, 0.03);
				}
				this.audioTracks.forEach(track => {
					if (!track.gain) {
						track.audio.volume = track.targetVolume * this.masterVolume;
					}
				});
			}

			/**
			 * Handles an `audio` scene: play, stop, pause or volume.
			 */
			handleScene(scene) {
				const action = scene.action || 'play';
				const targetId = scene.id;

				if (action === 'play') this.play(scene);
				if (action === 'stop') this.stop(targetId, scene.fade || 0);
				if (action === 'pause') this.pause(targetId, scene.fade || 0);
				if (action === 'volume') this.changeVolume(targetId, scene.volume, scene.fade || 0);
			}

			/**
			 * A new track: an Audio element that loops if asked and starts at `from` seconds.
			 * The source goes through the resolver given to the constructor
			 * (AssetManager.url), so the downloaded copy is what plays.
			 */
			createTrack(scene) {
				const audio = new Audio(this.#resolve(scene.asset));
				audio.preload = 'auto';
				audio.loop = scene.loop === true;
				audio.volume = 1;

				const from = Math.max(0, Number(scene.from) || 0);
				if (from > 0) {
					try { audio.currentTime = from; } catch (e) {  }
				}

				return { audio, gain: this.attachElement(audio), targetVolume: 1, stopTimer: null };
			}

			/**
			 * Frees a track completely. The map entry goes too, unless a newer track has
			 * already taken the id.
			 */
			#release(id, track) {
				this.detachElement(track.audio, track.gain);
				unloadMedia(track.audio);
				if (this.audioTracks.get(id) === track) this.audioTracks.delete(id);
			}

			/**
			 * Starts a track, replacing any track with the same id. A suspended context is
			 * resumed first. A fade-in starts from silence. A track that doesn't loop releases
			 * itself when it ends, and any track does on an error.
			 */
			play(scene) {
				if (!scene.asset) return null;

				try {
					const id = scene.id;
					const targetVolume = clamp(scene.volume != null ? Number(scene.volume) : 1, 0, 1);
					const fade = Math.max(0, Number(scene.fade) || 0);

					if (this.audioTracks.has(id)) {
						this.stop(id, 0);
					}

					const track = this.createTrack(scene);
					track.targetVolume = targetVolume;
					this.audioTracks.set(id, track);

					const startPlayback = () => {
						if (track.gain) {
							this.#fadeNode(track.gain, targetVolume, fade, fade > 0 ? 0 : targetVolume);
						} else {
							track.audio.volume = targetVolume * this.masterVolume;
						}

						track.audio.play().catch(() => console.log('Audio playback failed'));
					};

					const ctx = this.audioContext;
					if (ctx && ctx.state === 'suspended') {
						ctx.resume().then(startPlayback, startPlayback);
					} else {
						startPlayback();
					}

					const release = () => this.#release(id, track);
					if (!track.audio.loop) track.audio.addEventListener('ended', release, { once: true });
					track.audio.addEventListener('error', release, { once: true });

					return track.audio;
				} catch (e) {
					console.log('Audio not available');
					return null;
				}
			}

			/**
			 * Fades the track out, then releases it. An empty id stops every track.
			 */
			stop(id, fade = 0) {
				if (!id || String(id).trim() === '') {
					this.stopAll(fade);
					return;
				}

				const track = this.audioTracks.get(id);
				if (!track) return;
				this.fadeTrackTo(track, 0, fade, () => this.#release(id, track));
			}

			stopAll(fade = 0) {
				Array.from(this.audioTracks.keys()).forEach(id => this.stop(id, fade));
			}

			/**
			 * Used while the orientation blocker pauses the game: pauses whatever is playing,
			 * remembers which tracks those were, and suspends the context.
			 */
			suspendAll() {
				this.audioTracks.forEach(track => {
					if (!track.audio.paused) {
						track.wasPlaying = true;
						track.audio.pause();
					}
				});
				if (this.audioContext?.state === 'running') {
					this.audioContext.suspend().catch(() => {});
				}
			}

			resumeAll() {
				if (this.audioContext?.state === 'suspended') {
					this.audioContext.resume().catch(() => {});
				}
				this.audioTracks.forEach(track => {
					if (track.wasPlaying) {
						track.wasPlaying = false;
						track.audio.play().catch(() => {});
					}
				});
			}

			/**
			 * Fades out, then pauses. The track stays registered.
			 */
			pause(id, fade = 0) {
				if (!id || String(id).trim() === '') {
					this.audioTracks.forEach(track => this.fadeTrackTo(track, 0, fade, () => track.audio.pause()));
					return;
				}
				const track = this.audioTracks.get(id);
				if (!track) return;
				this.fadeTrackTo(track, 0, fade, () => track.audio.pause());
			}

			/**
			 * Sets a track's target volume and fades to it. With no id it applies to every
			 * track.
			 */
			changeVolume(id, volume, fade = 0) {
				if ((!id || String(id).trim() === '') && volume !== undefined) {
					this.audioTracks.forEach(track => {
						track.targetVolume = clamp(Number(volume), 0, 1);
						this.fadeTrackTo(track, track.targetVolume, fade);
					});
					return;
				}
				const track = this.audioTracks.get(id);
				if (!track || volume === undefined) return;
				track.targetVolume = clamp(Number(volume), 0, 1);
				this.fadeTrackTo(track, track.targetVolume, fade);
			}

			/**
			 * Fades one track to `volume` over `fade` seconds (a gain ramp, or element.volume
			 * in the fallback), then calls onComplete a little after the fade ends
			 * (audioStopBuffer), so a stop never clips the tail. A timer left by an earlier
			 * fade is cancelled first.
			 */
			fadeTrackTo(track, volume, fade = 0, onComplete = null) {
				if (!track) return;
				const target = clamp(Number(volume), 0, 1);
				const duration = Math.max(0, Number(fade) || 0);

				if (track.stopTimer) {
					clearTimeout(track.stopTimer);
					track.stopTimer = null;
				}

				if (track.gain && this.audioContext) {
					this.#fadeNode(track.gain, target, duration);
				} else {
					track.audio.volume = target * this.masterVolume;
				}

				if (onComplete) {
					if (duration === 0) {
						onComplete();
					} else {
						track.stopTimer = setTimeout(onComplete, (duration * 1000) + TIMINGS.audioStopBuffer);
					}
				}
			}
		}

		/**
		 * Renders dialogue (single, multi, narration, conversation) and runs the typewriter.
		 * Each scene type has a renderer in #renderers that fills the matching static DOM and
		 * returns a description of what to show: container, position, text targets and the
		 * screen-reader line. render() then treats all of them alike.
		 *
		 * A conversation is a small state machine: one scene holds many lines, #index is the
		 * current one, and advanceConversation() steps through them and moves on to the
		 * next scene after the last.
		 */
		class DialogueManager {
			#vn;
			/**
			 * elements being typed, and the animation frame driving them
			 */
			#nodes = [];
			#rafId = null;
			#isTyping = false;
			#enabled = true;
			#characters = null;
			#isConversationActive = false;
			#index = 0;

			#renderers = {
				single: (scene) => this.#renderSingle(scene),
				multi: (scene) => this.#renderMulti(scene),
				narration: (scene) => this.#renderNarration(scene),
				conversation: (scene) => this.#renderConversation(scene),
			};

			constructor(vn) {
				this.#vn = vn;
			}

			get isTyping() { return this.#isTyping; }
			get isConversationActive() { return this.#isConversationActive; }
			get enabled() { return this.#enabled; }
			set enabled(value) { this.#enabled = Boolean(value); }

			/**
			 * Puts `rawText` into `element`, revealing it one character at a time when `animate`
			 * is true. The full text is kept in data-full-text, for completeAll() and the log.
			 * When animating, the text nodes are emptied and refilled in place, so inline tags
			 * such as <b> survive, and each <br> stays hidden until the text reaches it.
			 * `delay` postpones this element's start, in milliseconds.
			 */
			type(element, rawText = '', delay = 0, animate = this.#enabled) {
				const text = newlinesToBreaks(rawText);
				element.dataset.fullText = text;

				if (!animate) {
					element.innerHTML = text;
					return;
				}

				element.innerHTML = text;

				const segments = [];
				let total = 0;
				const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
				let node;
				while ((node = walker.nextNode())) {
					if (node.nodeType === Node.TEXT_NODE) {
						segments.push({ node, text: node.nodeValue });
						total += node.nodeValue.length;
						node.nodeValue = '';
					} else if (node.tagName === 'BR') {
						segments.push({ br: node });
						node.style.display = 'none';
					}
				}

				this.#nodes.push({
					el: element, segments, total,
					delay, startTime: 0,
					done: total === 0
				});
				this.#isTyping = true;
				if (!this.#rafId) this.#startLoop();
			}

			/**
			 * One requestAnimationFrame loop serves every element being typed. Each frame
			 * shows floor(elapsed / typewriterStep) characters, spread over the element's text
			 * nodes in order. When nothing is left active the loop stops and tells the autoplay
			 * manager the content has settled, so its reading timer only starts once the text
			 * is fully on screen.
			 */
			#startLoop() {
				const stepMs = TIMINGS.typewriterStep;
				const tick = (ts) => {
					let anyActive = false;

					for (const node of this.#nodes) {
						if (node.done) continue;
						if (!node.startTime) node.startTime = ts;
						const elapsed = ts - node.startTime - node.delay;
						if (elapsed < 0) { anyActive = true; continue; }

						const target = stepMs > 0 ? Math.min(node.total, Math.floor(elapsed / stepMs)) : node.total;
						let remaining = target;
						for (const seg of node.segments) {
							if (seg.br) {
								const display = remaining > 0 ? '' : 'none';
								if (seg.br.style.display !== display) seg.br.style.display = display;
								continue;
							}
							const show = remaining <= 0 ? 0 : Math.min(seg.text.length, remaining);
							if (seg.node.nodeValue.length !== show) seg.node.nodeValue = seg.text.slice(0, show);
							remaining -= seg.text.length;
						}

						if (target >= node.total) node.done = true;
						else anyActive = true;
					}

					if (anyActive) {
						this.#rafId = requestAnimationFrame(tick);
					} else {
						this.#rafId = null;
						this.#nodes.length = 0;
						this.#isTyping = false;
						this.#vn.autoplay?.onContentSettled(this.#vn.script[this.#vn.currentIndex]);
					}
				};

				this.#rafId = requestAnimationFrame(tick);
			}

			/**
			 * Stops typing where it is.
			 */
			halt() {
				if (this.#rafId) {
					cancelAnimationFrame(this.#rafId);
					this.#rafId = null;
				}
				this.#nodes.length = 0;
				this.#isTyping = false;
			}

			/**
			 * Skips the animation: stops the loop and writes the full text into every dialogue
			 * and narration element.
			 */
			completeAll() {
				this.halt();

				document.querySelectorAll('.dialogue-text, .narration-text').forEach(element => {
					if (element.dataset.fullText !== undefined) {
						element.innerHTML = element.dataset.fullText;
					}
				});
			}

			resetConversation() {
				this.#characters = null;
				this.#isConversationActive = false;
				this.#index = 0;
			}

			/**
			 * Starts a conversation. Characters sit on the left or the right. The speaker's
			 * avatar is shown normally and the other one is .dimmed.
			 */
			startConversation(scene) {
				this.#characters = scene.characters;
				this.#isConversationActive = true;
				this.#index = 0;
				this.#setupConversation();
			}

			advanceConversation() {
				const scene = this.#vn.script[this.#vn.currentIndex];
				this.#index++;

				if (this.#index >= scene.dialogue.length) {
					this.#isConversationActive = false;
					this.#index = 0;
					this.#vn.scene.nextScene();
				} else {
					this.render(scene);
				}
			}

			/**
			 * Sets up the first line: hides other screens, positions the box, sets both avatars
			 * and who is speaking, then fades the layer in after two frames. Avatar transitions
			 * are switched off until then so they don't animate from the previous state.
			 */
			#setupConversation() {
				if (!this.#characters) return;

				const vn = this.#vn;
				vn.scene.hideAllScreens();
				const scene = vn.script[vn.currentIndex];
				vn.applyDialoguePosition(vn.elements.convDialogue, scene.position);

				const leftChar = this.#characters.find(c => c.position === 'left');
				const rightChar = this.#characters.find(c => c.position === 'right');
				const firstLine = scene.dialogue[0];

				const leftAvatar = vn.elements.leftAvatar;
				const rightAvatar = vn.elements.rightAvatar;
				const hasLeftAvatar = vn.hasAsset(leftChar?.avatar);
				const hasRightAvatar = vn.hasAsset(rightChar?.avatar);

				this.#updateAvatarDOM(leftAvatar, hasLeftAvatar, leftChar?.avatar);
				this.#updateAvatarDOM(rightAvatar, hasRightAvatar, rightChar?.avatar);
				leftAvatar.dataset.speaker = leftChar.characterId;
				rightAvatar.dataset.speaker = rightChar.characterId;
				vn.elements.convDialogue.classList.toggle('conv-dialogue--no-avatar', !hasLeftAvatar && !hasRightAvatar);
				vn.elements.convDialogue.classList.remove('conv-dialogue--speaker-no-avatar');

				leftAvatar.style.transition = 'none';
				rightAvatar.style.transition = 'none';

				if (firstLine.characterId === leftChar.characterId) {
					leftAvatar.classList.remove('dimmed');
					rightAvatar.classList.add('dimmed');
				} else {
					rightAvatar.classList.remove('dimmed');
					leftAvatar.classList.add('dimmed');
				}

				requestAnimationFrame(() => {
					requestAnimationFrame(() => {
						leftAvatar.style.transition = '';
						rightAvatar.style.transition = '';
						vn.scene.activateLayer(vn.elements.convDialogue);
					});
				});
			}

			/**
			 * Shows a dialogue scene. Whether it types is decided by the line's own
			 * `typewriter:` override first, then the scene's, then the player's setting. It also
			 * records the speaker id on the container (data-speaker, for skins), announces the
			 * line to screen readers, adds it to the log, and, if nothing is being typed, tells
			 * autoplay straight away.
			 */
			render(scene) {
				const build = this.#renderers[scene.type];
				if (!build) return;

				const result = build(scene);
				if (!result) return;

				const vn = this.#vn;
				const { container, position, targets = [], line, speech, typewriter } = result;
				const animate = typewriter ?? scene.typewriter ?? this.#enabled;

				if (line?.characterId) container.dataset.speaker = line.characterId;
				else delete container.dataset.speaker;
				vn.applyDialoguePosition(container, position);
				vn.scene.activateLayer(container);
				targets.forEach(t => this.type(t.el, t.text, t.delay || 0, animate));
				if (speech != null) announce(vn.elements.sr[scene.type], speech);
				vn.log.add(scene, scene.type === 'conversation' ? [line] : undefined);
				if (!this.#isTyping) vn.autoplay?.onContentSettled(scene);
			}

			/**
			 * Shows or hides an avatar image, taking its src from getImageSrc (the downloaded
			 * copy when there is one).
			 */
			#updateAvatarDOM(element, hasAvatar, src, toggleHiddenClass = true) {
				if (toggleHiddenClass) element.classList.toggle('hidden-avatar', !hasAvatar);
				if (hasAvatar) element.src = this.#vn.getImageSrc(src);
				else element.removeAttribute('src');
			}

			/**
			 * One speaker. The avatar is hidden when the character has none or hideAvatarInGame
			 * is set (the log can still show it). The name takes the character's own colour,
			 * otherwise the CSS default.
			 */
			#renderSingle(scene) {
				const vn = this.#vn;
				const container = vn.elements.singleDialogue;
				const avatarEl = vn.elements.singleAvatar;
				const hasAvatar = vn.hasAsset(scene.avatar) && scene.hideAvatarInGame !== true;
				container.classList.toggle('single-dialogue--no-avatar', !hasAvatar);
				this.#updateAvatarDOM(avatarEl, hasAvatar, scene.avatar, false);

				const nameEl = vn.elements.singleCharacterName;
				nameEl.innerHTML = scene.name;
				nameEl.style.color = scene.color || '';

				return {
					container,
					position: scene.position,
					line: scene,
					targets: [{ el: vn.elements.singleDialogueText, text: scene.text }],
					speech: speechLine(vn.i18n, scene.name, scene.text)
				};
			}

			/**
			 * Several speakers at once, one row each, rebuilt every time.
			 */
			#renderMulti(scene) {
				const vn = this.#vn;
				const container = vn.elements.multiDialogue;
				container.innerHTML = '';
				scene.characters.forEach(char => {
					const row = document.createElement('div');
					const hasAvatar = vn.hasAsset(char.avatar) && char.hideAvatarInGame !== true;
					row.className = `dialogue-wrapper speaker-row${hasAvatar ? '' : ' speaker-row--no-avatar'}`;
					row.dataset.speaker = char.characterId;
					row.innerHTML = `
						${hasAvatar ? `<img class="avatar" src="${vn.getImageSrc(char.avatar)}" alt="${char.name}">` : ''}
						<div class="dialogue-content">
							<div class="character-name" dir="auto" style="color: ${char.color || 'var(--color-accent)'}">${char.name}</div>
							<div class="dialogue-text" dir="auto"></div>
						</div>
					`;
					container.appendChild(row);
				});

				const targets = [];
				container.querySelectorAll('.dialogue-text').forEach((el, index) => {
					targets.push({ el, text: scene.characters[index].text, delay: 0 });
				});

				return {
					container,
					position: scene.position,
					targets,
					speech: scene.characters.map(char => speechLine(vn.i18n, char.name, char.text)).join('. ')
				};
			}

			#renderNarration(scene) {
				return {
					container: this.#vn.elements.narrationScreen,
					position: scene.position,
					targets: [{ el: this.#vn.elements.narrationText, text: scene.text }],
					speech: htmlToText(scene.text)
				};
			}

			/**
			 * One line of a conversation. The speaker's avatar takes the line's image, the box
			 * flips to the right for the right-hand speaker, and the other avatar is dimmed.
			 * `position` is null: the box was already placed in #setupConversation.
			 */
			#renderConversation(scene) {
				if (!this.#characters) return null;
				const vn = this.#vn;
				const container = vn.elements.convDialogue;

				const leftChar = this.#characters.find(c => c.position === 'left');
				const rightChar = this.#characters.find(c => c.position === 'right');
				const currentDialogue = scene.dialogue[this.#index];

				const leftAvatar = vn.elements.leftAvatar;
				const rightAvatar = vn.elements.rightAvatar;
				const dialogueBox = vn.elements.convDialogueBox;
				const nameEl = vn.elements.convCharacterName;

				const leftIsSpeaker = currentDialogue.characterId === leftChar.characterId;
				const speakerAvatarEl = leftIsSpeaker ? leftAvatar : rightAvatar;
				const speakerAvatar = currentDialogue.avatar;

				const speakerHasAvatar = vn.hasAsset(speakerAvatar);
				const hasLeftAvatar = vn.hasAsset(leftChar?.avatar);
				const hasRightAvatar = vn.hasAsset(rightChar?.avatar);

				leftAvatar.classList.toggle('hidden-avatar', !hasLeftAvatar);
				rightAvatar.classList.toggle('hidden-avatar', !hasRightAvatar);
				container.classList.toggle('conv-dialogue--no-avatar', !hasLeftAvatar && !hasRightAvatar);
				container.classList.toggle('conv-dialogue--speaker-no-avatar', !speakerHasAvatar);
				dialogueBox.classList.toggle('conv-dialogue-box--no-avatar', !speakerHasAvatar);

				if (speakerHasAvatar) speakerAvatarEl.src = vn.getImageSrc(speakerAvatar);

				if (leftIsSpeaker) {
					leftAvatar.classList.remove('dimmed');
					rightAvatar.classList.add('dimmed');
					dialogueBox.classList.remove('conv-dialogue-box--right');
				} else {
					rightAvatar.classList.remove('dimmed');
					leftAvatar.classList.add('dimmed');
					dialogueBox.classList.add('conv-dialogue-box--right');
				}
				nameEl.style.color = currentDialogue.color || '';

				nameEl.innerHTML = currentDialogue.name;
				return {
					container,
					position: null,
					line: currentDialogue,
					targets: [{ el: vn.elements.convDialogueText, text: currentDialogue.text }],
					typewriter: currentDialogue.typewriter,
					speech: speechLine(vn.i18n, currentDialogue.name, currentDialogue.text)
				};
			}
		}

		/**
		 * Everything on screen that isn't dialogue: toasts, fullscreen, the volume controls, the
		 * start gate, the log, credits and pause modals, the error screens, and the title,
		 * image and end screens, plus sharing. It writes into the static DOM (vn.elements)
		 * and mounts plugin UI at the places plugins may extend (`plugins.mount()` for
		 * the start, pause and end screens).
		 */
		class UIManager {
			#vn;
			/**
			 * once an error screen is final, later errors only go to the console
			 */
			#failed = false;
			#isStartingTransition = false;

			constructor(vn) { this.#vn = vn; }

			/**
			 * Sets up the volume and autoplay-speed sliders (the volume one gets a wave) and keeps the pause list's edge fades in step with scrolling and
			 * resizing.
			 */
			initControls() {
				const e = this.#vn.elements;
				this.sliders = {
					volume: enhanceSlider(e.volumeSlider, true),
					speed: enhanceSlider(e.autoplaySpeedSlider)
				};
				const updateFade = () => this.updatePauseFade();
				e.pauseList.addEventListener('scroll', updateFade, { passive: true });
				addEventListener('resize', updateFade);
			}

			/**
			 * A title or end screen's dim: the event's `dim:` wins, then `screenDim` in settings.
			 */
			#applyDim(screen, scene) {
				screen.classList.toggle('full-screen-overlay--no-dim', !(scene.dim ?? this.#vn.controls.screenDim));
			}

			/**
			 * FLIP animation: note where each toast is, apply the change, then animate every
			 * toast from its old place to its new one, so the stack glides instead of jumping.
			 * Skipped under reduced motion.
			 */
			#flipToasts(stack, change) {
				const before = new Map([...stack.children].map(toast => [toast, toast.offsetTop]));
				change();
				if (reducedMotion()) return;
				before.forEach((top, toast) => {
					const distance = top - toast.offsetTop;
					if (distance && toast.isConnected) toast.animate([{ transform: `translateY(${distance}px)` }, { transform: 'none' }], { duration: TIMINGS.toastGlide, easing: 'cubic-bezier(.2, .8, .2, 1)' });
				});
			}

			#dismissToast(toast) {
				if (toast.classList.contains('hide')) return;
				clearTimeout(toast.timer);
				toast.classList.add('hide');
				setTimeout(() => this.#flipToasts(toast.parentElement, () => toast.remove()), TIMINGS.toastFade);
			}

			/**
			 * Shows a toast on the left or right stack. A message repeated while its toast is
			 * still showing isn't added again: the toast's counter goes up (x2, x3), it bumps
			 * and its timer restarts. At most three toasts are live; older ones are dismissed.
			 * Hovering a toast holds its timer, clicking dismisses it, and errors stay longer.
			 */
			showToast(message, type = 'info', { duration = type === 'error' ? TIMINGS.toastErrorDuration : TIMINGS.toastDuration, side = 'left' } = {}) {
				const stack = this.#vn.elements.toastContainer.querySelector(`.toast-stack--${side}`);
				const live = () => [...stack.children].filter(toast => !toast.classList.contains('hide'));
				const repeat = live().find(toast => toast.children[1].textContent === message && toast.classList.contains(type));
				const toast = repeat || document.createElement('div');
				const arm = () => {
					clearTimeout(toast.timer);
					toast.timer = setTimeout(() => this.#dismissToast(toast), duration);
				};
				if (repeat) {
					toast.count = (toast.count || 1) + 1;
					toast.lastChild.textContent = `×${toast.count}`;
					if (!reducedMotion()) toast.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.05)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'cubic-bezier(.34, 1.36, .64, 1)' });
					arm();
					return;
				}
				toast.className = `toast ${type}`;
				toast.dir = 'auto';
				toast.innerHTML = `${iconTag(type)}<span></span><span class="toast-count"></span>`;
				toast.children[1].textContent = message;
				toast.addEventListener('pointerenter', () => clearTimeout(toast.timer));
				toast.addEventListener('pointerleave', arm);
				toast.addEventListener('click', (event) => {
					event.stopPropagation();
					this.#dismissToast(toast);
				});
				this.#flipToasts(stack, () => stack.prepend(toast));
				toast.classList.toggle('multi', toast.children[1].offsetHeight > 30);
				live().slice(3).forEach(old => this.#dismissToast(old));
				arm();
			}

			async requestFullscreen() {
				if (document.fullscreenElement || !document.documentElement.requestFullscreen) return;
				try { await document.documentElement.requestFullscreen(); } catch (e) {  }
			}

			async exitFullscreen() {
				if (!document.fullscreenElement || !document.exitFullscreen) return;
				try { await document.exitFullscreen(); } catch (e) {  }
			}

			/**
			 * True when the browser window itself is fullscreen (F11) rather than the page
			 * through the Fullscreen API. A page can't leave that mode, so the button shows a
			 * hint instead. Only checked for desktop pointers: either display-mode: fullscreen
			 * matches or the window exactly covers the screen.
			 */
			get #browserFullscreen() {
				if (document.fullscreenElement || !matchMedia('(hover: hover) and (pointer: fine)').matches) return false;
				return matchMedia('(display-mode: fullscreen)').matches || (screenX === 0 && screenY === 0 && outerWidth === screen.width && outerHeight === screen.height);
			}

			async toggleFullscreen() {
				if (this.#browserFullscreen) {
					this.showToast(this.#vn.i18n.t('controls.fullscreenBrowser', { key: /Mac/i.test(navigator.platform) ? 'Ctrl+Cmd+F' : 'F11' }), 'info', { side: 'right' });
					return;
				}
				if (document.fullscreenElement) {
					await this.exitFullscreen();
				} else {
					await this.requestFullscreen();
				}
				emit('feature_fullscreen', { state: document.fullscreenElement ? 'entered' : 'exited' });
				this.updateFullscreenButton();
			}

			/**
			 * Sets a control's tooltip from a string key and appends its keyboard shortcut in
			 * brackets when shortcuts are enabled.
			 */
			setTitle(el, key) {
				if (!el) return;
				const hint = el.dataset.shortcut && this.#vn.controls.enableKeyboardShortcuts ? ` (${el.dataset.shortcut})` : '';
				setTip(el, this.#vn.i18n.t(key) + hint);
			}

			updateFullscreenButton() {
				const button = this.#vn.elements.fullscreenToggle;
				if (!button) return;

				const isFullscreen = Boolean(document.fullscreenElement) || this.#browserFullscreen;
				button.classList.toggle('fullscreen-active', isFullscreen);
				this.setTitle(button, isFullscreen ? 'controls.fullscreenExit' : 'controls.fullscreenEnter');
			}

			/**
			 * Syncs every volume control with the master volume: slider, percentage, mute
			 * button state and tooltips. Also emits the plugin `volume` happening.
			 */
			updateVolumeUi() {
				const vn = this.#vn;
				if (!vn.elements.volumeSlider) return;
				const masterVolume = vn.audio.masterVolume;
				const percent = Math.round(masterVolume * 100);
				vn.elements.volumeSlider.value = String(percent);
				vn.elements.volumeValue.textContent = `${percent}%`;
				this.sliders.volume.sync();
				this.setTitle(vn.elements.muteToggle, masterVolume > 0 ? 'controls.mute' : 'controls.unmute');
				vn.elements.muteToggle?.classList.toggle('muted', masterVolume === 0);
				this.setTitle(vn.elements.volumeToggle, masterVolume > 0 ? 'controls.volume' : 'controls.muted');
				vn.elements.volumeToggle?.classList.toggle('muted', masterVolume === 0);
				vn.plugins.emit('volume', { volume: masterVolume });
			}

			showStartGate() {
				const vn = this.#vn;
				vn.isWaitingForStart = true;
				this.configureStartGate();
				vn.elements.startGate.classList.add('active');
			}

			/**
			 * The start gate depends on saved progress. With a checkpoint to return to it asks
			 * "Continue?" and offers Continue and Restart; otherwise it just says to click.
			 * Plugins can mount into it.
			 */
			configureStartGate() {
				const vn = this.#vn;
				const hasResume = vn.progress.pendingResumeIndex !== null && vn.progress.pendingResumeIndex > 0;
				const checkpoint = hasResume ? vn.progress.getCheckpointByResumeIndex(vn.progress.pendingResumeIndex) : null;
				const checkpointLabel = checkpoint?.name
					? vn.i18n.t('startGate.checkpointNamed', { name: checkpoint.name })
					: vn.i18n.t('startGate.lastCheckpoint');

				const button = (action, icon, key, classes) => uiButton(`data-start-action="${action}"`, icon, vn.i18n.t(key), classes);

				vn.elements.startGate.classList.toggle('start-gate--resume', hasResume);
				vn.elements.startTitle.textContent = vn.i18n.t(hasResume ? 'startGate.continueTitle' : 'startGate.clickToStart');
				vn.elements.startSubtitle.textContent = hasResume ? vn.i18n.t('startGate.resumeFrom', { checkpoint: checkpointLabel }) : '';
				vn.elements.startSubtitle.hidden = !hasResume;
				vn.elements.startActions.innerHTML = hasResume ? button('restart', 'restart', 'startGate.restart', 'secondary') + button('continue', 'play', 'startGate.continue') : '';
				vn.elements.startActions.hidden = !hasResume;
				vn.plugins.mount('start', vn.elements.startGate, {
					checkpoint: hasResume ? checkpoint?.name || '' : null,
					start: () => this.beginStart('start'),
					resume: () => this.beginStart('continue'),
					restart: () => this.beginStart('restart')
				});
			}

			/**
			 * Starts the chapter once the start panel has faded out. It waits for the
			 * transition, with a short timeout in case transitionend never fires, and ignores
			 * calls when the gate isn't waiting or a start is already under way. With no panel
			 * (a plugin replaced the screen) it proceeds at once.
			 */
			beginStart(action = 'start') {
				const vn = this.#vn;
				if (!vn.isWaitingForStart || this.#isStartingTransition) return;
				this.#isStartingTransition = true;

				const panel = vn.elements.startGate.querySelector(':scope:not(.screen--replaced) > .start-panel');
				const proceed = () => {
					if (!this.#isStartingTransition) return;
					this.#isStartingTransition = false;
					this.startChapter(action);
				};

				if (!panel) { proceed(); return; }

				let done = false;
				const finish = () => {
					if (done) return;
					done = true;
					panel.removeEventListener('transitionend', finish);
					proceed();
				};
				panel.addEventListener('transitionend', finish);
				panel.classList.add('starting');

				setTimeout(finish, TIMINGS.startPanelFade + TIMINGS.startPanelSafety);
			}

			/**
			 * Marks the game active, reports how it started (new, continue or restart),
			 * resumes audio, which is allowed now that a user gesture has happened, and hands
			 * over to the scene manager at the resume index.
			 */
			async startChapter(action = 'start') {
				const vn = this.#vn;
				if (!vn.isWaitingForStart) return;
				vn.isWaitingForStart = false;

				document.body.classList.add('game-active');
				document.body.classList.remove('controls-hidden');

				const resumeIndex = action === 'continue' && vn.progress.pendingResumeIndex > 0 ? vn.progress.pendingResumeIndex : 0;
				if (resumeIndex) {
					emit('game_started', { type: 'continue' });
					emit('chapter_resumed', { scene_index: resumeIndex });
				} else {
					emit('game_started', { type: action === 'restart' ? 'restart' : 'new' });
					if (action === 'restart') emit('chapter_restarted', { trigger: 'start_gate' });
				}
				vn.plugins.emit('start', { type: resumeIndex ? 'continue' : action === 'restart' ? 'restart' : 'new', index: resumeIndex });

				vn.audio.resume();

				vn.scene.begin(resumeIndex);
			}

			resetStartTransition() { this.#isStartingTransition = false; }

			/**
			 * The log, credits and pause modals share one mechanism: build the content, add
			 * .active, move focus in and pause autoplay. The pause menu stays closed when
			 * checkpoints are disabled.
			 */
			openModal(id) {
				const vn = this.#vn;
				if (id === 'pause' && !vn.controls.enableCheckpoints) return;

				if (id === 'log') {
					vn.log.populate();
				} else if (id === 'credits') {
					this.#fillCredits(vn.chapterFile ? vn.script[vn.currentIndex]?.credits : vn.gameMeta.credits);
				} else if (id === 'pause') {
					this.buildPauseMenu();
				}

				const el = this.#modalEl(id);
				if (!el) return;
				el.classList.add('active');
				focusDialog(el);
				vn.activeModal = id;
				vn.autoplay.pause();

				if (id === 'log') emit('feature_log_opened');
				else if (id === 'pause') emit('pause_menu_opened', { chapter_id: vn.chapterFile, scene_index: vn.currentIndex });
				else if (id === 'credits') emit('credits_open');

			}

			closeModal() {
				const vn = this.#vn;
				if (!vn.activeModal) return;
				if (vn.activeModal === 'credits') emit('credits_close');
				this.#modalEl(vn.activeModal)?.classList.remove('active');
				vn.activeModal = null;
				vn.autoplay.resume();
			}

			/**
			 * Credits are either inline text or a path to a .html or .txt file, fetched when
			 * opened. HTML is inserted as markup; plain text has its newlines turned into
			 * breaks.
			 */
			async #fillCredits(credits) {
				const body = this.#vn.elements.creditsBody;
				const file = /\.(html|txt)$/i.exec(String(credits ?? '').trim());
				if (!file) { body.innerHTML = newlinesToBreaks(credits); return; }
				body.innerHTML = '';
				const response = await fetch(file.input).catch(() => null);
				if (!response?.ok) { this.showError(`Could not load the credits file \`${file.input}\`. Check that the file exists and that its path under \`credits:\` is correct.`, 'asset'); return; }
				body.textContent = await response.text();
				if (file[1].toLowerCase() === 'html') body.innerHTML = body.textContent;
				else body.innerHTML = newlinesToBreaks(body.innerHTML);
			}

			#modalEl(id) {
				const e = this.#vn.elements;
				return { log: e.logModal, credits: e.creditsModal, pause: e.pauseMenu }[id] || null;
			}

			/**
			 * Fills the pause menu: logo or title, chapter name and the checkpoint list. A
			 * checkpoint is unlocked, locked, or current, meaning the latest unlocked one at or
			 * before the current scene. Locked ones are disabled and show a lock. The list is
			 * scrolled to centre the current one, and plugins can mount into the menu.
			 */
			buildPauseMenu() {
				const vn = this.#vn;
				const meta = vn.gameMeta || {};

				if (vn.elements.pauseLogo) {
					vn.elements.pauseLogo.innerHTML = hasAsset(meta.logo)
						? `<img src="${meta.logo}" alt="${stripHtml(meta.title) || vn.i18n.t('alt.gameLogo')}" class="pause-logo-img">`
						: `<div class="eyebrow">${meta.title || DEFAULT_GAME_META.title}</div>`;
				}
				if (vn.elements.pauseChapter) vn.elements.pauseChapter.innerHTML = vn.currentChapter || '';

				const all = vn.progress.chapterCheckpoints || [];
				const unlocked = new Set((vn.progress.chapterProgress || vn.progress.getChapterProgress())?.unlocked || []);
				const current = all.findLast(checkpoint => unlocked.has(checkpoint.id) && checkpoint.index <= vn.currentIndex);
				const checkpoints = all.map((checkpoint, index) => ({ id: checkpoint.id, number: index + 1, name: checkpoint.name || '', unlocked: unlocked.has(checkpoint.id), current: checkpoint === current }));
				vn.elements.pauseRight?.classList.toggle('hidden', !checkpoints.length);
				vn.elements.pauseMenu?.classList.toggle('pause-solo', !checkpoints.length);

				const icon = (name) => `<span class="row-meta">${iconTag(name)}</span>`;
				vn.elements.pauseCount.textContent = `${checkpoints.filter(checkpoint => checkpoint.unlocked).length} / ${checkpoints.length}`;
				vn.elements.pauseList.innerHTML = checkpoints.map(({ id, number, name, unlocked: available, current: here }) => available
					? `<button class="row checkpoint-item${here ? ' current' : ''}" data-checkpoint="${id}"><span class="row-num">${number}</span><span class="row-title" dir="auto">${name || vn.i18n.t('pause.checkpointFallback', { number })}</span>${icon(here ? 'play' : 'check')}</button>`
					: `<button class="row checkpoint-item" data-checkpoint="${id}" data-tip-always title="${vn.i18n.t('pause.checkpointLocked')}" disabled><span class="row-num">${number}</span><span class="row-title" dir="auto">${vn.i18n.t('pause.checkpointFallback', { number: '' }).trim()}</span>${icon('lock')}</button>`).join('');

				const list = vn.elements.pauseList;
				const here = list.querySelector('.current');
				list.scrollTop = here ? here.offsetTop - (list.clientHeight - here.offsetHeight) / 2 : 0;
				this.updatePauseFade();

				this.updatePauseAssets();
				vn.plugins.mount('pause', vn.elements.pauseMenu, {
					chapter: vn.currentChapter,
					checkpoints,
					resume: () => this.closeModal(),
					restart: () => vn.scene.restartChapterMidGame(),
					jump: (id) => vn.scene.jumpToCheckpoint(id),
					menu: () => vn.input.runAction('menu')
				});
			}

			/**
			 * Records in data-more whether the list has more content past its top or bottom
			 * edge, which the CSS fade masks read.
			 */
			updatePauseFade() {
				const list = this.#vn.elements.pauseList;
				list.dataset.more = [list.scrollTop > 4 && 'above', list.scrollTop + list.clientHeight < list.scrollHeight - 4 && 'below'].filter(Boolean).join(' ');
			}

			/**
			 * The debug line of the pause menu: preload statistics.
			 */
			updatePauseAssets() {
				const vn = this.#vn;
				if (!vn.elements.pauseAssets) return;
				const a = vn.assets.debugSummary();
				const sceneNo = (vn.currentIndex || 0) + 1;
				const sceneTotal = vn.script ? vn.script.length : 0;

				const typeBreakdown = `(${a.imgReady}/${a.imgTotal} img, ${a.audioReady}/${a.audioTotal} aud, ${a.videoReady}/${a.videoTotal} vid)`;

				vn.elements.pauseAssets.textContent =
					(a.activeTotal
						? `${a.resident} assets resident · ${a.ready}/${a.total} warm ${typeBreakdown} · window ${a.windowStart + 1}–${a.windowEnd + 1}/${a.activeTotal} active · scene ${sceneNo}/${sceneTotal}`
						: `${a.resident} assets resident · ${a.ready}/${a.total} warm ${typeBreakdown} · scene ${sceneNo}/${sceneTotal}`);
			}

			/**
			 * A network failure while loading files, with a Retry button. Not final:
			 * hideLoadingError() clears it when a retry succeeds.
			 */
			showLoadingError(files) {
				if (this.#failed) return;
				const t = (key) => this.#vn.i18n.t(key);
				this.#showError(t('errors.networkTitle'), t('errors.networkDesc'), uiButton('data-action="retry"', 'retry', t('errors.retry')), `Could not reach the server for:\n\n` + '```\n' + files.join('\n') + '\n```');
			}

			hideLoadingError() {
				if (this.#failed) return;
				document.getElementById('errorScreen')?.classList.remove('active');
				delete document.body.dataset.error;
			}

			/**
			 * The final error screen, shown once. It carries player-facing wording, and the
			 * technical message goes in a collapsible Details section that is open by default
			 * on local development hosts, where the creator is the likely reader. It is also
			 * reported to analytics (message cut to 300 characters).
			 */
			showError(message, kind = 'script') {
				if (this.#failed) { console.error(message); return; }
				this.#failed = true;
				emit('error_script', { kind, message: String(message).slice(0, 300) });
				const t = (key) => this.#vn.i18n.t(key);
				this.#showError(t('errors.title'), t('errors.desc'), (chapterParam() ? uiButton('data-action="menu"', 'home', t('endScreen.backToMenu'), 'secondary') : '') + uiButton('data-action="reload"', 'retry', t('errors.retry')), message);
			}

			/**
			 * Message for missing files, or, with `missing` false, files that exist but
			 * couldn't be loaded (damaged, or a format the browser can't play).
			 */
			showAssetError(files, missing = true) {
				this.showError(`The chapter referenced ${files.length > 1 ? 'assets' : 'an asset'} that could not be ${missing ? 'found' : 'loaded'}:\n\n` + '```\n' + files.join('\n') + '\n```\n\n' + (missing ? 'Check that the file path is correct and that the file exists.' : 'Check that the file isn\'t damaged and is in a format browsers can play.'), 'asset');
			}

			/**
			 * Renders the error screen. `message` understands a small subset of markdown: fenced
			 * ``` blocks become <pre>, blank lines separate paragraphs and `backticks` become
			 * <code>. The Copy button copies the message with the engine version, the URL and
			 * the user agent, which is what a bug report needs.
			 */
			#showError(title, desc, actions, message) {
				const vn = this.#vn;
				vn.elements.loading.classList.add('hidden');
				showErrorScreen(title, desc, actions).insertAdjacentHTML('beforeend', `<details class="error-details"${isDevHost() ? ' open' : ''}><summary><span dir="auto">${vn.i18n.t('errors.details')}</span>${iconTag('chevron')}</summary><div class="error-details__panel"><button class="error-details__copy">${vn.i18n.t('errors.copy')}</button></div></details>`);
				const panel = document.querySelector('#errorScreen .error-details__panel');
				String(message).split(/\n*```\n?/).forEach((part, i) => {
					if (i % 2) return panel.append(Object.assign(document.createElement('pre'), { textContent: part }));
					part.split(/\n{2,}/).map(text => text.trim()).filter(Boolean).forEach(text => {
						const paragraph = document.createElement('p');
						text.split('`').forEach((bit, j) => paragraph.append(j % 2 ? Object.assign(document.createElement('code'), { textContent: bit }) : bit));
						panel.append(paragraph);
					});
				});
				const copy = panel.firstElementChild;
				copy.addEventListener('click', async () => {
					copy.textContent = vn.i18n.t(await this.copyToClipboard(`Sastra ${APP_VERSION} · ${window.location.href}\n${navigator.userAgent}\n\n${message}`) ? 'endScreen.copied' : 'endScreen.copyFailed');
					setTimeout(() => { copy.textContent = vn.i18n.t('errors.copy'); }, TIMINGS.shareFeedback);
				});
			}

			/**
			 * A title that replaces one already showing fades the old text out first
			 * (scheduleTitleReveal). In instant mode, or when it appears behind the start gate,
			 * transitions are switched off for the first frame.
			 */
			showTitleScreen(scene, isStarting = false) {
				const vn = this.#vn;
				const titleScreen = vn.elements.titleScreen;
				const titleMain = vn.elements.titleMain;
				const titleSub = vn.elements.titleSub;

				vn.scene.cancelTitleReveal();

				const renderContent = () => {
					this.#applyDim(titleScreen, scene);
					titleMain.innerHTML = '';
					titleSub.innerHTML = '';

					const hasMainContent = Boolean(scene.image || scene.title);

					if (scene.image) {
						const img = document.createElement('img');
						img.src = vn.getImageSrc(scene.image);
						img.alt = htmlToText(scene.title) || vn.i18n.t('alt.titleImage');
						img.className = 'title-image';
						titleMain.appendChild(img);
						titleMain.style.display = 'block';
					} else if (scene.title) {
						titleMain.innerHTML = newlinesToBreaks(scene.title);
						titleMain.style.display = 'block';
					} else {
						titleMain.style.display = 'none';
					}

					if (scene.subtitle) {
						titleSub.innerHTML = newlinesToBreaks(scene.subtitle);
						titleSub.style.display = 'block';
						titleMain.style.marginBottom = hasMainContent ? '20px' : '0';
					} else {
						titleSub.style.display = 'none';
						titleMain.style.marginBottom = '0';
					}
				};

				const activate = () => {
					titleMain.style.opacity = '1';
					titleSub.style.opacity = '1';
					enableGpuAccel(titleScreen);
					titleScreen.classList.add('active');
				};

				const isStartGateActive = vn.elements.startGate.classList.contains('active');

				if (vn.scene.instant || (isStarting && isStartGateActive)) {
					titleScreen.style.transition = 'none';
					titleMain.style.transition = 'none';
					titleSub.style.transition = 'none';

					renderContent();
					activate();

					forceNextFrame(() => {
						titleScreen.style.transition = '';
						titleMain.style.transition = '';
						titleSub.style.transition = '';
					});

				} else if (titleScreen.classList.contains('active')) {
					titleMain.style.opacity = '0';
					titleSub.style.opacity = '0';
					vn.scene.scheduleTitleReveal(() => { renderContent(); forceNextFrame(activate); });
				} else {
					renderContent();
					forceNextFrame(activate);
				}

				announce(vn.elements.sr.title, [scene.title, scene.subtitle].filter(Boolean).map(htmlToText).join('. '));

				vn.log.add(scene);
			}

			showImage(scene) {
				const vn = this.#vn;
				vn.elements.displayImage.src = vn.getImageSrc(scene.asset);
				vn.scene.activateLayer(vn.elements.imageScreen);

				vn.log.add(scene);
			}

			/**
			 * The Clipboard API where it exists, otherwise the older execCommand route.
			 */
			async copyToClipboard(text) {
				try {
					if (navigator.clipboard?.writeText) {
						await navigator.clipboard.writeText(text);
						return true;
					}
					const textArea = document.createElement('textarea');
					textArea.value = text;
					document.body.appendChild(textArea);
					textArea.select();
					const ok = document.execCommand('copy');
					document.body.removeChild(textArea);
					return ok;
				} catch (err) {
					console.error('Failed to copy to clipboard:', err);
					return false;
				}
			}

			async shareStory(button = null) {
				const vn = this.#vn;
				const success = await this.copyToClipboard(vn.i18n.t('share.text', { chapter: stripHtml(vn.currentChapter), url: window.location.href }));
				emit('action_share', { result: success ? 'copied' : 'failed' });
				if (button) this.flashShareButton(button, success);
				return success;
			}

			/**
			 * Briefly turns the share button into "Copied" or "Couldn't copy", animating its
			 * width between the two labels so it doesn't jump.
			 */
			flashShareButton(button, success) {
				if (button.dataset.flashing) return;
				button.dataset.flashing = '1';

				const span = button.querySelector('span');
				const icon = button.querySelector('.icon');
				const originalText = span.textContent;
				const originalIcon = icon.dataset.icon;
				const feedbackText = this.#vn.i18n.t(success ? 'endScreen.copied' : 'endScreen.copyFailed');

				const startWidth = button.offsetWidth;
				span.textContent = feedbackText;
				const endWidth = button.offsetWidth;
				span.textContent = originalText;

				button.style.width = `${startWidth}px`;
				void button.offsetWidth;
				button.classList.add(success ? 'copied' : 'copy-failed');
				icon.dataset.icon = success ? 'check' : 'close';
				span.textContent = feedbackText;
				button.style.width = `${endWidth}px`;

				setTimeout(() => {
					span.textContent = originalText;
					icon.dataset.icon = originalIcon;
					button.classList.remove('copied', 'copy-failed');
					button.style.width = `${startWidth}px`;
					setTimeout(() => {
						button.style.width = '';
						delete button.dataset.flashing;
					}, TIMINGS.shareWidth);
				}, TIMINGS.shareFeedback);
			}

			getNextChapter() {
				const vn = this.#vn;
				const chapters = vn.gameMeta?.chapters || [];
				const index = chapters.findIndex(chapter => chapter.file === vn.chapterFile);
				return (index === -1 || index + 1 >= chapters.length) ? null : chapters[index + 1];
			}

			/**
			 * The primary action is Next chapter when there is one, else Back to menu. The
			 * secondary row holds credits (when the end scene has them), share and Back to
			 * menu.
			 */
			renderEndActions(scene) {
				const vn = this.#vn;
				const next = this.getNextChapter();

				const button = ({ action, icon, labelKey, classes, chapter = null }) => uiButton(`data-action="${action}"${chapter ? ` data-chapter="${chapter}"` : ''}`, icon, vn.i18n.t(labelKey), classes);

				const primary = next
					? button({ action: 'next-chapter', icon: 'next-chapter', labelKey: 'endScreen.nextChapter', classes: 'icon-end', chapter: next.file })
					: button({ action: 'menu', icon: 'home', labelKey: 'endScreen.backToMenu' });

				const secondary = [
					hasAsset(scene.credits) ? button({ action: 'credits-open', icon: 'credits', labelKey: 'endScreen.credits', classes: 'secondary' }) : '',
					button({ action: 'share', icon: 'share', labelKey: 'endScreen.share', classes: 'secondary' }),
					next ? button({ action: 'menu', icon: 'home', labelKey: 'endScreen.backToMenu', classes: 'secondary' }) : ''
				].join('');

				vn.elements.endActions.innerHTML = `<div class="end-actions-row">${secondary}</div>${primary}`;
				vn.plugins.fill('end', vn.elements.endActions.querySelector('.end-actions-row'));
			}

			/**
			 * Fills the end screen, reports the completed chapter and mounts plugin UI.
			 */
			showEndScreen(scene) {
				const vn = this.#vn;
				const endMain = vn.elements.endMain;
				const endSub = vn.elements.endSub;
				const titleText = scene.title || vn.i18n.t('endScreen.theEnd');

				this.#applyDim(vn.elements.endScreen, scene);

				endMain.innerHTML = '';
				if (scene.image) {
					const img = document.createElement('img');
					img.src = vn.getImageSrc(scene.image);
					img.alt = scene.title || vn.i18n.t('endScreen.theEnd');
					img.className = 'title-image';
					endMain.appendChild(img);
				} else {
					endMain.innerHTML = newlinesToBreaks(titleText);
				}

				if (scene.subtitle) {
					endSub.innerHTML = newlinesToBreaks(scene.subtitle);
					endSub.style.display = 'block';
					endMain.style.marginBottom = '20px';
				} else {
					endSub.innerHTML = '';
					endSub.style.display = 'none';
					endMain.style.marginBottom = '40px';
				}

				announce(vn.elements.sr.end, [titleText, scene.subtitle].filter(Boolean).map(htmlToText).join('. '));

				emit('chapter_completed', { chapter_id: vn.chapterFile });
				this.renderEndActions(scene);
				const next = this.getNextChapter();
				vn.plugins.mount('end', vn.elements.endScreen, {
					title: titleText,
					subtitle: scene.subtitle || '',
					image: scene.image ? vn.getImageSrc(scene.image) : '',
					hasCredits: hasAsset(scene.credits),
					next: next ? { file: next.file, name: next.name } : null,
					playNext: () => { if (next) vn.enterChapter(next.file); },
					menu: () => vn.input.runAction('menu'),
					openCredits: () => this.openModal('credits'),
					share: () => this.shareStory()
				});
				vn.scene.activateLayer(vn.elements.endScreen);
				vn.plugins.emit('end', { element: vn.elements.endActions });
			}
		}

		// A setting can sit at the top level of config.yaml or under `settings:`. The top
		// level wins.
		const booleanSetting = (meta, key, fallback) => {
			if (typeof meta[key] === 'boolean') return meta[key];
			if (meta.settings && typeof meta.settings[key] === 'boolean') return meta.settings[key];
			return fallback;
		};

		const numberSetting = (meta, key, fallback) => {
			const raw = typeof meta[key] === 'number' ? meta[key]
				: (meta.settings && typeof meta.settings[key] === 'number' ? meta.settings[key] : null);
			return raw === null ? fallback : raw;
		};

		/**
		 * Loads config.yaml and turns it into the game's settings and look. The order
		 * matters: parse the file, resolve the language, merge the defaults, load the
		 * interface strings, apply theme and settings, then announce `sastra:ready`.
		 */
		class ConfigManager {
			#vn;

			constructor(vn) { this.#vn = vn; }

			/**
			 * Throws a `config` sastraError when the file is missing or isn't a mapping. Merge
			 * order, later wins: DEFAULT_GAME_META, then the language-resolved config; `settings`
			 * merges key by key. `sastra:ready` goes out as a DOM event once everything is
			 * applied.
			 */
			async load() {
				const vn = this.#vn;
				const config = await loadYaml('config', 'config');
				if (!config) throw sastraError('Could not find `config.yaml` (or `config.yml`) next to `index.html`. Every game needs one: it lists the chapters and the game\'s settings.', 'config');
				if (!isPlainObject(config.data)) throw sastraError(`\`${config.path}\` must be a list of settings, like \`title: My Game\`.`, 'config');
				const rawConfig = config.data;

				vn.languageManager = new LanguageManager(rawConfig);
				vn.activeLanguage = vn.languageManager.resolveActive(vn.save.getLanguage());
				const localizedMeta = vn.languageManager.getMergedMeta(vn.activeLanguage);

				vn.gameMeta = {
					...DEFAULT_GAME_META,
					...localizedMeta,
					settings: {
						...DEFAULT_GAME_META.settings,
						...(localizedMeta.settings || {})
					}
				};

				await vn.i18n.load(vn.activeLanguage);
				if (vn.activeLanguage) {
					document.documentElement.lang = vn.activeLanguage;
				}
				vn.i18n.translateDom(document);

				this.apply(vn.gameMeta);
				document.dispatchEvent(new CustomEvent('sastra:ready', { detail: { meta: vn.gameMeta } }));
				return vn.gameMeta;
			}

			/**
			 * Applies a resolved config: title, theme, game settings, favicon. The inline style
			 * the theme writes to <html> is also cached in localStorage, so the next visit can
			 * paint with the right colours before any of this runs.
			 */
			apply(meta = {}) {
				document.title = stripHtml(meta.title) || DEFAULT_GAME_META.title;
				this.#applyTheme(meta.theme || {});
				this.#vn.save.setTheme(document.documentElement.getAttribute('style') || '');
				this.#vn.applyGameSettings(meta);

				if (meta.favicon) {
					this.#setFavicon(meta.favicon);
				}
			}

			/**
			 * Replaces the theme: the inline style on <html> is cleared and only variables with a
			 * value are set, so anything left blank keeps its CSS default. A value that names
			 * another key of the same section (`dialogue: body`) takes that key's value. Font
			 * lists get family names quoted, generic families left alone, and sans-serif is
			 * appended unless the list already ends in a generic one. The text colour on the
			 * accent is computed from the accent, and the theme-color meta follows the page
			 * background.
			 */
			#applyTheme(theme = {}) {
				const root = document.documentElement;
				root.removeAttribute('style');

				const resolveVariables = (section) => {
					const resolved = { ...section };
					for (const [key, value] of Object.entries(resolved)) {
						if (Object.hasOwn(resolved, value)) resolved[key] = resolved[value];
					}
					return resolved;
				};

				const formatFontFamily = (fontString) => {
					const fonts = String(fontString).split(',').map(f => f.replace(/['"]/g, '').trim()).filter(Boolean)
						.map(f => GENERIC_FONT_FAMILIES.has(f.toLowerCase()) ? f.toLowerCase() : `"${f}"`);
					if (!GENERIC_FONT_FAMILIES.has(fonts.at(-1))) fonts.push('sans-serif');
					return fonts.join(', ');
				};

				const hasValue = (v) => v !== undefined && v !== null && String(v).trim() !== '';

				const fonts = resolveVariables(theme.fonts || {});
				const colors = resolveVariables(theme.colors || {});

				this.#installFontFaces(theme.customFonts || {});

				Object.entries(CSS_THEME_VARS.fonts).forEach(([key, cssVar]) => {
					if (hasValue(fonts[key])) root.style.setProperty(cssVar, formatFontFamily(fonts[key]));
				});

				Object.entries(CSS_THEME_VARS.colors).forEach(([key, cssVar]) => {
					if (hasValue(colors[key])) root.style.setProperty(cssVar, colors[key]);
				});

				// Any other key is a colour a skin defines: `mint` sets --color-mint.
				const builtInColors = Object.keys(CSS_THEME_VARS.colors);
				Object.entries(colors).forEach(([key, value]) => {
					if (!builtInColors.includes(key) && /^[a-zA-Z][a-zA-Z0-9]*$/.test(key) && hasValue(value)) {
						root.style.setProperty(`--color-${key.replace(/[A-Z]/g, letter => `-${letter.toLowerCase()}`)}`, value);
					}
				});

				if (hasValue(colors.pageBackground)) {
					document.querySelector('meta[name="theme-color"]')?.setAttribute('content', colors.pageBackground);
				}
				if (hasValue(colors.accent)) root.style.setProperty('--color-on-accent', onAccent(colors.accent));
			}

			/**
			 * Registers custom fonts. A stylesheet (Google Fonts or a .css file) becomes a
			 * <link>; anything else a generated @font-face covering weights 400-700. Fonts from
			 * a previous call are removed first, so changing language re-applies cleanly.
			 */
			#installFontFaces(customFonts = {}) {
				document.querySelectorAll('[data-sastra-font]').forEach(node => node.remove());

				if (!customFonts || Object.keys(customFonts).length === 0) return;

				const isStylesheet = (url) => /fonts\.googleapis\.com/i.test(url) || /\.css(\?|#|$)/i.test(url);
				const getFontFormat = (url) => {
					const ext = url.split('.').pop().toLowerCase();
					const formats = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' };
					return formats[ext] ? ` format("${formats[ext]}")` : '';
				};

				const faceRules = [];
				for (const [familyName, fontUrl] of Object.entries(customFonts)) {
					if (!hasAsset(fontUrl)) continue;
					if (isStylesheet(fontUrl)) {
						const link = document.createElement('link');
						link.rel = 'stylesheet';
						link.href = fontUrl;
						link.dataset.sastraFont = '';
						document.head.appendChild(link);
					} else {
						faceRules.push(`@font-face {
							font-family: "${familyName}";
							src: url("${fontUrl}")${getFontFormat(fontUrl)};
							font-weight: 400 700;
							font-style: normal;
							font-display: swap;
						}`);
					}
				}

				if (faceRules.length) {
					const style = document.createElement('style');
					style.dataset.sastraFont = '';
					style.textContent = faceRules.join('\n');
					document.head.appendChild(style);
				}
			}

			#setFavicon(url) {
				let link = document.querySelector('link[rel="icon"]');
				if (!link) {
					link = document.createElement('link');
					link.rel = 'icon';
					document.head.appendChild(link);
				}
				link.href = url;
			}
		}

		/**
		 * The dialogue log. Scenes add entries as they are shown, and a scene with `log: false`
		 * adds none. The DOM is built lazily when the log opens, and only for entries not
		 * rendered yet. After a jump the log is rebuilt from the script up to the target
		 * index, since the scenes in between were never shown this session. Each scene type
		 * reduces to entries: a spoken line, narration, a title, or an image (not a
		 * full-screen one).
		 */
		class LogManager {
			#vn;
			#entries = [];
			#renderedCount = 0;

			constructor(vn) { this.#vn = vn; }

			/**
			 * One spoken line. The avatar is dropped when the character has hideAvatarInLog.
			 */
			static #line = (line) => ({ type: 'dialogue', characterId: line.characterId, name: line.name, color: line.color, avatar: line.hideAvatarInLog ? '' : line.avatar, text: line.text });

			static #entriesOf(scene, lines) {
				switch (scene.type) {
					case 'single': return [LogManager.#line(scene)];
					case 'multi': return scene.characters.map(LogManager.#line);
					case 'conversation': return (lines ?? scene.dialogue).map(LogManager.#line);
					case 'narration': return [{ type: 'narration', text: scene.text }];
					case 'title': return [{ type: 'title', title: scene.title || '', subtitle: scene.subtitle || '', image: scene.image }];
					case 'image': return scene.fullscreen ? [] : [{ type: 'image', asset: scene.asset, caption: scene.caption || '' }];
					default: return [];
				}
			}

			add(scene, lines) {
				if (scene.log !== false) this.#entries.push(...LogManager.#entriesOf(scene, lines));
			}

			reset() {
				this.#entries = [];
				this.resetRender();
			}

			resetRender() {
				this.#vn.elements.logBody.innerHTML = '';
				this.#renderedCount = 0;
			}

			/**
			 * Appends only the entries not yet rendered, then scrolls to the end. If there are
			 * fewer entries than were rendered (after a reset) it starts over.
			 */
			populate() {
				if (this.#renderedCount > this.#entries.length) this.resetRender();

				if (this.#renderedCount === this.#entries.length) {
					this.#scrollToBottom();
					return;
				}

				const frag = document.createDocumentFragment();
				for (let i = this.#renderedCount; i < this.#entries.length; i++) {
					const node = LogManager.#buildNode(this.#entries[i]);
					if (node) frag.appendChild(node);
				}
				this.#renderedCount = this.#entries.length;
				this.#vn.elements.logBody.appendChild(frag);

				this.#scrollToBottom();
			}

			/**
			 * Used after a jump: re-adds every scene up to the target as if it had been read.
			 */
			rebuild(targetIndex) {
				this.#entries = [];
				this.resetRender();

				this.#vn.script.slice(0, targetIndex + 1).forEach(scene => scene && this.add(scene));
			}

			#scrollToBottom() {
				const logBody = this.#vn.elements.logBody;
				logBody.scrollTop = logBody.scrollHeight;
			}

			/**
			 * Clones one of the <template> elements in the markup (logTplDialogue and the
			 * others) and fills it in.
			 */
			static #buildNode(entry) {
				const clone = (id) => document.getElementById(id).content.firstElementChild.cloneNode(true);
				let node;

				switch (entry.type) {
					case 'dialogue': {
						node = clone('logTplDialogue');
						const avatar = node.querySelector('.log-avatar');
						if (hasAsset(entry.avatar)) {
							avatar.src = entry.avatar;
							avatar.alt = entry.name || '';
						} else {
							avatar.remove();
						}
						node.dataset.speaker = entry.characterId;
						const nameEl = node.querySelector('.character-name');
						nameEl.innerHTML = entry.name || '';
						nameEl.style.color = entry.color || 'var(--color-accent)';
						node.querySelector('.text').innerHTML = newlinesToBreaks(entry.text);
						break;
					}

					case 'narration': {
						node = clone('logTplNarration');
						node.querySelector('.text').innerHTML = newlinesToBreaks(entry.text);
						break;
					}

					case 'title': {
						node = clone('logTplTitle');
						const hasTitle = entry.title && entry.title.trim() !== '';
						const hasSubtitle = entry.subtitle && entry.subtitle.trim() !== '';
						const isImageOnly = entry.image && !hasTitle && !hasSubtitle;
						const img = node.querySelector('.title-image');
						const nameEl = node.querySelector('.title-name');
						const subEl = node.querySelector('.title-subtitle');

						if (entry.image) {
							img.src = entry.image;
							if (isImageOnly) {
								node.classList.add('only-image');
								img.classList.add('centered');
							}
						} else {
							img.remove();
						}

						if (hasTitle) nameEl.innerHTML = newlinesToBreaks(entry.title); else nameEl.remove();
						if (hasSubtitle) subEl.innerHTML = newlinesToBreaks(entry.subtitle); else subEl.remove();
						break;
					}

					case 'image': {
						node = clone('logTplImage');
						node.querySelector('.log-image').src = entry.asset;
						const caption = node.querySelector('.text');
						if (entry.caption) caption.innerHTML = newlinesToBreaks(entry.caption); else caption.remove();
						break;
					}

					default:
						return null;
				}

				return node;
			}
		}

		/**
		 * Sprites on the sprite stage, keyed by id. Showing an id that already exists updates
		 * that sprite (move, resize, swap the image) instead of adding another; `replace`
		 * does the same without a fade. Hiding fades out and removes the element after
		 * spriteFade; showing the id again cancels that pending removal.
		 */
		class SpriteManager {
			#vn;
			#sprites = new Map();

			constructor(vn) { this.#vn = vn; }

			/**
			 * A `sprites` scene carries several commands, a `sprite` scene one.
			 */
			applyScene(scene) {
				if (scene.type === 'sprites') {
					(scene.sprites || []).forEach(sprite => this.applyCommand(sprite));
					return;
				}

				this.applyCommand(scene);
			}

			/**
			 * The action is whatever the command says, otherwise `show` when it has an asset
			 * and `hide` when it has none. `clear` hides everything. A command without an id is
			 * skipped with a console warning.
			 */
			applyCommand(command = {}) {
				const action = command.action || (hasAsset(command.asset) ? 'show' : 'hide');

				if (action === 'clear') {
					this.clear(command.fade);
					return;
				}

				const id = command.id;
				if (!id) {
					console.warn('Sprite command skipped because it has no id.', command);
					return;
				}

				if (action === 'hide') {
					this.#hide(id, command.fade);
					return;
				}

				if (action === 'replace') {
					this.#show({ ...command, fade: false, keepVisible: true });
					return;
				}

				this.#show(command);
			}

			clear(fade = true) {
				Array.from(this.#sprites.keys()).forEach(id => this.#hide(id, fade));
			}

			/**
			 * Creates the <img> on first use (it needs an asset), cancels a pending removal,
			 * swaps the image if the path changed, positions it, and fades it in on the next
			 * frame. A sprite that is already visible is not faded again.
			 */
			#show(command) {
				const vn = this.#vn;
				const id = command.id;
				const asset = command.asset;
				let sprite = this.#sprites.get(id);
				const isNew = !sprite;

				if (isNew && !hasAsset(asset)) {
					console.warn(`Sprite "${id}" skipped because it has no asset.`);
					return;
				}

				if (!sprite) {
					sprite = document.createElement('img');
					sprite.className = 'vn-sprite';
					sprite.alt = id;
					sprite.dataset.spriteId = id;
					vn.elements.spriteStage.appendChild(sprite);
					this.#sprites.set(id, sprite);
				}

				clearTimeout(sprite.hideTimer);

				if (asset && sprite.getAttribute('src') !== vn.getImageSrc(asset)) {
					sprite.src = vn.getImageSrc(asset);
				}

				this.#position(sprite, command, isNew);

				const shouldFade = command.fade !== false && !command.keepVisible;
				if (isNew || !sprite.classList.contains('active')) {
					if (shouldFade) {
						enableGpuAccel(sprite);
						forceNextFrame(() => sprite.classList.add('active'));
					} else {
						sprite.classList.add('active');
					}
				}
			}

			#hide(id, fade = true) {
				const sprite = this.#sprites.get(id);
				if (!sprite) return;

				const removeSprite = () => {
					sprite.src = '';
					sprite.remove();
					this.#sprites.delete(id);
				};

				clearTimeout(sprite.hideTimer);

				if (fade === false) {
					removeSprite();
					return;
				}

				enableGpuAccel(sprite);
				sprite.classList.remove('active');
				sprite.hideTimer = setTimeout(removeSprite, TIMINGS.spriteFade);
			}

			/**
			 * `pos` puts the anchor point on the stage, as percentages (--sprite-x, --sprite-y).
			 * `anchor` says which point of the sprite sits there (--sprite-anchor-x and -y: 0 is
			 * left or top, 100 right or bottom), so the default 50/100 is bottom centre. An
			 * omitted axis keeps its value on an existing sprite and gets the default on a new
			 * one. `height` is in vh, `layer` is the z-index.
			 */
			#position(sprite, command, isNew) {
				SpriteManager.#applyAxes(sprite, command.pos, isNew, PLACEMENT_KEYWORDS.pos, '--sprite-x', '--sprite-y', '%');
				SpriteManager.#applyAxes(sprite, command.anchor, isNew, PLACEMENT_KEYWORDS.anchor, '--sprite-anchor-x', '--sprite-anchor-y', '');

				if (command.height != null) sprite.style.setProperty('--sprite-height', `${SpriteManager.#normalizeHeight(command.height)}vh`);
				else if (isNew) sprite.style.setProperty('--sprite-height', `${SpriteManager.#normalizeHeight()}vh`);

				if (command.layer != null) {
					const layer = Number(command.layer);
					sprite.style.zIndex = Number.isFinite(layer) ? String(layer) : '';
				} else if (isNew) {
					sprite.style.zIndex = '';
				}
			}

			/**
			 * Writes one pair of axes. A new sprite starts at 50 and 100.
			 */
			static #applyAxes(sprite, value, isNew, keywords, xProp, yProp, suffix) {
				const placement = value != null ? resolvePlacement(value, keywords) : null;
				const x = placement ? placement.x : null;
				const y = placement ? placement.y : null;
				if (x != null) sprite.style.setProperty(xProp, `${x}${suffix}`);
				else if (isNew) sprite.style.setProperty(xProp, `50${suffix}`);
				if (y != null) sprite.style.setProperty(yProp, `${y}${suffix}`);
				else if (isNew) sprite.style.setProperty(yProp, `100${suffix}`);
			}

			/**
			 * Accepts 80, '80' or '80%'. Clamped to 1-100.
			 */
			static #normalizeHeight(value, fallback = 90) {
				if (typeof value === 'string') {
					value = value.trim().endsWith('%') ? parseFloat(value) : Number(value);
				}

				const parsed = Number(value);
				return Number.isFinite(parsed) ? clamp(parsed, 1, 100) : fallback;
			}
		}

		/**
		 * Backgrounds and full-screen media.
		 *
		 * Two background layers crossfade. fadeBackground() fills the idle one, waits until
		 * its media is ready (an image loaded, or a video's first frame), then fades it in
		 * over the old one and clears the old one afterwards. A safety timer starts the
		 * fade anyway if the media never reports ready, and a fade id cancels a pending
		 * start when another change arrives first. `fade: false` cuts instead.
		 *
		 * Full-screen image and video scenes use a second pair of layers the same way.
		 * Videos without `fullscreen` use the video screen layer.
		 *
		 * Same-origin videos play through the audio graph, so master volume and fades apply
		 * to them; cross-origin ones can't be routed (CORS) and use element.volume.
		 */
		class StageManager {
			#vn;
			#bg1;
			#bg2;
			#currentLayer;
			#fadeId = 0;
			#cleanupTimer = null;
			#fs1;
			#fs2;
			#fsCurrent;
			#fsVideo = null;
			#fsFadeTimer = null;

			constructor(vn) {
				this.#vn = vn;
				this.#bg1 = document.getElementById('bgLayer1');
				this.#bg2 = document.getElementById('bgLayer2');
				this.#currentLayer = this.#bg1;
				this.#fs1 = document.getElementById('fsLayer1');
				this.#fs2 = document.getElementById('fsLayer2');
				this.#fsCurrent = this.#fs1;
			}

			#videoVolume(scene) {
				return clamp(scene.volume !== undefined ? Number(scene.volume) : 1, 0, 1);
			}

			/**
			 * Builds a <video>: looping unless `loop: false`, inline (needed on iOS), without
			 * remote playback. `silent` starts it at volume 0, which the incoming layer uses
			 * until its crossfade begins. The stall watcher is only attached to blob: sources.
			 */
			#createVideo(scene, silent = false, src = this.#vn.getImageSrc(scene.asset)) {
				const video = document.createElement('video');
				video.src = src;
				video.autoplay = true;
				video.muted = false;
				video.loop = scene.loop !== false;
				video.playsInline = true;
				video.preload = 'auto';
				video.disableRemotePlayback = true;
				video.style.objectPosition = scene.position || '';
				const target = silent ? 0 : this.#videoVolume(scene);
				if (this.#routeVideo(video)) this.#vn.audio.fadeGain(video._gain, target, 0);
				else video.volume = target;
				if (src.startsWith('blob:')) video.addEventListener('waiting', () => this.#rescueStall(video, scene));
				return video;
			}

			/**
			 * Works around a Firefox for Android bug where a video playing from a blob: copy
			 * can freeze for about 15 seconds after a sound blob is released. When a video
			 * reports `waiting` and hasn't moved after videoStall ms, a second element is built
			 * from the original file URL, seeked to the same time and swapped in, and the frozen
			 * one is destroyed. That turns the freeze into a short hold. One attempt per video.
			 */
			#rescueStall(video, scene) {
				const time = video.currentTime;
				setTimeout(() => {
					if (video._rescued || !video.isConnected || video.paused || video.ended || video.currentTime - time > .1) return;
					video._rescued = true;
					const fresh = this.#createVideo(scene, true, scene.asset);
					fresh.autoplay = false;
					fresh.addEventListener('loadedmetadata', () => { fresh.currentTime = time; }, { once: true });
					fresh.addEventListener('error', () => this.#destroyVideo(fresh), { once: true });
					fresh.addEventListener('seeked', () => {
						if (!video.isConnected) return this.#destroyVideo(fresh);
						const playing = !video.paused;
						const level = video._gain ? video._gain.gain.value : video.volume;
						if (fresh._gain) this.#vn.audio.fadeGain(fresh._gain, level, 0);
						else fresh.volume = level;
						video.replaceWith(fresh);
						if (playing) fresh.play().catch(() => {});
						if (this.#fsVideo === video) this.#fsVideo = fresh;
						this.#destroyVideo(video);
					}, { once: true });
				}, TIMINGS.videoStall);
			}

			/**
			 * Puts the scene's media into a layer: a video as a <video> element, anything else
			 * as a background image focused on the scene's `position`.
			 */
			#fillLayer(layer, scene, silent = false) {
				if (scene.type === 'video' || scene.mediaType === 'video') {
					layer.classList.add('video-bg');
					const video = this.#createVideo(scene, silent);
					layer.appendChild(video);
					video.play().catch(() => {});
					return video;
				}
				layer.style.backgroundImage = `url('${this.#vn.getImageSrc(scene.asset)}')`;
				layer.style.backgroundPosition = scene.position || '';
				return null;
			}

			/**
			 * Returns a layer to idle: video torn down, content removed, classes and inline
			 * styles cleared, opacity 0 with transitions off so the next fill doesn't animate.
			 */
			#hideLayer(layer) {
				this.#destroyVideo(layer.querySelector('video'));
				layer.innerHTML = '';
				layer.classList.remove('visible', 'video-bg', 'fs-front');
				layer.classList.add('hidden');
				layer.style.backgroundImage = '';
				layer.style.zIndex = '';
				layer.style.transition = 'none';
				layer.style.opacity = '0';
			}

			/**
			 * Replaces the background with no fade, for restoring state (jumps, skipping,
			 * instant mode). Always uses the first layer and cancels any fade in progress.
			 */
			setBackgroundInstant(scene) {
				const layer = this.#bg1;
				this.#fadeId++;
				clearTimeout(this.#cleanupTimer);
				this.#hideLayer(this.#bg2);
				this.#hideLayer(layer);
				layer.style.opacity = '1';
				layer.classList.replace('hidden', 'visible');
				this.#fillLayer(layer, scene);
				this.#currentLayer = layer;
			}

			fadeBackground(scene) {
				const currentLayer = this.#currentLayer;
				const nextLayer = currentLayer === this.#bg1 ? this.#bg2 : this.#bg1;
				clearTimeout(this.#cleanupTimer);
				this.#hideLayer(nextLayer);
				const fadeId = ++this.#fadeId;
				const start = () => {
					if (this.#fadeId !== fadeId) return;
					this.#fadeId++;
					this.#performCrossfade(nextLayer, currentLayer, scene);
				};
				setTimeout(start, TIMINGS.bgReadySafety);
				const video = this.#fillLayer(nextLayer, scene, true);
				if (video) {
					video.addEventListener('loadeddata', () => setTimeout(start, TIMINGS.videoReadySettle), { once: true });
					video.addEventListener('error', start, { once: true });
				} else {
					const img = new Image();
					img.onload = img.onerror = start;
					img.src = this.#vn.getImageSrc(scene.asset);
				}
			}

			/**
			 * Raises the new layer (z-index -1) over the old one (-2), switches the classes and
			 * forces a reflow so the opacity transition starts from 0. Video audio crossfades
			 * too. The old layer is cleared when the transition ends, at once for a cut.
			 */
			#performCrossfade(nextLayer, currentLayer, scene) {
				const cut = scene.fade === false;
				const currentVideo = currentLayer.querySelector('video');
				if (currentVideo) this.#fadeVolume(currentVideo, currentVideo.volume, 0, cut ? 0 : TIMINGS.videoFadeOut);
				const video = nextLayer.querySelector('video');
				if (video) this.#fadeVolume(video, 0, this.#videoVolume(scene), cut ? 0 : TIMINGS.videoFadeIn);

				currentLayer.style.zIndex = '-2';
				nextLayer.style.zIndex = '-1';
				nextLayer.classList.replace('hidden', 'visible');
				void nextLayer.offsetWidth;
				this.#currentLayer = nextLayer;

				if (cut) nextLayer.style.opacity = '1';
				else requestAnimationFrame(() => {
					enableGpuAccel(nextLayer);
					nextLayer.style.transition = 'opacity 1s ease-in-out';
					nextLayer.style.opacity = '1';
				});
				this.#cleanupTimer = setTimeout(() => {
					this.#hideLayer(currentLayer);
					nextLayer.style.transition = 'none';
				}, cut ? 0 : TIMINGS.bgCrossfade);
			}

			/**
			 * Routes a same-origin video's audio through the audio graph. Cross-origin media
			 * can't be, so it keeps plain element.volume.
			 */
			#routeVideo(video) {
				if (!isSameOrigin(video.src)) return false;
				const gain = this.#vn.audio.attachElement(video);
				if (!gain) return false;
				video._gain = gain;
				video.volume = 1;
				return true;
			}

			/**
			 * Fades a video's volume: a gain ramp when it is routed through the graph,
			 * otherwise a requestAnimationFrame loop on element.volume.
			 */
			#fadeVolume(videoElement, startVolume, endVolume, duration = 1000) {
				if (!videoElement) return;

				if (videoElement._gain) {
					this.#vn.audio.fadeGain(videoElement._gain, clamp(Number(endVolume), 0, 1), duration);
					return;
				}

				if (videoElement.fadeRAF) {
					cancelAnimationFrame(videoElement.fadeRAF);
					videoElement.fadeRAF = null;
				}

				const from = clamp(Number(startVolume), 0, 1);
				const to = clamp(Number(endVolume), 0, 1);
				videoElement.volume = duration > 0 ? from : to;
				if (duration <= 0) return;

				const startTime = performance.now();
				const step = (now) => {
