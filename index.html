<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="app-version" content="1.0.0">
    <meta name="app-version-label" content="Version 1.0.0">

	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Sastra VN">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#FF006E">
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">

    <title>Sastra™</title>
	<script defer src="sastra-analytics.js"></script>

	<style>
		:root {
			--font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-dialogue: var(--font-body);
			--font-character-name: var(--font-body);
			--font-ui: var(--font-body);
			--font-title: var(--font-body);
			--color-page-bg: #1a1a1a;
			--color-text: #fff;
			--color-muted-text: #ccc;
			--color-accent: #4a9eff;
			--color-accent-hover: #357abd;
			--color-dialogue-bg: rgba(0,0,0,.7);
			--color-panel-bg: #1a1a1a;
			--color-modal-bg: rgba(0,0,0,.8);
			--color-control-bg: rgba(0,0,0,.8);
			--color-button-bg: rgba(74,158,255,.8);
			--color-button-hover-bg: #4a9eff;
			--color-toolbar-hover-bg: rgba(74,158,255,.2);
			--color-menu-button-bg: rgba(0,0,0,.5);
			--color-menu-button-hover-bg: rgba(0,0,0,.7);
			--color-log-dialogue: var(--color-accent);
			--color-log-narration: var(--color-text);
			--color-log-title: #ff6b6b;
			--color-log-image: #4ecdc4;
			--color-success: rgba(34,197,94,.9);
			--color-error: rgba(239,68,68,.9);
			--dialogue-position-top: 70px;
			--dialogue-position-bottom: 70px;

			--z-blank: 10;
			--z-sprite-stage: 5;
			--z-scene: 20;
			--z-image: 30;
			--z-fullscreen: 40;
			--z-screen: 50;
			--z-chapter-info: 100;
			--z-top-controls: 150;
			--z-loading: 1000;
			--z-chapter-select: 1000;
			--z-modal: 2000;
			--z-start-gate: 2500;
			--z-pause: 2600;
			--z-toast: 3000;
			--z-overlay: 3000;
			--z-loading-error: 4000;
			--z-file-error: 5000;
		}

        @keyframes spin {
			0% {
				transform: rotate(0deg)
			}

			to {
				transform: rotate(360deg)
			}
		}

		@keyframes fadeIn {
			to {
				opacity: 1
			}
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box
		}

		body {
			font-family: var(--font-body);
			background: #000;
			color: var(--color-text);
			overflow: hidden;
		}

		.game-container {
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden
		}

		.background-layer,.overlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%
		}

		.background-layer {
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			opacity: 0;
			z-index: -1;
			transition: opacity 1s ease-in-out;
			pointer-events: none;
		}

		.gpu-accelerate {
			will-change: opacity, transform;
		}

		.fs-layer {
			z-index: var(--z-fullscreen);
		}

		.fs-layer.fs-front {
			z-index: calc(var(--z-fullscreen) + 1);
		}

		.background-layer.visible {
			opacity: 1
		}

		.background-layer.hidden {
			opacity: 0
		}

		.background-layer.video-bg {
			background: transparent !important;
		}

		.background-layer.video-bg video {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
		}

		.background-layer.visible video {
			display: block;
		}

		.background-layer.hidden video {
			display: none;
		}

		.overlay {
			background: rgba(0,0,0,0);
			transition: opacity .5s ease
		}

		.sprite-stage {
			position: absolute;
			inset: 0;
			z-index: var(--z-sprite-stage);
			pointer-events: none;
			overflow: hidden;

			contain: strict;
		}

		.vn-sprite {
			position: absolute;
			top: var(--sprite-y, 100%);
			left: var(--sprite-x, 50%);
			height: min(var(--sprite-height, 90vh), 100vh);
			max-width: 100vw;
			object-fit: contain;
			object-position: bottom center;
			opacity: 0;
			transform: translate(calc(var(--sprite-anchor-x, 50) * -1%), calc(var(--sprite-anchor-y, 100) * -1%)) translateY(12px);
			filter: drop-shadow(0 18px 28px rgba(0,0,0,.35));
			transition: opacity .45s cubic-bezier(.25,.46,.45,.94), transform .45s cubic-bezier(.25,.46,.45,.94), filter .45s ease;
			user-select: none;
		}

		.vn-sprite.active {
			opacity: 1;
			transform: translate(calc(var(--sprite-anchor-x, 50) * -1%), calc(var(--sprite-anchor-y, 100) * -1%));
		}

		.scene-layer {
			position: absolute;
			z-index: var(--z-scene);
			opacity: 0;
			transition: opacity .5s cubic-bezier(.25,.46,.45,.94);
		}

		.scene-layer.active {
			opacity: 1;
		}

		.image-screen {
			z-index: var(--z-image);
		}

		.character-name,.conv-dialogue-box,.dialogue-content,.dialogue-text,.narration-text {
			user-select: text;
			cursor: text
		}

		.flex-center {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.centered-scene {
			inset: 0;
			width: max-content;
			height: max-content;
			margin: auto;
		}

		.dialogue-wrapper {
			display: flex;
			align-items: center;
		}

		.single-dialogue {
			gap: 40px
		}

		.single-dialogue--no-avatar {
			gap: 0;
		}

		.single-dialogue--no-avatar .avatar {
			display: none;
		}

		.dialogue-position-top {
			top: var(--dialogue-position-top);
			margin-block: 0 auto;
		}

		.dialogue-position-center {
			margin-block: auto;
		}

		.dialogue-position-bottom {
			bottom: var(--dialogue-position-bottom);
			margin-block: auto 0;
		}

		.avatar,.dialogue-content {
			border-radius: 20px;
			transition: all .3s ease
		}

		.avatar {
			flex: none;
			width: 150px;
			height: 150px;
			object-fit: cover
		}

		.dialogue-content {
			background: var(--color-dialogue-bg);
			padding: 30px;
			min-width: 400px;
			max-width: 600px;

			contain: layout paint;
		}

		.character-name {
			font-family: var(--font-character-name);
			font-size: 24px;
			font-weight: 700;
			color: var(--color-accent);
			margin-bottom: 12px
		}

		.dialogue-text {
			font-family: var(--font-dialogue);
			font-size: 20px;
			line-height: 1.6;
			min-height: 32px;
			word-wrap: break-word;
			white-space: pre-wrap
		}

		.multi-dialogue {
			display: flex;
			flex-direction: column;
			gap: 20px
		}

		.speaker-row {
			gap: 40px
		}

		.speaker-row--no-avatar {
			justify-content: center;
			gap: 0;
		}

		.narration-screen {
			background: var(--color-dialogue-bg);
			border-radius: 20px;
			padding: 40px;
			max-width: 50%;
			min-width: 400px;
			text-align: center;
			contain: layout paint;
		}

		.narration-text {
			font-family: var(--font-dialogue);
			font-size: 22px;
			line-height: 1.6;
			min-height: 35px;
			word-wrap: break-word;
			white-space: pre-wrap
		}

		.conv-dialogue {
			gap: 30px
		}

		.conv-dialogue--no-avatar {
			justify-content: center;
			gap: 0;
		}

		.conv-dialogue--speaker-no-avatar {
			justify-content: center;
			gap: 0;
		}

		.conv-dialogue--speaker-no-avatar .conv-avatar {
			display: none;
		}

		.conv-avatar {
			flex: none;
			width: 160px;
			height: 160px;
			border-radius: 25px;
			object-fit: cover;
			transition: opacity .5s ease, transform .5s ease
		}

		.conv-avatar.dimmed {
			opacity: .4;
			transform: scale(.9)
		}

		.conv-avatar.hidden-avatar {
			display: none;
		}

		.conv-dialogue-box {
			background: var(--color-dialogue-bg);
			border-radius: 20px;
			padding: 30px 34px;
			position: relative;
			max-width: 640px;
			min-width: 440px;
			min-height: 150px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			transition: all .3s ease;
			contain: layout;
		}

		.conv-dialogue-box::before {
			content: "";
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			left: -15px;
			width: 0;
			height: 0;
			border-style: solid;
			border-width: 10px 15px 10px 0;
			border-color: transparent var(--color-dialogue-bg) transparent transparent
		}

		.conv-dialogue-box--right::before {
			right: -15px;
			left: auto;
			border-width: 10px 0 10px 15px;
			border-color: transparent transparent transparent var(--color-dialogue-bg)
		}

		.conv-dialogue-box--no-avatar::before {
			display: none;
		}

		.image-screen,
		.video-screen {
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			transform: scale(.9);
			transition: all .8s cubic-bezier(.25,.46,.45,.94)
		}

		.image-screen.active,
		.video-screen.active {
			transform: scale(1)
		}

		.display-image,
		.video-screen video {
			max-width: 90%;
			max-height: 90%;
			border-radius: 10px;
			box-shadow: 0 10px 30px rgba(0,0,0,.5)
		}

		.video-screen video {
			background: #000
		}

		.blank-screen {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			opacity: 0;
			transition: opacity .5s ease;
			pointer-events: none;
			z-index: var(--z-blank);
		}

		.blank-screen.active {
			opacity: 1;
		}

		.screen-fade {
			position: fixed;
			inset: 0;
			background: #000;
			z-index: var(--z-start-gate);
			opacity: 0;
			pointer-events: none;
			transition: opacity .7s ease;
		}

		.screen-fade.active {
			opacity: 1;
		}

		.chapter-info {
			position: absolute;
			top: 20px;
			left: 20px;
			background: var(--color-control-bg);
			color: var(--color-text);
			padding: 0 20px;
			border-radius: 25px;
			font-family: var(--font-ui);
			font-size: 14px;
			font-weight: 700;
			z-index: var(--z-chapter-info);
			height: 44px;
			display: flex;
			align-items: center;
			justify-content: center;
			user-select: none;
			transition: all .3s ease;
		}

		.chapter-info.checkpoints-enabled {
			cursor: pointer;
		}

		.chapter-info.checkpoints-enabled:hover {
			background: var(--color-toolbar-hover-bg);
			transform: scale(1.05);
		}

		.loading {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: #000;
			z-index: var(--z-loading);
			transition: opacity .5s ease
		}

		.loading.hidden {
			opacity: 0;
			pointer-events: none
		}

		.error-overlay {
			position: fixed;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 28px;
		}

		.error-overlay.active {
			display: flex;
		}

		.error-overlay--network {
			background: #000;
			z-index: var(--z-loading-error);
		}

		.error-overlay--file {
			background: var(--color-page-bg);
			z-index: var(--z-file-error);
			font-family: var(--font-body);
		}

		.error-overlay__content {
			max-width: min(420px, 90vw);
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 14px;
		}

		.error-overlay__title {
			font-family: var(--font-title);
			font-size: clamp(1.6rem, 5vw, 2.2rem);
			font-weight: 700;
			color: var(--color-text);
		}

		.error-overlay__desc {
			color: var(--color-muted-text);
			font-size: 1.05rem;
			line-height: 1.5;
			margin-bottom: 10px;
		}

		.spinner {
			width: 40px;
			height: 40px;
			border: 4px solid rgba(255,255,255,.1);
			border-top: 4px solid var(--color-accent);
			border-radius: 50%;
			animation: spin 1s linear infinite
		}

		.error-overlay--file .error-overlay__title {
			color: var(--color-error);
		}

		.error-overlay--file code {
			font-family: monospace;
			color: var(--color-accent);
		}

		.fp-code {
			font-family: monospace;
			color: var(--color-accent);
			background: rgba(255,255,255,0.075);
			padding: 6px 14px;
			border-radius: 6px;
			font-size: .90rem;
			user-select: all;
			white-space: pre-wrap;
			word-break: break-word;
			max-width: 100%;
		}

		.fp-sub {
			color: var(--color-muted-text);
			font-size: .90rem;
			margin: 0;
		}

		.fp-divider {
			width: 100%;
			border: 0;
			border-top: 1px solid rgba(255, 255, 255, 0.25);
			margin: 12px 0;
		}

		.error-overlay--file .ui-button {
			margin-top: 24px;
			text-decoration: none;
		}

		.typewriter-char {
			opacity: 0;
			animation: fadeIn .2s ease-in-out forwards
		}

		.sr-only {
			position: absolute !important;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		.top-controls {
			position: absolute;
			top: 20px;
			right: 20px;
			display: flex;
			gap: 10px;
			z-index: var(--z-top-controls);
		}

		.modal-overlay {
			position: fixed;
			inset: 0;
			background: var(--color-modal-bg);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: var(--z-modal);
			opacity: 0;
			visibility: hidden;
			transition: all .3s ease;
			contain: layout paint;
		}

		.modal-overlay.active {
			opacity: 1;
			visibility: visible;
		}

		.modal-content {
			background: var(--color-panel-bg);
			border: 2px solid var(--color-accent);
			border-radius: 15px;
			display: flex;
			flex-direction: column;
			transform: scale(.8);
			transition: transform .3s ease;
		}

		.modal-overlay.active .modal-content {
			transform: scale(1);
		}

		.control-button {
			background: var(--color-control-bg);
			color: var(--color-text);
			border: 0;
			font-family: var(--font-ui);
			cursor: pointer;
			transition: all .3s ease;
		}

		.control-button:hover {
			background: var(--color-toolbar-hover-bg);
			transform: scale(1.05);
		}

		.control-button.circle {
			position: relative;
			width: 44px;
			height: 44px;
			padding: 10px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 16px;
		}

		.control-button.pill {
			padding: 10px 20px;
			border-radius: 25px;
			height: 44px;
			font-size: 14px;
		}

		.control-button.reset,
		.control-button.cookies,
		.control-button.language {
			width: 48px;
			height: 48px;
			background: rgba(0,0,0,.76);
			transition: background .25s ease, transform .25s ease;
		}

		.control-button.reset:hover {
			background: var(--color-error);
		}

		.control-button.cookies:hover,
		.control-button.language:hover {
			background: var(--color-accent);
		}

		.log-content {
			width: 80%;
			max-width: 800px;
			height: 70%;
		}

		.log-header,
		.credits-header {
			background: var(--color-accent);
			color: var(--color-text);
			padding: 15px 20px;
			border-radius: 13px 13px 0 0;
			display: flex;
			justify-content: space-between;
			align-items: center;
			font-size: 18px;
			font-weight: 700
		}

		.log-body,
		.credits-body {
			flex: 1;
			padding: 20px;
			overflow-y: auto;
			color: var(--color-text)
		}

		.log-body {
			transition: opacity .3s ease;
			contain: content
		}

		.credits-body {
			line-height: 1.6
		}

		.credits-body :is(h1,h2,h3,h4,h5,h6),
		.log-body :is(h1,h2,h3,h4,h5,h6) {
			margin: 1.2em 0 0
		}

		.credits-body :is(h1,h2,h3,h4,h5,h6):first-child,
		.credits-body :is(h1,h2,h3,h4,h5,h6) + :is(h1,h2,h3,h4,h5,h6),
		.log-body :is(h1,h2,h3,h4,h5,h6):first-child,
		.log-body :is(h1,h2,h3,h4,h5,h6) + :is(h1,h2,h3,h4,h5,h6) {
			margin-top: 0
		}

		.log-entry {
			margin-bottom: 15px;
			padding: 10px 15px;
			background: rgba(255,255,255,.05);
			border-radius: 8px;
			border-left: 3px solid var(--color-log-dialogue);
			opacity: 1;
			transform: translateY(20px);
			position: relative
		}

		.log-entry:nth-child(even) {
			background: rgba(255,255,255,.02)
		}

		.log-entry .character-name {
			font-weight: 700;
			margin-bottom: 5px;
			font-size: 16px
		}

		.log-entry .text {
			line-height: 1.5;
			font-size: 15px
		}

		.log-entry.narration {
			border-left-color: var(--color-log-narration);
			position: relative;
			top: auto;
			left: auto;
			transform: translateY(20px)
		}

		.log-entry.narration .text {
			text-align: left;
		}

		.log-entry.title,
		.log-entry.image {
			background: rgba(255, 255, 255, 0.1);
			padding: 15px;
			text-align: center;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: auto;
		}

		.log-entry.title {
			padding: 10px 15px;
			border-left-color: var(--color-log-title);
		}

		.log-entry.title.only-image {
			padding: 15px;
			min-height: 180px;
		}

		.log-entry.image {
			border-left-color: var(--color-log-image);
		}

<script>
		const forceNextFrame = (cb) => requestAnimationFrame(() => requestAnimationFrame(cb));

		const htmlToText = (html) => {
			if (html == null) return '';
			const tmp = document.createElement('div');
			tmp.innerHTML = String(html);
			return (tmp.textContent || '').replace(/\s+/g, ' ').trim();
		};
		const speechLine = (i18n, name, text) => {
			const body = htmlToText(text);
			const who = htmlToText(name);
			if (!who) return body;
			const line = i18n.t('a11y.dialogue', { name: who, text: body });
			return line === 'a11y.dialogue' ? `${who}: ${body}` : line;
		};
		const announce = (node, text) => { if (node) node.textContent = text || ''; };

		const APP_VERSION = document.querySelector('meta[name="app-version"]')?.content || '';
		const APP_VERSION_LABEL = document.querySelector('meta[name="app-version-label"]')?.content || '';
		window.SASTRA = { version: APP_VERSION, versionLabel: APP_VERSION_LABEL };

		const emit = (event, params) => document.dispatchEvent(new CustomEvent('sastra:analytics', { detail: { event, params: params || {} } }));

		const DEFAULT_GAME_META = {
			title: 'Sastra™',
			author: '',
			synopsis: '',
			logo: '',
			background: '',
			analytics_id: '',
			settings: {
				showLogButton: true,
				showTypewriterButton: true,
				showAutoplayButton: true,
				enableTypewriter: true,
				typewriterSpeed: 30,
				enableCheckpoints: true,
				allowHoldToSkip: false,
				enableKeyboardShortcuts: true
			}
		};

		const TYPEWRITER_STORAGE_KEY = `sastra:typewriter:${window.location.pathname}`;
		const VOLUME_STORAGE_KEY = `sastra:volume:${window.location.pathname}`;
		const CHECKPOINT_STORAGE_KEY = `sastra:checkpoints:${window.location.pathname}`;
		const LANGUAGE_STORAGE_KEY = `sastra:lang:${window.location.pathname}`;
		const AUTOPLAY_SPEED_STORAGE_KEY = `sastra:autoplaySpeed:${window.location.pathname}`;
		const AUTOPLAY_PROGRESS_STORAGE_KEY = `sastra:autoplayProgress:${window.location.pathname}`;

		const AUTOPLAY_SPEEDS = [
			{ id: 'verySlow', base: 1700, perChar: 75 },
			{ id: 'slow', base: 1200, perChar: 55 },
			{ id: 'normal', base: 700, perChar: 35 },
			{ id: 'fast', base: 450, perChar: 22 },
			{ id: 'veryFast', base: 250, perChar: 12 }
		];
		const AUTOPLAY_DEFAULT_SPEED = 2;
		const AUTOPLAY_MIN_DWELL = 600;
		const AUTOPLAY_MAX_DWELL = 30000;
		const AUTOPLAY_MEDIA_CHARS = 60;
		const AUTOPLAY_VIDEO_FALLBACK = 5000;
		const AUTOPLAY_SPEED_BUFFER = 1000;

		const TIMINGS = {
			sceneGap: 200,
			spriteFade: 460,
			titleCrossfade: 300,
			toastDuration: 3100,
			toastFade: 400,
			loadingHandoff: 500,
			logFadeIn: 100,
			startPanelFade: 400,
			bgCrossfade: 1000,
			chapterSelectIn: 100,
			gpuAccel: 1500,
			assetRetry: 1000,
			typewriterStep: 30,
			logScroll: 10,
			startPanelSafety: 80,
			audioStopBuffer: 60,
			shareFeedback: 2000,
			shareWidth: 300,
			screenFade: 700,
			videoReadySettle: 50,
			videoFadeOut: 900,
			videoFadeOutClear: 950,
			videoFadeIn: 700,
			videoSafety1: 3000,
			videoSafety2: 8000,
			videoFinalSafety: 12000
		};

		const clamp = (value, min, max) => (Number.isFinite(value) ? Math.min(max, Math.max(min, value)) : min);

		const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

		const hasAsset = (value) => typeof value === 'string' && value.trim() !== '';

		const PLACEMENT_KEYWORDS = {
			pos: { h: { left: 20, right: 80, farleft: 8, 'far-left': 8, farright: 92, 'far-right': 92 }, v: { top: 0, bottom: 100 } },
			anchor: { h: { left: 0, right: 100 }, v: { top: 0, bottom: 100 } }
		};

		const resolvePlacement = (value, keywords) => {
			const tokens = String(value).trim().split(/\s+/).filter(Boolean).slice(0, 2);
			if (!tokens.length) return null;
			const result = { x: null, y: null };
			const pending = [];
			for (const token of tokens) {
				const key = token.toLowerCase();
				if (key === 'center' || key === 'centre') pending.push(50);

		class AssetManager {
			#preloadToken = 0;
			#lastWindowOrdinal = -1;
			#isWindowInit = false;
			#windowStartOrd = 0;
			#windowEndOrd = 0;

			constructor() {
				this.imageCache = new Map();
				this.audioCache = new Map();
				this.assetPromises = new Map();
				this.assetReady = new Set();
				this.assetsToLoad = [];
				this.script = [];
				this.#preloadToken = 0;

				this.activeIndices = [];
				this.#lastWindowOrdinal = -1;
				this.#isWindowInit = false;
				this.#windowStartOrd = 0;
				this.#windowEndOrd = 0;
			}

			reset() {
				this.assetsToLoad = [];
				this.script = [];
				this.activeIndices = [];
				this.#lastWindowOrdinal = -1;
				this.#isWindowInit = false;
				this.#windowStartOrd = 0;
				this.#windowEndOrd = 0;
				this.#preloadToken = (this.#preloadToken || 0) + 1;
			}

			getImageSrc(src) {
				return hasAsset(src) ? (this.imageCache.get(src)?.src || src) : '';
			}

			loadableSrc(src) {
				return hasAsset(src) && !src.startsWith('data:');
			}

			sceneAssetSrcs(scene) {
				if (!scene) return [];
				switch (scene.type) {
					case 'background':
					case 'image':
					case 'video':
						return [scene.asset];
					case 'audio':
						return scene.action && scene.action !== 'play' ? [] : [scene.asset];
					case 'single':
						return [scene.avatar];
					case 'multi':
						return (scene.characters || []).map(char => char.avatar);
					case 'conversation':
						return [
							...(scene.characters || []).map(char => char.avatar),
							...(scene.dialogue || []).map(line => line.avatar)
						];
					case 'title':
					case 'end':
						return [scene.image];
					case 'sprite':
						return [scene.asset];
					case 'sprites':
						return (scene.sprites || []).map(sprite => sprite.asset);
					default:
						return [];
				}
			}

			pendingFor(scene) {
				return this.sceneAssetSrcs(scene).filter(src => this.loadableSrc(src) && !this.assetReady.has(src));
			}

			collectAssets(script) {
				this.script = script;
				const seen = new Set();
				this.assetsToLoad = [];
				this.activeIndices = [];
				this.#lastWindowOrdinal = -1;
				this.#isWindowInit = false;
				script.forEach((scene, i) => {
					if (!scene?.isPassive) this.activeIndices.push(i);
					this.sceneAssetSrcs(scene).forEach(src => {
						if (!this.loadableSrc(src) || seen.has(src)) return;
						seen.add(src);
						this.assetsToLoad.push(src);
					});
				});
			}

			#loadMediaElement(element, src, label, onSuccess) {
				return new Promise((resolve, reject) => {
					element.preload = 'auto';
					const cleanup = () => {
						element.removeEventListener('canplaythrough', onOk);
						element.removeEventListener('loadeddata', onOk);
						element.removeEventListener('error', onErr);
					};
					const onOk = () => { cleanup(); if (onSuccess) onSuccess(); resolve(); };
					const onErr = () => { cleanup(); reject(new Error(label + ' load failed: ' + src)); };
					element.addEventListener('canplaythrough', onOk);
					element.addEventListener('loadeddata', onOk);
					element.addEventListener('error', onErr);
					element.src = src;
					element.load();
				});
			}

			loadOnce(src) {
				if (isAudioAsset(src)) {
					const audio = new Audio();
					return this.#loadMediaElement(audio, src, 'audio', () => this.audioCache.set(src, audio));
				}
				if (isVideoAsset(src)) {
					const video = document.createElement('video');
					video.muted = true;
					video.disableRemotePlayback = true;
					return this.#loadMediaElement(video, src, 'video');
				}
				return new Promise((resolve, reject) => {
					const img = new Image();
					img.decoding = 'async';
					img.onload = () => { this.imageCache.set(src, img); resolve(); };
					img.onerror = () => reject(new Error('image load failed: ' + src));
					img.src = src;
				});
			}

			async loadAssetWithRetry(src, attempts = 3) {
				let lastError;
				for (let attempt = 0; attempt < attempts; attempt++) {
					try {
						await this.loadOnce(src);
						return;
					} catch (e) {
						lastError = e;
						if (attempt < attempts - 1) await delay(TIMINGS.assetRetry);
					}
				}
				throw lastError || new Error('Asset failed: ' + src);
			}

			ensureAsset(src) {
				if (!this.loadableSrc(src) || this.assetReady.has(src)) return Promise.resolve();
				if (this.assetPromises.has(src)) return this.assetPromises.get(src);

				const promise = this.loadAssetWithRetry(src)
					.then(() => { this.assetReady.add(src); })
					.catch(err => { this.assetPromises.delete(src); throw err; });

				this.assetPromises.set(src, promise);
				return promise;
			}

			debugSummary() {
				let imgTotal = 0, audioTotal = 0, videoTotal = 0;
				let imgReady = 0, audioReady = 0, videoReady = 0;

				for (const src of this.assetsToLoad) {
					const isAudio = isAudioAsset(src);
					const isVideo = isVideoAsset(src);
					const isReady = this.assetReady.has(src);

					if (isAudio) {
						audioTotal++;
						if (isReady) audioReady++;
					} else if (isVideo) {
						videoTotal++;
						if (isReady) videoReady++;
					} else {
						imgTotal++;
						if (isReady) imgReady++;
					}
				}

				return {
					ready: this.assetReady.size,
					total: this.assetsToLoad.length,
					imgReady, imgTotal,
					audioReady, audioTotal,
					videoReady, videoTotal,
					resident: this.imageCache.size + this.audioCache.size,
					activeTotal: this.activeIndices.length,
					windowStart: this.#windowStartOrd,
					windowEnd: this.#windowEndOrd
				};
			}

			invalidate(srcs) {
				srcs.forEach(src => this.assetPromises.delete(src));

			async diagnoseFailure(srcs) {
				let reachedServer = false;
				const missing = [];
				for (const src of srcs) {
					try {
						const res = await fetch(src, { cache: 'no-store' });
						reachedServer = true;
						if (!res.ok) missing.push(src);
					} catch (e) {  }
				}
				return { network: !reachedServer, missing };

			async findMissingAssets() {
				const missing = [];
				await Promise.all(this.assetsToLoad.map(async src => {
					const controller = new AbortController();
					try {
						const res = await fetch(src, { signal: controller.signal, cache: 'no-store' });
						controller.abort();
						if (!res.ok) missing.push(src);
					} catch (e) {  }
				}));
				return missing;
			}

			async preloadInitialAssets() {
				const needed = new Set();
				for (let i = 0; i < this.script.length; i++) {
					const scene = this.script[i];
					this.sceneAssetSrcs(scene).forEach(src => {
						if (this.loadableSrc(src)) needed.add(src);
					});
					if (!scene?.isPassive) break;
				}
				await Promise.all(Array.from(needed).map(src => this.ensureAsset(src).catch(() => {})));
			}

			#activeOrdinal(scriptIndex) {
				const a = this.activeIndices;
				let lo = 0, hi = a.length;
				while (lo < hi) {
					const mid = (lo + hi) >> 1;
					if (a[mid] < scriptIndex) lo = mid + 1; else hi = mid;
				}
				return lo;
			}

			#scriptIndexAtOrdinal(ordinal) {
				const a = this.activeIndices;
				if (ordinal <= 0) return 0;
				if (ordinal >= a.length) return this.script.length - 1;
				return a[ordinal];
			}

			#buildWindowSets(currentIndex) {
				const p = this.#activeOrdinal(currentIndex);
				const startIdx = this.#scriptIndexAtOrdinal(p - PRELOAD_WINDOW.history);
				const endIdx = this.#scriptIndexAtOrdinal(p + PRELOAD_WINDOW.lookahead);
				const heavyEndIdx = this.#scriptIndexAtOrdinal(p + PRELOAD_WINDOW.heavyLookahead);

				const retain = new Set();
				const heavy = [];
				const standard = [];
				const add = (bucket, src) => {
					if (this.loadableSrc(src) && !retain.has(src)) { retain.add(src); bucket.push(src); }
				};

				for (let i = startIdx; i <= heavyEndIdx && i < this.script.length; i++) {
					this.sceneAssetSrcs(this.script[i]).forEach(src => {
						if (isVideoAsset(src) || isAudioAsset(src)) add(heavy, src);
					});
				}

				for (let i = startIdx; i <= endIdx && i < this.script.length; i++) {
					this.sceneAssetSrcs(this.script[i]).forEach(src => add(standard, src));
				}

				return { retain, queue: heavy.concat(standard) };
			}

			#evictOutsideWindow(retain) {
				for (const [src, img] of this.imageCache) {
					if (retain.has(src)) continue;
					img.src = '';
					this.imageCache.delete(src);
					this.assetReady.delete(src);
					this.assetPromises.delete(src);
				}
				for (const [src, audio] of this.audioCache) {
					if (retain.has(src)) continue;
					try { audio.pause(); audio.removeAttribute('src'); audio.load(); } catch (e) {  }
					this.audioCache.delete(src);
					this.assetReady.delete(src);
					this.assetPromises.delete(src);
				}
			}

			async #streamQueue(queue, onProgress) {
				const token = this.#preloadToken = (this.#preloadToken || 0) + 1;
				for (const src of queue) {
					if (this.#preloadToken !== token) return;
					if (this.assetReady.has(src)) continue;
					try {
						await this.ensureAsset(src);
					} catch (e) {

					}
					if (onProgress) onProgress();
				}
			}

			updateWindow(currentIndex, onProgress = null) {
				if (!this.script.length || !this.activeIndices.length) return;
				const p = this.#activeOrdinal(currentIndex);
				if (this.#isWindowInit && p === this.#lastWindowOrdinal) return;
				this.#lastWindowOrdinal = p;
				this.#isWindowInit = true;

				this.#windowStartOrd = Math.max(0, p - PRELOAD_WINDOW.history);
				this.#windowEndOrd = Math.min(this.activeIndices.length - 1, p + PRELOAD_WINDOW.lookahead);

				const { retain, queue } = this.#buildWindowSets(currentIndex);
				this.#evictOutsideWindow(retain);
				if (onProgress) onProgress();
				this.#streamQueue(queue, onProgress);
			}

			backgroundPreloadRest(onProgress = null) {
				this.updateWindow(0, onProgress);
			}
		}

		class AudioManager {
			constructor(initialVolume = 1) {
				this.audioContext = null;
				this.masterGain = null;
				this.audioTracks = new Map();
				this.audioSourceNodes = new WeakMap();
				this.masterVolume = clamp(initialVolume, 0, 1);
				this.previousVolume = this.masterVolume > 0 ? this.masterVolume : 1;
			}

			getContext() {
				if (!this.audioContext) {
					const AudioContextClass = window.AudioContext || window.webkitAudioContext;
					if (!AudioContextClass) return null;
					this.audioContext = new AudioContextClass();
					this.masterGain = this.audioContext.createGain();
					this.masterGain.gain.value = this.masterVolume;
					this.masterGain.connect(this.audioContext.destination);
				}
				return this.audioContext;
			}

			async resume() {
				const context = this.getContext();
				if (context && context.state === 'suspended') {
					try { await context.resume(); } catch (e) {  }
				}
			}

			setMasterVolume(value) {
				this.masterVolume = clamp(value, 0, 1);
				if (this.masterVolume > 0) this.previousVolume = this.masterVolume;
				this.applyMasterVolume();
			}

			toggleMute() {
				if (this.masterVolume > 0) {
					this.previousVolume = this.masterVolume;
					this.masterVolume = 0;
				} else {
					this.masterVolume = this.previousVolume || 1;
				}
				this.applyMasterVolume();
				return this.masterVolume;
			}

			#fadeNode(gainNode, to, duration = 0, from = null) {
				if (!gainNode || !this.audioContext) return;
				const now = this.audioContext.currentTime;
				gainNode.gain.cancelScheduledValues(now);
				gainNode.gain.setValueAtTime(from !== null ? from : gainNode.gain.value, now);
				if (duration > 0) {
					gainNode.gain.linearRampToValueAtTime(to, now + duration);
				} else {
					gainNode.gain.setValueAtTime(to, now);
				}
			}

			attachElement(el) {
				const context = this.getContext();
				if (!context) return null;
				let source = this.audioSourceNodes.get(el);
				if (!source) {
					try { source = context.createMediaElementSource(el); }
					catch (e) { return null; }
					this.audioSourceNodes.set(el, source);
				}
				const gain = context.createGain();
				gain.gain.value = 0;
				source.connect(gain);
				gain.connect(this.masterGain);
				return gain;
			}

			fadeGain(gainNode, to, durationMs = 0, from = null) {
				this.#fadeNode(gainNode, clamp(Number(to), 0, 1), Math.max(0, Number(durationMs) || 0) / 1000, from);
			}

			detachElement(el, gainNode) {
				if (gainNode) { try { gainNode.disconnect(); } catch (e) {  } }
				const source = this.audioSourceNodes.get(el);
				if (source) {
					try { source.disconnect(); } catch (e) {  }
					this.audioSourceNodes.delete(el);
				}
			}

			applyMasterVolume() {
				const context = this.getContext();
				if (this.masterGain && context) {
					this.#fadeNode(this.masterGain, this.masterVolume, 0.03);
				}
				this.audioTracks.forEach(track => {
					if (!track.gain) {
						track.audio.volume = track.targetVolume * this.masterVolume;
					}
				});
			}

			handleScene(scene) {
				const action = scene.action || 'play';
				const targetId = scene.id;

				if (action === 'play') this.play(scene);
				if (action === 'stop') this.stop(targetId, scene.fade || 0);
				if (action === 'pause') this.pause(targetId, scene.fade || 0);
				if (action === 'volume') this.changeVolume(targetId, scene.volume, scene.fade || 0);
			}

			createTrack(scene) {
				const context = this.getContext();
				const audio = new Audio(scene.asset);
				audio.preload = 'auto';
				audio.loop = scene.loop === true;
				audio.volume = 1;

				const from = Math.max(0, Number(scene.from) || 0);
				if (from > 0) {
					try { audio.currentTime = from; } catch (e) {  }
				}

				const gain = context ? context.createGain() : null;
				if (context && gain) {
					let source = this.audioSourceNodes.get(audio);
					if (!source) {
						source = context.createMediaElementSource(audio);
						this.audioSourceNodes.set(audio, source);
					}
					source.connect(gain);
					gain.connect(this.masterGain);
				}

				return { audio, gain, targetVolume: 1, stopTimer: null };
			}

			play(scene) {
				if (!scene.asset) return null;

				try {
					const id = scene.id;
					const targetVolume = clamp(scene.volume != null ? Number(scene.volume) : 1, 0, 1);
					const fade = Math.max(0, Number(scene.fade) || 0);

					if (this.audioTracks.has(id)) {
						this.stop(id, 0);
					}

					const track = this.createTrack(scene);
					track.targetVolume = targetVolume;
					this.audioTracks.set(id, track);

					const startPlayback = () => {
						if (track.gain) {
							this.#fadeNode(track.gain, targetVolume, fade, fade > 0 ? 0 : targetVolume);
						} else {
							track.audio.volume = targetVolume * this.masterVolume;
						}

						track.audio.play().catch(() => console.log('Audio playback failed'));
					};

					const ctx = this.audioContext;
					if (ctx && ctx.state === 'suspended') {
						ctx.resume().then(startPlayback, startPlayback);
					} else {
						startPlayback();
					}

					if (!track.audio.loop) {
						track.audio.addEventListener('ended', () => {
							this.audioTracks.delete(id);
						}, { once: true });
					}

					return track.audio;
				} catch (e) {
					console.log('Audio not available');
					return null;
				}
			}

			stop(id, fade = 0) {
				if (!id || String(id).trim() === '') {
					this.stopAll(fade);
					return;
				}

				const track = this.audioTracks.get(id);
				if (!track) return;
				this.fadeTrackTo(track, 0, fade, () => {
					track.audio.pause();
					track.audio.currentTime = 0;
					this.detachElement(track.audio, track.gain);
					this.audioTracks.delete(id);
				});
			}

			stopAll(fade = 0) {
				Array.from(this.audioTracks.keys()).forEach(id => this.stop(id, fade));
			}

			suspendAll() {
				this.audioTracks.forEach(track => {
					if (!track.audio.paused) {
						track.wasPlaying = true;
						track.audio.pause();
					}
				});
				if (this.audioContext?.state === 'running') {
					this.audioContext.suspend().catch(() => {});
				}
			}

			resumeAll() {
				if (this.audioContext?.state === 'suspended') {
					this.audioContext.resume().catch(() => {});
				}
				this.audioTracks.forEach(track => {
					if (track.wasPlaying) {
						track.wasPlaying = false;
						track.audio.play().catch(() => {});
					}
				});
			}

			pause(id, fade = 0) {
				if (!id || String(id).trim() === '') {
					this.audioTracks.forEach(track => this.fadeTrackTo(track, 0, fade, () => track.audio.pause()));
					return;
				}
				const track = this.audioTracks.get(id);
				if (!track) return;
				this.fadeTrackTo(track, 0, fade, () => track.audio.pause());
			}

			changeVolume(id, volume, fade = 0) {
				if ((!id || String(id).trim() === '') && volume !== undefined) {
					this.audioTracks.forEach(track => {
						track.targetVolume = clamp(Number(volume), 0, 1);
						this.fadeTrackTo(track, track.targetVolume, fade);
					});
					return;
				}
				const track = this.audioTracks.get(id);
				if (!track || volume === undefined) return;
				track.targetVolume = clamp(Number(volume), 0, 1);
				this.fadeTrackTo(track, track.targetVolume, fade);
			}

			fadeTrackTo(track, volume, fade = 0, onComplete = null) {
				if (!track) return;
				const target = clamp(Number(volume), 0, 1);
				const duration = Math.max(0, Number(fade) || 0);

				if (track.stopTimer) {
					clearTimeout(track.stopTimer);
					track.stopTimer = null;
				}

				if (track.gain && this.audioContext) {
					this.#fadeNode(track.gain, target, duration);
				} else {
					track.audio.volume = target * this.masterVolume;
				}

				if (onComplete) {
					if (duration === 0) {
						onComplete();
					} else {
						track.stopTimer = setTimeout(onComplete, (duration * 1000) + TIMINGS.audioStopBuffer);
					}
				}
			}
		}

		class DialogueManager {
			#vn;
			#nodes = [];
			#rafId = null;
			#isTyping = false;
			#enabled = true;
			#characters = null;
			#isConversationActive = false;
			#index = 0;

			#renderers = {
				single: (scene) => this.#renderSingle(scene),
				multi: (scene) => this.#renderMulti(scene),
				narration: (scene) => this.#renderNarration(scene),
				conversation: (scene) => this.#renderConversation(scene),
			};

			constructor(vn) {
				this.#vn = vn;
			}

			get isTyping() { return this.#isTyping; }
			get isConversationActive() { return this.#isConversationActive; }
			get enabled() { return this.#enabled; }
			set enabled(value) { this.#enabled = Boolean(value); }

			type(element, rawText = '', delay = 0) {
				const text = newlinesToBreaks(rawText);
				element.dataset.fullText = text;

				if (!this.#enabled) {
					element.innerHTML = text;
					return;
				}

				element.innerHTML = text;

				const segments = [];
				let total = 0;
				const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
				let node;
				while ((node = walker.nextNode())) {
					if (node.nodeType === Node.TEXT_NODE) {
						segments.push({ node, text: node.nodeValue });
						total += node.nodeValue.length;
						node.nodeValue = '';
					} else if (node.tagName === 'BR') {
						segments.push({ br: node });
						node.style.display = 'none';
					}
				}

				this.#nodes.push({
					el: element, segments, total,
					delay, startTime: 0,
					done: total === 0
				});
				this.#isTyping = true;
				if (!this.#rafId) this.#startLoop();
			}

			#startLoop() {
				const stepMs = TIMINGS.typewriterStep;
				const tick = (ts) => {
					let anyActive = false;

					for (const node of this.#nodes) {
						if (node.done) continue;
						if (!node.startTime) node.startTime = ts;
						const elapsed = ts - node.startTime - node.delay;
						if (elapsed < 0) { anyActive = true; continue; }

						const target = stepMs > 0 ? Math.min(node.total, Math.floor(elapsed / stepMs)) : node.total;
						let remaining = target;
						for (const seg of node.segments) {
							if (seg.br) {
								const display = remaining > 0 ? '' : 'none';
								if (seg.br.style.display !== display) seg.br.style.display = display;
								continue;
							}
							const show = remaining <= 0 ? 0 : Math.min(seg.text.length, remaining);
							if (seg.node.nodeValue.length !== show) seg.node.nodeValue = seg.text.slice(0, show);
							remaining -= seg.text.length;
						}

						if (target >= node.total) node.done = true;
						else anyActive = true;
					}

					if (anyActive) {
						this.#rafId = requestAnimationFrame(tick);
					} else {
						this.#rafId = null;
						this.#nodes.length = 0;
						this.#isTyping = false;
						this.#vn.autoplay?.onContentSettled(this.#vn.script[this.#vn.currentIndex]);
					}
				};

				this.#rafId = requestAnimationFrame(tick);
			}

			halt() {
				if (this.#rafId) {
					cancelAnimationFrame(this.#rafId);
					this.#rafId = null;
				}
				this.#nodes.length = 0;
				this.#isTyping = false;
			}

			completeAll() {
				this.halt();

				document.querySelectorAll('.dialogue-text, .narration-text').forEach(element => {
					if (element.dataset.fullText !== undefined) {
						element.innerHTML = element.dataset.fullText;
					}
				});
			}

			resetConversation() {
				this.#characters = null;
				this.#isConversationActive = false;
				this.#index = 0;
			}

			startConversation(scene) {
				this.#characters = scene.characters;
				this.#isConversationActive = true;
				this.#index = 0;
				this.#setupConversation();
			}

			advanceConversation() {
				const scene = this.#vn.script[this.#vn.currentIndex];
				this.#index++;

				if (this.#index >= scene.dialogue.length) {
					this.#isConversationActive = false;
					this.#index = 0;
					this.#vn.scene.nextScene();
				} else {
					this.render(scene);
				}
			}

			#setupConversation() {
				if (!this.#characters) return;

				const vn = this.#vn;
				vn.scene.hideAllScreens();
				const scene = vn.script[vn.currentIndex];
				vn.applyDialoguePosition(vn.elements.convDialogue, scene.position);

				const leftChar = this.#characters.find(c => c.position === 'left');
				const rightChar = this.#characters.find(c => c.position === 'right');
				const firstLine = scene.dialogue[0];

				const leftAvatar = vn.elements.leftAvatar;
				const rightAvatar = vn.elements.rightAvatar;
				const hasLeftAvatar = vn.hasAsset(leftChar?.avatar) && leftChar?.hideAvatarInGame !== true;
				const hasRightAvatar = vn.hasAsset(rightChar?.avatar) && rightChar?.hideAvatarInGame !== true;

				this.#updateAvatarDOM(leftAvatar, hasLeftAvatar, leftChar?.avatar);
				this.#updateAvatarDOM(rightAvatar, hasRightAvatar, rightChar?.avatar);
				vn.elements.convDialogue.classList.toggle('conv-dialogue--no-avatar', !hasLeftAvatar && !hasRightAvatar);
				vn.elements.convDialogue.classList.remove('conv-dialogue--speaker-no-avatar');

				leftAvatar.style.transition = 'none';
				rightAvatar.style.transition = 'none';

				if (firstLine.speaker === leftChar.name) {
					leftAvatar.classList.remove('dimmed');
					rightAvatar.classList.add('dimmed');
				} else {
					rightAvatar.classList.remove('dimmed');
					leftAvatar.classList.add('dimmed');
				}

				requestAnimationFrame(() => {
					requestAnimationFrame(() => {
						leftAvatar.style.transition = '';
						rightAvatar.style.transition = '';
						vn.scene.activateLayer(vn.elements.convDialogue);
					});
				});
			}

			render(scene) {
				const build = this.#renderers[scene.type];
				if (!build) return;

				const result = build(scene);
				if (!result) return;

				const vn = this.#vn;
				const { container, position, targets = [], logEntries = [], speech } = result;

				vn.applyDialoguePosition(container, position);
				vn.scene.activateLayer(container);
				targets.forEach(t => this.type(t.el, t.text, t.delay || 0));
				if (speech != null) announce(vn.elements.sr[scene.type], speech);
				if (scene.log !== false) logEntries.forEach(e => vn.log.add(e));
				if (!this.#isTyping) vn.autoplay?.onContentSettled(scene);
			}

			#updateAvatarDOM(element, hasAvatar, src, toggleHiddenClass = true) {
				if (toggleHiddenClass) element.classList.toggle('hidden-avatar', !hasAvatar);
				if (hasAvatar) element.src = this.#vn.getImageSrc(src);
				else element.removeAttribute('src');
			}

			#renderSingle(scene) {
				const vn = this.#vn;
				const container = vn.elements.singleDialogue;
				const avatarEl = vn.elements.singleAvatar;
				const hasAvatar = vn.hasAsset(scene.avatar) && scene.hideAvatarInGame !== true;
				container.classList.toggle('single-dialogue--no-avatar', !hasAvatar);
				this.#updateAvatarDOM(avatarEl, hasAvatar, scene.avatar, false);

				const nameEl = vn.elements.singleCharacterName;
				nameEl.innerHTML = scene.character;
				nameEl.style.color = scene.color || '';

				return {
					container,
					position: scene.position,
					targets: [{ el: vn.elements.singleDialogueText, text: scene.text }],
					speech: speechLine(vn.i18n, scene.character, scene.text),
					logEntries: [{
						type: 'dialogue',
						character: { name: scene.character, color: scene.color, avatar: scene.hideAvatarInLog ? '' : scene.avatar },
						text: scene.text
					}]
				};
			}

			#renderMulti(scene) {
				const vn = this.#vn;
				const container = vn.elements.multiDialogue;
				container.innerHTML = '';
				scene.characters.forEach(char => {
					const row = document.createElement('div');
					const hasAvatar = vn.hasAsset(char.avatar) && char.hideAvatarInGame !== true;
					row.className = `dialogue-wrapper speaker-row${hasAvatar ? '' : ' speaker-row--no-avatar'}`;
					row.innerHTML = `
						${hasAvatar ? `<img class="avatar" src="${vn.getImageSrc(char.avatar)}" alt="${char.name}">` : ''}
						<div class="dialogue-content">
							<div class="character-name" dir="auto" style="color: ${char.color || 'var(--color-accent)'}">${char.name}</div>
							<div class="dialogue-text" dir="auto"></div>
						</div>
					`;
					container.appendChild(row);
				});

				const targets = [];
				container.querySelectorAll('.dialogue-text').forEach((el, index) => {
					targets.push({ el, text: scene.characters[index].text, delay: 0 });
				});

				return {
					container,
					position: scene.position,
					targets,
					speech: scene.characters.map(char => speechLine(vn.i18n, char.name, char.text)).join('. '),
					logEntries: scene.characters.map(char => ({
						type: 'dialogue',
						character: { name: char.name, color: char.color, avatar: char.hideAvatarInLog ? '' : char.avatar },
						text: char.text
					}))
				};
			}

			#renderNarration(scene) {
				return {
					container: this.#vn.elements.narrationScreen,
					position: scene.position,
					targets: [{ el: this.#vn.elements.narrationText, text: scene.text }],
					speech: htmlToText(scene.text),
					logEntries: [{ type: 'narration', text: scene.text }]
				};
			}

			#renderConversation(scene) {
				if (!this.#characters) return null;
				const vn = this.#vn;
				const container = vn.elements.convDialogue;

				const leftChar = this.#characters.find(c => c.position === 'left');
				const rightChar = this.#characters.find(c => c.position === 'right');
				const currentDialogue = scene.dialogue[this.#index];

				const leftAvatar = vn.elements.leftAvatar;
				const rightAvatar = vn.elements.rightAvatar;
				const dialogueBox = vn.elements.convDialogueBox;
				const nameEl = vn.elements.convCharacterName;

				const leftIsSpeaker = currentDialogue.speaker === leftChar.name;
				const speakerChar = leftIsSpeaker ? leftChar : rightChar;
				const speakerAvatarEl = leftIsSpeaker ? leftAvatar : rightAvatar;
				const speakerAvatar = currentDialogue.avatar != null ? currentDialogue.avatar : speakerChar.avatar;
				const speakerColor = currentDialogue.color != null ? currentDialogue.color : speakerChar.color;

				const speakerHasAvatar = vn.hasAsset(speakerAvatar) && speakerChar?.hideAvatarInGame !== true;
				const hasLeftAvatar = vn.hasAsset(leftChar?.avatar) && leftChar?.hideAvatarInGame !== true;
				const hasRightAvatar = vn.hasAsset(rightChar?.avatar) && rightChar?.hideAvatarInGame !== true;

				leftAvatar.classList.toggle('hidden-avatar', !hasLeftAvatar);
				rightAvatar.classList.toggle('hidden-avatar', !hasRightAvatar);
				container.classList.toggle('conv-dialogue--no-avatar', !hasLeftAvatar && !hasRightAvatar);
				container.classList.toggle('conv-dialogue--speaker-no-avatar', !speakerHasAvatar);
				dialogueBox.classList.toggle('conv-dialogue-box--no-avatar', !speakerHasAvatar);

				if (speakerHasAvatar) speakerAvatarEl.src = vn.getImageSrc(speakerAvatar);

				if (leftIsSpeaker) {
					leftAvatar.classList.remove('dimmed');
					rightAvatar.classList.add('dimmed');
					dialogueBox.classList.remove('conv-dialogue-box--right');
				} else {
					rightAvatar.classList.remove('dimmed');
					leftAvatar.classList.add('dimmed');
					dialogueBox.classList.add('conv-dialogue-box--right');
				}
				nameEl.style.color = speakerColor || '';

				nameEl.innerHTML = currentDialogue.speaker;
				return {
					container,
					position: null,
					targets: [{ el: vn.elements.convDialogueText, text: currentDialogue.text }],
					speech: speechLine(vn.i18n, currentDialogue.speaker, currentDialogue.text),
					logEntries: [{
						type: 'dialogue',
						character: { name: currentDialogue.speaker, color: speakerColor, avatar: speakerChar?.hideAvatarInLog ? '' : (speakerAvatar || '') },
						text: currentDialogue.text
					}]
				};
			}
		}

		class UIManager {
			#vn;
			#isStartingTransition = false;

			constructor(vn) { this.#vn = vn; }

			showToast(message, type = 'success') {
				const toast = document.createElement('div');
				toast.className = `toast ${type}`;
				toast.dir = 'auto';
				toast.textContent = message;

				this.#vn.elements.toastContainer.appendChild(toast);

				forceNextFrame(() => toast.classList.add('show'));

				setTimeout(() => {
					toast.classList.remove('show');
					setTimeout(() => toast.remove(), TIMINGS.toastFade);
				}, TIMINGS.toastDuration);
			}

			async requestFullscreen() {
				if (document.fullscreenElement || !document.documentElement.requestFullscreen) return;
				try { await document.documentElement.requestFullscreen(); } catch (e) {  }
			}

			async exitFullscreen() {
				if (!document.fullscreenElement || !document.exitFullscreen) return;
				try { await document.exitFullscreen(); } catch (e) {  }
			}

			async toggleFullscreen() {
				if (document.fullscreenElement) {
					await this.exitFullscreen();
				} else {
					await this.requestFullscreen();
				}
				emit('feature_fullscreen', { state: document.fullscreenElement ? 'entered' : 'exited' });
				this.updateFullscreenButton();
			}

			setTitle(el, key) {
				if (!el) return;
				const hint = el.dataset.shortcut && this.#vn.controls.enableKeyboardShortcuts ? ` (${el.dataset.shortcut})` : '';
				el.title = this.#vn.i18n.t(key) + hint;
			}

			updateFullscreenButton() {
				const button = this.#vn.elements.fullscreenToggle;
				if (!button) return;

				const isFullscreen = Boolean(document.fullscreenElement);
				button.classList.toggle('fullscreen-active', isFullscreen);
				this.setTitle(button, isFullscreen ? 'controls.fullscreenExit' : 'controls.fullscreenEnter');
			}

			updateVolumeUi() {
				const vn = this.#vn;
				if (!vn.elements.volumeSlider) return;
				const masterVolume = vn.audio.masterVolume;
				const percent = Math.round(masterVolume * 100);
				vn.elements.volumeSlider.value = String(percent);
				vn.elements.volumeSlider.style.setProperty('--fill', `${percent}%`);
				vn.elements.volumeValue.textContent = `${percent}%`;
				this.setTitle(vn.elements.muteToggle, masterVolume > 0 ? 'controls.mute' : 'controls.unmute');
				vn.elements.muteToggle?.classList.toggle('muted', masterVolume === 0);
				this.setTitle(vn.elements.volumeToggle, masterVolume > 0 ? 'controls.volume' : 'controls.muted');
				vn.elements.volumeToggle?.classList.toggle('muted', masterVolume === 0);
			}

			showStartGate() {
				const vn = this.#vn;
				vn.isWaitingForStart = true;
				this.configureStartGate();
				vn.elements.startGate.classList.add('active');
			}

			configureStartGate() {
				const vn = this.#vn;
				const hasResume = vn.progress.pendingResumeIndex !== null && vn.progress.pendingResumeIndex > 0;
				const checkpoint = hasResume ? vn.progress.getCheckpointByResumeIndex(vn.progress.pendingResumeIndex) : null;
				const checkpointLabel = checkpoint?.name
					? vn.i18n.t('startGate.checkpointNamed', { name: checkpoint.name })
					: vn.i18n.t('startGate.lastCheckpoint');

				vn.elements.startTitle.textContent = vn.i18n.t(hasResume ? 'startGate.continueTitle' : 'startGate.clickToStart');

				vn.elements.startTitle.style.fontWeight = hasResume ? '700' : 'normal';

				if (hasResume) {
					vn.elements.startSubtitle.textContent = vn.i18n.t('startGate.resumeFrom', { checkpoint: checkpointLabel });
					vn.elements.startSubtitle.style.display = 'block';

					vn.elements.startActions.innerHTML = `<button class="ui-button pill" data-start-action="continue"><svg width="24" height="24" viewBox="0 0 24 24"><use href="#icon-play"/></svg><span dir="auto">${vn.i18n.t('startGate.continue')}</span></button><button class="ui-button pill secondary" data-start-action="restart"><svg width="24" height="24" viewBox="0 0 24 24"><use href="#icon-restart"/></svg><span dir="auto">${vn.i18n.t('startGate.restart')}</span></button>`;
					vn.elements.startActions.style.display = 'flex';
				} else {
					vn.elements.startSubtitle.textContent = '';
					vn.elements.startSubtitle.style.display = 'none';

					vn.elements.startActions.innerHTML = '';
					vn.elements.startActions.style.display = 'none';
				}
			}

			beginStart(action = 'start') {
				const vn = this.#vn;
				if (!vn.isWaitingForStart || this.#isStartingTransition) return;
				this.#isStartingTransition = true;

				const panel = vn.elements.startGate.querySelector('.start-panel');
				const proceed = () => {
					if (!this.#isStartingTransition) return;
					this.#isStartingTransition = false;
					this.startChapter(action);
				};

				if (!panel) { proceed(); return; }

				let done = false;
				const finish = () => {
					if (done) return;
					done = true;
					panel.removeEventListener('transitionend', finish);
					proceed();
				};
				panel.addEventListener('transitionend', finish);
				panel.classList.add('starting');

				setTimeout(finish, TIMINGS.startPanelFade + TIMINGS.startPanelSafety);
			}

			async startChapter(action = 'start') {
				const vn = this.#vn;
				if (!vn.isWaitingForStart) return;
				vn.isWaitingForStart = false;

				document.body.classList.add('game-active');
				document.body.classList.remove('controls-hidden');

				if (action === 'continue' && vn.progress.pendingResumeIndex !== null && vn.progress.pendingResumeIndex > 0) {
					emit('game_started', { type: 'continue' });
					emit('chapter_resumed', { scene_index: vn.progress.pendingResumeIndex });
					vn.scene.restoreSceneState(vn.progress.pendingResumeIndex - 1);
					vn.currentIndex = vn.progress.pendingResumeIndex;
				} else {
					emit('game_started', { type: action === 'restart' ? 'restart' : 'new' });
					if (action === 'restart') emit('chapter_restarted', { trigger: 'start_gate' });
					vn.currentIndex = 0;
				}

				vn.audio.resume();

				vn.scene.begin();
			}

			resetStartTransition() { this.#isStartingTransition = false; }

			openModal(id) {
				const vn = this.#vn;
				if (id === 'pause' && !vn.controls.enableCheckpoints) return;

				if (id === 'log') {
					vn.log.populate();
				} else if (id === 'credits') {
					const scene = vn.script[vn.currentIndex];
					if (scene && scene.credits) vn.elements.creditsBody.innerHTML = newlinesToBreaks(scene.credits);
				} else if (id === 'pause') {
					this.buildPauseMenu();
				}

				const el = this.#modalEl(id);
				if (!el) return;
				el.classList.add('active');
				vn.activeModal = id;
				vn.autoplay.pause();

				if (id === 'log') emit('feature_log_opened');
				else if (id === 'pause') emit('pause_menu_opened', { chapter_id: vn.chapterFile, scene_index: vn.currentIndex });
				else if (id === 'credits') emit('credits_open');

				if (id === 'log') {
					vn.elements.logBody.style.opacity = '0';
					setTimeout(() => { vn.elements.logBody.style.opacity = '1'; }, TIMINGS.logFadeIn);
				}
			}

			closeModal() {
				const vn = this.#vn;
				if (!vn.activeModal) return;
				if (vn.activeModal === 'credits') emit('credits_close');
				this.#modalEl(vn.activeModal)?.classList.remove('active');
				vn.activeModal = null;
				vn.autoplay.resume();
			}

			#modalEl(id) {
				const e = this.#vn.elements;
				return { log: e.logModal, credits: e.creditsModal, pause: e.pauseMenu }[id] || null;
			}

			buildPauseMenu() {
				const vn = this.#vn;
				const meta = vn.gameMeta || {};

				if (vn.elements.pauseLogo) {
					vn.elements.pauseLogo.innerHTML = hasAsset(meta.logo)
						? `<img src="${meta.logo}" alt="${meta.title || vn.i18n.t('pause.logoAlt')}" class="pause-logo-img">`
						: `<div class="pause-logo-title" dir="auto">${meta.title || DEFAULT_GAME_META.title}</div>`;
				}
				if (vn.elements.pauseChapter) vn.elements.pauseChapter.innerHTML = vn.currentChapter || '';

				const hasCheckpoints = vn.progress.chapterCheckpoints && vn.progress.chapterCheckpoints.length > 0;
				vn.elements.pauseRight?.classList.toggle('hidden', !hasCheckpoints);
				vn.elements.pauseMenu?.classList.toggle('pause-solo', !hasCheckpoints);

				if (hasCheckpoints) {
					const progress = vn.progress.chapterProgress || vn.progress.getChapterProgress();
					const unlocked = new Set(progress.unlocked || []);
					vn.elements.pauseList.innerHTML = vn.progress.chapterCheckpoints.map((checkpoint, index) => {
						const available = unlocked.has(checkpoint.id);
						const displayName = available
							? (checkpoint.name || vn.i18n.t('pause.checkpointFallback', { number: index + 1 }))
							: vn.i18n.t('pause.checkpointLocked');
						return `<button class="checkpoint-item" data-checkpoint="${checkpoint.id}" dir="auto" ${available ? '' : 'disabled'}>${displayName}</button>`;
					}).join('');
				} else {
					vn.elements.pauseList.innerHTML = '';
				}

				this.updatePauseAssets();
			}

			updatePauseAssets() {
				const vn = this.#vn;
				if (!vn.elements.pauseAssets) return;
				const a = vn.assets.debugSummary();
				const sceneNo = (vn.currentIndex || 0) + 1;
				const sceneTotal = vn.script ? vn.script.length : 0;

				const typeBreakdown = `(${a.imgReady}/${a.imgTotal} img, ${a.audioReady}/${a.audioTotal} aud, ${a.videoReady}/${a.videoTotal} vid)`;

				vn.elements.pauseAssets.textContent =
					(a.activeTotal
						? `${a.resident} assets resident · ${a.ready}/${a.total} warm ${typeBreakdown} · window ${a.windowStart + 1}–${a.windowEnd + 1}/${a.activeTotal} active · scene ${sceneNo}/${sceneTotal}`
						: `${a.resident} assets resident · ${a.ready}/${a.total} warm ${typeBreakdown} · scene ${sceneNo}/${sceneTotal}`);
			}

			showLoadingError() {
				this.#vn.elements.loadingError.classList.add('active');
			}

			hideLoadingError() {
				this.#vn.elements.loadingError.classList.remove('active');
			}

			showScriptError(message) {
				emit('error_script', { message: String(message).slice(0, 300) });
				this.#vn.elements.loading.classList.add('hidden');

				let overlay = document.getElementById('scriptError');
				if (!overlay) {
					overlay = document.createElement('div');
					overlay.id = 'scriptError';
					overlay.className = 'error-overlay error-overlay--file';
					overlay.innerHTML = `
						<div class="error-overlay__content">
							<div class="error-overlay__title">Script error</div>
							<p class="error-overlay__desc">A problem in this chapter's script has stopped it from loading. Fix the issue described below, and then reload the page.</p>
							<pre class="fp-code" id="scriptErrorMessage"></pre>
						</div>`;
					document.body.appendChild(overlay);
				}
				overlay.querySelector('#scriptErrorMessage').textContent = message;
				overlay.classList.add('active');
			}

			showTitleScreen(scene, isStarting = false) {
				const vn = this.#vn;
				const titleScreen = vn.elements.titleScreen;
				const titleMain = vn.elements.titleMain;
				const titleSub = vn.elements.titleSub;

				vn.scene.cancelTitleReveal();

				const renderContent = () => {
					titleMain.innerHTML = '';
					titleSub.innerHTML = '';

					const hasMainContent = Boolean(scene.image || scene.title);

					if (scene.image) {
						const img = document.createElement('img');
						img.src = scene.image;
						img.alt = scene.title || 'Title Image';
						img.className = 'title-image';
						titleMain.appendChild(img);
						titleMain.style.display = 'block';
					} else if (scene.title) {
						titleMain.innerHTML = newlinesToBreaks(scene.title);
						titleMain.style.display = 'block';
					} else {
						titleMain.style.display = 'none';
					}

					if (scene.subtitle) {
						titleSub.innerHTML = newlinesToBreaks(scene.subtitle);
						titleSub.style.display = 'block';
						titleMain.style.marginBottom = hasMainContent ? '20px' : '0';
					} else {
						titleSub.style.display = 'none';
						titleMain.style.marginBottom = '0';
					}
				};

				const activate = () => {
					titleMain.style.opacity = '1';
					titleSub.style.opacity = '1';
					enableGpuAccel(titleScreen);
					titleScreen.classList.add('active');
				};

				const isStartGateActive = vn.elements.startGate.classList.contains('active');

				if (vn.scene.instant || (isStarting && isStartGateActive)) {
					titleScreen.style.transition = 'none';
					titleMain.style.transition = 'none';
					titleSub.style.transition = 'none';

					renderContent();
					activate();

					forceNextFrame(() => {
						titleScreen.style.transition = '';
						titleMain.style.transition = '';
						titleSub.style.transition = '';
					});

				} else if (titleScreen.classList.contains('active')) {
					titleMain.style.opacity = '0';
					titleSub.style.opacity = '0';
					vn.scene.scheduleTitleReveal(() => { renderContent(); forceNextFrame(activate); });
				} else {
					renderContent();
					forceNextFrame(activate);
				}

				announce(vn.elements.sr.title, [scene.title, scene.subtitle].filter(Boolean).map(htmlToText).join('. '));

				if (scene.log !== false) {
					vn.log.add({
						type: 'title',
						title: scene.title || '',
						subtitle: scene.subtitle || '',
						image: scene.image
					});
				}
			}

			showImage(scene) {
				const vn = this.#vn;
				vn.elements.displayImage.src = scene.asset;
				vn.scene.activateLayer(vn.elements.imageScreen);

				if (scene.log !== false) vn.log.add({
					type: 'image',
					asset: scene.asset,
					caption: scene.caption || ''
				});
			}

			async copyToClipboard(text) {
				try {
					if (navigator.clipboard?.writeText) {
						await navigator.clipboard.writeText(text);
						return true;
					}
					const textArea = document.createElement('textarea');
					textArea.value = text;
					document.body.appendChild(textArea);
					textArea.select();
					const ok = document.execCommand('copy');
					document.body.removeChild(textArea);
					return ok;
				} catch (err) {
					console.error('Failed to copy to clipboard:', err);
					return false;
				}
			}

			async shareStory(button) {
				if (!button) return;
				const vn = this.#vn;
				const shareText = vn.i18n.t('share.text', { chapter: stripHtml(vn.currentChapter), url: window.location.href });
				const success = await this.copyToClipboard(shareText);
				emit('action_share', { result: success ? 'copied' : 'failed' });
				this.flashShareButton(button, success);
			}

			flashShareButton(button, success) {
				if (button.dataset.flashing) return;
				button.dataset.flashing = '1';

				const span = button.querySelector('span');
				const use = button.querySelector('use');
				const originalText = span.textContent;
				const originalIcon = use.getAttribute('href');
				const feedbackText = this.#vn.i18n.t(success ? 'endScreen.copied' : 'endScreen.copyFailed');

				const startWidth = button.offsetWidth;
				span.textContent = feedbackText;
				const endWidth = button.offsetWidth;
				span.textContent = originalText;

				button.style.width = `${startWidth}px`;
				void button.offsetWidth;
				button.classList.add(success ? 'copied' : 'copy-failed');
				use.setAttribute('href', success ? '#icon-check' : '#icon-close');
				span.textContent = feedbackText;
				button.style.width = `${endWidth}px`;

				setTimeout(() => {
					span.textContent = originalText;
					use.setAttribute('href', originalIcon);
					button.classList.remove('copied', 'copy-failed');
					button.style.width = `${startWidth}px`;
					setTimeout(() => {
						button.style.width = '';
						delete button.dataset.flashing;
					}, TIMINGS.shareWidth);
				}, TIMINGS.shareFeedback);
			}

			getNextChapter() {
				const vn = this.#vn;
				const chapters = vn.gameMeta?.chapters || [];
				const index = chapters.findIndex(chapter => chapter.file === vn.chapterFile);
				return (index === -1 || index + 1 >= chapters.length) ? null : chapters[index + 1];
			}

			renderEndActions() {
				const vn = this.#vn;
				const next = this.getNextChapter();

				const button = ({ action, icon, labelKey, classes = '', chapter = null }) => `
					<button class="ui-button icon ${classes}" data-action="${action}"${chapter ? ` data-chapter="${chapter}"` : ''}>
						<svg width="20" height="20" viewBox="0 0 24 24"><use href="#${icon}"/></svg>
						<span dir="auto">${vn.i18n.t(labelKey)}</span>
					</button>`;

				const primary = next
					? button({ action: 'next-chapter', icon: 'icon-next-chapter', labelKey: 'endScreen.nextChapter', classes: 'large', chapter: next.file })
					: button({ action: 'menu', icon: 'icon-home', labelKey: 'endScreen.backToMenu', classes: 'large' });

				const secondary = [
					next ? button({ action: 'menu', icon: 'icon-home', labelKey: 'endScreen.backToMenu', classes: 'secondary' }) : '',
					button({ action: 'credits-open', icon: 'icon-credits', labelKey: 'endScreen.credits', classes: 'secondary' }),
					button({ action: 'share', icon: 'icon-share', labelKey: 'endScreen.share', classes: 'secondary' })
				].join('');

				vn.elements.endActions.innerHTML = `${primary}<div class="end-actions-row">${secondary}</div>`;
			}

			showEndScreen(scene) {
				const vn = this.#vn;
				const endMain = vn.elements.endMain;
				const endSub = vn.elements.endSub;
				const titleText = scene.title || vn.i18n.t('endScreen.theEnd');

				endMain.innerHTML = '';
				if (scene.image) {
					const img = document.createElement('img');
					img.src = scene.image;
					img.alt = scene.title || vn.i18n.t('endScreen.theEnd');
					img.className = 'title-image';
					endMain.appendChild(img);
				} else {
					endMain.innerHTML = newlinesToBreaks(titleText);
				}

				if (scene.subtitle) {
					endSub.innerHTML = newlinesToBreaks(scene.subtitle);
					endSub.style.display = 'block';
					endMain.style.marginBottom = '20px';
				} else {
					endSub.innerHTML = '';
					endSub.style.display = 'none';
					endMain.style.marginBottom = '40px';
				}

				announce(vn.elements.sr.end, [titleText, scene.subtitle].filter(Boolean).map(htmlToText).join('. '));

				emit('chapter_completed', { chapter_id: vn.chapterFile });
				this.renderEndActions();
				vn.scene.activateLayer(vn.elements.endScreen);
			}
		}

		const booleanSetting = (meta, key, fallback) => {
			if (typeof meta[key] === 'boolean') return meta[key];
			if (meta.settings && typeof meta.settings[key] === 'boolean') return meta.settings[key];
			return fallback;
		};

		const numberSetting = (meta, key, fallback) => {
			const raw = typeof meta[key] === 'number' ? meta[key]
				: (meta.settings && typeof meta.settings[key] === 'number' ? meta.settings[key] : null);
			return raw === null ? fallback : raw;
		};

		class ConfigManager {
			#vn;

			constructor(vn) { this.#vn = vn; }

			async load() {
				const vn = this.#vn;
				let rawConfig = {};
				for (const url of ['config.yaml', 'config.yml']) {
					try {
						const response = await fetch(url);
						if (response.ok) {
							rawConfig = jsyaml.load(await response.text()) || {};
							break;
						}
					} catch (e) {  }
				}

				vn.languageManager = new LanguageManager(rawConfig);
				vn.activeLanguage = vn.languageManager.resolveActive(vn.save.getLanguage());
				const localizedMeta = vn.languageManager.getMergedMeta(vn.activeLanguage);

				vn.gameMeta = {
					...DEFAULT_GAME_META,
					...localizedMeta,
					settings: {
						...DEFAULT_GAME_META.settings,
						...(localizedMeta.settings || {})
					}
				};

				await vn.i18n.load(vn.activeLanguage);
				if (vn.activeLanguage) {
					document.documentElement.lang = vn.activeLanguage;
				}
				vn.i18n.translateDom(document);

				this.apply(vn.gameMeta);
				document.dispatchEvent(new CustomEvent('sastra:ready', { detail: { meta: vn.gameMeta } }));
				return vn.gameMeta;
			}

			apply(meta = {}) {
				document.title = stripHtml(meta.title) || DEFAULT_GAME_META.title;
				this.#applyTheme(meta.theme || {});
				this.#vn.applyGameSettings(meta);

				if (meta.favicon) {
					this.#setFavicon(meta.favicon);
				}
			}

			#applyTheme(theme = {}) {
				const root = document.documentElement;

				const resolveVariables = (section) => {
					const resolved = { ...section };
					for (const [key, value] of Object.entries(resolved)) {
						if (Object.hasOwn(resolved, value)) resolved[key] = resolved[value];
					}
					return resolved;
				};

				const formatFontFamily = (fontString) => {
					const fonts = String(fontString).split(',').map(f => f.replace(/['"]/g, '').trim()).filter(Boolean)
						.map(f => GENERIC_FONT_FAMILIES.has(f.toLowerCase()) ? f.toLowerCase() : `"${f}"`);
					if (!GENERIC_FONT_FAMILIES.has(fonts.at(-1))) fonts.push('sans-serif');
					return fonts.join(', ');
				};

				const hasValue = (v) => v !== undefined && v !== null && String(v).trim() !== '';

				const fonts = resolveVariables(theme.fonts || {});
				const colors = resolveVariables(theme.colors || {});

				this.#installFontFaces(theme.customFonts || {});

				Object.entries(CSS_THEME_VARS.fonts).forEach(([key, cssVar]) => {
					if (hasValue(fonts[key])) root.style.setProperty(cssVar, formatFontFamily(fonts[key]));
				});

				Object.entries(CSS_THEME_VARS.colors).forEach(([key, cssVar]) => {
					if (hasValue(colors[key])) root.style.setProperty(cssVar, colors[key]);
				});

				if (hasValue(colors.accent)) {
					document.querySelector('meta[name="theme-color"]')?.setAttribute('content', colors.accent);
				}
			}

			#installFontFaces(customFonts = {}) {
				document.querySelectorAll('[data-sastra-font]').forEach(node => node.remove());

				if (!customFonts || Object.keys(customFonts).length === 0) return;

				const isStylesheet = (url) => /fonts\.googleapis\.com/i.test(url) || /\.css(\?|#|$)/i.test(url);
				const getFontFormat = (url) => {
					const ext = url.split('.').pop().toLowerCase();
					const formats = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' };
					return formats[ext] ? ` format("${formats[ext]}")` : '';
				};

				const faceRules = [];
				for (const [familyName, fontUrl] of Object.entries(customFonts)) {
					if (!hasAsset(fontUrl)) continue;
					if (isStylesheet(fontUrl)) {
						const link = document.createElement('link');
						link.rel = 'stylesheet';
						link.href = fontUrl;
						link.dataset.sastraFont = '';
						document.head.appendChild(link);
					} else {
						faceRules.push(`@font-face {
							font-family: "${familyName}";
							src: url("${fontUrl}")${getFontFormat(fontUrl)};
							font-weight: 400 700;
							font-style: normal;
							font-display: swap;
						}`);
					}
				}

				if (faceRules.length) {
					const style = document.createElement('style');
					style.dataset.sastraFont = '';
					style.textContent = faceRules.join('\n');
					document.head.appendChild(style);
				}
			}

			#setFavicon(url) {
				let link = document.querySelector('link[rel="icon"]');
				if (!link) {
					link = document.createElement('link');
					link.rel = 'icon';
					document.head.appendChild(link);
				}
				link.href = url;
			}
		}

		class LogManager {
			#vn;
			#entries = [];
			#renderedCount = 0;

			constructor(vn) { this.#vn = vn; }

			add(data) {
				const entry = { type: data.type, timestamp: Date.now() };

				switch (data.type) {
					case 'dialogue':
						entry.character = data.character;
						entry.text = data.text;
						break;
					case 'narration':
						entry.text = data.text;
						break;
					case 'title':
						entry.title = data.title;
						entry.subtitle = data.subtitle;
						entry.image = data.image;
						break;
					case 'image':
						entry.asset = data.asset;
						entry.caption = data.caption;
						break;
					default:
						return;
				}

				this.#entries.push(entry);
			}

			reset() {
				this.#entries = [];
				this.resetRender();
			}

			resetRender() {
				this.#vn.elements.logBody.innerHTML = '';
				this.#renderedCount = 0;
			}

			populate() {
				if (this.#renderedCount > this.#entries.length) this.resetRender();

				if (this.#renderedCount === this.#entries.length) {
					this.#scrollToBottom();
					return;
				}

				const frag = document.createDocumentFragment();
				for (let i = this.#renderedCount; i < this.#entries.length; i++) {
					const node = LogManager.#buildNode(this.#entries[i]);
					if (node) frag.appendChild(node);
				}
				this.#renderedCount = this.#entries.length;
				this.#vn.elements.logBody.appendChild(frag);

				this.#scrollToBottom();
			}

			rebuild(targetIndex) {
				this.#entries = [];
				this.resetRender();

				const script = this.#vn.script;
				for (let i = 0; i <= targetIndex && i < script.length; i++) {
					const scene = script[i];
					if (!scene) continue;
					if (scene.log === false) continue;

					switch (scene.type) {
						case 'single':
							this.add({
								type: 'dialogue',
								character: { name: scene.character, color: scene.color, avatar: scene.hideAvatarInLog ? '' : scene.avatar },
								text: scene.text
							});
							break;
						case 'multi':
							(scene.characters || []).forEach(char => {
								this.add({
									type: 'dialogue',
									character: { name: char.name, color: char.color, avatar: char.hideAvatarInLog ? '' : char.avatar },
									text: char.text
								});
							});
							break;
						case 'narration':
							this.add({ type: 'narration', text: scene.text });
							break;
						case 'conversation':
							(scene.dialogue || []).forEach(line => {
								const speakerData = (scene.characters || []).find(c => c.name === line.speaker);
								this.add({
									type: 'dialogue',
									character: {
										name: line.speaker,
										color: line.color != null ? line.color : speakerData?.color,
										avatar: speakerData?.hideAvatarInLog ? '' : (line.avatar != null ? line.avatar : (speakerData?.avatar || ''))
									},
									text: line.text
								});
							});
							break;
						case 'image':
							this.add({ type: 'image', asset: scene.asset, caption: scene.caption || '' });
							break;
						case 'title':
							this.add({
								type: 'title',
								title: scene.title || '',
								subtitle: scene.subtitle || '',
								image: scene.image
							});
							break;
					}
				}
			}

			#scrollToBottom() {
				const logBody = this.#vn.elements.logBody;
				setTimeout(() => {
					logBody.scrollTop = logBody.scrollHeight;
				}, TIMINGS.logScroll);
			}

			static #buildNode(entry) {
				const clone = (id) => document.getElementById(id).content.firstElementChild.cloneNode(true);
				let node;

				switch (entry.type) {
					case 'dialogue': {
						node = clone('logTplDialogue');
						const avatar = node.querySelector('.log-avatar');
						if (hasAsset(entry.character.avatar)) {
							avatar.src = entry.character.avatar;
							avatar.alt = entry.character.name || '';
						} else {
							avatar.remove();
						}
						const nameEl = node.querySelector('.character-name');
						nameEl.innerHTML = entry.character.name || '';
						nameEl.style.color = entry.character.color || 'var(--color-accent)';
						node.querySelector('.text').innerHTML = newlinesToBreaks(entry.text);
						break;
					}

					case 'narration': {
						node = clone('logTplNarration');
						node.querySelector('.text').innerHTML = newlinesToBreaks(entry.text);
						break;
					}

					case 'title': {
						node = clone('logTplTitle');
						const hasTitle = entry.title && entry.title.trim() !== '';
						const hasSubtitle = entry.subtitle && entry.subtitle.trim() !== '';
						const isImageOnly = entry.image && !hasTitle && !hasSubtitle;
						const img = node.querySelector('.title-image');
						const nameEl = node.querySelector('.title-name');
						const subEl = node.querySelector('.title-subtitle');

						if (entry.image) {
							img.src = entry.image;
							if (isImageOnly) {
								node.classList.add('only-image');
								img.classList.add('centered');
							}
						} else {
							img.remove();
						}

						if (hasTitle) nameEl.innerHTML = newlinesToBreaks(entry.title); else nameEl.remove();
						if (hasSubtitle) subEl.innerHTML = newlinesToBreaks(entry.subtitle); else subEl.remove();
						break;
					}

					case 'image': {
						node = clone('logTplImage');
						node.querySelector('.log-image').src = entry.asset;
						const caption = node.querySelector('.text');
						if (entry.caption) caption.innerHTML = newlinesToBreaks(entry.caption); else caption.remove();
						break;
					}

					default:
						return null;
				}

				return node;
			}
		}

		class SpriteManager {
			#vn;
			#sprites = new Map();

			constructor(vn) { this.#vn = vn; }

			applyScene(scene) {
				if (scene.type === 'sprites') {
					(scene.sprites || []).forEach(sprite => this.applyCommand(sprite));
					return;
				}

				this.applyCommand(scene);
			}

			applyCommand(command = {}) {
				const action = command.action || (hasAsset(command.asset) ? 'show' : 'hide');

				if (action === 'clear') {
					this.clear(command.fade);
					return;
				}

				const id = command.id;
				if (!id) {
					console.warn('Sprite command skipped because it has no id.', command);
					return;
				}

				if (action === 'hide') {
					this.#hide(id, command.fade);
					return;
				}

				if (action === 'replace') {
					this.#show({ ...command, fade: false, keepVisible: true });
					return;
				}

				this.#show(command);
			}

			clear(fade = true) {
				Array.from(this.#sprites.keys()).forEach(id => this.#hide(id, fade));
			}

			#show(command) {
				const vn = this.#vn;
				const id = command.id;
				const asset = command.asset;
				let sprite = this.#sprites.get(id);
				const isNew = !sprite;

				if (isNew && !hasAsset(asset)) {
					console.warn(`Sprite "${id}" skipped because it has no asset.`);
					return;
				}

				if (!sprite) {
					sprite = document.createElement('img');
					sprite.className = 'vn-sprite';
					sprite.alt = id;
					sprite.dataset.spriteId = id;
					vn.elements.spriteStage.appendChild(sprite);
					this.#sprites.set(id, sprite);
				}

				clearTimeout(sprite.hideTimer);

				if (asset && sprite.getAttribute('src') !== vn.getImageSrc(asset)) {
					sprite.src = vn.getImageSrc(asset);
				}

				this.#position(sprite, command, isNew);

				const shouldFade = command.fade !== false && !command.keepVisible;
				if (isNew || !sprite.classList.contains('active')) {
					if (shouldFade) {
						enableGpuAccel(sprite);
						forceNextFrame(() => sprite.classList.add('active'));
					} else {
						sprite.classList.add('active');
					}
				}
			}

			#hide(id, fade = true) {
				const sprite = this.#sprites.get(id);
				if (!sprite) return;

				const removeSprite = () => {
					sprite.src = '';
					sprite.remove();
					this.#sprites.delete(id);
				};

				clearTimeout(sprite.hideTimer);
