    <title>Sastra™</title>

	<!--
	Sastra visual novel engine: one self-contained file, no build step.
	
	Layout of this document:
	  1. The style block: all of the CSS, design tokens in :root first, then components.
	  2. The body: the static DOM (stage, screens, overlays), looked up once at startup.
	  3. The engine script: constants, manager classes, the VisualNovel orchestrator, boot.
	  4. The js-yaml script: bundled (MIT), parses config.yaml and the chapter files.
	
	The engine runs only over http(s); it makes no network requests of its own.
	The release build is this file with its comments removed. Licence notices stay.
	-->
	<style>
		/*
		 * Registered so the slider track/thumb sizes and the scroll-edge fades can be
		 * transitioned. Plain custom properties are never interpolated.
		 */
		@property --track { syntax: '<length>'; inherits: true; initial-value: 6px; }
		@property --thumb { syntax: '<length>'; inherits: true; initial-value: 20px; }
		@property --fade-top { syntax: '<length>'; inherits: false; initial-value: 0px; }
		@property --fade-bottom { syntax: '<length>'; inherits: false; initial-value: 0px; }

		:root {
			/* Typography. ConfigManager overrides these from `theme.fonts` in config.yaml. */
			--font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			--font-dialogue: var(--font-body);
			--font-character-name: var(--font-body);
			--font-ui: var(--font-body);
			--font-title: var(--font-body);
			/*
			 * Palette. The eight --color-* tokens are the only colours config.yaml sets
			 * (`theme.colors`). Everything below is derived from them with color-mix(), so
			 * changing the accent re-tints the whole interface.
			 */
			--color-accent: #ff006e;
			--color-text: #f2f2f3;
			--color-muted-text: #98989f;
			--color-page-bg: #0a0a0b;
			--color-panel-bg: #19191b;
			--color-dialogue-bg: rgba(0, 0, 0, .7);
			--color-success: #1f9d55;
			--color-error: #da373c;
			--color-on-accent: #fff;
			--accent-hover: color-mix(in srgb, var(--color-accent) 84%, #fff);
			--accent-text: color-mix(in srgb, var(--color-accent) 80%, var(--color-text));
			--ink-2: color-mix(in srgb, var(--color-text) 80%, var(--color-page-bg));
			--soft: color-mix(in srgb, var(--color-text) 6%, transparent);
			--soft-2: color-mix(in srgb, var(--color-text) 11%, transparent);
			--line: color-mix(in srgb, var(--color-text) 10%, var(--color-panel-bg));
			--line-strong: color-mix(in srgb, var(--color-text) 16%, var(--color-panel-bg));
			--danger: var(--color-error);
			--on-danger: #fff;
			--chrome-bg: rgba(10, 10, 11, .66);
			--chrome-hover: rgba(36, 36, 40, .84);
			--dim: rgba(0, 0, 0, .55);
			--art-surface: color-mix(in srgb, var(--color-panel-bg) 88%, transparent);
			--art-surface-hover: color-mix(in srgb, color-mix(in srgb, var(--color-text) 11%, var(--color-panel-bg)) 92%, transparent);
			--tip-bg: color-mix(in srgb, var(--color-text) 20%, var(--color-page-bg));
			--tip-fg: var(--color-text);
			--backdrop: rgba(0, 0, 0, .6);
			/* Corner radii, by component size. */
			--r-pill: 999px;
			--r-modal: 28px;
			--r-card: 24px;
			--r-menu: 30px;
			--r-pop: 20px;
			--r-row: 14px;
			--r-tip: 8px;
			/*
			 * Control sizes: --ctl is the standard button and row height, --ctl-sm the
			 * compact one. --bar, --bar-icon, --bar-gap and --bar-edge size the top control bar.
			 */
			--ctl: 48px;
			--ctl-sm: 40px;
			--bar: 44px;
			--bar-icon: 20px;
			--bar-gap: 10px;
			--bar-edge: 16px;
			/* Elevation. */
			--shadow-sm: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 10px -3px rgba(0, 0, 0, .5);
			--shadow-md: 0 14px 40px rgba(0, 0, 0, .55);
			--shadow-lg: 0 24px 64px rgba(0, 0, 0, .55);
			/*
			 * Motion. --ease-spring overshoots slightly and is only for small things that
			 * appear; exits, modals and sheets use --ease-out. UI motion stays under .3s.
			 */
			--ease-out: cubic-bezier(.2, .8, .2, 1);
			--ease-spring: cubic-bezier(.34, 1.36, .64, 1);
			--t-press: .12s;
			--t-fast: .15s;
			--t-menu: .18s;
			--t-exit: .2s;
			--t-toast: .24s;
			--t-modal: .28s;
			--t-sheet: .3s;
			--lift: -2px;
			/* Bottom safe-area inset (home indicator, rounded corners). */
			--safe-b: env(safe-area-inset-bottom, 0px);
			/*
			 * One scene pixel. Dialogue, sprites and avatars are sized in multiples of it so
			 * they scale with window height, clamped to .75-1.25px: readable on a phone,
			 * not oversized on a big monitor.
			 */
			--scene-px: clamp(.75px, 100vh / 900, 1.25px);
			/*
			 * Distance of the dialogue box from the top or bottom edge. The top value also
			 * clears the control bar.
			 */
			--dialogue-position-top: max(calc(var(--bar-edge) + var(--bar) + 8px), 7%);
			--dialogue-position-bottom: max(calc(16px + var(--safe-b)), 7%);

			/*
			 * Stacking order, bottom to top. New layers go in this list instead of getting
			 * a raw z-index. Background layers sit at -1, below all of it.
			 */
			--z-blank: 10;
			--z-sprite-stage: 5;
			--z-scene: 20;
			--z-image: 30;
			--z-fullscreen: 40;
			--z-screen: 50;
			--z-plugin: 60;
			--z-chapter-info: 100;
			--z-top-controls: 150;
			--z-loading: 1000;
			--z-chapter-select: 1000;
			--z-modal: 2000;
			--z-start-gate: 2500;
			--z-pause: 2600;
			--z-toast: 3000;
			--z-overlay: 3000;
			--z-tooltip: 3100;
			--z-error: 5000;
		}

		/*
		 * Shared keyframes. Entrances start from a visible state (scale .86 or more),
		 * never from zero.
		 */
		@keyframes spin {
			to {
				transform: rotate(360deg)
			}
		}

		@keyframes fadeIn {
			to {
				opacity: 1
			}
		}

		@keyframes modal-in {
			from {
				opacity: 0;
				transform: scale(.94);
			}
		}

		@keyframes sheet-in {
			from {
				opacity: 0;
				transform: translateY(40px);
			}
		}

		@keyframes toast-in {
			from {
				opacity: 0;
				transform: translateY(-16px) scale(.96);
			}
		}

		@keyframes tick-in {
			from {
				opacity: 0;
				transform: scale(.86);
			}
		}

		@keyframes tick-draw {
			from {
				clip-path: inset(0 100% 0 0);
			}
			to {
				clip-path: inset(0);
			}
		}

		@keyframes label-swap {
			from {
				opacity: 0;
				filter: blur(2px);
			}
		}

		@keyframes progress-grow {
			from {
				width: 0;
			}
		}

		/* Reset. */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box
		}

		/* The page is a fixed black stage; nothing scrolls. */
		body {
			font-family: var(--font-body);
			background: #000;
			color: var(--color-text);
			overflow: hidden;
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
		}

		::selection {
			background: var(--color-accent);
			color: var(--color-on-accent);
		}

		:focus-visible {
			outline: 2px solid var(--color-accent);
			outline-offset: 2px;
		}

		button {
			font: inherit;
			color: inherit;
		}

		svg,
		.icon {
			flex: none;
		}

		/*
		 * Icons are CSS masks. An element with data-icon="name" gets --icon (an inline
		 * SVG data URI) and paints currentColor through it, so icons follow the text
		 * colour and need no font and no network request.
		 */
		.icon {
			display: inline-block;
			width: 1em;
			height: 1em;
			background: currentColor;
			-webkit-mask: var(--icon) center / contain no-repeat;
			mask: var(--icon) center / contain no-repeat;
		}

		/* Must win over any component's own display value. */
		[hidden] {
			display: none !important;
		}

		.scrollbar {
			scrollbar-width: thin;
			scrollbar-color: var(--line-strong) transparent;
		}

		/* Root of the stage. Everything in a running game lives inside it. */
		.game-container {
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden
		}

		/*
		 * Background layers: StageManager keeps two (bg1, bg2) and crossfades them by
		 * swapping .visible and .hidden. They sit behind everything (z-index -1).
		 */
		.background-layer,.overlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%
		}

		.background-layer {
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			opacity: 0;
			z-index: -1;
			transition: opacity 1s ease-in-out;
			pointer-events: none;
		}

		.gpu-accelerate {
			will-change: opacity, transform;
		}

		/*
		 * Full-screen image and video scene layers. .fs-front raises one layer one step
		 * above the other.
		 */
		.fs-layer {
			z-index: var(--z-fullscreen);
		}

		.fs-layer.fs-front {
			z-index: calc(var(--z-fullscreen) + 1);
		}

		.background-layer.visible {
			opacity: 1
		}

		.background-layer.hidden {
			opacity: 0
		}

		.background-layer.video-bg {
			background: transparent !important;
		}

		.background-layer.video-bg video {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center;
		}

		.background-layer.visible video {
			display: block;
		}

		.background-layer.hidden video {
			display: none;
		}

		.overlay {
			background: rgba(0,0,0,0);
			transition: opacity .5s ease
		}

		/*
		 * Sprites get their own stage under the dialogue. contain: strict isolates its
		 * layout and paint from the rest of the page, and pointer-events: none lets
		 * clicks through.
		 */
		.sprite-stage {
			position: absolute;
			inset: 0;
			z-index: var(--z-sprite-stage);
			pointer-events: none;
			overflow: hidden;
			contain: strict;
		}

		/*
		 * Placement comes from per-sprite custom properties set by SpriteManager
		 * (--sprite-x, --sprite-y, --sprite-height, --sprite-anchor-x, --sprite-anchor-y).
		 * The 12px translateY is the entrance offset, removed by .active.
		 */
		.vn-sprite {
			position: absolute;
			top: var(--sprite-y, 100%);
			left: var(--sprite-x, 50%);
			height: min(var(--sprite-height, 90vh), 100vh);
			max-width: 100vw;
			object-fit: contain;
			object-position: bottom center;
			opacity: 0;
			transform: translate(calc(var(--sprite-anchor-x, 50) * -1%), calc(var(--sprite-anchor-y, 100) * -1%)) translateY(12px);
			filter: drop-shadow(0 18px 28px rgba(0,0,0,.35));
			transition: opacity .45s cubic-bezier(.25,.46,.45,.94), transform .45s cubic-bezier(.25,.46,.45,.94), filter .45s ease;
			user-select: none;
		}

		.vn-sprite.active {
			opacity: 1;
			transform: translate(calc(var(--sprite-anchor-x, 50) * -1%), calc(var(--sprite-anchor-y, 100) * -1%));
		}

		.scene-layer {
			position: absolute;
			z-index: var(--z-scene);
			opacity: 0;
			transition: opacity .5s cubic-bezier(.25,.46,.45,.94);
		}

		.scene-layer.active {
			opacity: 1;
		}

		/* Host for plugin UI (z 60). Click-through until a plugin's content is .active. */
		.plugin-layer {
			inset: 0;
			z-index: var(--z-plugin);
			pointer-events: none;
		}

		.plugin-layer.active {
			pointer-events: auto;
		}

		.plugin-overlay {
			display: contents;
		}

		a.plugin-button {
			text-decoration: none;
		}

		.image-screen {
			z-index: var(--z-image);
		}

		.character-name,.conv-dialogue-box,.dialogue-content,.dialogue-text,.narration-text {
			user-select: text;
			cursor: text
		}

		.flex-center {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.centered-scene {
			inset: 0;
			width: max-content;
			height: max-content;
			margin: auto;
		}

		/*
		 * Dialogue layout. Sizes use --scene-px. The -top, -center and -bottom classes
		 * follow the scene's position.
		 */
		.dialogue-wrapper {
			display: flex;
			align-items: center;
		}

		.single-dialogue,
		.speaker-row {
			gap: calc(40 * var(--scene-px))
		}

		.single-dialogue--no-avatar,
		.speaker-row--no-avatar {
			justify-content: center;
			gap: 0;
		}

		.single-dialogue--no-avatar .avatar {
			display: none;
		}

		.dialogue-position-top {
			top: var(--dialogue-position-top);
			margin-block: 0 auto;
		}

		.dialogue-position-center {
			margin-block: auto;
		}

		.dialogue-position-bottom {
			bottom: var(--dialogue-position-bottom);
			margin-block: auto 0;
		}

		.avatar,
		.conv-avatar {
			flex: none;
			width: calc(150 * var(--scene-px));
			height: calc(150 * var(--scene-px));
			border-radius: calc(24 * var(--scene-px));
			object-fit: cover;
			transition: opacity .5s ease, transform .5s ease;
		}

		.dialogue-content,
		.narration-screen,
		.conv-dialogue-box {
			display: flex;
			flex-direction: column;
			justify-content: center;
			background: var(--color-dialogue-bg);
			border-radius: calc(28 * var(--scene-px));
			padding: calc(30 * var(--scene-px)) calc(34 * var(--scene-px));
			contain: layout paint;
		}

		.dialogue-content {
			min-width: min(calc(400 * var(--scene-px)), 58vw);
			max-width: min(calc(600 * var(--scene-px)), 72vw);
		}

		.single-dialogue:not(.single-dialogue--no-avatar) .dialogue-content,
		.speaker-row:not(.speaker-row--no-avatar) .dialogue-content {
			min-height: calc(150 * var(--scene-px));
		}

		.character-name {
			font-family: var(--font-character-name);
			font-size: calc(24 * var(--scene-px));
			font-weight: 700;
			line-height: 1.2;
			color: var(--color-accent);
			margin-bottom: calc(12 * var(--scene-px))
		}

		.dialogue-text,
		.narration-text {
			font-family: var(--font-dialogue);
			font-size: calc(20 * var(--scene-px));
			line-height: 1.6;
			min-height: 1.6em;
			word-wrap: break-word;
			white-space: pre-wrap
		}

		.multi-dialogue {
			display: flex;
			flex-direction: column;
			gap: calc(20 * var(--scene-px))
		}

		.narration-screen {
			max-width: 50%;
			min-width: min(calc(400 * var(--scene-px)), 72vw);
			padding: calc(40 * var(--scene-px));
			text-align: center;
		}

		.narration-text {
			font-size: calc(22 * var(--scene-px));
		}

		.conv-dialogue {
			gap: calc(30 * var(--scene-px))
		}

		.conv-dialogue--no-avatar,
		.conv-dialogue--speaker-no-avatar {
			justify-content: center;
			gap: 0;
		}

		.conv-dialogue--speaker-no-avatar .conv-avatar {
			display: none;
		}

		.conv-avatar {
			width: calc(160 * var(--scene-px));
			height: calc(160 * var(--scene-px));
		}

		.conv-avatar.dimmed {
			opacity: .4;
			transform: scale(.9)
		}

		.conv-avatar.hidden-avatar {
			display: none;
		}

		.conv-dialogue-box {
			max-width: min(calc(640 * var(--scene-px)), 72vw);
			min-width: min(calc(440 * var(--scene-px)), 58vw);
			min-height: calc(160 * var(--scene-px));
		}

		.image-screen,
		.video-screen {
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			transform: scale(.9);
			transition: all .8s cubic-bezier(.25,.46,.45,.94)
		}

		.image-screen.active,
		.video-screen.active {
			transform: scale(1)
		}

		.display-image,
		.video-screen video {
			max-width: 90%;
			max-height: 90%;
			border-radius: var(--r-card);
			box-shadow: var(--shadow-lg)
		}

		.video-screen video {
			background: #000
		}

		/* Plain black scene layer. */
		.blank-screen {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			opacity: 0;
			transition: opacity .5s ease;
			pointer-events: none;
			z-index: var(--z-blank);
		}

		.blank-screen.active {
			opacity: 1;
		}

		/* Black cover for the fade-to-black and fade-from-black transitions. */
		.screen-fade {
			position: fixed;
			inset: 0;
			background: #000;
			z-index: var(--z-start-gate);
			opacity: 0;
			pointer-events: none;
			transition: opacity .7s ease;
		}

		.screen-fade.active {
			opacity: 1;
		}

		/*
		 * Top-bar controls. Hover styles sit inside @media (hover: hover) throughout the
		 * file, so a tap on a touch screen never leaves an element stuck in its hover
		 * look.
		 */
		.chapter-info,
		.control-button {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			height: var(--bar);
			border: 0;
			border-radius: var(--r-pill);
			background: var(--chrome-bg);
			color: #fff;
			font-family: var(--font-ui);
			font-size: .95rem;
			font-weight: 700;
			white-space: nowrap;
			cursor: pointer;
			user-select: none;
			will-change: transform;
			transition: opacity var(--t-fast) ease, background var(--t-fast) ease, color var(--t-fast) ease, transform .3s var(--ease-spring);
		}

		.chapter-info {
			position: absolute;
			top: var(--bar-edge);
			left: var(--bar-edge);
			display: block;
			max-width: 46vw;
			padding: 0 20px;
			line-height: var(--bar);
			overflow: hidden;
			text-overflow: ellipsis;
			z-index: var(--z-chapter-info);
			cursor: default;
		}

		.chapter-info.checkpoints-enabled,
		.chapter-info.checkpoints-enabled * {
			cursor: pointer !important;
		}

		.control-button.circle {
			position: relative;
			width: var(--bar);
			padding: 0;
		}

		.control-button.pill {
			padding: 0 20px;
		}

		.control-button :is(svg, img, .icon) {
			width: var(--bar-icon);
			height: var(--bar-icon);
		}

		.control-button.active {
			background: var(--color-accent);
			color: var(--color-on-accent);
		}

		@media (hover: hover) {
			.chapter-info.checkpoints-enabled:hover,
			.control-button:hover {
				background: var(--chrome-hover);
				transform: translateY(var(--lift));
			}

			.control-button.active:hover {
				background: var(--accent-hover);
			}
		}

		.chapter-info.checkpoints-enabled:active,
		.control-button:active {
			transform: scale(.94);
			transition-duration: var(--t-press);
			transition-timing-function: var(--ease-out);
		}

		.top-controls {
			position: absolute;
			top: var(--bar-edge);
			right: var(--bar-edge);
			display: flex;
			gap: var(--bar-gap);
			z-index: var(--z-top-controls);
		}

		.ui-button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 9px;
			height: 52px;
			padding: 0 26px;
			border: 2px solid transparent;
			border-radius: var(--r-pill);
			background: var(--color-accent);
			color: var(--color-on-accent);
			font-family: var(--font-ui);
			font-size: 1.05rem;
			font-weight: 700;
			line-height: 1;
			white-space: nowrap;
			text-decoration: none;
			cursor: pointer;
			transition: background var(--t-fast) ease, color var(--t-fast) ease, transform var(--t-fast) var(--ease-out), width .22s var(--ease-out);
		}

		:is(.ui-button, .modal-title, .toast, .error-details summary, .plugin-button) > span:not(.toast-count) {
			text-box: trim-both cap alphabetic;
		}

		.ui-button :is(svg, img, .icon) {
			width: 20px;
			height: 20px;
		}

		.ui-button.secondary {
			background: var(--soft);
			color: var(--color-text);
		}

		.ui-button.danger-solid {
			background: var(--danger);
			color: var(--on-danger);
		}

		.ui-button.block {
			width: 100%;
		}

		.ui-button.icon-end {
			flex-direction: row-reverse;
		}

		.ui-button.copied {
			background: var(--color-success);
			color: #fff;
		}

		:is(.ui-button.copied, .ui-button.copy-failed) span {
			animation: label-swap .22s ease;
		}

		:is(.ui-button.copied, .ui-button.copy-failed) .icon {
			animation: tick-draw .32s var(--ease-out);
		}

		:is(.pause-left, .full-screen-overlay--end) .ui-button.secondary:not(.copied, .copy-failed) {
			background: var(--art-surface);
		}

		.ui-button.copy-failed {
			background: var(--color-error);
			color: #fff;
		}

		@media (hover: hover) {
			.ui-button:hover {
				background: var(--accent-hover);
				transform: translateY(var(--lift));
			}

			.ui-button.secondary:hover {
				background: var(--soft-2);
			}

			:is(.pause-left, .full-screen-overlay--end) .ui-button.secondary:not(.copied, .copy-failed):hover {
				background: var(--art-surface-hover);
			}

			.ui-button.danger-solid:hover {
				background: color-mix(in srgb, var(--danger) 88%, #fff);
			}

			.ui-button.copied:hover {
				background: var(--color-success);
			}

			.ui-button.copy-failed:hover {
				background: var(--color-error);
			}
		}

		.ui-button:active {
			transform: scale(.97);
			transition-duration: var(--t-press);
		}

		.close-button,
		.mute-toggle {
			display: flex;
			align-items: center;
			justify-content: center;
			flex: none;
			width: var(--ctl-sm);
			height: var(--ctl-sm);
			border: 0;
			border-radius: 50%;
			background: var(--soft);
			color: var(--ink-2);
			cursor: pointer;
			transition: background var(--t-fast) ease, color var(--t-fast) ease, transform .3s var(--ease-spring);
		}

		.close-button .icon,
		.mute-toggle .icon {
			width: 18px;
			height: 18px;
		}

		@media (hover: hover) {
			.close-button:hover,
			.mute-toggle:hover {
				background: var(--soft-2);
				color: var(--color-text);
			}
		}

		.close-button:active,
		.mute-toggle:active {
			transform: scale(.94);
			transition-duration: var(--t-press);
			transition-timing-function: var(--ease-out);
		}

		.eyebrow {
			font-size: .85rem;
			font-weight: 700;
			color: var(--color-muted-text);
		}

		/* List rows, e.g. checkpoints and languages. .current marks the active one. */
		.row {
			display: flex;
			align-items: center;
			gap: 12px;
			width: 100%;
			min-height: var(--ctl);
			padding: 6px 20px;
			border: 0;
			border-radius: var(--r-pill);
			background: transparent;
			color: var(--color-text);
			font-family: var(--font-ui);
			font-size: 1rem;
			text-align: start;
			cursor: pointer;
			transition: background var(--t-fast) ease, color var(--t-fast) ease;
		}

		.row-title {
			flex: 1;
			min-width: 0;
			padding-block: .4em;
			margin-block: -.15em;
			text-box: trim-both cap alphabetic;
			font-weight: 700;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.row-num {
			flex: none;
			min-width: 20px;
			font-weight: 700;
			color: var(--color-muted-text);
		}

		.row-meta {
			display: flex;
			align-items: center;
			flex: none;
			font-size: .88rem;
			color: var(--color-muted-text);
		}

		.row :is(svg, img, .icon) {
			width: 16px;
			height: 16px;
		}

		@media (hover: hover) {
			.row:not(:disabled):hover {
				background: var(--soft);
			}

			.row:is(.picked, .current):hover {
				background: var(--accent-hover);
			}
		}

		.row.current {
			background: var(--color-accent);
			color: var(--color-on-accent);
		}

		.row.current .row-num,
		.row.current .row-meta {
			color: inherit;
		}

		.row.picked {
			background: var(--color-accent);
			color: var(--color-on-accent);
		}

		.row.picked .row-meta {
			color: inherit;
			opacity: .8;
			animation: tick-in .22s var(--ease-spring);
		}

		.row:disabled {
			color: var(--color-muted-text);
			cursor: not-allowed;
		}

		.rows {
			display: flex;
			flex-direction: column;
			gap: 2px;
		}

		/*
		 * Boot and chapter loading screen. The spinner fades in after 400ms, so fast
		 * loads never show it, and stays hidden until the saved theme is applied
		 * (:root:not([data-themed])) to avoid flashing the default accent.
		 * .loading--settled pauses that fade during the fixed hand-off hold.
		 */
		.loading {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: var(--color-page-bg);
			z-index: var(--z-loading);
			transition: opacity .5s ease
		}

		.loading.hidden {
			opacity: 0;
			pointer-events: none
		}

		:root:not([data-themed]) .spinner {
			visibility: hidden;
		}

		.spinner {
			width: 28px;
			height: 28px;
			color: var(--color-accent);
			opacity: 0
		}

		.loading:not(.hidden) .spinner {
			animation: spin .8s linear infinite, fadeIn .2s ease .4s forwards
		}

		.loading.loading--settled .spinner {
			animation-play-state: running, paused
		}

		/*
		 * Screens that block the game: .error-overlay (z 5000, scrolls when the details
		 * are long) and .orientation-blocker (body.portrait-blocked: chapters play in
		 * landscape only, only the chapter menu supports portrait).
		 */
		.error-overlay,
		.orientation-blocker {
			position: fixed;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 36px 20px;
			background: var(--color-page-bg);
			color: var(--color-text);
			font-family: var(--font-ui);
		}

		.error-overlay.active,
		body.portrait-blocked .orientation-blocker {
			display: flex;
		}

		.error-overlay {
			z-index: var(--z-error);
			overflow-y: auto;
		}

		.error-overlay__content {
			width: min(480px, 100%);
			margin: auto;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 10px;
		}

		.error-overlay__content > .icon {
			width: 40px;
			height: 40px;
			color: var(--danger);
		}

		.error-overlay__title {
			font-family: var(--font-title);
			font-size: 1.15rem;
			font-weight: 700;
			line-height: 1.15;
			letter-spacing: -.01em;
		}

		.error-overlay__desc {
			margin: 0;
			color: var(--ink-2);
			font-size: 1rem;
			line-height: 1.6;
			max-width: 36ch;
		}

		.error-overlay__actions {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 10px;
			margin-top: 14px;
		}

		.error-details {
			width: 100%;
		}

		.error-details summary,
		.error-details__copy {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			border: 0;
			border-radius: var(--r-pill);
			font-family: var(--font-ui);
			font-weight: 700;
			cursor: pointer;
			transition: background var(--t-fast) ease, color var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
		}

		.error-details summary:active {
			transform: scale(.97);
			transition-duration: var(--t-press);
		}

		.error-details__copy:active {
			transform: scale(.94);
			transition-duration: var(--t-press);
		}

		.error-details summary {
			display: flex;
			width: fit-content;
			margin: 0 auto;
			height: var(--ctl-sm);
			padding: 0 18px;
			color: var(--ink-2);
			font-size: .95rem;
			list-style: none;
		}

		.error-details summary::-webkit-details-marker {
			display: none;
		}

		.error-details summary .icon {
			width: 14px;
			height: 14px;
			transition: transform .2s var(--ease-out);
		}

		.error-details[open] summary .icon {
			transform: rotate(180deg);
		}

		.error-details__panel {
			margin-top: 10px;
			padding: 16px 20px;
			border-radius: var(--r-row);
			background: var(--soft);
			color: var(--ink-2);
			font-size: .92rem;
			line-height: 1.6;
			text-align: left;
			overflow-wrap: anywhere;
		}

		.error-details__panel p {
			margin: 0;
			white-space: pre-line;
		}

		.error-details__panel > :is(p, pre) ~ :is(p, pre) {
			margin-top: 10px;
		}

		.error-details__panel :is(code, pre) {
			font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
			color: var(--color-text);
		}

		.error-details__panel code {
			font-size: .88em;
			padding: 2px 7px;
			border-radius: 6px;
			background: var(--soft-2);
		}

		.error-details__panel pre {
			padding: 12px 16px;
			border-radius: 10px;
			background: var(--color-page-bg);
			font-size: .85rem;
			line-height: 1.7;
			overflow-x: auto;
			overflow-wrap: normal;
		}

		.error-details__panel .error-details__copy {
			float: right;
			height: 32px;
			margin: -8px -12px 6px 12px;
			padding: 0 14px;
			background: var(--soft-2);
			color: var(--color-text);
			font-size: .82rem;
		}

		@media (hover: hover) {
			.error-details summary:hover {
				background: var(--soft);
				color: var(--color-text);
			}

			.error-details__copy:hover {
				background: color-mix(in srgb, var(--color-text) 18%, transparent);
			}
		}

		.sr-only {
			position: absolute !important;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		/*
		 * Modal backdrop. Hidden with visibility as well as opacity, so a closed modal
		 * cannot take focus. contain keeps repaints local.
		 */
		.modal-overlay {
			position: fixed;
			inset: 0;
			background: var(--backdrop);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			z-index: var(--z-modal);
			opacity: 0;
			visibility: hidden;
			transition: opacity var(--t-exit) ease, visibility var(--t-exit) ease;
			contain: layout paint;
		}

		.modal-overlay.active {
			opacity: 1;
			visibility: visible;
			transition: opacity var(--t-exit) ease;
		}

		.modal-content {
			display: flex;
			flex-direction: column;
			width: min(800px, 100%);
			max-height: min(88dvh, 760px);
			overflow: hidden;
			background: var(--color-panel-bg);
			color: var(--color-text);
			border-radius: var(--r-modal);
			box-shadow: var(--shadow-lg);
			font-family: var(--font-ui);
			opacity: 0;
			transform: scale(.96);
			transition: transform var(--t-exit) ease, opacity var(--t-exit) ease;
			will-change: transform, opacity;
		}

		.modal-overlay.active .modal-content {
			opacity: 1;
			transform: none;
			animation: modal-in var(--t-modal) var(--ease-out);
		}

		.modal-content:focus-visible,
		.pause-body:focus-visible {
			outline: none;
		}

		.modal-confirm,
		.modal-list {
			width: fit-content;
			min-width: min(360px, 100%);
			max-width: min(440px, 100%);
		}

		.modal-list {
			min-width: min(440px, 100%);
			max-width: min(640px, 100%);
		}

		.modal-list .row-title {
			overflow-wrap: normal;
		}

		.modal-head {
			display: flex;
			align-items: center;
			gap: 12px;
			min-height: 72px;
			padding: 0 16px 0 24px;
			flex: none;
		}

		.modal-title {
			display: flex;
			align-items: center;
			gap: 16px;
			flex: 1;
			min-width: 0;
			font-size: 1.3rem;
			font-weight: 700;
			line-height: 1.2;
			letter-spacing: -.01em;
		}

		.modal-title .icon {
			width: 22px;
			height: 22px;
			color: var(--color-accent);
		}

		.modal-body {
			flex: 1;
			min-height: 0;
			padding: 0 24px 20px;
			overflow-y: auto;
			overscroll-behavior: contain;
			line-height: 1.6;
			color: var(--ink-2);
		}

		.modal-foot {
			display: flex;
			justify-content: flex-end;
			gap: 10px;
			padding: 16px 24px;
			border-top: 1px solid var(--line);
			background: var(--color-panel-bg);
			flex: none;
		}

		.log-content {
			height: min(80dvh, 760px);
		}

		.log-body {
			contain: content
		}

		.credits-body :is(h1,h2,h3,h4,h5,h6),
		.log-body :is(h1,h2,h3,h4,h5,h6) {
			margin: 1.2em 0 0;
			color: var(--color-text);
		}

		.credits-body :is(h1,h2,h3,h4,h5,h6):first-child,
		.credits-body :is(h1,h2,h3,h4,h5,h6) + :is(h1,h2,h3,h4,h5,h6),
		.log-body :is(h1,h2,h3,h4,h5,h6):first-child,
		.log-body :is(h1,h2,h3,h4,h5,h6) + :is(h1,h2,h3,h4,h5,h6) {
			margin-top: 0
		}

		.log-entry {
			padding: 10px 0;
		}

		.log-entry .character-name {
			margin-bottom: 2px;
			font-size: .95rem;
		}

		.log-entry .text {
			font-size: 1rem;
			line-height: 1.6;
		}

		.log-entry.narration .text {
			color: var(--color-muted-text);
		}

		.log-entry.title,
		.log-entry.image {
			padding: 20px 0;
			text-align: center;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.log-entry.title.only-image {
			min-height: 180px;
		}

		.log-entry.title .title-content,
		.log-entry.image .image-content {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 8px;
			width: 100%;
		}

		.log-entry.title .title-image {
			max-width: 500px;
			max-height: 160px;
			width: auto;
			height: auto;
			object-fit: contain;
			filter: none;
			margin: 5px 0;
		}

		.log-entry.title .title-image.centered {
			margin: 10px 0;
		}

		.log-entry.title .title-name {
			font-size: 1.3rem;
			font-weight: 700;
			line-height: 1.2;
			color: var(--color-text);
		}

		.log-entry.title .title-subtitle {
			font-size: 1.05rem;
			line-height: 1.3;
		}

		.log-entry.image .log-image {
			max-width: 300px;
			max-height: 180px;
			width: auto;
			height: auto;
			border-radius: var(--r-row);
			object-fit: contain;
			margin: 5px 0;
		}

		.log-entry.image .text {
			font-style: italic;
		}

		.log-entry-content {
			display: flex;
			align-items: flex-start;
			gap: 14px
		}

		.log-avatar {
			width: 44px;
			height: 44px;
			border-radius: 50%;
			object-fit: cover;
			flex-shrink: 0
		}

		.log-text-content {
			flex: 1
		}

		.full-screen-overlay,
		/*
		 * Full-screen overlay screens (title, image, end). Variants use the
		 * full-screen-overlay--name modifier.
		 */
		.full-screen-overlay__backdrop {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%
		}

		.full-screen-overlay {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 24px;
			opacity: 0;
			z-index: var(--z-screen)
		}

		.full-screen-overlay,
		.full-screen-overlay * {
			user-select: none;
			cursor: default;
		}

		.full-screen-overlay__backdrop {
			background: var(--dim);
			z-index: -1
		}

		.full-screen-overlay--no-dim .full-screen-overlay__backdrop {
			display: none;
		}

		.full-screen-overlay--title {
			transition: opacity .4s ease-out;
		}

		.full-screen-overlay--title.active {
			opacity: 1;
			transition: opacity 1s ease-in-out;
		}

		.full-screen-overlay--end {
			visibility: hidden;
			pointer-events: none;
			transition: opacity .75s cubic-bezier(.25,.46,.45,.94);
		}

		.full-screen-overlay--end.active {
			visibility: visible;
			pointer-events: auto;
			opacity: 1;
			transition: opacity 2s cubic-bezier(.25,.46,.45,.94);
		}

		.full-screen-overlay .ui-button,
		.full-screen-overlay .ui-button * {
			cursor: pointer;
		}

		.screen-title {
			font-family: var(--font-title);
			font-size: calc(64 * var(--scene-px));
			font-weight: 700;
			line-height: 1.1;
			letter-spacing: -.02em;
			color: var(--color-text);
			margin-bottom: 20px
		}

		.screen-subtitle {
			font-family: var(--font-title);
			font-size: calc(28.8 * var(--scene-px));
			color: var(--color-text)
		}

		.full-screen-overlay--title .screen-title,
		.full-screen-overlay--title .screen-subtitle {
			transition: opacity .3s ease-in-out;
		}

		.full-screen-overlay--end .screen-subtitle {
			margin-bottom: 40px
		}

		.end-actions {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: 10px;
			max-width: 100%;
		}

		/*
		 * When a plugin replaces a whole screen, the engine adds .screen--replaced to it,
		 * which hides the built-in content and keeps the container.
		 */
		.plugin-screen {
			position: absolute;
			inset: 0;
			cursor: auto;
		}

		.screen--replaced > :is(.start-panel, .pause-body, .screen-title, .screen-subtitle, .end-actions) {
			display: none !important;
		}

		.end-actions-row {
			display: contents;
		}

		.title-image {
			max-width: 80%;
			max-height: 300px;
			width: auto;
			height: auto;
			object-fit: contain;
			filter: drop-shadow(0 10px 25px rgba(0,0,0,.5))
		}

		/*
		 * Toasts stack at the top. They are hidden while the controls are hidden or
		 * before the game is active.
		 */
		.toast-container {
			position: fixed;
			inset: 0;
			z-index: var(--z-toast);
			pointer-events: none;
		}

		.toast-stack {
			position: absolute;
			top: calc(var(--bar-edge) + var(--bar) + 8px);
			display: flex;
			flex-direction: column;
			gap: 8px;
			transition: top var(--t-toast) var(--ease-out);
		}

		.toast-stack--left {
			left: var(--bar-edge);
			align-items: flex-start;
		}

		.toast-stack--right {
			right: var(--bar-edge);
			align-items: flex-end;
		}

		:is(body.controls-hidden, body:not(.game-active)) .toast-stack {
			top: 12px;
		}

		.toast {
			display: flex;
			align-items: center;
			gap: 12px;
			min-height: 48px;
			max-width: min(380px, calc(100vw - 2 * var(--bar-edge)));
			padding: 12px 18px 12px 14px;
			border-radius: var(--r-pill);
			background: var(--color-accent);
			color: var(--color-on-accent);
			font-family: var(--font-ui);
			font-size: .95rem;
			font-weight: 700;
			line-height: 1.35;
			box-shadow: var(--shadow-sm);
			cursor: pointer;
			pointer-events: auto;
			user-select: none;
			animation: toast-in var(--t-toast) var(--ease-spring);
		}

		.toast.multi {
			border-radius: var(--r-pop);
		}

		.toast .icon {
			width: 20px;
			height: 20px;
		}

		.toast-count {
			flex: none;
			opacity: .8;
		}

		.toast.hide {
			opacity: 0;
			transform: translateY(-6px);
			pointer-events: none;
			transition: opacity var(--t-exit) ease, transform var(--t-exit) ease;
		}

		.toast.success {
			background: var(--color-success);
			color: #fff;
		}

		.toast.error {
			background: var(--color-error);
			color: #fff;
		}

		/* Tooltip bubble, filled from an element's data-tip. */
		.tooltip {
			position: fixed;
			z-index: var(--z-tooltip);
			padding: 6px 10px;
			border-radius: var(--r-tip);
			background: var(--tip-bg);
			color: var(--tip-fg);
			font-family: var(--font-ui);
			font-size: .8rem;
			font-weight: 700;
			line-height: 1.4;
			white-space: nowrap;
			pointer-events: none;
			animation: fadeIn .12s ease backwards;
		}

		.tooltip.instant {
			animation: none;
		}

		.volume-control,
		.autoplay-control,
		.more-control {
			position: relative;
		}

		.volume-icon-off,
		.muted .volume-icon-on {
			display: none;
		}

		.volume-icon-on,
		.muted .volume-icon-off {
			display: flex;
		}

		.volume-panel,
		.autoplay-panel,
		.more-panel {
			position: absolute;
			top: calc(var(--bar) + 12px);
			right: 0;
			display: flex;
			flex-direction: column;
			padding: 8px 16px;
			background: var(--color-panel-bg);
			color: var(--color-text);
			border-radius: var(--r-pop);
			box-shadow: var(--shadow-md);
			font-family: var(--font-ui);
			opacity: 0;
			visibility: hidden;
			transform: scale(.96);
			transform-origin: top right;
			transition: opacity var(--t-fast) ease, transform var(--t-fast) ease, visibility var(--t-fast) ease;
		}

		.volume-control.open .volume-panel,
		.autoplay-control.open .autoplay-panel,
		.more-control.open .more-panel {
			opacity: 1;
			visibility: visible;
			transform: none;
			transition-duration: var(--t-menu);
			transition-timing-function: var(--ease-spring);
		}

		.volume-panel {
			width: 280px;
			padding-inline: 8px 16px;
		}

		.slider-row {
			display: flex;
			align-items: center;
			gap: 14px;
			min-height: 44px;
		}

		.slider-value {
			flex: none;
			min-width: 5ch;
			text-align: end;
			font-size: .88rem;
			color: var(--color-muted-text);
		}

		.autoplay-panel {
			width: 260px;
		}

		.more-panel {
			width: max-content;
			min-width: 200px;
			max-width: 280px;
			padding: 8px;
			border-radius: var(--r-menu);
		}

		.more-panel .row {
			min-height: 44px;
			padding: 0 16px;
			font-size: .95rem;
		}

		.setting {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			min-height: 44px;
		}

		.setting-label {
			font-size: .95rem;
			font-weight: 700;
		}

		.autoplay-options {
			display: flex;
			flex-direction: column;
			gap: 8px;
			overflow: hidden;
			max-height: 0;
			opacity: 0;
			transition: max-height .25s ease, opacity .2s ease, margin-top .25s ease;
		}

		.autoplay-control.autoplay-on .autoplay-options {
			max-height: 200px;
			opacity: 1;
			margin-bottom: 8px;
		}

		.autoplay-section {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.autoplay-section .setting {
			min-height: 0;
		}

		/*
		 * Range inputs are restyled so the track and thumb follow --track and --thumb.
		 * Both are registered @property values, so .held can grow them smoothly.
		 */
		.slider {
			--track: 6px;
			--thumb: 20px;
			position: relative;
			z-index: 1;
			display: block;
			width: 100%;
			height: 32px;
			margin: 0;
			background: transparent;
			cursor: pointer;
			-webkit-appearance: none;
			appearance: none;
			transition: --track .16s var(--ease-spring), --thumb .16s var(--ease-spring);
		}

		.slider.held {
			--track: 10px;
			--thumb: 24px;
		}

		.slider::-webkit-slider-runnable-track {
			height: var(--track);
			border-radius: var(--r-pill);
			background:
				linear-gradient(var(--fill-color, var(--color-accent)), var(--fill-color, var(--color-accent))) left/var(--fill, 0%) 100% no-repeat,
				var(--soft-2);
		}

		.slider::-moz-range-track {
			height: var(--track);
			border-radius: var(--r-pill);
			background: var(--soft-2);
		}

		.slider::-moz-range-progress {
			height: var(--track);
			border-radius: var(--r-pill);
			background: var(--fill-color, var(--color-accent));
		}

		.slider::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: var(--thumb);
			height: var(--thumb);
			margin-top: calc((var(--track) - var(--thumb)) / 2);
			border-radius: 50%;
			background: #fff;
			box-shadow: var(--shadow-sm);
		}

		.slider::-moz-range-thumb {
			width: var(--thumb);
			height: var(--thumb);
			border: 0;
			border-radius: 50%;
			background: #fff;
			box-shadow: var(--shadow-sm);
		}

		.slider-wrap {
			position: relative;
			display: flex;
			flex: 1;
			align-items: center;
			min-width: 0;
		}

		.slider-wave {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			overflow: visible;
			pointer-events: none;
		}

		.slider-wave path {
			fill: none;
			stroke: var(--color-accent);
			stroke-linecap: round;
		}

		.slider-ticks {
			position: absolute;
			left: 8px;
			right: 8px;
			top: 50%;
			transform: translateY(-50%);
			display: flex;
			justify-content: space-between;
			align-items: center;
			pointer-events: none;
		}

		.slider-ticks span {
			width: 4px;
			height: 4px;
			border-radius: 50%;
			background: color-mix(in srgb, var(--color-text) 45%, transparent);
		}

		.switch {
			position: relative;
			flex: none;
			width: 48px;
			height: 28px;
			border: 0;
			border-radius: var(--r-pill);
			background: color-mix(in srgb, var(--color-text) 22%, transparent);
			cursor: pointer;
			transition: background var(--t-fast) ease;
		}

		.switch::after {
			content: '';
			position: absolute;
			top: 3px;
			left: 3px;
			width: 22px;
			height: 22px;
			border-radius: 50%;
			background: #fff;
			transition: transform .24s var(--ease-spring), width .14s var(--ease-out);
		}

		.switch:active::after {
			width: 28px;
		}

		.switch[aria-checked="true"]:active::after {
			transform: translateX(14px);
		}

		.switch[aria-checked="true"] {
			background: var(--color-accent);
		}

		.switch[aria-checked="true"]::after {
			transform: translateX(20px);
		}

		.autoplay-icon {
			display: grid;
		}

		.autoplay-icon > .icon {
			grid-area: 1 / 1;
		}

		.control-button.autoplay.active .autoplay-ring {
			animation: spin 4s linear infinite;
		}

		.autoplay-progress {
			position: absolute;
			left: 0;
			bottom: 0;
			width: 100%;
			height: 4px;
			z-index: var(--z-top-controls);
			opacity: 0;
			visibility: hidden;
			transition: opacity .2s ease, visibility .2s ease;
			pointer-events: none;
		}

		.autoplay-progress.visible {
			opacity: 1;
			visibility: visible;
		}

		.autoplay-progress__bar {
			width: 100%;
			height: 100%;
			background: var(--color-accent);
			transform: scaleX(0);
			transform-origin: left center;
			will-change: transform;
		}

		.control-button.typewriter {
			overflow: hidden;
		}

		/*
		 * The typewriter button's off state is pure CSS, driven by
		 * body[data-typewriter-enabled].
		 */
		body[data-typewriter-enabled="false"] .control-button.typewriter::before {
			content: '';
			position: absolute;
			inset: 0;
			margin: auto;
			width: 26px;
			height: 2px;
			border-radius: 1px;
			background: currentColor;
			transform: rotate(-45deg);
			pointer-events: none;
		}

		body[data-typewriter-enabled="false"] .control-button.typewriter .icon {
			opacity: .6;
		}

		.fullscreen-icon {
			display: flex;
		}

		.control-button.fullscreen .fullscreen-icon-exit,
		.control-button.fullscreen.fullscreen-active .fullscreen-icon-enter {
			display: none;
		}

		.control-button.fullscreen.fullscreen-active .fullscreen-icon-exit {
			display: flex;
		}

		/*
		 * Start gate: the first click or tap. Browsers refuse to play audio before a
		 * user gesture, and this screen provides it. .start-gate--resume offers
		 * Continue and Restart instead.
		 */
		.start-gate {
			position: fixed;
			inset: 0;
			background: var(--color-page-bg);
			z-index: var(--z-start-gate);
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
			transition: opacity .6s ease, visibility .6s ease;
			text-align: center;
			padding: 28px;
			cursor: pointer;
		}

		.start-gate--resume {
			cursor: default;
		}

		.start-gate.active {
			opacity: 1;
			visibility: visible;
			pointer-events: auto;
		}

		.start-gate.hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}

		.start-panel {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 12px;
			max-width: min(620px, 92vw);
			transition: opacity .4s ease;
		}

		.start-panel.starting {
			opacity: 0;
			pointer-events: none;
		}

		.start-title {
			font-family: var(--font-title);
			font-size: 2.4rem;
			font-weight: 700;
			line-height: 1.15;
			letter-spacing: -.02em;
			color: var(--color-text);
		}

		.start-gate:not(.start-gate--resume) .start-title {
			font-size: 1.75rem;
			color: var(--ink-2);
		}

		.start-subtitle {
			color: var(--ink-2);
			font-size: 1.1rem;
			line-height: 1.5;
			max-width: 52ch;
		}

		.start-actions {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			justify-content: center;
			margin-top: 16px;
		}

		/*
		 * Pause menu. A two-column grid; --pause-step sets the vertical rhythm of the
		 * buttons.
		 */
		.pause-menu {
			background: rgba(0, 0, 0, .78);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			z-index: var(--z-pause);
			padding: 24px;
			overflow: hidden;
			font-family: var(--font-ui);
			--pause-step: calc(var(--ctl) + 2px);
		}

		.pause-body {
			display: grid;
			grid-template-columns: minmax(0, 34fr) minmax(0, 40fr);
			align-items: center;
			gap: 6vw;
			width: min(1040px, 100%);
			max-height: 100%;
		}

		.pause-menu.active .pause-body {
			animation: modal-in var(--t-modal) var(--ease-out);
		}

		.pause-menu.pause-solo .pause-body {
			grid-template-columns: minmax(0, 360px);
			justify-content: center;
		}

		.pause-left {
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
			gap: 8px;
			min-width: 0;
		}

		.pause-left .ui-button {
			width: clamp(200px, 25vw, 320px);
			max-width: 100%;
		}

		.pause-logo-img {
			display: block;
			max-width: min(300px, 100%);
			max-height: 140px;
			object-fit: contain;
			margin: 0 auto 20px;
		}

		.pause-chapter {
			font-family: var(--font-title);
			font-size: 1.9rem;
			font-weight: 700;
			line-height: 1.2;
			letter-spacing: -.01em;
			color: var(--color-text);
			margin: 0 0 24px;
			user-select: none;
		}

		.pause-right {
			display: flex;
			flex-direction: column;
			gap: 8px;
			min-width: 0;
			padding-top: 16px;
			border-radius: var(--r-card);
			background: var(--art-surface);
			overflow: hidden;
		}

		.pause-right.hidden {
			display: none;
		}

		.pause-right-head {
			display: flex;
			justify-content: space-between;
			gap: 16px;
			padding: 0 32px;
			overflow-y: hidden;
			scrollbar-gutter: stable both-edges;
		}

		.pause-count {
			font-weight: 400;
		}

		.pause-list {
			position: relative;
			max-height: calc(min(82vh, 640px) - 56px);
			max-height: calc(round(down, min(82vh, 640px) - 56px - var(--pause-step) / 2, var(--pause-step)) + var(--pause-step) / 2);
			padding: 0 12px 12px;
			overflow-y: auto;
			overscroll-behavior: contain;
			scrollbar-gutter: stable both-edges;
			-webkit-mask-image: linear-gradient(transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent);
			mask-image: linear-gradient(transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent);
			transition: --fade-top var(--t-fast) ease, --fade-bottom var(--t-fast) ease;
		}

		.pause-list[data-more~="above"] {
			--fade-top: 32px;
		}

		.pause-list[data-more~="below"] {
			--fade-bottom: 40px;
		}

		@media (hover: hover) {
			.pause-list .row:not(:disabled):not(.current):hover {
				background: var(--soft-2);
			}
		}

		.pause-assets {
			position: absolute;
			bottom: 12px;
			left: 50%;
			transform: translateX(-50%);
			max-width: 92vw;
			text-align: center;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-size: .72rem;
			color: var(--color-muted-text);
			user-select: all;
		}

		.pause-menu:not(.show-debug) .pause-assets {
			display: none;
		}

		/*
		 * Chapter-select menu. It is the only screen that also works in portrait. Sizes
		 * are in em, from a font-size that grows with the viewport. --menu-fade is the
		 * scrim that keeps text legible over any background, --menu-pad the side
		 * padding.
		 */
		.chapter-select {
			position: fixed;
			inset: 0;
			overflow: hidden;
			background: var(--menu-fade), var(--color-page-bg);
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			z-index: var(--z-chapter-select);
			opacity: 0;
			transition: opacity .8s cubic-bezier(.25,.46,.45,.94);
			font-size: clamp(14px, 8px + .8vw, 16px);
			--menu-pad: clamp(24px, 6vw, 96px);
			--menu-fade: linear-gradient(90deg, rgba(0, 0, 0, .74) 0%, rgba(0, 0, 0, .62) 24%, rgba(0, 0, 0, .4) 44%, rgba(0, 0, 0, .15) 62%, rgba(0, 0, 0, 0) 78%);
		}

		.chapter-select--few {
			font-size: clamp(16px, 9px + .8vw, 19px);
		}

		.menu-scroll {
			position: absolute;
			inset: 0;
			overflow-x: hidden;
			overflow-y: auto;
			scrollbar-width: none;
		}

		.menu-scroll::-webkit-scrollbar {
			display: none;
		}

		.chapter-select.active {
			opacity: 1
		}

		.chapter-select-content {
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: safe center;
			gap: 1.25em;
			width: min(100%, calc(min(30em, 48vw) + 2 * var(--menu-pad)));
			min-height: 100%;
			padding: clamp(5em, 14vh, 8em) var(--menu-pad) 3.5em;
		}

		.chapter-select-content > * {
			flex: none;
		}

		.menu-head {
			display: flex;
			flex-direction: column;
			gap: .5em;
		}

		.game-logo {
			display: block;
			max-width: min(25em, 100%);
			max-height: 12em;
			object-fit: contain;
			object-position: left center;
			margin-bottom: 1.75em;
		}

		.menu-title {
			font-family: var(--font-title);
			font-size: 2.6em;
			font-weight: 700;
			line-height: 1.1;
			letter-spacing: -.02em;
			color: var(--color-text);
		}

		.menu-author {
			font-size: 1.3em;
			font-weight: 700;
			line-height: 1.25;
			color: var(--color-text);
		}

		.menu-author + .menu-synopsis {
			margin-top: .35em;
		}

		.menu-synopsis {
			font-size: 1.05em;
			line-height: 1.6;
			color: var(--color-text);
		}

		.menu-play {
			align-self: flex-start;
			margin-top: .75em;
			height: 3.25em;
			padding: 0 1.75em;
			gap: .6em;
			font-size: 1.1em;
		}

		.menu-play .icon {
			width: 1.15em;
			height: 1.15em;
		}

		.chapter-buttons {
			display: flex;
			flex-direction: column;
			gap: .6em;
		}

		.chapter-button {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			align-items: center;
			column-gap: 1em;
			width: 100%;
			min-height: 4.4em;
			padding: .85em 1.5em;
			border: 0;
			border-radius: 1.25em;

			cursor: pointer;
			transition: background var(--t-fast) ease, transform var(--t-fast) var(--ease-out);

		.chapter-button .row-title {

			}

			.menu-head {
				align-items: center;
				text-align: center;
			}

			.game-logo {
				object-position: center;

			.menu-play {

			.menu-corner {

				justify-content: space-between;
				align-items: center;

			.chapter-select > .menu-corner {

			.modal-overlay {

			.modal-content,

<script>
		// Runs cb after the next paint. Two nested frames: the first commits the style
		// change, the second lets a CSS transition start from it.
		// Engine script. Order: small helpers, shared constants, the manager classes,
		// VisualNovel (the orchestrator), then the boot code at the end. VisualNovel builds
		// every manager, and each manager keeps a private #vn reference and reaches the
		// others through it (vn.scene, vn.audio, vn.ui and so on).
		const forceNextFrame = (cb) => requestAnimationFrame(() => requestAnimationFrame(cb));

		// Flattens an HTML snippet to plain text with collapsed whitespace, for
		// screen-reader announcements.
		const htmlToText = (html) => {
			if (html == null) return '';
			const tmp = document.createElement('div');
			tmp.innerHTML = String(html);
			return (tmp.textContent || '').replace(/\s+/g, ' ').trim();
		};
		// The screen-reader line for a piece of dialogue, "Name says: text", built from the
		// a11y.dialogue string. i18n.t() returns the key itself when a string is missing,
		// so that case falls back to "Name: text".
		const speechLine = (i18n, name, text) => {
			const body = htmlToText(text);
			const who = htmlToText(name);

				pageBackground: '--color-page-bg',
				panelBackground: '--color-panel-bg',
				dialogueBackground: '--color-dialogue-bg',
				success: '--color-success',
				error: '--color-error'

		};

		/**
		 * Typed access to localStorage. Every call is wrapped, because storage can throw
		 * (private browsing, blocked site data, quota) and the game has to keep running
		 * without it. Keys come from the storage-key constants, which include the page path.
		 */
		class SaveManager {
			#keys;

			constructor(keys) {
				this.#keys = keys;
			}

			/**
			 * Returns `fallback` when the key is missing or storage is unavailable.
			 */
			#safeGet(key, fallback = null) {
				try {
					const raw = localStorage.getItem(key);
					return raw === null ? fallback : raw;
				} catch (e) {
					return fallback;
				}
			}

			#safeSet(key, value) {
				try { localStorage.setItem(key, String(value)); } catch (e) {  }
			}

			#safeRemove(key) {
				try { localStorage.removeItem(key); } catch (e) {  }
			}

			/**
			 * A missing or invalid value means full volume. Valid values are clamped to 0-1.
			 */
			getVolume() {
				const raw = this.#safeGet(this.#keys.volume);
				if (raw === null || raw === '') return 1;
				const value = Number(raw);
				return Number.isFinite(value) ? clamp(value, 0, 1) : 1;
			}

			setVolume(value) {
				this.#safeSet(this.#keys.volume, value);
			}

			getTypewriter() {
				return this.#safeGet(this.#keys.typewriter);
			}

			setTypewriter(enabled) {
				this.#safeSet(this.#keys.typewriter, enabled);
			}

			/**
			 * Checkpoint progress is a single JSON object. A corrupt value is discarded.
			 */
			loadCheckpointStore() {
				try { return JSON.parse(this.#safeGet(this.#keys.checkpoint, '{}') || '{}'); } catch (e) { return {}; }
			}

			saveCheckpointStore(store) {
				this.#safeSet(this.#keys.checkpoint, JSON.stringify(store));
			}

			clearCheckpointStore() {
				this.#safeRemove(this.#keys.checkpoint);
			}

			getLanguage() {
				return this.#safeGet(this.#keys.language);
			}

			setLanguage(code) {
				this.#safeSet(this.#keys.language, code);
			}

			/**
			 * An index into AUTOPLAY_SPEEDS, or null when unset or not an integer.
			 */
			getAutoplaySpeed() {
				const raw = this.#safeGet(this.#keys.autoplaySpeed);
				if (raw === null || raw === '') return null;
				const value = Number(raw);
				return Number.isInteger(value) ? value : null;
			}

			setAutoplaySpeed(index) {
				this.#safeSet(this.#keys.autoplaySpeed, index);
			}

			getAutoplayProgress() {
				return this.#safeGet(this.#keys.autoplayProgress);
			}

			/**
			 * Caches the resolved theme CSS, which the script in <head> applies before the
			 * first paint on the next visit.
			 */
			setTheme(style) {
				this.#safeSet(this.#keys.theme, style);
			}

			setAutoplayProgress(enabled) {
				this.#safeSet(this.#keys.autoplayProgress, enabled);
			}
		}

		/**
		 * Reads the language layout of config.yaml. Either every key sits at the top level
		 * (optionally with `language: en`), or each BCP 47 code (fr, pt-BR, ...) is a
		 * top-level block that overrides the shared keys.
		 */
		class LanguageManager {

			static BCP47 = /^[a-z]{2,3}(-[a-z0-9]{2,8})*$/i;

			constructor(rawConfig = {}) {
				this.raw = rawConfig && typeof rawConfig === 'object' ? rawConfig : {};
				const blocks = Object.keys(this.raw).filter(key => LanguageManager.BCP47.test(key) && isPlainObject(this.raw[key]));
				const main = typeof this.raw.language === 'string' && LanguageManager.BCP47.test(this.raw.language) ? this.raw.language : null;
				this.languages = main && !blocks.includes(main) ? [main, ...blocks] : blocks;
				const declared = main ?? this.raw.defaultLanguage;
				this.defaultLanguage = this.languages.includes(declared) ? declared : (this.languages[0] || null);
			}

			hasMultiple() {
				return this.languages.length > 1;
			}

			resolveActive(requested) {
				if (requested && this.languages.includes(requested)) return requested;
				return this.defaultLanguage;
			}

			getGlobalConfig() {
				const out = {};
				for (const key of Object.keys(this.raw)) {
					if (key === 'language' || key === 'defaultLanguage' || this.languages.includes(key)) continue;
					out[key] = this.raw[key];
				}
				return out;
			}

			/**
			 * Merge order, later wins: shared keys, the default language's block, the active
			 * language's block. `settings` and `theme` merge key by key. `chapters` is replaced
			 * whole: the active language's list, else the default's, else the shared one.
			 */
			getMergedMeta(activeCode) {
				if (!this.languages.length) return this.raw;
				const global = this.getGlobalConfig();
				const base = this.raw[this.defaultLanguage] || {};
				const active = this.raw[activeCode] || {};
				return {
					...global,
					...base,
					...active,
					settings: { ...(global.settings || {}), ...(base.settings || {}), ...(active.settings || {}) },
					theme: { ...(global.theme || {}), ...(base.theme || {}), ...(active.theme || {}) },

					chapters: active.chapters || base.chapters || global.chapters || []
				};
			}
		}

				"startGate": {

					"clickToStart": "Click to start",
					"continueTitle": "Continue?",
					"resumeFrom": "Resume from {checkpoint}?",
					"checkpointNamed": "checkpoint \"{name}\"",
					"lastCheckpoint": "your last checkpoint",

				},

					"nextChapter": "Next chapter",
					"copied": "Copied",
					"copyFailed": "Couldn't copy"
				},
				"toast": { "checkpointUnlocked": "Checkpoint unlocked: {name}" },

				"reset": {

					"title": "Reset progress?",
					"desc": "This will delete all saved progress and unlocked checkpoints.",

				},

				"cookies": { "tooltip": "Cookie settings" },

					"networkDesc": "Couldn't load the next part of the story. Check your connection and try again.",

			constructor() {
				this.strings = I18nManager.EMBEDDED_FALLBACK;

			/**
			 * Tries lang/<code>.json, then lang/<primary subtag>.json (fr-FR, then fr). The
			 * first file that parses to an object replaces the strings. A missing file is
			 * normal: the game just stays in English.
			 */
			async load(configLanguage) {
				const code = this.code = String(configLanguage || '');
				this.strings = I18nManager.EMBEDDED_FALLBACK;
				for (const candidate of new Set([code, code.split('-')[0]])) {
					if (!candidate) continue;
					try {
						const res = await fetch(`lang/${candidate}.json`);
						const pack = res.ok ? await res.json() : null;
						if (isPlainObject(pack)) { this.strings = pack; break; }
					} catch (e) {  }
				}
				return this.strings;
			}

			/**
			 * Looks up a dotted path such as 'controls.mute'. Sources, in priority order: the
			 * calling plugin's own strings (the pack's `plugins.<name>` section, then the
			 * plugin's `strings` for this language, its primary subtag, en, or its first entry),
			 * then the loaded pack, then built-in English. Returns the path itself when nothing
			 * matches. {name} placeholders come from vars; unknown ones are left as written.
			 */
			t(path, vars = null, plugin = null) {
				const lookup = (source) => path.split('.').reduce((acc, key) => (acc == null ? acc : acc[key]), source);
				const mine = isPlainObject(plugin?.def.strings) ? plugin.def.strings : {};
				const own = plugin ? [this.strings.plugins?.[plugin.name], mine[this.code], mine[this.code.split('-')[0]], mine.en, Object.values(mine)[0]] : [];
				let value = [...own, this.strings, I18nManager.EMBEDDED_FALLBACK].map(lookup).find(found => typeof found === 'string');
				if (value === undefined) return path;
				if (vars) {
					value = value.replace(/\{(\w+)\}/g, (match, name) =>
						(name in vars ? String(vars[name]) : match));
				}
				return value;
			}

			/**
			 * Fills elements marked data-i18n (text), data-i18n-html, data-i18n-title
			 * (tooltip), data-i18n-alt and data-i18n-label (aria-label). dir=auto keeps
			 * right-to-left strings laid out correctly.
			 */
			translateDom(root = document, plugin = null) {
				root.querySelectorAll('[data-i18n]').forEach(el => {
					el.textContent = this.t(el.dataset.i18n, null, plugin);
					el.dir = 'auto';
				});
				root.querySelectorAll('[data-i18n-html]').forEach(el => {
					el.innerHTML = this.t(el.dataset.i18nHtml, null, plugin);
					el.dir = 'auto';
				});
				root.querySelectorAll('[data-i18n-title]').forEach(el => {
					setTip(el, this.t(el.dataset.i18nTitle, null, plugin));
				});
				root.querySelectorAll('[data-i18n-alt]').forEach(el => {
					el.alt = this.t(el.dataset.i18nAlt, null, plugin);
				});
				root.querySelectorAll('[data-i18n-label]').forEach(el => {
					el.ariaLabel = this.t(el.dataset.i18nLabel, null, plugin);
				});
			}
		}

		/**
		 * Owns every file the story loads. Same-origin files are downloaded whole into
		 * memory and played from a blob: URL, so nothing streams or revalidates mid-scene;
		 * cross-origin files, which can't be read that way, are used by plain URL.
		 *
		 * Loading is windowed: only the scenes around the player stay resident.
		 * Terminology: an *active* scene waits for the player's click, a *passive* one
		 * (background, audio, sprites...) runs by itself. Passive scenes plus the active
		 * scene they lead into form a *cluster*, and none of a cluster runs until every
		 * file it needs is ready.
		 */
		class AssetManager {
			#vn;
			/**
			 * path -> blob: URL of the downloaded copy
			 */
			#urls = new Map();
			/**
			 * path -> loaded Image
			 */
			#images = new Map();
			/**
			 * paths that are fully loaded and verified
			 */
			#ready = new Set();
			/**
			 * path -> load in flight, shared by everyone asking for it
			 */
			#promises = new Map();
			/**
			 * evicted blob: URLs waiting to be revoked once nothing displays them
			 */
			#retired = new Set();
			/**
			 * bumped to make the workers of an older preload queue stop
			 */
			#preloadToken = 0;
			/**
			 * the window in active-scene ordinals: where it was last computed, and its bounds
			 */
			#lastWindowOrdinal = -1;
			#windowStartOrd = 0;
			#windowEndOrd = 0;

			constructor(vn) {
				this.#vn = vn;
				this.assetsToLoad = [];
				this.script = [];
				this.activeIndices = [];
			}

			/**
			 * Called when the script is replaced. Bumping the token stops the previous
			 * chapter's preload workers.
			 */
			reset() {
				this.assetsToLoad = [];
				this.script = [];
				this.activeIndices = [];
				this.#lastWindowOrdinal = -1;
				this.#windowStartOrd = 0;
				this.#windowEndOrd = 0;
				this.#preloadToken++;
			}

			/**
			 * The URL to use for a path: its blob: URL once downloaded, else the path itself,
			 * or '' for an empty path. Everything that displays or plays an asset goes through
			 * this.
			 */
			url(src) {
				return hasAsset(src) ? (this.#urls.get(src) || src) : '';
			}

			/**
			 * data: URIs are inline and need no loading.
			 */
			loadableSrc(src) {
				return hasAsset(src) && !src.startsWith('data:');
			}

			/**
			 * Every file a compiled scene uses: the built-in ones for its type, plus any extra
			 * paths it declares in `assets`.
			 */
			sceneAssetSrcs(scene) {
				return scene ? [...this.#builtInSrcs(scene), ...(scene.assets || [])] : [];
			}

			/**
			 * Which fields hold files, by scene type. An audio scene only needs its file when
			 * it plays; stop, pause and volume carry none.
			 */
			#builtInSrcs(scene) {
				switch (scene.type) {
					case 'background':
					case 'image':
					case 'video':
						return [scene.asset];
					case 'audio':
						return scene.action && scene.action !== 'play' ? [] : [scene.asset];
					case 'single':
						return [scene.avatar];
					case 'multi':
						return (scene.characters || []).map(char => char.avatar);
					case 'conversation':
						return [
							...(scene.characters || []).map(char => char.avatar),
							...(scene.dialogue || []).map(line => line.avatar)
						];
					case 'title':
					case 'end':
						return [scene.image];
					case 'sprite':
						return [scene.asset];
					case 'sprites':
						return (scene.sprites || []).map(sprite => sprite.asset);
					default:
						return [];
				}
			}

			/**
			 * The unique loadable paths of `srcs` that are not ready yet.
			 */
			pending(srcs) {
				return [...new Set(srcs)].filter(src => this.loadableSrc(src) && !this.#ready.has(src));
			}

			/**
			 * First scene of the cluster containing `index`: walks back over the passive
			 * scenes directly before it.
			 */
			clusterStart(index) {
				let i = Math.min(index, this.script.length - 1);
				while (i > 0 && this.script[i - 1]?.isPassive) i--;
				return i;
			}

			/**
			 * Last scene of the cluster: walks forward over passive scenes and stops on the
			 * first active one.
			 */
			#clusterEnd(index) {
				let i = Math.max(0, index);
				while (i < this.script.length - 1 && this.script[i]?.isPassive) i++;
				return i;
			}

			/**
			 * Every file from `index` to the end of its cluster.
			 */
			clusterSrcs(index) {
				const srcs = [];
				for (let i = index, end = this.#clusterEnd(index); i <= end; i++) srcs.push(...this.sceneAssetSrcs(this.script[i]));
				return srcs;
			}

			/**
			 * The files needed to start at `index` without playing what leads up to it, as on a
			 * resume or a checkpoint jump. It replays the state-setting scenes before it
			 * without running them: the last background, the sprites still on stage
			 * (show, hide, clear) and the audio still playing, then adds the target cluster's
			 * own files. Audio is only replayed from the restore point's cluster onward.
			 */
			restoreSrcs(restoreIndex, index) {
				const end = this.#clusterEnd(index);
				const audioFrom = restoreIndex < 0 ? 0 : this.clusterStart(restoreIndex);
				let background = null;
				const sprites = new Map();
				const audio = new Map();
				const applySprite = (command) => {
					const action = command.action || (hasAsset(command.asset) ? 'show' : 'hide');
					if (action === 'clear') sprites.clear();
					else if (action === 'hide') sprites.delete(command.id);
					else if (hasAsset(command.asset)) sprites.set(command.id, command.asset);
				};
				for (let i = 0; i < end; i++) {
					const scene = this.script[i];
					if (scene?.type === 'background') background = scene.asset;
					else if (scene?.type === 'sprite') applySprite(scene);
					else if (scene?.type === 'sprites') (scene.sprites || []).forEach(applySprite);
					else if (scene?.type === 'audio' && i >= audioFrom) {
						if (scene.action === 'play') audio.set(scene.id, scene.asset);
						else if (scene.action === 'stop') scene.id ? audio.delete(scene.id) : audio.clear();
					}
				}
				return [background, ...sprites.values(), ...audio.values(), ...this.sceneAssetSrcs(this.script[end])];
			}

			/**
			 * Called with a freshly compiled script. Builds assetsToLoad, the ordered,
			 * de-duplicated list of every loadable path (it feeds the loading totals and the
			 * missing-file check), and activeIndices, the positions of the active scenes. The
			 * preload window is measured in active scenes, not raw ones.
			 */
			collectAssets(script) {
				this.script = script;
				const seen = new Set();
				this.assetsToLoad = [];
				this.activeIndices = [];
				this.#lastWindowOrdinal = -1;
				script.forEach((scene, i) => {
					if (!scene?.isPassive) this.activeIndices.push(i);
					this.sceneAssetSrcs(scene).forEach(src => {
						if (!this.loadableSrc(src) || seen.has(src)) return;
						seen.add(src);
						this.assetsToLoad.push(src);
					});
				});
			}

			/**
			 * Test-loads a media file, muted, in a throwaway element until `event` fires, then
			 * releases it, so the browser has shown it can decode the file before a scene
			 * needs it. `corrupt` is set when the failing source was our own blob: copy,
			 * because downloading it again would not help.
			 */
			#loadMedia(src, url, event) {
				return new Promise((resolve, reject) => {
					const media = document.createElement(isVideoAsset(src) ? 'video' : 'audio');
					const settle = (error) => {
						media.removeEventListener(event, ok);
						media.removeEventListener('error', fail);
						unloadMedia(media);
						if (error) reject(error); else resolve();
					};
					const ok = () => settle();
					const fail = () => settle(Object.assign(new Error('media load failed: ' + src), { src, corrupt: url !== src }));
					media.addEventListener(event, ok);
					media.addEventListener('error', fail);
					media.muted = true;
					media.preload = event === 'loadedmetadata' ? 'metadata' : 'auto';
					media.src = url;
				});
			}

			/**
			 * Loads and decodes an image. decode() is raced against a timer because in a
			 * hidden tab it can stay pending forever and would stall loading.
			 */
			async #loadImage(src, url) {
				const img = new Image();
				await new Promise((resolve, reject) => {
					img.onload = resolve;
					img.onerror = () => reject(Object.assign(new Error('image load failed: ' + src), { src, corrupt: url !== src }));
					img.src = url;
				});
				await Promise.race([img.decode().catch(() => {}), delay(TIMINGS.imageDecode)]);
				this.#images.set(src, img);
			}

			/**
			 * Downloads one file. Same-origin: fetch it, wrap it in a blob: URL, verify it by
			 * loading it, then record it in #urls. A network error (TypeError) on a
			 * cross-origin file means CORS forbids reading it, so it is checked by plain URL
			 * instead; on a same-origin file, or for any HTTP error, it is thrown. Files that
			 * are neither media nor images are only fetched, which confirms they exist.
			 * `missing` (403, 404, 410) and `corrupt` on a thrown error stop retries.
			 */
			async loadOnce(src) {
				let blob;
				try {
					const response = await fetch(src);
					if (!response.ok) throw Object.assign(new Error(`${response.status} ${src}`), { src, missing: isMissingStatus(response.status) });
					blob = await response.blob();
				} catch (e) {
					if (!(e instanceof TypeError) || isSameOrigin(src)) throw Object.assign(e, { src });
					if (isFileAsset(src)) return;
					return isAudioAsset(src) || isVideoAsset(src) ? this.#loadMedia(src, src, 'loadeddata') : this.#loadImage(src, src);
				}
				if (isFileAsset(src)) return;
				const url = URL.createObjectURL(blob);
				try {
					if (isAudioAsset(src) || isVideoAsset(src)) await this.#loadMedia(src, url, 'loadedmetadata');
					else await this.#loadImage(src, url);
				} catch (e) {
					URL.revokeObjectURL(url);
					throw e;
				}
				this.#urls.set(src, url);
			}

			/**
			 * Up to three attempts, a second apart, for transient failures. A missing file or
			 * a corrupt download fails at once.
			 */
			async #loadWithRetry(src, attempts = 3) {
				for (let attempt = 1; ; attempt++) {
					try {
						return await this.loadOnce(src);
					} catch (e) {
						if (e.missing || e.corrupt || attempt >= attempts) throw e;
						await delay(TIMINGS.assetRetry);
					}
				}
			}

			/**
			 * The one entry point for loading a file. Everyone asking for a path shares a
			 * single promise, and a failed one is forgotten so a later call can try again.
			 */
			ensureAsset(src) {
				if (!this.loadableSrc(src) || this.#ready.has(src)) return Promise.resolve();
				if (this.#promises.has(src)) return this.#promises.get(src);
				const promise = this.#loadWithRetry(src)
					.then(() => { this.#ready.add(src); })
					.catch(err => {
						if (this.#promises.get(src) === promise) this.#promises.delete(src);
						throw err;
					});
				this.#promises.set(src, promise);
				return promise;
			}

			/**
			 * Counts for the pause menu's debug line.
			 */
			debugSummary() {
				const counts = { img: [0, 0], audio: [0, 0], video: [0, 0] };
				for (const src of this.assetsToLoad) {
					const count = counts[isAudioAsset(src) ? 'audio' : isVideoAsset(src) ? 'video' : 'img'];
					count[1]++;
					if (this.#ready.has(src)) count[0]++;
				}
				return {
					ready: counts.img[0] + counts.audio[0] + counts.video[0],
					total: this.assetsToLoad.length,
					imgReady: counts.img[0], imgTotal: counts.img[1],
					audioReady: counts.audio[0], audioTotal: counts.audio[1],
					videoReady: counts.video[0], videoTotal: counts.video[1],
					resident: this.#ready.size,
					activeTotal: this.activeIndices.length,
					windowStart: this.#windowStartOrd,
					windowEnd: this.#windowEndOrd
				};
			}

			/**
			 * The paths the server reports as missing (an uncached HEAD request each).
			 * Network failures are ignored.
			 */
			async findMissingAssets() {
				const missing = [];
				await Promise.all(this.assetsToLoad.map(async src => {
					try {
						const res = await fetch(src, { method: 'HEAD', cache: 'no-store' });
						if (isMissingStatus(res.status)) missing.push(src);
					} catch (e) {  }
				}));
				return missing;
			}

			/**
			 * Loads what is needed to start at `index`. Errors are ignored here.
			 */
			async preloadInitialAssets(index = 0) {
				await Promise.all(this.pending(this.restoreSrcs(index - 1, index)).map(src => this.ensureAsset(src).catch(() => {})));
			}

			/**
			 * Binary search: how many active scenes lie before scriptIndex.
			 */
			#activeOrdinal(scriptIndex) {
				const a = this.activeIndices;
				let lo = 0, hi = a.length;
				while (lo < hi) {
					const mid = (lo + hi) >> 1;
					if (a[mid] < scriptIndex) lo = mid + 1; else hi = mid;
				}
				return lo;
			}

			/**
			 * The inverse: the script position of the n-th active scene, clamped to the ends
			 * of the script.
			 */
			#scriptIndexAtOrdinal(ordinal) {
				const a = this.activeIndices;
				if (ordinal <= 0) return 0;
				if (ordinal >= a.length) return this.script.length - 1;
				return a[ordinal];
			}

			/**
			 * The paths to keep resident around `currentIndex`, in load order: `lookahead`
			 * active scenes ahead, `history` behind (so going back and the log still work),
			 * and, out to `heavyLookahead`, audio and video only.
			 */
			#windowQueue(currentIndex, p) {
				const queue = new Set();
				const add = (from, to, heavyOnly = false) => {
					for (let i = Math.max(0, from); i <= to && i < this.script.length; i++) {
						this.sceneAssetSrcs(this.script[i]).forEach(src => {
							if (this.loadableSrc(src) && (!heavyOnly || isAudioAsset(src) || isVideoAsset(src))) queue.add(src);
						});
					}
				};
				const endIdx = this.#scriptIndexAtOrdinal(p + PRELOAD_WINDOW.lookahead);
				add(currentIndex, endIdx);
				add(this.#scriptIndexAtOrdinal(p - PRELOAD_WINDOW.history), currentIndex - 1);
				add(endIdx + 1, this.#scriptIndexAtOrdinal(p + PRELOAD_WINDOW.heavyLookahead), true);
				return [...queue];
			}

			/**
			 * The blob: URLs still referenced by the DOM (src attributes, inline styles) or by
			 * an audio track, so they are not revoked while something shows them.
			 */
			#urlsInUse() {
				const used = new Set();
				document.querySelectorAll('[src^="blob:"]').forEach(el => used.add(el.getAttribute('src')));
				document.querySelectorAll('[style*="blob:"]').forEach(el => {
					(el.getAttribute('style').match(/blob:[^'")\s]+/g) || []).forEach(url => used.add(url));
				});
				this.#vn.audio.audioTracks.forEach(track => used.add(track.audio.getAttribute('src')));
				return used;
			}

			/**
			 * Drops everything outside `keep`. A blob: URL is revoked only once nothing uses
			 * it; #retired holds the ones still in use until a later pass.
			 */
			#evictOutside(keep) {
				for (const src of this.#ready) {
					if (keep.has(src)) continue;
					const url = this.#urls.get(src);
					if (url) this.#retired.add(url);
					this.#urls.delete(src);
					this.#images.delete(src);
					this.#ready.delete(src);
					this.#promises.delete(src);
				}
				if (!this.#retired.size) return;
				const used = this.#urlsInUse();
				for (const url of this.#retired) {
					if (used.has(url)) continue;
					URL.revokeObjectURL(url);
					this.#retired.delete(url);
				}
			}

			/**
			 * Downloads the queue with `parallel` workers. A newer token, from updateWindow or
			 * reset, makes the workers of an older queue stop.
			 */
			async #streamQueue(queue, onProgress) {
				const token = ++this.#preloadToken;
				let next = 0;
				const worker = async () => {
					while (this.#preloadToken === token && next < queue.length) {
						const src = queue[next++];
						if (this.#ready.has(src)) continue;
						await this.ensureAsset(src).catch(() => {});
						onProgress?.();
					}
				};
				await Promise.all(Array.from({ length: PRELOAD_WINDOW.parallel }, worker));
			}

			/**
			 * Called as the player advances. The window is recomputed only when the active-scene
			 * ordinal changed. What fell out of it is evicted, then what is missing is streamed.
			 */
			updateWindow(currentIndex, onProgress = null) {
				if (!this.activeIndices.length) return;
				const p = this.#activeOrdinal(currentIndex);
				if (p === this.#lastWindowOrdinal) return;
				this.#lastWindowOrdinal = p;
				this.#windowStartOrd = Math.max(0, p - PRELOAD_WINDOW.history);
				this.#windowEndOrd = Math.min(this.activeIndices.length - 1, p + PRELOAD_WINDOW.lookahead);

				const queue = this.#windowQueue(currentIndex, p);
				this.#evictOutside(new Set(queue));
				onProgress?.();
				this.#streamQueue(queue, onProgress);
			}
		}

		/**
		 * Music and sound effects. Each `play:` makes a track: an Audio element routed
		 * through the Web Audio graph (element -> per-track gain -> master gain -> speakers),
		 * which gives smooth fades and one master volume. If Web Audio is unavailable, a
		 * track falls back to plain element.volume scaled by the master volume. Tracks are
		 * keyed by the scene's id, and playing an id again replaces its track.
		 *
		 * Every finished or stopped track is released completely (disconnected, unloaded).
		 * Firefox for Android stopped opening new media once about 28 finished tracks
		 * were still wired up, so leaving them attached is not an option.
		 */
		class AudioManager {
			#resolve;

			constructor(initialVolume = 1, resolve = src => src) {
				this.#resolve = resolve;
				this.audioContext = null;
				this.masterGain = null;
				this.audioTracks = new Map();
				this.audioSourceNodes = new WeakMap();
				this.masterVolume = clamp(initialVolume, 0, 1);
				this.previousVolume = this.masterVolume > 0 ? this.masterVolume : 1;
			}

			/**
			 * Created on first use rather than at load, since browsers only allow audio after a
			 * user gesture. Returns null when the browser has no Web Audio.
			 */
			getContext() {
				if (!this.audioContext) {
					const AudioContextClass = window.AudioContext || window.webkitAudioContext;
					if (!AudioContextClass) return null;
					this.audioContext = new AudioContextClass();
					this.masterGain = this.audioContext.createGain();
					this.masterGain.gain.value = this.masterVolume;
					this.masterGain.connect(this.audioContext.destination);
				}
				return this.audioContext;
			}

			/**
			 * A context created before a gesture starts suspended. Errors are ignored.
			 */
			async resume() {
				const context = this.getContext();
				if (context && context.state === 'suspended') {
					try { await context.resume(); } catch (e) {  }
				}
			}

			setMasterVolume(value) {
				this.masterVolume = clamp(value, 0, 1);
				if (this.masterVolume > 0) this.previousVolume = this.masterVolume;
				this.applyMasterVolume();
			}

			/**
			 * Muting remembers the volume; unmuting restores it (1 if there was none).
			 * Returns the new master volume.
			 */
			toggleMute() {
				if (this.masterVolume > 0) {
					this.previousVolume = this.masterVolume;
