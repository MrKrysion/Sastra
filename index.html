			 */
			static #plugin(key, event, characters, at) {
				const { compile, passive } = PLUGIN_EVENTS.get(key);
				const data = compile ? ScriptCompiler.#pluginCall(compile, event[key], event, { characters }, at) : { value: event[key] };
				return { ...(isPlainObject(data) ? data : {}), type: 'plugin', event: key, isPassive: passive === true };
			}

			/**
			 * An empty value or 'default' resets to the default position; otherwise it must be
			 * top, center or bottom.
			 */
			static #dialoguePosition(value, at) {
				const position = value != null ? String(value).trim().toLowerCase() : '';
				if (position === '' || position === 'default') return DEFAULT_DIALOGUE_POSITION;
				if (!DIALOGUE_POSITIONS.includes(position)) {
					throw new Error(at('`position:` must be top, center, bottom, or left empty to reset.'));
				}
				return position;
			}

			static #text(value) {
				return value != null ? String(value) : '';
			}

			/**
			 * The per-line typewriter override: true or false, nothing else.
			 */
			static #typewriter(value, at) {
				if (value == null) return undefined;
				if (typeof value !== 'boolean') throw new Error(at('`typewriter:` must be true or false.'));
				return value;
			}

			static #asset(value, action, at) {
				if (!hasAsset(value)) throw new Error(at(`\`${action}:\` needs a file path.`));
				return String(value);
			}

			/**
			 * `anchor` for backgrounds and images, as a CSS background-position such as
			 * '20% 50%'. An omitted axis is centred.
			 */
			static #bgAnchor(value, at) {
				if (value == null) return undefined;
				const placement = resolvePlacement(value, PLACEMENT_KEYWORDS.anchor);
				if (!placement) {
					throw new Error(at('`anchor` must be top, bottom, left, right, center, a percentage, or a pair like `top left`.'));
				}
				return `${placement.x != null ? placement.x : 50}% ${placement.y != null ? placement.y : 50}%`;
			}

			/**
			 * An empty target or `all` means every track.
			 */
			static #audioTarget(value) {
				const target = ScriptCompiler.#text(value).trim();
				return target === '' || target === 'all' ? undefined : target;
			}

			/**
			 * A `play:` takes its id from `id:`, falling back to its file path, so playing the
			 * same file again replaces the track instead of stacking. stop, pause and volume
			 * address a track by id, or all of them. The volume event's `level:` is stored as
			 * `volume`.
			 */
			static #compileAudio(action, value, event, at) {
				if (action === 'play') {
					return { type: 'audio', action: 'play', asset: ScriptCompiler.#asset(value, 'play', at), id: event.id != null ? String(event.id) : value, loop: event.loop, volume: event.volume, fade: event.fade, from: event.from, isPassive: true };
				}
				const command = { type: 'audio', action, id: ScriptCompiler.#audioTarget(value), fade: event.fade, isPassive: true };
				if (action === 'volume') command.volume = event.level;
				return command;
			}

			static #compileSprite(action, value, event, at) {
				if (action === 'clear') return { type: 'sprite', action: 'clear', fade: event.fade, isPassive: true };
				if (action === 'hide') return ScriptCompiler.#hide(value, event, at);
				return ScriptCompiler.#sprite(value, event, action, at);
			}

			/**
			 * One spoken line: the character's defaults, with the event's own `color` and
			 * `avatar` taking precedence.
			 */
			static #line(id, container, characters, at) {
				const character = characters[id];
				if (!character) throw new Error(at(`unknown character id \`${id}\`.`));
				return {
					characterId: id,
					name: character.name,
					color: container.color != null ? container.color : character.color,
					avatar: container.avatar != null ? container.avatar : character.avatar,
					text: ScriptCompiler.#text(container[id]),
					hideAvatarInGame: container.hideAvatarInGame === true,
					hideAvatarInLog: container.hideAvatarInLog === true
				};
			}

			static #single(id, event, characters, at) {
				return {
					type: 'single',
					...ScriptCompiler.#line(id, event, characters, at),
					position: event.position,
					log: event.log,
					typewriter: ScriptCompiler.#typewriter(event.typewriter, at)
				};
			}

			static #characterKey(item, characters, at, label) {
				if (!isPlainObject(item)) {
					throw new Error(at(`${label} must be a mapping like \`- m: "..."\``));
				}
				const ids = Object.keys(item).filter(key => key in characters);
				if (ids.length !== 1) throw new Error(at(`${label} needs exactly one character id.`));
				return ids[0];
			}

			/**
			 * Several lines shown together, one speaker each.
			 */
			static #multi(value, event, characters, at) {
				if (!Array.isArray(value)) throw new Error(at('`multi:` must be a list of character lines.'));
				const cast = value.map((item, j) => {
					const id = ScriptCompiler.#characterKey(item, characters, at, `multi line #${j + 1}`);
					ScriptCompiler.#checkKeys(item, [id, ...EVENT_KEYS.multiLine], at, ` in multi line #${j + 1}`);
					return ScriptCompiler.#line(id, item, characters, at);
				});
				return { type: 'multi', characters: cast, position: event.position, log: event.log, typewriter: ScriptCompiler.#typewriter(event.typewriter, at) };
			}

			/**
			 * Accepts the nested form (a `conversation:` mapping) or the keys beside it on the
			 * event. There are exactly two characters, left and right, and every line's speaker
			 * must be one of them.
			 */
			static #conversation(event, characters, at) {
				const value = event.conversation;
				const src = isPlainObject(value) ? value : event;
				if (src === value) ScriptCompiler.#checkKeys(value, EVENT_KEYS.conversation, at, ' under `conversation:`');
				const cast = ['left', 'right'].map(position => {
					const character = characters[src[position]];
					if (!character) throw new Error(at(`conversation \`${position}:\` references unknown character id \`${src[position]}\`.`));
					return { characterId: src[position], name: character.name, color: character.color, avatar: character.avatar, position };
				});
				if (!Array.isArray(src.dialogue)) throw new Error(at('conversation needs a `dialogue:` list.'));

				const dialogue = src.dialogue.map((item, j) => {
					const id = ScriptCompiler.#characterKey(item, characters, at, `conversation line #${j + 1}`);
					if (id !== src.left && id !== src.right) {
						throw new Error(at(`conversation line #${j + 1} speaker \`${id}\` is not the left or right character.`));
					}
					ScriptCompiler.#checkKeys(item, [id, ...EVENT_KEYS.conversationLine], at, ` in conversation line #${j + 1}`);
					return { ...ScriptCompiler.#line(id, item, characters, at), typewriter: ScriptCompiler.#typewriter(item.typewriter, at) };
				});

				return { type: 'conversation', characters: cast, dialogue, position: src.position ?? event.position, log: src.log ?? event.log, typewriter: ScriptCompiler.#typewriter(src.typewriter ?? event.typewriter, at) };
			}

			static #spriteParams(id, params, action, at) {
				if (!isPlainObject(params)) {
					throw new Error(at(`sprite \`${id}\` must be a mapping of parameters.`));
				}
				ScriptCompiler.#checkKeys(params, EVENT_KEYS.sprite, at, ` for sprite \`${id}\``);
				return {
					id, action,
					asset: params.asset,
					pos: params.pos,
					anchor: params.anchor,
					layer: params.layer,
					height: params.height,
					fade: params.fade
				};
			}

			/**
			 * `show` and `replace` take a character id with the parameters beside it on the
			 * event, or a mapping of id to parameters to place several sprites at once.
			 */
			static #sprite(value, event, action, at) {
				if (typeof value === 'string') {
					return { type: 'sprite', id: value, action, asset: event.asset, pos: event.pos, anchor: event.anchor, layer: event.layer, height: event.height, fade: event.fade, isPassive: true };
				}
				if (isPlainObject(value)) {
					const sprites = Object.entries(value).map(([id, params]) => ScriptCompiler.#spriteParams(id, params, action, at));
					return { type: 'sprites', sprites, isPassive: true };
				}
				throw new Error(at(`\`${action}:\` must be a character id or a mapping of character ids.`));
			}

			/**
			 * `hide:` takes one id or a list of ids.
			 */
			static #hide(value, event, at) {
				if (typeof value === 'string') {
					return { type: 'sprite', id: value, action: 'hide', fade: event.fade, isPassive: true };
				}
				if (Array.isArray(value)) {
					return { type: 'sprites', sprites: value.map(id => ({ id: String(id), action: 'hide', fade: event.fade })), isPassive: true };
				}
				throw new Error(at('`hide:` must be a character id or a list of character ids.'));
			}
		}

		/**
		 * Moves the story on by itself after a reading delay. The cycle: a scene finishes
		 * showing its content (DialogueManager calls onContentSettled when the typing is
		 * done), a timer sized to the scene starts, and when it fires input.advance() runs as
		 * if the player had clicked. A manual advance, a modal, loading or the pause menu
		 * cancels the countdown.
		 *
		 * Dwell time comes from the speed preset and the number of characters on screen.
		 * Images and blank scenes count as a fixed number of characters. A video waits for
		 * its own remaining length, which the speed setting doesn't change. A progress bar
		 * shows the time left.
		 */
		class AutoplayManager {
			#vn;
			#enabled = false;
			#speedIndex = AUTOPLAY_DEFAULT_SPEED;
			#showProgress = true;
			#timer = null;
			/**
			 * the scene's content is fully shown and the scene is known
			 */
			#settled = false;
			/**
			 * when the countdown began, how long it lasts, and the scene it belongs to
			 */
			#armStart = 0;
			#armDwell = 0;
			#armScene = null;
			/**
			 * a fixed length (a video): it doesn't follow the speed setting
			 */
			#armFixed = false;
			/**
			 * a pending loadedmetadata listener, waiting for a video's length
			 */
			#metaVideo = null;
			#metaHandler = null;
			/**
			 * a speed change is under way: the bar is held at this fraction
			 */
			#isFrozen = false;
			#frozenFrac = 0;

			constructor(vn) { this.#vn = vn; }

			get enabled() { return this.#enabled; }

			static speedLabelKey(index) {
				const id = AUTOPLAY_SPEEDS[index].id;
				return `controls.autoplaySpeed${id.charAt(0).toUpperCase()}${id.slice(1)}`;
			}

			init() {
				const save = this.#vn.save;
				const savedSpeed = save.getAutoplaySpeed();
				this.#speedIndex = (savedSpeed !== null && savedSpeed >= 0 && savedSpeed < AUTOPLAY_SPEEDS.length) ? savedSpeed : AUTOPLAY_DEFAULT_SPEED;
				const savedProgress = save.getAutoplayProgress();
				this.#showProgress = savedProgress === null ? true : savedProgress === 'true';
				this.#syncUi();
			}

			toggleEnabled() { this.setEnabled(!this.#enabled); }

			setEnabled(on) {
				this.#enabled = Boolean(on);
				this.#syncUi();
				emit('feature_autoplay', { state: this.#enabled ? 'enabled' : 'disabled' });
				if (this.#enabled) this.#maybeArm();
				else this.#cancel();
			}

			setSpeed(index) {
				if (!(index >= 0 && index < AUTOPLAY_SPEEDS.length) || index === this.#speedIndex) return;
				this.#speedIndex = index;
				this.#vn.save.setAutoplaySpeed(index);
				this.#syncUi();
				if (this.#timer) this.#adjustDwell();
			}

			toggleProgress() {
				this.#showProgress = !this.#showProgress;
				this.#vn.save.setAutoplayProgress(this.#showProgress);
				this.#syncUi();
				if (this.#timer && this.#showProgress) {
					const frac = this.#elapsedFraction();
					this.#renderBar(frac, this.#armDwell * (1 - frac));
				} else {
					this.#hideBar();
				}
			}

			/**
			 * Called when a scene's text has finished typing, or it has none. The end scene
			 * never arms.
			 */
			onContentSettled(scene) {
				this.#cancel();
				this.#settled = Boolean(scene) && scene.type !== 'end';
				this.#armScene = this.#settled ? scene : null;
				this.#maybeArm();
			}

			/**
			 * The story is moving on (by the player or by autoplay): drop the countdown.
			 */
			onAdvanceStart() {
				this.#cancel();
				this.#settled = false;
				this.#armScene = null;
			}

			/**
			 * Used while a modal is open.
			 */
			pause() { this.#cancel(); }

			resume() { this.#maybeArm(); }

			reset() {
				this.#cancel();
				this.#settled = false;
				this.#armScene = null;
			}

			#maybeArm() {
				if (this.#settled && this.#armScene && this.#enabled && this.#canRun()) this.#armForScene(this.#armScene);
			}

			#canRun() {
				const vn = this.#vn;
				return vn.isLoaded && !vn.isWaitingForStart && !vn.activeModal && !vn.scene.isLoadingScene;
			}

			#armForScene(scene) {
				this.#cancel();
				if (scene.type === 'video') {
					const video = this.#vn.stage.activeSceneVideo;
					const begin = () => {
						const remaining = (video && isFinite(video.duration) && video.duration > 0)
							? Math.max(0, (video.duration - (video.currentTime || 0)) * 1000)
							: AUTOPLAY_VIDEO_FALLBACK;
						this.#arm(remaining, true);
					};
					if (video && isFinite(video.duration) && video.duration > 0) {
						begin();
					} else if (video) {
						this.#metaVideo = video;
						this.#metaHandler = () => {
							this.#cancelMeta();
							if (this.#settled && this.#enabled && this.#canRun()) begin();
						};
						video.addEventListener('loadedmetadata', this.#metaHandler, { once: true });
					} else {
						this.#arm(AUTOPLAY_VIDEO_FALLBACK, true);
					}
				} else {
					this.#arm(this.#dwellForScene(scene), false);
				}
			}

			#dwellForScene(scene) {
				const preset = AUTOPLAY_SPEEDS[this.#speedIndex];
				const isStatic = scene.type === 'image' || scene.type === 'blank';
				const chars = isStatic ? AUTOPLAY_MEDIA_CHARS : this.#measureChars();
				return clamp(preset.base + chars * preset.perChar, AUTOPLAY_MIN_DWELL, AUTOPLAY_MAX_DWELL);
			}

			/**
			 * Counts the characters currently visible in the active layer.
			 */
			#measureChars() {
				let count = 0;
				document.querySelectorAll('.scene-layer.active .dialogue-text, .scene-layer.active .narration-text, .scene-layer.active .screen-title, .scene-layer.active .screen-subtitle')
					.forEach(el => { count += (el.textContent || '').length; });
				return count;
			}

			#arm(dwell, fixed = false) {
				this.#cancel();
				this.#armStart = Date.now();
				this.#armDwell = dwell;
				this.#armFixed = fixed;
				this.#renderBar(0, dwell);
				this.#timer = setTimeout(() => { this.#timer = null; this.#fire(); }, dwell);
			}

			/**
			 * The speed changed mid-countdown. The bar freezes at its current fraction, and if
			 * the speed isn't changed again within AUTOPLAY_SPEED_BUFFER the countdown carries
			 * on from that fraction at the new speed, with at least 100ms left. Fixed lengths
			 * (videos) are left alone.
			 */
			#adjustDwell() {
				if (this.#armFixed || !this.#armScene) return;

				const frac = this.#isFrozen ? this.#frozenFrac : this.#elapsedFraction();
				
				clearTimeout(this.#timer);
				
				this.#isFrozen = true;
				this.#frozenFrac = frac;

				const bar = this.#vn.elements.autoplayProgressBar;
				if (bar) {
					bar.style.transition = 'none';
					bar.style.transform = `scaleX(${frac})`;
				}

				this.#timer = setTimeout(() => {
					this.#isFrozen = false;
					
					const remaining = Math.max(this.#dwellForScene(this.#armScene) * (1 - frac), 100);
					
					this.#armDwell = frac < 1 ? remaining / (1 - frac) : remaining;
					this.#armStart = Date.now() - (frac * this.#armDwell);
					
					this.#timer = setTimeout(() => { this.#timer = null; this.#fire(); }, remaining);
					this.#renderBar(frac, remaining);
				}, AUTOPLAY_SPEED_BUFFER); 
			}

			#elapsedFraction() {
				if (!this.#armDwell) return 0;
				return clamp((Date.now() - this.#armStart) / this.#armDwell, 0, 1);
			}

			#fire() {
				this.#hideBar();
				if (this.#enabled && this.#canRun()) this.#vn.input.advance();
			}

			#cancel() {
				if (this.#timer) { clearTimeout(this.#timer); this.#timer = null; }
				this.#isFrozen = false;
				this.#cancelMeta();
				this.#hideBar();
			}

			#cancelMeta() {
				if (this.#metaVideo && this.#metaHandler) this.#metaVideo.removeEventListener('loadedmetadata', this.#metaHandler);
				this.#metaVideo = null;
				this.#metaHandler = null;
			}

			/**
			 * Runs the progress bar: jump to `fromFraction`, force a reflow, then let a linear
			 * CSS transition take it to full over the remaining time, so it needs no per-frame
			 * script.
			 */
			#renderBar(fromFraction, durationMs) {
				const wrap = this.#vn.elements.autoplayProgress;
				const bar = this.#vn.elements.autoplayProgressBar;
				if (!wrap || !bar) return;
				if (!this.#showProgress) { wrap.classList.remove('visible'); return; }
				bar.style.transition = 'none';
				bar.style.transform = `scaleX(${fromFraction})`;
				wrap.classList.add('visible');
				void bar.offsetWidth;
				bar.style.transition = `transform ${durationMs}ms linear`;
				bar.style.transform = 'scaleX(1)';
			}

			#hideBar() {
				const wrap = this.#vn.elements.autoplayProgress;
				const bar = this.#vn.elements.autoplayProgressBar;
				if (!wrap || !bar) return;
				wrap.classList.remove('visible');
				bar.style.transition = 'none';
				bar.style.transform = 'scaleX(0)';
			}

			#syncUi() {
				const vn = this.#vn;
				const button = vn.elements.autoplayToggle;
				if (button) {
					button.classList.toggle('active', this.#enabled);
					vn.ui.setTitle(button, 'controls.autoplay');
				}
				vn.elements.autoplayControl?.classList.toggle('autoplay-on', this.#enabled);
				const enableToggle = vn.elements.autoplayEnableToggle;
				if (enableToggle) {
					enableToggle.setAttribute('aria-checked', String(this.#enabled));
					vn.ui.setTitle(enableToggle, this.#enabled ? 'controls.autoplayDisable' : 'controls.autoplayEnable');
				}
				const progressToggle = vn.elements.autoplayProgressToggle;
				if (progressToggle) {
					progressToggle.setAttribute('aria-checked', String(this.#showProgress));
					setTip(progressToggle, vn.i18n.t(this.#showProgress ? 'controls.autoplayProgressHide' : 'controls.autoplayProgressShow'));
				}
				const slider = vn.elements.autoplaySpeedSlider;
				if (slider) {
					slider.value = String(this.#speedIndex);
				}
				if (vn.elements.autoplaySpeedValue) vn.elements.autoplaySpeedValue.textContent = vn.i18n.t(AutoplayManager.speedLabelKey(this.#speedIndex));
				vn.ui.sliders.speed.sync();
			}
		}

		/**
		 * The plugin system. A plugin is a script listed under `plugins:` in config.yaml that
		 * calls SASTRA.plugin({...}). Its definition can have `name` (required, unique),
		 * `requires` (a minimum engine version), `setup(api)` (awaited at boot, before the
		 * game starts), `events` (new script keys: the engine compiles them with the hook's
		 * `compile`, preloads its `assets` and calls `run` and `stop`), `modifiers` (extra keys
		 * that can ride on any event), `on` (shorthand for api.on) and `strings` (translated
		 * text for the plugin's own UI). The api object given to setup() is the supported
		 * surface. SASTRA.game and the managers are reachable but unsupported. A skin is
		 * just a stylesheet loaded before the plugins.
		 *
		 * Anything that goes wrong raises the error screen (#fail) rather than leaving a
		 * half-working game.
		 */
		class PluginManager {
			#vn;
			#plugins = [];
			/**
			 * registered buttons
			 */
			#buttons = [];
			/**
			 * built-in screens a plugin replaced: name -> { plugin, render, options }
			 */
			#screens = new Map();
			/**
			 * the scene layer of each plugin event
			 */
			#layers = new Map();
			/**
			 * the plugin scene currently on screen
			 */
			#running = null;
			/**
			 * active scenes whose modifiers must be stopped when the screen changes
			 */
			#modified = [];
			/**
			 * outstanding hold tokens; while any exist the story doesn't advance
			 */
			#holds = new Set();
			#booted = false;
			#failed = false;

			/**
			 * Where each button place lives in the DOM, and the classes a button gets there so
			 * it matches the built-in buttons around it.
			 */
			static #containers = {
				top: '.top-controls',
				pause: '.pause-left',
				menu: '.chapter-select .menu-actions',
				end: '#endActions .end-actions-row'
			};

			static #classes = {
				top: 'control-button circle',
				pause: 'ui-button block secondary',
				menu: 'control-button circle',
				end: 'ui-button secondary',
				more: 'row'
			};

			constructor(vn) { this.#vn = vn; }

			/**
			 * A plugin scene is on screen and unfinished. It owns the input, so the engine's
			 * shortcuts and click-to-advance stand down.
			 */
			get capturing() { return Boolean(this.#running && !this.#running.finished); }

			/**
			 * A modifier asked the story to wait.
			 */
			get held() { return this.#holds.size > 0; }

			get list() { return this.#plugins.map(plugin => plugin.def); }

			has(name) { return this.#plugins.some(plugin => plugin.name === name); }

			/**
			 * Boot order: plugins that registered before the game existed (queued in
			 * pluginQueue), then the skin stylesheet (a folder path means <folder>/skin.css),
			 * then each plugin script listed in config.yaml, injected one after another, then the
			 * legacy analytics file if it is needed, then every plugin's setup(). A script that
			 * fails to load raises the error screen and stops the boot.
			 */
			async load(meta) {
				pluginQueue.splice(0).forEach(def => this.register(def));
				// One skin at a time. A list is a likely mistake, so the first one runs and the console says so.
				const skins = [].concat(meta.skin ?? []);
				if (skins.length > 1) console.warn(`\`skin:\` takes one skin, so only \`${skins[0]}\` is used.`);
				const skin = hasAsset(skins[0]) ? skins[0].trim() : '';
				if (skin && !await this.#inject(skin.endsWith('/') ? `${skin}skin.css` : skin, true)) {
					return this.#fail(`Could not load the skin \`${skin}\`. Check that the file exists and that its path under \`skin:\` in \`config.yaml\` is correct.`);
				}
				for (const src of [].concat(meta.plugins ?? []).filter(hasAsset)) {
					if (!await this.#inject(src.trim())) return this.#fail(`Could not load the plugin \`${src}\`. Check that the file exists and that its path under \`plugins:\` in \`config.yaml\` is correct.`);
					if (this.#failed) return false;
				}
				if (hasAsset(meta.analytics_id) && !this.has('analytics')) await this.#inject(LEGACY_ANALYTICS_PLUGIN);
				for (const plugin of this.#plugins) {
					await this.#setup(plugin);
					if (this.#failed) return false;
				}
				this.#booted = true;
				this.emit('language', { language: this.#vn.activeLanguage });
				return true;
			}

			/**
			 * Validates and records a plugin. It needs a name; a duplicate name is ignored; its
			 * `requires` is checked against the engine version; and its event and modifier
			 * keys may not clash with built-in words. Registered keys join RESERVED_WORDS, so a
			 * character can't take one. If the game has already booted (the plugin loaded late),
			 * setup() runs at once.
			 */
			register(def) {
				const name = hasAsset(def?.name) ? def.name.trim() : '';
				if (!name) return this.#fail('A plugin was registered without a `name`.');
				if (this.has(name)) return;
				if (hasAsset(def.requires) && PluginManager.#compare(APP_VERSION, def.requires) < 0) {
					return this.#fail(`The \`${name}\` plugin needs Sastra ${def.requires} or newer. This game runs Sastra ${APP_VERSION}.`);
				}
				const hooks = [[PLUGIN_EVENTS, def.events], [PLUGIN_MODIFIERS, def.modifiers]].map(([map, list]) => [map, Object.entries(isPlainObject(list) ? list : {})]);
				const clash = hooks.flatMap(([, list]) => list).find(([key]) => RESERVED_WORDS.has(key) || OPTION_WORDS.has(key));
				if (clash) return this.#fail(`The \`${name}\` plugin's \`${clash[0]}:\` clashes with a built-in word or another plugin's event.`);

				const plugin = { name, def, handlers: new Map(), started: false, overlay: null };
				plugin.api = this.#api(plugin);
				hooks.forEach(([map, list]) => list.forEach(([key, hook]) => {
					map.set(key, { ...hook, plugin, key });
					RESERVED_WORDS.add(key);
				}));
				Object.entries(isPlainObject(def.on) ? def.on : {}).forEach(([event, fn]) => plugin.api.on(event, fn));
				this.#plugins.push(plugin);
				if (this.#booted) this.#setup(plugin);
			}

			/**
			 * Calls every plugin's handlers for a happening. A handler that throws is logged and
			 * doesn't stop the others.
			 */
			emit(name, payload = {}) {
				for (const plugin of this.#plugins) {
					plugin.handlers.get(name)?.forEach(fn => {
						try { fn(payload); } catch (error) { console.error(`Sastra plugin "${plugin.name}":`, error); }
					});
				}
			}

			/**
			 * Inserts every plugin button registered for `place` into `container`.
			 */
			fill(place, container) {
				this.#buttons.filter(entry => entry.place === place).forEach(entry => this.#insert(entry, container));
			}

			/**
			 * The options of the plugin that replaced a built-in screen, or null.
			 */
			replaced(name) { return this.#screens.get(name)?.options ?? null; }

			/**
			 * Each built-in screen calls this as it renders. If a plugin replaced that screen, the
			 * host gets .screen--replaced and the plugin's render() draws into its own
			 * .plugin-screen element, with the screen's data and actions and the buttons
			 * registered for that place. If none did, nothing happens.
			 */
			mount(name, host, ctx) {
				const screen = this.#screens.get(name);
				host.classList.toggle('screen--replaced', Boolean(screen));
				if (!screen) return;
				let element = host.querySelector(':scope > .plugin-screen');
				if (!element) {
					element = document.createElement('div');
					element.className = 'plugin-screen';
					element.dataset.screen = name;
					element.dataset.plugin = screen.plugin.name;
					host.prepend(element);
				}
				element.replaceChildren();
				const buttons = document.createDocumentFragment();
				if (name !== 'menu' || screen.options.corner === false) this.fill(name, buttons);
				try { screen.render(element, { ...ctx, buttons: [...buttons.children] }); }
				catch (error) {
					console.error(`Sastra plugin "${screen.plugin.name}":`, error);
					this.#fail(`The \`${screen.plugin.name}\` plugin could not draw the ${name} screen: ${error?.message || error}`);
				}
			}

			/**
			 * Before a chapter's assets are collected, asks each plugin event and modifier for
			 * the files its scenes need (`assets`), so they are preloaded like built-in ones.
			 */
			async prepare(script) {
				await Promise.all(script.map(async scene => {
					const hooks = [PLUGIN_EVENTS.get(scene.event), ...Object.keys(scene.mods ?? {}).map(key => PLUGIN_MODIFIERS.get(key))].filter(Boolean);
					if (!hooks.length) return;
					const lists = await Promise.all(hooks.map(hook => hook.assets ? hook.assets(scene) : hook.key === scene.event ? scene.assets : null));
					scene.assets = lists.flat().filter(hasAsset);
				}));
			}

			/**
			 * Runs a scene's modifiers. For an active scene they are remembered, so they can be
			 * stopped when the screen changes. Each one gets { value, instant, hold }.
			 */
			modify(scene, instant) {
				for (const key in scene.mods) {
					const modifier = PLUGIN_MODIFIERS.get(key);
					if (!scene.isPassive) this.#modified.push({ modifier, scene });
					this.#call(modifier, 'run', scene, { value: scene.mods[key], instant, hold: () => this.#hold() });
				}
			}

			/**
			 * A modifier can hold the story back while its effect plays. The function it gets
			 * back releases the hold, and once nothing else is holding or typing, autoplay is
			 * told the content has settled.
			 */
			#hold() {
				const token = {};
				this.#holds.add(token);
				return () => {
					if (!this.#holds.delete(token) || this.held || this.#vn.dialogue.isTyping) return;
					this.#vn.autoplay.onContentSettled(this.#vn.script[this.#vn.currentIndex]);
				};
			}

			/**
			 * Runs a plugin event. A passive one just runs. An active one gets its own layer, a
			 * show() that reveals it and a done() that moves on to the next scene. Only the
			 * latest running event may call them; stale calls are ignored. Errors raise the error
			 * screen.
			 */
			run(scene, instant = false) {
				const event = PLUGIN_EVENTS.get(scene.event);
				if (scene.isPassive) {
					this.#call(event, 'run', scene, { instant });
					return;
				}
				const vn = this.#vn;
				const layer = this.#layer(scene.event);
				const entry = { event, scene, finished: false };
				this.#running = entry;
				this.#call(event, 'run', scene, {
					layer,
					show: () => { if (this.#running === entry) vn.scene.activateLayer(layer); },
					done: () => {
						if (entry.finished || this.#running !== entry) return;
						entry.finished = true;
						if (vn.currentIndex < vn.script.length - 1) vn.scene.nextScene();
					}
				}, true);
			}

			/**
			 * Called on leaving a scene: releases holds, stops modifiers, stops the running
			 * plugin scene.
			 */
			stop() {
				const instant = this.#vn.scene.instant;
				this.#holds.clear();
				this.#modified.splice(0).forEach(({ modifier, scene }) => this.#call(modifier, 'stop', scene, { value: scene.mods[modifier.key], instant }));
				const entry = this.#running;
				if (!entry) return;
				this.#running = null;
				this.#call(entry.event, 'stop', entry.scene, { instant });
			}

			/**
			 * Runs a hook function. Errors are logged, and for critical hooks also raise the error
			 * screen.
			 */
			#call(hook, name, scene, ctx, critical = false) {
				try { hook[name]?.(scene, ctx); }
				catch (error) {
					console.error(`Sastra plugin "${hook.plugin.name}":`, error);
					if (critical) this.#fail(`The \`${hook.plugin.name}\` plugin failed on \`${hook.key}:\`: ${error?.message || error}`);
				}
			}

			/**
			 * One .scene-layer per plugin event, created the first time it is needed.
			 */
			#layer(key) {
				if (!this.#layers.has(key)) {
					const layer = document.createElement('div');
					layer.className = 'scene-layer plugin-layer';
					layer.dataset.event = key;
					this.#vn.elements.container.appendChild(layer);
					this.#layers.set(key, layer);
				}
				return this.#layers.get(key);
			}

			/**
			 * Adds a script or stylesheet to <head>. Resolves true when it loads, false on error.
			 */
			#inject(src, stylesheet = false) {
				return new Promise(resolve => {
					const element = document.createElement(stylesheet ? 'link' : 'script');
					if (stylesheet) Object.assign(element, { rel: 'stylesheet', href: src });
					else element.src = src;
					element.onload = () => resolve(true);
					element.onerror = () => { element.remove(); resolve(false); };
					document.head.appendChild(element);
				});
			}

			/**
			 * Runs a plugin's setup() once.
			 */
			async #setup(plugin) {
				if (plugin.started) return;
				plugin.started = true;
				try { await plugin.def.setup?.(plugin.api); }
				catch (error) {
					console.error(error);
					this.#fail(`The \`${plugin.name}\` plugin could not start: ${error?.message || error}`);
				}
			}

			/**
			 * Raises the error screen once and marks the plugin system failed. Returns false, so
			 * callers can `return this.#fail(...)`.
			 */
			#fail(message) {
				if (!this.#failed) this.#vn.ui.showError(message, 'plugin');
				this.#failed = true;
				return false;
			}

			/**
			 * The object handed to setup(): version, config, a state snapshot, on and off for
			 * happenings, progress (get, set, reset, passed), url (the resolved asset URL),
			 * button, overlay, screen, toast, t and translate (the plugin's own strings) and
			 * error.
			 */
			#api(plugin) {
				const vn = this.#vn;
				const { handlers } = plugin;
				const update = (store) => { vn.progress.replaceStore(store); vn.menu.refresh(); };
				return {
					version: APP_VERSION,
					get config() { return vn.gameMeta; },
					get state() {
						return {
							chapter: vn.chapterFile ? { file: vn.chapterFile, name: vn.chapterName(vn.chapterFile) } : null,
							index: vn.currentIndex,
							scenes: vn.script.length,
							scene: vn.script[vn.currentIndex] || null,
							volume: vn.audio.masterVolume,
							paused: isOrientationBlocked,
							modal: vn.activeModal,
							language: vn.activeLanguage
						};
					},
					on(name, fn) {
						if (typeof fn !== 'function') return;
						if (!handlers.has(name)) handlers.set(name, new Set());
						handlers.get(name).add(fn);
					},
					off(name, fn) { handlers.get(name)?.delete(fn); },
					progress: {
						get: () => vn.save.loadCheckpointStore(),
						set: (store) => update(isPlainObject(store) ? store : {}),
						reset: () => update(null),
						passed: (index) => vn.progress.passed(index)
					},
					url: (src) => vn.assets.url(src),
					button: (spec) => this.#button(plugin, spec),
					overlay: () => this.#overlay(plugin),
					screen: (name, render, options = {}) => this.#screen(plugin, name, render, options),
					toast: (message, { type, side, duration } = {}) => vn.ui.showToast(String(message), ['success', 'error'].includes(type) ? type : 'info', { duration: Number.isFinite(duration) ? duration : undefined, side: side === 'right' ? 'right' : 'left' }),
					t: (key, vars) => vn.i18n.t(key, vars, plugin),
					translate: (root) => vn.i18n.translateDom(root, plugin),
					error: (message) => this.#fail(`The \`${plugin.name}\` plugin: ${message}`)
				};
			}

			/**
			 * Registers a replacement for the menu, start, pause or end screen. The first plugin
			 * to claim a screen keeps it; a later one gets a console warning.
			 */
			#screen(plugin, name, render, options) {
				if (!PLUGIN_SCREENS.includes(name) || typeof render !== 'function') return this.#fail(`The \`${plugin.name}\` plugin: \`api.screen()\` needs one of ${PLUGIN_SCREENS.join(', ')} and a function that draws it.`);
				const taken = this.#screens.get(name);
				if (taken) console.warn(`Sastra plugin "${plugin.name}": the ${name} screen is already replaced by the "${taken.plugin.name}" plugin.`);
				else this.#screens.set(name, { plugin, render, options: isPlainObject(options) ? options : {} });
			}

			/**
			 * One div per plugin for its own free-floating UI, appended to <body>.
			 */
			#overlay(plugin) {
				if (!plugin.overlay) {
					plugin.overlay = document.createElement('div');
					plugin.overlay.className = 'plugin-overlay';
					plugin.overlay.dataset.plugin = plugin.name;
					document.body.appendChild(plugin.overlay);
				}
				return plugin.overlay;
			}

			/**
			 * Registers a button at a place: top, pause, menu or end. Only PLUGIN_TOP_LIMIT
			 * buttons fit in the top bar; further ones go into the overflow panel.
			 */
			#button(plugin, spec) {
				const place = spec?.place;
				if (!PLUGIN_PLACES.includes(place)) return this.#fail(`The \`${plugin.name}\` plugin: a button's \`place\` must be one of ${PLUGIN_PLACES.join(', ')}.`);
				const overflow = place === 'top' && this.#buttons.filter(entry => entry.place === 'top').length >= PLUGIN_TOP_LIMIT;
				const entry = { plugin, spec, place: overflow ? 'more' : place, elements: new Set() };
				this.#buttons.push(entry);
				this.#insert(entry, overflow ? this.#more() : document.querySelector(PluginManager.#containers[place]));
				return {
					remove: () => {
						this.#buttons = this.#buttons.filter(item => item !== entry);
						entry.elements.forEach(element => element.remove());
					}
				};
			}

			/**
			 * Creates the overflow control the first time, and returns its panel.
			 */
			#more() {
				const panel = document.querySelector('.more-panel');
				if (panel) return panel;
				const control = document.createElement('div');
				control.className = 'more-control';
				control.innerHTML = `<button class="control-button circle" data-action="more-toggle" title="${this.#vn.i18n.t('controls.more')}" aria-label="${this.#vn.i18n.t('controls.more')}">${iconTag('more')}</button><div class="more-panel"></div>`;
				document.querySelector(PluginManager.#containers.top).prepend(control);
				return control.lastChild;
			}

			/**
			 * Builds one button, or a link when it has `href`. Circle buttons get an icon and a
			 * tooltip, the others a text label.
			 */
			#insert(entry, container) {
				if (!container) return;
				const { spec, place } = entry;
				const element = document.createElement(spec.href ? 'a' : 'button');
				const label = this.#label(spec.label);
				element.className = `${PluginManager.#classes[place]} plugin-button`;
				element.dataset.plugin = entry.plugin.name;
				if (spec.href) {
					element.href = spec.href;
					if (spec.target) { element.target = spec.target; element.rel = 'noopener noreferrer'; }
				} else {
					element.type = 'button';
				}
				const icon = this.#icon(spec.icon);
				if (icon) element.append(icon);
				if (PluginManager.#classes[place].includes('circle')) {
					setTip(element, label);
				} else {
					const span = document.createElement('span');
					span.dir = 'auto';
					span.textContent = label;
					if (place === 'more') span.className = 'row-title';
					element.append(span);
				}
				element.addEventListener('click', (e) => {
					e.stopPropagation();
					element.closest('.open')?.classList.remove('open');
					spec.onClick?.(e);
				});
				if (place === 'top') container.prepend(element);
				else container.append(element);
				entry.elements.add(element);
			}

			#icon(icon) {
				if (!hasAsset(icon)) return null;
				const value = icon.trim();
				if (value.startsWith('<') || /^[\w-]+$/.test(value)) {
					const template = document.createElement('template');
					template.innerHTML = value.startsWith('<') ? value : iconTag(value);
					return template.content.firstElementChild;
				}
				const img = document.createElement('img');
				img.src = icon;
				img.alt = '';
				return img;
			}

			#label(label) {
				return String(pickLanguage(label, this.#vn.activeLanguage || '') ?? '');
			}

			static #compare(a, b) {
				const parse = (version) => String(version).split('-')[0].split('.').map(part => parseInt(part, 10) || 0);
				const [x, y] = [parse(a), parse(b)];
				for (let i = 0; i < Math.max(x.length, y.length); i++) {
					if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0);
				}
				return 0;
			}
		}

        /**
         * The orchestrator. It holds the top-level state (the current scene index, the
         * compiled script, the active chapter and language, the loaded and waiting flags)
         * and creates every manager. The managers reach one another through it.
         */
        class VisualNovel {

            /**
             * The audio manager gets a resolver closure (assets.url): assets doesn't exist yet
             * when the audio manager is built, but will by the time anything plays.
             */
            constructor() {
				this.currentIndex = 0;
				this.dialogue = new DialogueManager(this);

				this.save = new SaveManager({
					typewriter: TYPEWRITER_STORAGE_KEY,
					volume: VOLUME_STORAGE_KEY,
					checkpoint: CHECKPOINT_STORAGE_KEY,
					language: LANGUAGE_STORAGE_KEY,
					autoplaySpeed: AUTOPLAY_SPEED_STORAGE_KEY,
					autoplayProgress: AUTOPLAY_PROGRESS_STORAGE_KEY,
					theme: THEME_STORAGE_KEY
				});
				this.audio = new AudioManager(this.save.getVolume(), src => this.assets.url(src));
				this.assets = new AssetManager(this);
				this.i18n = new I18nManager();
				this.config = new ConfigManager(this);
				this.languageManager = null;
				this.activeLanguage = null;
				this.isLoaded = false;
				this.isWaitingForStart = false;
				this.log = new LogManager(this);

				this.activeModal = null;
				this.script = [];
				this.sprites = new SpriteManager(this);
				this.stage = new StageManager(this);
				this.input = new InputManager(this);
				this.menu = new MenuManager(this);
				this.scene = new SceneManager(this);
				this.autoplay = new AutoplayManager(this);
				this.currentChapter = '';
				this.dialoguePosition = DEFAULT_DIALOGUE_POSITION;
				this.controls = { ...DEFAULT_GAME_META.settings };
				this.chapterFile = '';
				this.progress = new ProgressManager(this);
				this.gameMeta = { ...DEFAULT_GAME_META };

				const elementIds = [
					'loading', 'singleDialogue', 'multiDialogue', 'narrationScreen',
					'convDialogue', 'spriteStage', 'imageScreen', 'titleScreen', 'blankScreen',
					'logButton', 'logModal', 'logBody', 'endScreen', 'creditsModal', 'creditsBody',
					'toastContainer', 'typewriterToggle', 'fullscreenToggle', 'volumeControl',
					'volumeToggle', 'muteToggle', 'volumeSlider', 'volumeValue', 'startGate',
					'autoplayControl', 'autoplayToggle', 'autoplaySpeedSlider',
					'autoplaySpeedValue', 'autoplayEnableToggle', 'autoplayProgressToggle',
					'autoplayProgress', 'autoplayProgressBar',
					'startTitle', 'startSubtitle', 'startActions', 'pauseMenu',
					'pauseList', 'pauseCount', 'pauseRight', 'pauseChapter', 'pauseLogo', 'pauseAssets', 'endActions', 'screenFade',
					'videoScreen',
					'singleAvatar', 'singleCharacterName', 'singleDialogueText', 'narrationText',
					'leftAvatar', 'rightAvatar', 'convDialogueBox', 'convCharacterName', 'convDialogueText',
					'displayImage', 'titleMain', 'titleSub', 'endMain', 'endSub'
				];
				this.elements = {};
				elementIds.forEach(id => { this.elements[id] = document.getElementById(id); });
				this.elements.container = document.getElementById('gameContainer');

				this.elements.sr = {};
				document.querySelectorAll('[data-sr-region]').forEach(node => {
					this.elements.sr[node.dataset.srRegion] = node;
				});
				this.elements.chapterInfo = document.querySelector('.chapter-info');

				this.ui = new UIManager(this);
				this.plugins = new PluginManager(this);
				this.ui.initControls();
				initTooltips();

				this.loadDialogueAndAssets();
				this.input.bind();
			}

			/**
			 * Called every time the config is applied. Copies the boolean settings into
			 * vn.controls, sets the typewriter speed (clamped to 0-500ms per character; 0
			 * shows text at once), decides whether the typewriter starts on (the player's saved
			 * choice beats `enableTypewriter`), shows or hides the optional buttons and syncs
			 * the controls.
			 */
			applyGameSettings(meta = {}) {
				for (const [key, fallback] of Object.entries(DEFAULT_GAME_META.settings)) {
					if (typeof fallback === 'boolean') this.controls[key] = booleanSetting(meta, key, fallback);
				}
				TIMINGS.typewriterStep = clamp(numberSetting(meta, 'typewriterSpeed', 30), 0, 500);

				// skinSettings become page markers for the skin: `bootScreen: false` is
				// body[data-skin-boot-screen="false"]. Old ones go first, as a language can change them.
				const markers = document.body.dataset;
				Object.keys(markers).filter(key => /^skin[A-Z]/.test(key)).forEach(key => delete markers[key]);
				Object.entries(isPlainObject(meta.skinSettings) ? meta.skinSettings : {}).forEach(([key, value]) => {
					if (/^[a-zA-Z][a-zA-Z0-9]*$/.test(key) && value !== null) markers[`skin${key[0].toUpperCase()}${key.slice(1)}`] = value;
				});

				const savedTypewriter = this.save.getTypewriter();
				this.dialogue.enabled = savedTypewriter === 'true' || savedTypewriter === 'false' ? savedTypewriter === 'true' : this.controls.enableTypewriter;

				this.elements.logButton.classList.toggle('control-hidden', !this.controls.showLogButton);
				this.elements.typewriterToggle.classList.toggle('control-hidden', !this.controls.showTypewriterButton);
				this.elements.autoplayControl.classList.toggle('control-hidden', !this.controls.showAutoplayButton);
				this.input.updateTypewriterToggleButton();
				this.autoplay.init();
				this.ui.updateVolumeUi();
				this.ui.updateFullscreenButton();
				this.ui.setTitle(this.elements.logButton, 'controls.log');
			}

			hasAsset(value) { return hasAsset(value); }
			getImageSrc(src) { return this.assets.url(src); }

			/**
			 * Puts the position class on a dialogue box. `undefined` means the current default
			 * set by `position:`; `null` means leave it alone, as a conversation places its own
			 * box.
			 */
			applyDialoguePosition(element, position) {
				if (!element || position === null) return;

				const requested = position === undefined ? this.dialoguePosition : position;
				const safePosition = DIALOGUE_POSITIONS.includes(requested) ? requested : DEFAULT_DIALOGUE_POSITION;
				element.classList.remove('dialogue-position-top', 'dialogue-position-center', 'dialogue-position-bottom');
				element.classList.add(`dialogue-position-${safePosition}`);
			}

			/**
			 * Boot: config, then plugins (the page is marked themed once both are in, which lets
			 * the spinner show), then either the chapter menu or, with ?c=, that chapter.
			 * Whatever throws becomes the error screen: an error with a `kind` shows its own
			 * message, anything else shows the stack so a bug report is useful.
			 */
			async loadDialogueAndAssets() {
				try {
					await this.config.load();
					if (!await this.plugins.load(this.gameMeta)) return;
					document.documentElement.dataset.themed = '';

					const chapter = chapterParam();

					if (!chapter) {
						await this.menu.show();
						return;
					}

					await this.loadChapter(chapter);

				} catch (error) {
					const trace = String(error?.stack ?? '');
					this.ui.showError(error?.kind ? error.message : 'Something unexpected stopped the game while loading:\n\n```\n' + (trace.includes(String(error)) ? trace : `${error}\n${trace}`).trim() + '\n```', error?.kind || 'boot');
				}
			}

			/**
			 * Loads a chapter. Reset state; fetch and compile the YAML (a compile error shows the
			 * error screen); let plugins declare the files their events need; set up the
			 * checkpoints and the resume point; collect the assets and preload what the start
			 * needs; in the background, check for missing files (the error screen shows only if
			 * the player is still in this chapter); then, after a short hold, hide the loading
			 * screen and show the start gate. loading--settled stops the spinner from fading in
			 * during that hold.
			 */
			async loadChapter(chapter) {

			fallback.dir = 'auto';
