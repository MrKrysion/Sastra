defaultLanguage: en

settings:
  showLogButton: true
  showTypewriterButton: true
  showAutoplayButton: true
  enableTypewriter: true
  typewriterSpeed: 30
  enableCheckpoints: true
  allowHoldToSkip: false

theme:
  customFonts:

  fonts:
    body:
    dialogue: body
    characterName: body
    ui: body
    title: body

  colors:
    pageBackground: "#1a1a1a"
    text: "#ffffff"
    mutedText: "#cccccc"
    accent: "#4a9eff"
    accentHover: "#357abd"
    dialogueBackground: "rgba(0,0,0,.7)"
    panelBackground: pageBackground
    modalBackground: "rgba(0,0,0,.8)"
    buttonBackground: "rgba(74,158,255,.8)"
    buttonHoverBackground: accent
    toolbarHoverBackground: "rgba(74,158,255,.2)"
    menuButtonBackground: "rgba(0,0,0,.5)"
    menuButtonHoverBackground: dialogueBackground
    logDialogueBorder: accent
    logNarrationBorder: text
    logTitleBorder: "#f43f5e"
    logImageBorder: "rgba(34,197,94,1)"
    success: "rgba(34,197,94,.9)"
    error: "rgba(239,68,68,.9)"

en:
  title: "Visual Novel"
  author: "by John Doe"
  synopsis: "A visual novel project"
  logo: "logo.webp"
  background: "background.webp"
  favicon: "favicon.webp"

  chapters:
    - name: "Sample Chapter"
      file: "sample"